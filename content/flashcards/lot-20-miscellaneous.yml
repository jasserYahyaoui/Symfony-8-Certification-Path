schema_version: 2

flashcards:
- id: FLC-tz5z2qr23ew3
  official_item: OIT-s601ppsyb9f7
  language: fr
  level: TRAP
  front: Deux listeners ont les priorités 10 et -10. Lequel s'exécute en premier ?
  back: Celui à 10. Plus le nombre est élevé, plus le listener est appelé tôt ; les valeurs négatives sont permises
    et passent en dernier.
  explanation: À priorité égale, c'est l'ordre d'ajout au répartiteur qui départage.
  memorization_justification: L'analogie avec « priorité 1 » d'une queue suggère l'inverse.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/components/event_dispatcher.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/components/event_dispatcher.rst
    symbol_or_lines: '"An optional priority, defined as a positive or negative integer (defaults to 0). The higher the number, the earlier the listener is called. If two listeners have the same priority, they are executed in the order that they were added to the dispatcher"'
    branch: '8.0'
    verified_at: '2026-09-02'
- id: FLC-6eg8g2bt06nt
  official_item: OIT-8xcczyjyyanz
  language: fr
  level: RECALL
  front: Que fait exactement stopPropagation() sur un event ?
  back: Elle empêche les listeners pas encore appelés de l'être. Elle n'annule rien de ce qui a déjà été fait.
  explanation: 'Son effet dépend donc entièrement des priorités : un listener appelé tôt peut couper la suite.'
  memorization_justification: Le mot « stop » laisse croire à une annulation, alors qu'il ne s'agit que d'interrompre
    une string.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/components/event_dispatcher.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/components/event_dispatcher.rst
    symbol_or_lines: 'Event::stopPropagation() — "the listener needs to be able to tell the dispatcher to stop all propagation of the event to future listeners (i.e. to not notify any more listeners)"'
    branch: '8.0'
    verified_at: '2026-09-02'
