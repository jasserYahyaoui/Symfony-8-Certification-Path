  official_item: OIT-92ctf3sy3ddk
  language: fr
  level: APPLICATION
  front: 'DependencyInjection : passer un paramètre smtp_host au constructeur d''un service.'
  back: '`$c->setParameter(''smtp_host'', ''smtp.acme.test''); $c->register(''transport'', SmtpTransport::class)->addArgument(''%smtp_host%'');`'
