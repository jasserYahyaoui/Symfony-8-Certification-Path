- id: FLC-52t4mqa7vj24
  official_item: OIT-92ctf3sy3ddk
  language: fr
  level: TRAP
  front: 'DependencyInjection : peut-on ajouter un paramètre au conteneur après compile() ?'
  back: 'Non : `setParameter()` lève une `LogicException`, « Impossible to call set() on a frozen ParameterBag. »'
  explanation: Exécuté avec dependency-injection 8.0.15.
  memorization_justification: Le gel porte aussi sur les paramètres.
  verification_status: VERIFIED
  official_sources:
