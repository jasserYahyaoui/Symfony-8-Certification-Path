- id: FLC-asdnwk77st9y
  official_item: OIT-79f4n087b66c
  language: fr
  level: TRAP
  front: 'Symfony : php bin/console debug:container --show-private affiche-t-il les services privés ?'
  back: 'Non : l''option `--show-private` n''existe pas en 8.0. Les services privés sont listés par défaut ; `--show-hidden` ajoute les services internes, dont l''identifiant commence par un point.'
  explanation: 'Options relues dans `ContainerDebugCommand` (8.0) : `--show-hidden`, `--tag`, `--tags`, `--parameter`, `--types`, `--env-var`…'
  memorization_justification: Option imaginaire souvent citée.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Bundle/FrameworkBundle/Command/ContainerDebugCommand.php
    readable_url: https://github.com/symfony/symfony/blob/8.0/src/Symfony/Bundle/FrameworkBundle/Command/ContainerDebugCommand.php
