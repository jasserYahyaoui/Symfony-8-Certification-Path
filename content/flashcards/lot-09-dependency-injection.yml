schema_version: 2
flashcards:
- id: FLC-1y9kmkwvmjg7
  official_item: OIT-92ctf3sy3ddk
  language: fr
  level: TRAP
  front: Recevoir le conteneur en argument, est-ce de l'injection de dépendances ?
  back: 'Non. C''est de la récupération de services : les dépendances réelles disparaissent de la signature.'
  explanation: L'injection nomme ce dont la classe a besoin ; le conteneur permet de demander n'importe
    quoi, donc plus rien n'est vérifiable à la compilation.
  memorization_justification: Le conteneur étant lui-même injecté, la formulation trompe.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/service_container.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/service_container.rst
    symbol_or_lines: 'Public Versus Private Services — "you should fetch services using dependency injection instead of using $container->get()"'
    branch: '8.0'
    verified_at: '2026-09-01'
- id: FLC-cv9s7bswxrh8
  official_item: OIT-79f4n087b66c
  language: fr
  level: RECALL
  front: 'Un service privé : injectable ? récupérable par get() ?'
  back: Injectable oui, récupérable non. Privé est le défaut, et il autorise la suppression s'il n'est
    référencé nulle part.
  explanation: Privé ne concerne que l'accès depuis l'extérieur du conteneur, pas le câblage entre services.
  memorization_justification: Le mot « privé » suggère à tort une restriction d'injection.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/service_container/alias_private.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/service_container/alias_private.rst
    symbol_or_lines: 'Marking Services as Public / Private — "If a service is public, it means that you can access it directly from the container at runtime ... But typically, services are accessed using dependency injection. And in this case, those services do not need to be public ... In fact, all services are private by default"'
    branch: '8.0'
    verified_at: '2026-09-01'
- id: FLC-7xkwp2t1hefj
  official_item: OIT-dy7108w6bf4z
  language: fr
  level: RECALL
  front: Quelle commande répond à « quel type puis-je type-hinter ? »
  back: debug:autowiring. debug:container liste les identifiants, pas les types câblables.
  explanation: Les deux commandes répondent à deux questions différentes ; c'est la première que l'on
    se pose en écrivant un constructeur.
  memorization_justification: Les deux noms se ressemblent et on prend l'une pour l'autre.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/service_container.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/service_container.rst
    symbol_or_lines: '"What other services are available? Find out by running: php bin/console debug:autowiring" — output headed "Autowirable Types ... can be used as type-hints when autowiring"'
    branch: '8.0'
    verified_at: '2026-09-01'
- id: FLC-kbnpt2sv2dss
  official_item: OIT-ar4h3zfskjsp
  language: fr
  level: RECALL
  front: '%param% et %env(VAR)% : à quel moment chacun est-il résolu ?'
  back: '%param% à la compilation, %env(VAR)% à l''exécution. Un pourcent littéral s''écrit %%.'
  explanation: C'est pourquoi changer une variable d'environnement ne demande pas de recompiler le conteneur.
  memorization_justification: La syntaxe est presque identique et le comportement radicalement différent.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/configuration/env_var_processors.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/configuration/env_var_processors.rst
    symbol_or_lines: 'Resolving Environment Variable At Compile Time — "Environment variables are resolved at runtime, but you can also resolve them at compile time"'
    branch: '8.0'
    verified_at: '2026-09-01'
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/service_container.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/service_container.rst
    branch: '8.0'
    symbol_or_lines: '"You can only set a parameter before the container is compiled, not at runtime" — the compile-time half of the contrast'
    verified_at: '2026-09-07'
  - url: https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/DependencyInjection/ParameterBag/ParameterBag.php
    readable_url: https://github.com/symfony/symfony/blob/8.0/src/Symfony/Component/DependencyInjection/ParameterBag/ParameterBag.php
    branch: '8.0'
    symbol_or_lines: 'ParameterBag::escapeValue() — str_replace(''%'', ''%%'', $value); and resolveString() skipping "%%" — the literal-percent escape'
    verified_at: '2026-09-07'
- id: FLC-6a9ngbsfteyg
  official_item: OIT-stze9x4aydp3
  language: fr
  front: _defaults s'applique-t-il aux blocs when@dev du même fichier ?
  back: Non. Chaque bloc when@ doit redéfinir son propre _defaults, sinon ni autowire ni autoconfigure.
  explanation: Un service déclaré dans un bloc d'environnement sans _defaults n'est donc pas câblé, sans
    message explicite.
  memorization_justification: 'Rien ne signale l''omission : le service existe mais n''est pas autowire.'
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/service_container.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/service_container.rst
    symbol_or_lines: '"The _defaults section applies only to services defined in the same services block. Each when@<env> block has its own scope and does not inherit _defaults from the main services section. Redefine _defaults in every when@<env> block where you need it"'
    branch: '8.0'
    verified_at: '2026-09-01'
- id: FLC-xj1bfncctk1r
  official_item: OIT-adhs2ny9hc5f
  language: fr
  front: 'decoration_priority : la priorité la plus haute finit-elle à l''extérieur ?'
  back: 'Non, à l''intérieur. Appliquée en premier, elle enveloppe la cible directement : priorités 5
    puis 1 donnent Baz(Bar(Foo)).'
  explanation: « Appliquée en premier » veut dire « construit en premier », donc au plus près du service
    décoré.
  memorization_justification: L'intuition place le prioritaire devant, alors qu'il est le plus profond.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/service_container/service_decoration.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/service_container/service_decoration.rst
    symbol_or_lines: 'Decoration Priority — "you can control their order with the decoration_priority option. Its value is an integer that defaults to 0 and higher priorities mean that decorators will be applied earlier", with the worked example at priorities 5 then 1'
    branch: '8.0'
    verified_at: '2026-09-01'
- id: FLC-tv2t8a6yt50g
  official_item: OIT-83sac57rw0xn
  language: fr
  front: Que produit un tag qu'aucune passe ni aucun itérateur ne lit ?
  back: Rien, et sans erreur. Un tag est une étiquette inerte tant que quelque chose ne la collecte pas.
  explanation: 'C''est la même logique que pour un attribut PHP : la donnée ne produit un effet que par
    son lecteur.'
  memorization_justification: L'absence totale de signal rend le défaut difficile à diagnostiquer.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/service_container/tags.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/service_container/tags.rst
    symbol_or_lines: '"Services tagged with the twig.extension tag are collected during the initialization of TwigBundle and added to Twig as extensions" — a tag acts only where something collects it'
    branch: '8.0'
    verified_at: '2026-09-01'
- id: FLC-dmvk9r2pqhsg
  official_item: OIT-qj4xfkhwdrx7
  language: fr
  front: 'Une clé inconnue dans la configuration d''un bundle : ignorée ou erreur ?'
  back: Erreur au chargement. L'arbre déclaré par ConfigurationInterface valide la configuration avant
    qu'elle serve.
  explanation: C'est le principal apport de la configuration sémantique sur un tableau d'options libre.
  memorization_justification: L'habitude des tableaux d'options laisse croire à une clé simplement ignorée.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/bundles/configuration.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/bundles/configuration.rst
    symbol_or_lines: '"The processConfiguration() method uses the configuration tree you have defined in the Configuration class to validate, normalize and merge all the configuration arrays together"'
    branch: '8.0'
    verified_at: '2026-09-01'
- id: FLC-j8n3qsftrmm5
  official_item: OIT-h2n7d7dbr56p
  language: fr
  front: Avec une fabrique, à qui arguments est-il passé ?
  back: À la fabrique. Le constructeur du service n'est pas appelé du tout.
  explanation: Le conteneur enregistre la valeur retournée par la fabrique ; le constructeur est hors
    du chemin.
  memorization_justification: La clé s'appelle arguments, ce qui évoque le constructeur.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/service_container/factories.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/service_container/factories.rst
    symbol_or_lines: 'Passing Arguments to the Factory Method — "If you need to pass arguments to the factory method you can use the arguments option"'
    branch: '8.0'
    verified_at: '2026-09-01'
- id: FLC-3f3jxjqynjmj
  official_item: OIT-3y0b9gxyandm
  language: fr
  front: Quel est le type par défaut d'une passe, et que se passe-t-il après TYPE_REMOVE ?
  back: 'TYPE_BEFORE_OPTIMIZATION. Après TYPE_REMOVE, un service privé non référencé a déjà été supprimé
    : le câbler échoue.'
  explanation: L'étape choisie décide de ce que la passe peut encore voir et modifier.
  memorization_justification: Les cinq étapes se confondent et l'erreur ne se voit qu'à la compilation.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/DependencyInjection/Compiler/PassConfig.php
    readable_url: https://github.com/symfony/symfony/blob/8.0/src/Symfony/Component/DependencyInjection/Compiler/PassConfig.php
    symbol_or_lines: 'PassConfig::addPass(CompilerPassInterface $pass, string $type = self::TYPE_BEFORE_OPTIMIZATION, int $priority = 0) — the default type is in the signature; the constants TYPE_BEFORE_OPTIMIZATION, TYPE_OPTIMIZE, TYPE_BEFORE_REMOVING, TYPE_REMOVE, TYPE_AFTER_REMOVING give the order'
    branch: '8.0'
    verified_at: '2026-09-01'
- id: FLC-yze03t40rkqr
  official_item: OIT-wm3qdqemtap9
  language: fr
  front: 'Deux classes implémentent la même interface : que devient l''autowiring ?'
  back: 'L''alias automatique disparaît. Il faut un alias par défaut, un alias nommé « Interface $argument
    », ou #[Target].'
  explanation: Le message parle d'un service inexistant alors que la cause est l'absence de choix entre
    deux implémentations.
  memorization_justification: Le message d'erreur oriente vers la mauvaise cause.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/service_container/autowiring.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/service_container/autowiring.rst
    symbol_or_lines: 'Working with Interfaces / the interface alias — "if only one service is discovered that implements an interface, configuring the alias is not mandatory and Symfony will automatically create one"'
    branch: '8.0'
    verified_at: '2026-09-01'
- id: FLC-zn7hhaddbzd2
  official_item: OIT-gkhcbtygef69
  language: fr
  front: 'getSubscribedServices() : statique ? et en héritage ?'
  back: 'Statique. En héritage, il faut fusionner : array_merge(parent::getSubscribedServices(), [...]).'
  explanation: 'Oublier parent:: retire silencieusement les services déclarés par la classe parente.'
  memorization_justification: L'omission ne produit aucune erreur, seulement un service manquant a l'usage.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/service_container/service_subscribers_locators.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/service_container/service_subscribers_locators.rst
    symbol_or_lines: '"public static function getSubscribedServices(): array"; and the inheritance example "return array_merge(parent::getSubscribedServices(), [ ... ])"'
    branch: '8.0'
    verified_at: '2026-09-01'
- id: FLC-g83rfk7rmkf5
  official_item: OIT-92ctf3sy3ddk
  language: fr
  level: TRAP
  front: 'DependencyInjection : après compile(), $container->get(''mailer'') lève une ServiceNotFoundException alors que le service est défini. Pourquoi ?'
  back: 'Parce qu''une définition créée par `register()` est **privée** par défaut : la compilation l''a retirée ou inlinée. Il faut `setPublic(true)`.'
  explanation: 'Exécuté avec dependency-injection 8.0.15 : « removed or inlined when the container was compiled… make it public, or stop using the container directly and use dependency injection ».'
  memorization_justification: Le conseil du message est la leçon de l'item.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/DependencyInjection/ContainerBuilder.php
    readable_url: https://github.com/symfony/symfony/blob/8.0/src/Symfony/Component/DependencyInjection/ContainerBuilder.php
    repository: symfony/symfony
    branch: '8.0'
    symbol_or_lines: ContainerBuilder::register(), compile(), get()
    verified_at: '2026-09-25'
  - url: https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/DependencyInjection/Definition.php
    readable_url: https://github.com/symfony/symfony/blob/8.0/src/Symfony/Component/DependencyInjection/Definition.php
    repository: symfony/symfony
    branch: '8.0'
    symbol_or_lines: Definition::isPublic(), setShared(), setProperty()
    verified_at: '2026-09-25'
- id: FLC-d2zy76cabspv
  official_item: OIT-92ctf3sy3ddk
  language: fr
  level: TRAP
  front: 'DependencyInjection : get() fonctionne-t-il sur un ContainerBuilder non compilé ?'
  back: 'Oui : le service est construit et les paramètres `%…%` sont même résolus ; mais aucune passe de compilation ne s''exécute et rien n''est figé.'
  explanation: 'Exécuté : `get(''mailer'')` avant `compile()` rend un `Mailer` dont le transport a reçu `smtp.acme.test`.'
  memorization_justification: On croit compile() indispensable pour obtenir un service.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/DependencyInjection/ContainerBuilder.php
    readable_url: https://github.com/symfony/symfony/blob/8.0/src/Symfony/Component/DependencyInjection/ContainerBuilder.php
    repository: symfony/symfony
    branch: '8.0'
    symbol_or_lines: ContainerBuilder::register(), compile(), get()
    verified_at: '2026-09-25'
- id: FLC-j71chhwhsvk2
  official_item: OIT-92ctf3sy3ddk
  language: fr
  level: RECALL
  front: 'DependencyInjection : que se passe-t-il si l''on appelle register() après compile() ?'
  back: 'Une `BadMethodCallException` : « Adding definition to a compiled container is not allowed. »'
  explanation: Le conteneur compilé est figé ; `setParameter()` lève aussi, une `LogicException` sur un ParameterBag figé.
  memorization_justification: Effet concret du gel.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/DependencyInjection/ContainerBuilder.php
    readable_url: https://github.com/symfony/symfony/blob/8.0/src/Symfony/Component/DependencyInjection/ContainerBuilder.php
    repository: symfony/symfony
    branch: '8.0'
    symbol_or_lines: ContainerBuilder::register(), compile(), get()
    verified_at: '2026-09-25'
- id: FLC-3603033a85gj
  official_item: OIT-92ctf3sy3ddk
  language: fr
  level: RECALL
  front: 'DependencyInjection : quelles sont les trois formes d''injection, et laquelle est la voie normale ?'
  back: Constructeur (voie normale, dépendance obligatoire), mutateur (facultatif ou cycle), propriété (déconseillée).
  explanation: La propriété se déclare par `Definition::setProperty()` ; exécuté.
  memorization_justification: Classement des formes d'injection.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/service_container.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/service_container.rst
    repository: symfony/symfony-docs
    branch: '8.0'
    symbol_or_lines: Service Container
    verified_at: '2026-09-25'
- id: FLC-xsv5jbt9xk86
  official_item: OIT-92ctf3sy3ddk
  language: fr
  level: RECALL
  front: 'DependencyInjection : deux get(''mailer'') successifs rendent-ils la même instance ?'
  back: 'Oui, par défaut : le service est partagé. `setShared(false)` donne une instance neuve à chaque appel.'
  explanation: 'Exécuté : `===` vrai par défaut, faux avec `setShared(false)`.'
  memorization_justification: Cycle de vie par défaut d'un service.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/DependencyInjection/Definition.php
    readable_url: https://github.com/symfony/symfony/blob/8.0/src/Symfony/Component/DependencyInjection/Definition.php
    repository: symfony/symfony
    branch: '8.0'
    symbol_or_lines: Definition::isPublic(), setShared(), setProperty()
    verified_at: '2026-09-25'
- id: FLC-5vmf08nqy10s
  official_item: OIT-92ctf3sy3ddk
  language: fr
  level: UNDERSTANDING
  front: 'DependencyInjection : pourquoi recevoir le conteneur entier masque-t-il les dépendances ?'
  back: 'Parce que la classe peut demander n''importe quel service : ses besoins réels ne figurent plus dans sa signature et ne sont plus vérifiables à la compilation.'
  explanation: C'est de la récupération de services, pas de l'injection.
  memorization_justification: Distinction de fond de l'item.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/service_container.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/service_container.rst
    repository: symfony/symfony-docs
    branch: '8.0'
    symbol_or_lines: Service Container
    verified_at: '2026-09-25'
- id: FLC-1ttg3fp5fmxw
  official_item: OIT-92ctf3sy3ddk
  language: fr
  level: UNDERSTANDING
  front: 'DependencyInjection : que fait compile() de plus qu''un simple get() ?'
  back: Il exécute les passes de compilation, résout le conteneur et le fige ; les services privés inutilisés sont retirés ou inlinés.
  explanation: 'Exécuté : après `compile()`, `has(''transport'')` vaut `false` pour un service privé inliné.'
  memorization_justification: Rôle de la compilation.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/DependencyInjection/ContainerBuilder.php
    readable_url: https://github.com/symfony/symfony/blob/8.0/src/Symfony/Component/DependencyInjection/ContainerBuilder.php
    repository: symfony/symfony
    branch: '8.0'
    symbol_or_lines: ContainerBuilder::register(), compile(), get()
    verified_at: '2026-09-25'
- id: FLC-yqf0wrxqtkgn
  official_item: OIT-92ctf3sy3ddk
  language: fr
  level: APPLICATION
  front: 'DependencyInjection hors framework : déclarer un service mailer récupérable après compilation, avec un transport en argument.'
  back: '`$c->register(''mailer'', Mailer::class)->addArgument(new Reference(''transport''))->setPublic(true); $c->compile();`'
  explanation: Sans `setPublic(true)`, `get('mailer')` échoue après compilation.
  memorization_justification: Assemblage minimal correct.
  verification_status: VERIFIED
  official_sources:
