- id: FLC-frmg9m3dw5p7
  official_item: OIT-fr58jzaj6jtb
  language: fr
  level: UNDERSTANDING
  front: 'Symfony Serializer : pourquoi une propriété privée sans getter n''apparaît-elle pas ?'
  back: 'Parce qu''`ObjectNormalizer` lit l''objet par l''accès aux propriétés : propriétés publiques et méthodes `get`, `has`, `is`, `can`.'
  explanation: 'Exécuté sur Serializer 8.0.15 : la privée avec getter sort, la privée ou protégée sans accesseur non.'
  memorization_justification: Portée réelle.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/serializer.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/serializer.rst
    repository: symfony/symfony-docs
    branch: '8.0'
    symbol_or_lines: Built-in Normalizers
    verified_at: '2026-10-03'
- id: FLC-yk92sgasa9ma
  official_item: OIT-fr58jzaj6jtb
  language: fr
  level: UNDERSTANDING
  front: 'Symfony Serializer : pourquoi #[SerializedName] reste-t-il sans effet dans un Serializer construit à la main ?'
  back: Parce qu'il agit par `MetadataAwareNameConverter`, que le service du framework branche et qu'un `ObjectNormalizer` nu n'a pas.
  explanation: 'Exécuté : `fullName` sans le convertisseur, `full_name` avec.'
  memorization_justification: Convertisseur requis.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/serializer.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/serializer.rst
    repository: symfony/symfony-docs
    branch: '8.0'
    symbol_or_lines: Converting Property Names when Serializing and Deserializing
    verified_at: '2026-10-03'
- id: FLC-n0t57zgbwffm
  official_item: OIT-fr58jzaj6jtb
  language: fr
  level: UNDERSTANDING
  front: 'Symfony Serializer : pourquoi un même objet présent dans deux propriétés sœurs ne lève-t-il pas CircularReferenceException ?'
  back: 'Parce que le compteur voyage dans le contexte transmis aux enfants : seule une branche qui contient l''objet en elle-même le compte deux fois.'
  explanation: Lu dans `AbstractNormalizer::isCircularReference()` (8.0) et exécuté avec la limite `1`.
  memorization_justification: Cycle contre répétition.
  verification_status: VERIFIED
  official_sources:
