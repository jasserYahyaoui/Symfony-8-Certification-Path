flashcards:
- id: FLC-50daktpqmkv9
  official_item: OIT-fr58jzaj6jtb
  language: fr
  level: RECALL
  front: Normaliser puis encoder — la représentation normalisée est-elle toujours un tableau ?
  back: Non. Un objet ordinaire devient un tableau (ObjectNormalizer), mais DateTimeNormalizer rend une chaîne
    RFC 3339, BackedEnumNormalizer la valeur du cas, et un scalaire passe tel quel. Plusieurs normaliseurs interviennent,
    un seul encodeur, celui du format demandé.
  explanation: normalize() déclare array|string|int|float|bool|ArrayObject|null ; exécuté sur Serializer 8.0.15.
  memorization_justification: L'exemple courant, un objet devenu tableau, se généralise à tort en règle ; les dates
    et les enums le démentent.
  verification_status: VERIFIED
  reviewed_at: '2026-10-13'
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Serializer/Normalizer/NormalizerInterface.php
    readable_url: https://github.com/symfony/symfony/blob/8.0/src/Symfony/Component/Serializer/Normalizer/NormalizerInterface.php
    branch: '8.0'
    symbol_or_lines: 'normalize() — @return array|string|int|float|bool|\ArrayObject|null'
    verified_at: '2026-10-13'
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/serializer.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/serializer.rst
    branch: '8.0'
    symbol_or_lines: the-serialization-process-normalizers-and-encoders
    verified_at: '2026-09-02'
