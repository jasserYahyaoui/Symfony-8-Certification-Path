- id: FLC-d5w66y32a3ka
  official_item: OIT-fr58jzaj6jtb
  language: fr
  level: RECALL
  front: Quelles clés de contexte omettent les propriétés nulles, et fixent le format des dates ?
  back: skip_null_values (AbstractObjectNormalizer::SKIP_NULL_VALUES) et datetime_format (DateTimeNormalizer::FORMAT_KEY).
  explanation: 'Le contexte, troisième argument, ne règle que l''appel en cours. Exécuté : Y-m-d rend "2026-01-02".'
  memorization_justification: Deux noms de clé à retrouver sans documentation.
  verification_status: VERIFIED
  reviewed_at: '2026-10-14'
  official_sources:
