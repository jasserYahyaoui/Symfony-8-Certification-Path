# not anchor, and that decides an exam answer.

schema_version: 2

flashcards:
- id: FLC-nb0mh2t8j7r9
  official_item: OIT-tvc5rjv6qvse
  language: fr
  level: TRAP
  front: Une vraie variable d'environnement et un fichier .env définissent la même clé. Laquelle gagne ?
  back: La vraie variable d'environnement, toujours. Les fichiers .env n'ajoutent que ce qui manque, ils n'écrasent
    rien.
  explanation: C'est ce qui permet à un hébergeur de fixer une valeur qu'aucun fichier versionné ne peut contredire.
  memorization_justification: L'ordre de la cascade .env est bien retenu, mais on oublie ce qui la surplombe.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/configuration.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/configuration.rst
    symbol_or_lines: '"Set the value as a real environment variable in your shell or your web server" — one of the three ways to define a value, alongside a .env file'
    branch: '8.0'
    verified_at: '2026-09-02'
  - url: https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Dotenv/Dotenv.php
    readable_url: https://github.com/symfony/symfony/blob/8.0/src/Symfony/Component/Dotenv/Dotenv.php
    branch: '8.0'
    symbol_or_lines: 'Dotenv::populate(array $values, bool $overrideExistingVars = false) — "@param bool $overrideExistingVars Whether existing environment variables set by the system should be overridden"; the default is false, so a real environment variable wins'
    verified_at: '2026-09-07'
- id: FLC-63tca08n26r1
  official_item: OIT-kv7mbksn7m8v
  language: fr
  level: RECALL
  front: D'où vient le code de statut HTTP d'une page d'erreur ?
  back: De l'exception — HttpExceptionInterface, attribut WithHttpStatus, RequestExceptionInterface (400) — ou de
    la configuration framework.exceptions. Une exception ordinaire donne 500.
  explanation: 'C''est pourquoi createNotFoundException() existe : lever une RuntimeException ordinaire donnerait
    un 500. Exécuté sur Symfony 8.0.15 ; la documentation ne cite que l''interface, le code connaît les quatre.'
  memorization_justification: On suppose que le sens métier de l'exception suffit à choisir le statut.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/controller/error_pages.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/controller/error_pages.rst
    symbol_or_lines: '"You can customize the status code of an exception by implementing HttpExceptionInterface and its required getStatusCode() method. Otherwise, the status_code will default to 500"'
    branch: '8.0'
    verified_at: '2026-09-02'
  - url: https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/HttpKernel/EventListener/ErrorListener.php
    readable_url: https://github.com/symfony/symfony/blob/8.0/src/Symfony/Component/HttpKernel/EventListener/ErrorListener.php
    symbol_or_lines: logKernelException(); WithHttpStatus
    branch: '8.0'
    verified_at: '2026-10-02'
- id: FLC-1f4raf4m8wng
  official_item: OIT-xgrbftkj67ds
  language: fr
  front: Que se passe-t-il si un dump() reste dans du code déployé en production ?
  back: 'Une Error fatale : symfony/var-dumper est une dépendance --dev, donc la fonction n''existe pas.'
  explanation: Ce n'est ni un affichage indésirable ni une exception applicative rattrapable — la page tombe.
  memorization_justification: On imagine un oubli cosmétique, alors que l'absence de la dépendance rend l'appel
    impossible.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/components/var_dumper.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/components/var_dumper.rst
    symbol_or_lines: '"composer require --dev symfony/var-dumper" — installed as a development dependency'
    branch: '8.0'
    verified_at: '2026-09-02'
- id: FLC-jjcxm1yjtmgr
  official_item: OIT-tvc5rjv6qvse
  language: fr
  level: RECALL
  front: 'Symfony : dans quel ordre les fichiers .env sont-ils chargés ?'
  back: '`.env`, `.env.local`, `.env.<env>`, `.env.<env>.local` ; le dernier chargé gagne.'
  explanation: Exécuté avec Dotenv 8.0.15.
  memorization_justification: Ordre de la cascade.
  verification_status: VERIFIED
