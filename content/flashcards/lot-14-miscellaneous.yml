- id: FLC-79d8bg4xqgk6
  official_item: OIT-tvc5rjv6qvse
  language: fr
  level: UNDERSTANDING
  front: 'Symfony : pourquoi %env(base64:json:CONFIG)% échoue-t-il sur une valeur base64 de JSON ?'
  back: 'Parce que les processeurs s''appliquent de droite à gauche : JSON est lu avant le décodage base64.'
  explanation: 'Exécuté : `RuntimeException`, *Invalid JSON in env var "CONFIG"*.'
  memorization_justification: Ordre des processeurs.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/configuration/env_var_processors.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/configuration/env_var_processors.rst
    repository: symfony/symfony-docs
    branch: '8.0'
    symbol_or_lines: Environment Variable Processors
    verified_at: '2026-10-02'
