- id: FLC-1x0cjn4b7pa8
  official_item: OIT-tvc5rjv6qvse
  language: fr
  level: RECALL
  front: 'Symfony : que rendent parse() et lint() d''ExpressionLanguage ?'
  back: '`parse()` rend un `ParsedExpression` ; `lint()` ne rend rien et lève une `SyntaxError` si l''expression est invalide.'
  explanation: Exécuté sur ExpressionLanguage 8.0.15.
  memorization_justification: Valeurs de retour.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/ExpressionLanguage/ExpressionLanguage.php
    readable_url: https://github.com/symfony/symfony/blob/8.0/src/Symfony/Component/ExpressionLanguage/ExpressionLanguage.php
    repository: symfony/symfony
    branch: '8.0'
    symbol_or_lines: 'lint(Expression|string $expression, array $names, int $flags = 0): void'
    verified_at: '2026-10-02'
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/components/expression_language.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/components/expression_language.rst
    repository: symfony/symfony-docs
    branch: '8.0'
    symbol_or_lines: Parsing and Linting Expressions
    verified_at: '2026-10-02'
- id: FLC-1c5fvxc50w4s
  official_item: OIT-tvc5rjv6qvse
  language: fr
  level: UNDERSTANDING
  front: 'Symfony : pourquoi .env.dev l''emporte-t-il sur .env.local en dev ?'
  back: 'Parce qu''il est chargé après : entre fichiers `.env`, le dernier chargé gagne.'
  explanation: 'Exécuté : une clé dans `.env`, `.env.local` et `.env.dev` vaut la valeur de `.env.dev`.'
  memorization_justification: Le local n'est pas le plus fort.
  verification_status: VERIFIED
  official_sources:
