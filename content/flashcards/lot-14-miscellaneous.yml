  official_item: OIT-tvc5rjv6qvse
  language: fr
  level: UNDERSTANDING
  front: 'Symfony : pourquoi modifier .env ne demande-t-il pas de vider le cache ?'
  back: Parce que le fichier est lu et analysé à chaque requête, hors du conteneur compilé.
  explanation: Documentation 8.0 ; sauf si un `.env.local.php` existe.
  memorization_justification: Lecture à chaque requête.
