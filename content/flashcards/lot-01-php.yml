  - id: FLC-1qbj8sb3scg4
    official_item: OIT-fhb3vz7xbt5h
    language: fr
    level: TRAP
    front: "PHP : que signifie `static` devant une closure, `static function () { … }` ?"
    back: "Qu'elle n'est liée à aucun object : `$this` n'y existe pas, et `bindTo()` d'une instance échoue (avertissement, `null`). Rien à voir avec une method statique."
    explanation: "Exécuté en PHP 8.4.19. « Cannot bind an instance to a static closure ». Une closure `static` peut encore changer de portée de class."
    memorization_justification: "Le même mot-clé a un autre sens sur une method : la confusion est mécanique."
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/php/doc-en/master/language/functions.xml"
        readable_url: "https://github.com/php/doc-en/blob/master/language/functions.xml"
        repository: "php/doc-en"
        branch: "master"
        symbol_or_lines: "Static anonymous functions — \"This prevents them from having the current class automatically bound to them. Objects may also not be bound to them at runtime\""
        verified_at: "2026-10-24"

  - id: FLC-xtrdcvjy4swp
    official_item: OIT-fhb3vz7xbt5h
    language: fr
    level: RECALL
    front: "PHP : une closure est-elle un object ? Le type `callable` n'accepte-t-il que des closures ?"
    back: "Oui, une instance de `Closure`. Non : `callable` accepte aussi une string (`'strlen'`) et un array `[$object, 'method']`."
    explanation: "Exécuté en PHP 8.4.19. `$f instanceof Closure`, `is_callable('strlen')` et `is_callable([new ArrayObject, 'count'])` valent tous `true`."
    memorization_justification: "Typer `Closure` au lieu de `callable` refuse des valeurs valides : la différence se retient."
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/php/doc-en/master/language/functions.xml"
        readable_url: "https://github.com/php/doc-en/blob/master/language/functions.xml"
        repository: "php/doc-en"
        branch: "master"
        symbol_or_lines: "\"Anonymous functions are implemented using the Closure class\""
        verified_at: "2026-10-24"
      - url: "https://raw.githubusercontent.com/php/doc-en/master/language/types/callable.xml"
        readable_url: "https://github.com/php/doc-en/blob/master/language/types/callable.xml"
        repository: "php/doc-en"
        branch: "master"
        symbol_or_lines: "\"string containing the name of a function or a method\"; \"array containing a class name or an object\""
        verified_at: "2026-10-24"

  - id: FLC-zt3hkwa4smfj
    official_item: OIT-hqz5c2qse24w
    language: fr
    level: RECALL
    front: "PHP : peut-on redéfinir `from()` ou `tryFrom()` sur une backed enum ?"
    back: "Non : erreur fatale, « Cannot redeclare S::from() ». Ces methods sont fournies par le langage."
    explanation: "Exécuté en PHP 8.4.19. Il en va de même pour `cases()`, sur toute enum."
    memorization_justification: "On personnalise volontiers une method de fabrication ; que le langage l'interdise ici est un fait à retenir."
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/php/doc-en/master/language/enumerations.xml"
        readable_url: "https://github.com/php/doc-en/blob/master/language/enumerations.xml"
        repository: "php/doc-en"
        branch: "master"
        symbol_or_lines: "\"Manually defining a from() or tryFrom() method on a Backed Enum will result in a fatal error\""
        verified_at: "2026-10-24"

  - id: FLC-91sn9e53zbe4
    official_item: OIT-hqz5c2qse24w
    language: fr
    level: APPLICATION
    front: "PHP : que rend `Suit::cases()` sur une backed enum, et comment obtenir ses valeurs ?"
    back: "Les cas eux-mêmes, des instances de `Suit`. Les valeurs : `array_column(Suit::cases(), 'value')`."
    explanation: "`cases()` rend la liste ordonnée de tous les cas, quel que soit le type d'enum. Exécuté en PHP 8.4.19."
    memorization_justification: "Sur une backed enum, on attend les valeurs scalaires : l'erreur est attendue."
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/php/doc-en/master/language/enumerations.xml"
        readable_url: "https://github.com/php/doc-en/blob/master/language/enumerations.xml"
        repository: "php/doc-en"
        branch: "master"
        symbol_or_lines: "\"cases() returns a packed array of all defined Cases in the order of declaration\""
        verified_at: "2026-10-24"

  - id: FLC-g7j72emr31qb
    official_item: OIT-hqz5c2qse24w
    language: fr
    level: TRAP
    front: "PHP : `P::A->value` sur une enum pure lève-t-il une exception ?"
    back: "Non : un avertissement « Undefined property: P::$value », et la valeur `null`."
    explanation: "Seuls les cas d'une backed enum portent la property `value`. Exécuté en PHP 8.4.19. Avertissement, puis `NULL`, sans exception."
    memorization_justification: "On attend une `Error` ; c'est un simple avertissement, qui laisse filer un `null`."
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/php/doc-en/master/language/enumerations.xml"
        readable_url: "https://github.com/php/doc-en/blob/master/language/enumerations.xml"
        repository: "php/doc-en"
        branch: "master"
        symbol_or_lines: "\"Backed Cases have an additional read-only property, value\""
        verified_at: "2026-10-24"

  - id: FLC-2yy6sbbm560h
    official_item: OIT-n0zfkcr189af
    language: fr
    level: TRAP
    front: "PHP : deux traits utilisés par la même class définissent `hi()`. Sans `insteadof`, que se passe-t-il ?"
    back: "Une erreur fatale à la compilation. PHP ne choisit pas le premier trait en silence."
    explanation: "Exécuté en PHP 8.4.19. « Trait method B::hi has not been applied as C::hi, because of collision with A::hi »."
    memorization_justification: "L'intuition « le premier gagne » vient d'autres mécanismes ordonnés ; ici rien n'est choisi."
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/php/doc-en/master/language/oop5/traits.xml"
        readable_url: "https://github.com/php/doc-en/blob/master/language/oop5/traits.xml"
        repository: "php/doc-en"
        branch: "master"
        symbol_or_lines: "Conflict Resolution — \"If two Traits insert a method with the same name, a fatal error is produced, if the conflict is not explicitly resolved\""
        verified_at: "2026-10-24"

  - id: FLC-k9c7n0brvb1c
    official_item: OIT-n0zfkcr189af
    language: fr
    level: TRAP
    front: "PHP : `use A, B { B::hi as hiB; }` résout-il un conflit sur `hi()` ?"
    back: "Non : `as` ajoute un alias sans rien écarter, le conflit reste fatal. Il faut `A::hi insteadof B;`, puis `B::hi as hiB;` pour garder l'autre."
    explanation: "Exécuté en PHP 8.4.19. Avec `as` seul, même erreur fatale ; avec `insteadof` puis `as`, `hi()` rend celui de A et `hiB()` celui de B."
    memorization_justification: "Les deux operators se lisent comme deux façons de résoudre ; un seul résout."
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/php/doc-en/master/language/oop5/traits.xml"
        readable_url: "https://github.com/php/doc-en/blob/master/language/oop5/traits.xml"
        repository: "php/doc-en"
        branch: "master"
        symbol_or_lines: "Conflict Resolution — \"the as operator can be used to add an alias to one of the methods. Note the as operator does not rename the method\""
        verified_at: "2026-10-24"

  - id: FLC-kggeyx7153s4
    official_item: OIT-n0zfkcr189af
    language: fr
    level: TRAP
    front: "PHP : une class utilise le trait `T`. Que vaut `$objet instanceof T` ?"
    back: "`false`. Un trait n'est pas un type ; `class_uses()` le voit, mais pour typer il faut une interface."
    explanation: "Exécuté en PHP 8.4.19. `instanceof` rend `false`, `class_uses()` rend `['T' => 'T']`."
    memorization_justification: "Le test compile et ne prévient de rien : seul le fait retenu évite une condition toujours fausse."
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/php/doc-en/master/language/oop5/traits.xml"
        readable_url: "https://github.com/php/doc-en/blob/master/language/oop5/traits.xml"
        repository: "php/doc-en"
        branch: "master"
        symbol_or_lines: "\"A Trait is similar to a class, but only intended to group functionality in a fine-grained and consistent way. It is not possible to instantiate a Trait on its own\""
        verified_at: "2026-10-24"

  - id: FLC-1matv67tch5r
    official_item: OIT-vt0p9cacpkpd
    language: fr
    level: UNDERSTANDING
    front: "PHP 8.4 : une interface déclare `public string $name { get; }`. La class qui l'implémente doit-elle stocker une valeur ?"
    back: "Non : l'interface impose un accès, pas un état. Une property virtuelle, dont le hook `get` calcule la valeur, la satisfait."
    explanation: "Exécuté en PHP 8.4.19. `public string $name { get => 'computed'; }` implémente l'interface sans rien stocker."
    memorization_justification: "« Property » évoque une valeur stockée ; dans une interface, c'est un contrat d'accès — une distinction nouvelle en PHP 8.4."
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/php/doc-en/master/language/oop5/interfaces.xml"
        readable_url: "https://github.com/php/doc-en/blob/master/language/oop5/interfaces.xml"
        repository: "php/doc-en"
        branch: "master"
        symbol_or_lines: "Properties — \"It may define a public virtual property that implements only the corresponding hook\""
        verified_at: "2026-10-24"

  - id: FLC-q6ac4pm4sm1y
    official_item: OIT-vt0p9cacpkpd
    language: fr
    level: TRAP
    front: "PHP 8.4 : l'interface déclare `public string $name { get; set; }`. Une property promue `public readonly string $name` la satisfait-elle ?"
    back: "Non : erreur fatale. Une property readonly ne satisfait qu'une property d'interface en lecture seule (`{ get; }`)."
    explanation: "Exécuté en PHP 8.4.19. « Set access level of C::$name must be omitted (as in class I) » : readonly implique `protected(set)`, incompatible avec un `set` public. Avec `{ get; }` seul, la même class compile."
    memorization_justification: "« readonly est public, donc ça passe » échoue précisément sur la moitié écriture."
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/php/doc-en/master/language/oop5/interfaces.xml"
        readable_url: "https://github.com/php/doc-en/blob/master/language/oop5/interfaces.xml"
        repository: "php/doc-en"
        branch: "master"
        symbol_or_lines: "Properties — \"Or a read property may be satisfied by a readonly property. However, an interface property that is settable may not be readonly\""
        verified_at: "2026-10-24"

  - id: FLC-h0d16j276qgh
    official_item: OIT-webdvbgbrfth
    language: fr
    level: RECALL
    front: "PHP : une class a besoin du comportement de deux classes de base. `class C extends A, B` est-il possible ?"
    back: "Non : erreur de syntaxe. Une class n'a qu'une parente ; on combine par trait ou par composition."
    explanation: "Exécuté en PHP 8.4.19. « syntax error, unexpected token \",\" »."
    memorization_justification: "Fait de base, mais l'examen le pose sous forme de code : le reconnaître doit être immédiat."
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/php/doc-en/master/language/oop5/basic.xml"
        readable_url: "https://github.com/php/doc-en/blob/master/language/oop5/basic.xml"
        repository: "php/doc-en"
        branch: "master"
        symbol_or_lines: "extends — \"It is not possible to extend multiple classes; a class can only inherit from one base class\""
        verified_at: "2026-10-24"

  - id: FLC-1fxqpfkbsm7j
    official_item: OIT-webdvbgbrfth
    language: fr
    level: TRAP
    front: "PHP : une class déclarée à la fois abstract et final, `abstract final class A {}`, est-elle valide ?"
    back: "Non : erreur fatale, « Cannot use the final modifier on an abstract class ». `abstract` exige une extension, `final` l'interdit."
    explanation: "Exécuté en PHP 8.4.19."
    memorization_justification: "Deux modificateurs valides séparément ; leur combinaison interdite se retient comme telle."
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/php/doc-en/master/language/oop5/abstract.xml"
        readable_url: "https://github.com/php/doc-en/blob/master/language/oop5/abstract.xml"
