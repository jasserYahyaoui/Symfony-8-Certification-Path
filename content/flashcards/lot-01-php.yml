        branch: "master"
        symbol_or_lines: "\"Classes defined as abstract cannot be instantiated\""
        verified_at: "2026-10-24"
      - url: "https://raw.githubusercontent.com/php/doc-en/master/language/oop5/final.xml"
        readable_url: "https://github.com/php/doc-en/blob/master/language/oop5/final.xml"
        repository: "php/doc-en"
        branch: "master"
        symbol_or_lines: "\"If the class itself is being defined final then it cannot be extended\""
        verified_at: "2026-10-24"

  - id: FLC-yc7t3pe7a8y8
    official_item: OIT-ywrx9x3hg9z8
    language: fr
    level: TRAP
    front: "PHP : une class enfant redéfinit une method `private` de son parent. Le parent qui l'appelle exécute laquelle ?"
    back: "La sienne : une method private redéfinie est une autre method, pas une surcharge. `#[\\Override]` posé dessus est même une erreur fatale."
    explanation: "Exécuté en PHP 8.4.19. `P::call()` appelle `$this->f()` et rend `'P'` même sur une instance de C ; `#[\\Override]` sur `C::f()` lève « no matching parent method exists »."
    memorization_justification: "La surcharge est le réflexe par défaut ; son absence pour une method private produit un comportement qui surprend."
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/php/doc-en/master/language/oop5/inheritance.xml"
        readable_url: "https://github.com/php/doc-en/blob/master/language/oop5/inheritance.xml"
        repository: "php/doc-en"
        branch: "master"
        symbol_or_lines: "\"Private methods of a parent class are not accessible to a child class. As a result, child classes may reimplement a private method themselves without regard for normal inheritance rules\""
        verified_at: "2026-10-24"

  - id: FLC-26dw5e7m1aqb
    official_item: OIT-ywrx9x3hg9z8
    language: fr
    level: RECALL
    front: "PHP : une property readonly avec une default value, `public readonly int $x = 1;`, est-elle valide ?"
    back: "Non : erreur fatale, « Readonly property A::$x cannot have default value ». Une property readonly s'initialise une fois, dans la class."
    explanation: "Une readonly munie d'un défaut serait déjà initialisée, donc équivalente à une constant. Exécuté en PHP 8.4.19."
    memorization_justification: "L'interdiction n'a pas d'équivalent pour les properties ordinaires : elle se retient."
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/php/doc-en/master/language/oop5/properties.xml"
        readable_url: "https://github.com/php/doc-en/blob/master/language/oop5/properties.xml"
        repository: "php/doc-en"
        branch: "master"
        symbol_or_lines: "Readonly properties — \"Specifying an explicit default value on readonly properties is not allowed\""
        verified_at: "2026-10-24"
