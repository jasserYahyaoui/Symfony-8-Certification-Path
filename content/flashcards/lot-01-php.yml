# Lot 01 flashcards (Master Plan §6).
#
# Eleven cards for nine items; the PHP API item carries three (remediation P1.1). PED-010 a comblé Interfaces et Abstract classes.
# L'exemption d'origine raisonnait en situation d'apprentissage ; à livre fermé,
# « la règle d'avant 8.1 » et « abstract private est fatal » sont des faits de
# rappel. La carte Abstract classes ne teste PAS la résolution self/static, déjà
# couverte : elle teste la combinaison interdite.

schema_version: 2

flashcards:
  - id: FLC-ef5rh3zk8shg
    official_item: OIT-46ry8d7dypmb
    language: fr
    front: "PHP : quelles nouveautés de langage PHP 8.4 apporte-t-il ?"
    back: "Property hooks, visibilité asymétrique (private(set)), objects lazy, attribute #[\\Deprecated], et new déréférençable sans parenthèses englobantes."
    explanation: >-
      Symfony 8.0 exige PHP >= 8.4, donc ces cinq ajouts sont dans le
      périmètre examinable ; UPGRADING (8.4) les liste sous New Features > Core. Ne pas les confondre avec 8.3 (constantes de class
      typées, #[\Override]) ni 8.1 (enums, readonly, callable de première class).
    memorization_justification: >-
      Attribution version-par-fonctionnalité : rien dans la syntaxe n'indique sa
      version d'introduction, et l'examen porte explicitement sur 8.4.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/php/php-src/PHP-8.4/UPGRADING"
        readable_url: "https://github.com/php/php-src/blob/PHP-8.4/UPGRADING"
        repository: "php/php-src"
        branch: "PHP-8.4"
        symbol_or_lines: "New Features > Core"
        verified_at: "2026-09-01"


  - id: FLC-6yegfjgbqn5g
    official_item: OIT-46ry8d7dypmb
    language: fr
    front: "PHP : array_merge ou + — que devient une key présente des deux côtés ?"
    back: >-
      array_merge : une string key prend la valeur de droite, les keys numériques
      sont renumérotées. + : la valeur de gauche est gardée et la droite ignorée.
    explanation: >-
      ['a'] + ['b'] vaut ['a'], car la key 0 existe déjà à gauche ;
      array_merge(['a'], ['b']) vaut ['a', 'b']. Exécuté en PHP 8.4.
    memorization_justification: >-
      Les deux écritures fusionnent des arrays et rien dans la syntaxe ne dit
      laquelle garde la gauche : c'est un fait de rappel.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/php/doc-en/master/language/operators/array.xml"
        readable_url: "https://github.com/php/doc-en/blob/master/language/operators/array.xml"
        repository: "php/doc-en"
        branch: "master"
        symbol_or_lines: 'Array operators — "the elements from the left-hand array will be used"'
        verified_at: "2026-10-16"
      - url: "https://raw.githubusercontent.com/php/doc-en/master/reference/array/functions/array-merge.xml"
        readable_url: "https://github.com/php/doc-en/blob/master/reference/array/functions/array-merge.xml"
        repository: "php/doc-en"
        branch: "master"
        symbol_or_lines: 'array_merge — "Values in the input arrays with numeric keys will be renumbered"'
        verified_at: "2026-10-16"

  - id: FLC-c63atm9r74mk
    official_item: OIT-46ry8d7dypmb
    language: fr
    front: "PHP : quelles functions d'array PHP 8.4 ajoute-t-il ?"
    back: "array_find(), array_find_key(), array_any() et array_all()."
    explanation: >-
      array_find() renvoie la première valeur acceptée ou null ; le callback
      reçoit la valeur puis la key. Plus anciennes : array_is_list() (8.1),
      json_validate() (8.3), str_contains() (8.0).
    memorization_justification: >-
      Attribution d'une function à sa version : rien dans son nom ne l'indique,
      et Symfony 8.0 exigeant PHP 8.4, ces functions sont utilisables partout.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/php/php-src/PHP-8.4/UPGRADING"
        readable_url: "https://github.com/php/php-src/blob/PHP-8.4/UPGRADING"
        repository: "php/php-src"
        branch: "PHP-8.4"
        symbol_or_lines: "6. New Functions > Standard: Added functions array_find(), array_find_key(), array_all(), and array_any()"
        verified_at: "2026-10-16"

  - id: FLC-xcnrvq0mddck
    official_item: OIT-ywrx9x3hg9z8
    language: fr
    front: "PHP : quelle est la différence entre self et static dans une method statique ?"
    back: >-
      self se résout à la class où le code est écrit ; static se résout à la
      class réellement appelée (binding statique tardive).
    explanation: >-
      new self() dans une class parente renvoie toujours le parent, même appelé
      via l'enfant. new static() renvoie l'enfant. C'est la différence entre une
      factory cassée et une factory correcte.
    memorization_justification: >-
      Deux mots-clés visuellement interchangeables aux sémantiques opposées,
      dont l'erreur ne se manifeste qu'à l'exécution et dans la sous-classe.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/php/doc-en/master/language/oop5/late-static-bindings.xml"
        readable_url: "https://github.com/php/doc-en/blob/master/language/oop5/late-static-bindings.xml"
        symbol_or_lines: 'Limitations of self:: — "Static references to the current class like self:: or __CLASS__ are resolved using the class in which the function belongs, as in where it was defined"; and the introduction, static:: "can be used to reference the called class in the context of static inheritance"'
        repository: "php/doc-en"
        branch: "master"
        verified_at: "2026-09-01"

  - id: FLC-nt75xsr5ygw0
    official_item: OIT-n0zfkcr189af
    language: fr
    front: "PHP : quel est l'ordre de précédence entre class courante, trait et class parente ?"
    back: "Class courante > trait > class parente."
    explanation: >-
      Une method définie dans la class écrase celle du trait ; le trait écrase
      celle héritée du parent. L'intuition inverse (« le trait est plus proche,
      donc il gagne ») est fausse.
    memorization_justification: >-
      Ordre à trois niveaux, contre-intuitif, et silencieux : le mauvais modèle
      mental ne produit aucune erreur, juste le mauvais comportement.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/php/doc-en/master/language/oop5/traits.xml"
        readable_url: "https://github.com/php/doc-en/blob/master/language/oop5/traits.xml"
        repository: "php/doc-en"
        branch: "master"
        symbol_or_lines: "section Precedence"
        verified_at: "2026-09-01"

  - id: FLC-8xtkgssqtqmg
    official_item: OIT-bvnvx2b6yt2y
    language: fr
    front: "PHP : catch (Exception $e) rattrape-t-il un TypeError ?"
    back: "Non. Error et Exception sont deux branches sœurs sous Throwable."
    explanation: >-
      TypeError, ValueError, DivisionByZeroError et ArgumentCountError étendent
      Error, pas Exception. Pour tout rattraper il faut catch (Throwable $e).
    memorization_justification: >-
      Erreur de conception fréquente qui ne se voit qu'au moment où l'erreur
      survient en production, et que le nom « Exception » rend contre-intuitive.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/php/doc-en/master/language/predefined/throwable.xml"
        readable_url: "https://github.com/php/doc-en/blob/master/language/predefined/throwable.xml"
        symbol_or_lines: '"Throwable is the base interface for any object that can be thrown via a throw statement, including Error and Exception"'
        repository: "php/doc-en"
        branch: "master"
        verified_at: "2026-09-01"
      - url: https://raw.githubusercontent.com/php/doc-en/master/language/error-handling.xml
        readable_url: https://github.com/php/doc-en/blob/master/language/error-handling.xml
        repository: php/doc-en
        branch: master
        symbol_or_lines: 'section "Throwable hierarchy": Error and Exception are two separate branches under Throwable, so catch (Exception $e) does not catch an Error (moved from language/errors/php7.xml, now 404)'
        verified_at: '2026-10-09'

  - id: FLC-h8jcxsh0da3t
    official_item: OIT-hqz5c2qse24w
    language: fr
    front: "PHP : quelle est la différence entre Enum::from() et Enum::tryFrom() ?"
    back: "from() lève une \\ValueError si aucun cas ne correspond ; tryFrom() renvoie null."
    explanation: >-
      Sur une entrée non fiable, tryFrom() suivi de ?? est la forme sûre. Les
      deux n'existent que sur les enums adossées (backed) ; une enum pure n'a
      ni from() ni ->value.
    memorization_justification: >-
      Deux methods de noms proches aux modes d'échec opposés, choisies au
      moment d'écrire le code, sans indice contextuel.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/php/doc-en/master/language/enumerations.xml"
        readable_url: "https://github.com/php/doc-en/blob/master/language/enumerations.xml"
        symbol_or_lines: '"from(int|string): self ... If one is not found, it will throw a ValueError"; "tryFrom(int|string): ?self ... If one is not found, it will return null"'
        repository: "php/doc-en"
        branch: "master"
        verified_at: "2026-09-01"

  - id: FLC-ypkjgzcsjn5v
    official_item: OIT-fhb3vz7xbt5h
    language: fr
    front: "PHP : comment une function fléchée (fn) capture-t-elle les variables externes ?"
    back: "Automatiquement et par valeur. Pas de use, et la capture par référence est impossible."
    explanation: >-
      function () use ($x) capture explicitement, par valeur au moment de la
      definition, ou par référence avec &$x. fn () => n'offre aucune de ces
      options et n'accepte qu'une seule expression.
    memorization_justification: >-
      Deux syntaxes interchangeables en apparence mais aux règles de capture
      différentes, dont l'écart ne se révèle que si la variable change ensuite.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/php/doc-en/master/language/functions.xml"
        readable_url: "https://github.com/php/doc-en/blob/master/language/functions.xml"
        repository: "php/doc-en"
        branch: "master"
        symbol_or_lines: "Arrow functions"
        verified_at: "2026-09-01"

  - id: FLC-6rbhadxrw3sh
    official_item: OIT-1kjqdnryaw0h
    language: fr
    front: "PHP : que renvoie ReflectionMethod::getAttributes() ?"
    back: "Des objects ReflectionAttribute — pas des instances. C'est newInstance() qui construit l'attribute."
    explanation: >-
      Tant que newInstance() n'est pas appelé, la class d'attribute n'est jamais
      instanciée : ses validations et ses erreurs de constructor n'apparaissent
      pas. Un attribute sans lecteur est totalement inerte.
    memorization_justification: >-
      Étape intermédiaire facile à oublier, et dont l'oubli produit un attribute
      silencieusement sans effet plutôt qu'une erreur.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/php/doc-en/master/language/attributes.xml"
        readable_url: "https://github.com/php/doc-en/blob/master/language/attributes.xml"
        symbol_or_lines: '"This method returns an array of ReflectionAttribute instances ... Objects of the attribute class are instantiated only after calling ReflectionAttribute::newInstance"'
        repository: "php/doc-en"
        branch: "master"
        verified_at: "2026-09-01"
  - id: FLC-rs1m1pw77eb7
    official_item: OIT-vt0p9cacpkpd
    language: fr
    front: 'PHP 8.4 : une class peut-elle redéfinir une constant déclarée dans une interface ?'
    back: Oui, depuis PHP 8.1 — sauf si la constant est déclarée `final`.
    explanation: 'La règle « une constant d''interface ne se surcharge jamais » a été vraie pendant
      des années et reste la Response instinctive. Sur PHP 8.4 elle est fausse : seule `final` l''interdit.'
    memorization_justification: 'Attribution version-par-règle : la syntaxe ne dit pas à partir de quelle
      version la redéfinition est permise, et l''ancienne règle reste la Response réflexe.'
    verification_status: VERIFIED
    official_sources:
    - url: https://raw.githubusercontent.com/php/doc-en/master/language/oop5/interfaces.xml
      readable_url: https://github.com/php/doc-en/blob/master/language/oop5/interfaces.xml
      repository: php/doc-en
      branch: master
      symbol_or_lines: section Object Interfaces
      verified_at: '2026-09-11'
  - id: FLC-6t7dhwjwhecc
    official_item: OIT-webdvbgbrfth
    language: fr
    front: 'PHP : que produit `abstract private function` dans une abstract class ?'
    back: Une erreur fatale.
    explanation: 'Une method abstraite privée serait invisible depuis la class fille, donc impossible
      à implémenter : le langage refuse la combinaison à la compilation. `abstract protected` et `abstract
      public` sont valides.'
    memorization_justification: 'Fait arbitraire du langage : rien dans la lecture de `abstract private`
      ne signale que c''est fatal plutôt que simplement inutile.'
    verification_status: VERIFIED
    official_sources:
    - url: https://raw.githubusercontent.com/php/doc-en/master/language/oop5/abstract.xml
      readable_url: https://github.com/php/doc-en/blob/master/language/oop5/abstract.xml
      repository: php/doc-en
      branch: master
      symbol_or_lines: section Class Abstraction
      verified_at: '2026-09-11'
