- id: FLC-p30ndw5tcf03
  official_item: OIT-z9c24d68et6w
  language: fr
  level: RECALL
  front: 'Symfony : quelle est la valeur par défaut de session_fixation_strategy ?'
  back: '`migrate` : l''identifiant de session change à la connexion.'
