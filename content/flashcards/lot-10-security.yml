schema_version: 2
flashcards:
- id: FLC-pd0dmdcagt1k
  official_item: OIT-942znmbjwvad
  language: fr
  level: TRAP
  front: Hacher un mot de passe exige-t-il le système de sécurité complet ?
  back: Non. symfony/password-hasher s'installe et s'utilise seul ; il ne dépend de rien.
  explanation: 'Les responsabilités sont séparées, pas les paquets : security-core dépend de password-hasher,
    et security-csrf de security-core.'
  memorization_justification: Le nom « Security » laisse croire à un bloc indivisible.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/security/passwords.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/security/passwords.rst
    symbol_or_lines: 'Password Hashing and Verification — "Symfony''s PasswordHasher component provides all utilities to safely hash and verify passwords. Make sure it is installed by running: composer require symfony/password-hasher"'
    branch: '8.0'
    verified_at: '2026-09-01'
- id: FLC-y9jp85bpbh2v
  official_item: OIT-z9c24d68et6w
  language: fr
  level: RECALL
  front: Où vit l'utilisateur courant pendant la requête ?
  back: Dans le TokenStorage, sous forme de jeton. getUser() n'est qu'un raccourci vers lui.
  explanation: 'C''est aussi ce que stateless: true empêche de conserver d''une requête à l''autre.'
  memorization_justification: On confond le jeton, l'utilisateur et la session.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Security/Core/Authentication/Token/Storage/TokenStorageInterface.php
    readable_url: https://github.com/symfony/symfony/blob/8.0/src/Symfony/Component/Security/Core/Authentication/Token/Storage/TokenStorageInterface.php
    symbol_or_lines: 'TokenStorageInterface::getToken() — "Returns the current security token"'
    branch: '8.0'
    verified_at: '2026-09-01'
- id: FLC-qtz62rzb36q3
  official_item: OIT-3qgn13f7zvqx
  language: fr
  level: TRAP
  front: Un accès refusé produit-il toujours un 403 ?
  back: Non. 403 si l'utilisateur est connu ; s'il est anonyme, le pare-feu déclenche l'entrée en authentification.
  explanation: Le code de statut dépend donc de l'authentification, pas de l'autorisation.
  memorization_justification: L'intuition associe refus et 403 de façon systématique.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/security.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/security.rst
    symbol_or_lines: 'Add Code to Deny Access — "1) If the user isn''t logged in yet, they will be asked to log in ... 2) If the user is logged in, but does not have the ROLE_ADMIN role, they''ll be shown the 403 access denied page"'
    branch: '8.0'
    verified_at: '2026-09-01'
- id: FLC-paer6jdxzr95
  official_item: OIT-xh63g15rz6n3
  language: fr
  level: RECALL
  front: Quelles deux sections de security.yaml appliquent la première correspondance ?
  back: 'firewalls et access_control — mais elles décident de deux choses différentes : comment on s''authentifie,
    et ce qu''il faut pour entrer.'
  explanation: Dans les deux, l'entrée sans motif se déclare en dernier.
  memorization_justification: Les deux règles se ressemblent et on les fusionne à tort.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/security.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/security.rst
    symbol_or_lines: 'The Firewall — "Only one firewall is active on each request: Symfony uses the pattern key"'
    branch: '8.0'
    verified_at: '2026-09-01'
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/security/access_control.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/security/access_control.rst
    symbol_or_lines: '"it stops - only the first matching access_control" (also: "Remember, the first rule that matches is used")'
    branch: '8.0'
    verified_at: '2026-09-07'
- id: FLC-zpyvxwvf1x8a
  official_item: OIT-45p7535dk4s2
  language: fr
  front: Quelle méthode du fournisseur s'exécute à chaque requête ?
  back: refreshUser(). loadUserByIdentifier() ne sert qu'à la connexion.
  explanation: C'est pourquoi un utilisateur supprimé en base est déconnecté dès la requête suivante.
  memorization_justification: On croit l'utilisateur conservé tel quel entre deux requêtes.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/security/user_providers.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/security/user_providers.rst
    symbol_or_lines: 'refreshUser() docblock — "When a user is logged in, at the beginning of each request, the User object is loaded from the session and then this method is called ... If your firewall is stateless: true (for a pure API), this method is not called"'
    branch: '8.0'
    verified_at: '2026-09-01'
- id: FLC-9j0hj0sv3c6j
  official_item: OIT-rwa6m06crs1h
  language: fr
  front: Combien de pare-feux traitent une requête donnée ?
  back: 'Un seul : le premier dont le pattern correspond. Les suivants ne sont jamais consultés.'
  explanation: Un pare-feu sans pattern attrape tout et doit donc être déclaré en dernier.
  memorization_justification: On imagine des pare-feux cumulatifs, comme des middlewares.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/security.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/security.rst
    symbol_or_lines: 'The Firewall — "Only one firewall is active on each request"'
    branch: '8.0'
    verified_at: '2026-09-01'
- id: FLC-ygn9w70dncp1
  official_item: OIT-gkh08ztwdme1
  language: fr
  front: Combien de méthodes UserInterface déclare-t-elle en Symfony 8.0 ?
  back: 'Deux : getRoles() et getUserIdentifier(). eraseCredentials() a été retirée.'
  explanation: Le mot de passe relève de PasswordAuthenticatedUserInterface, pas de UserInterface.
  memorization_justification: Les versions antérieures en déclaraient davantage ; le souvenir est faux
    pour 8.0.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Security/Core/User/UserInterface.php
    readable_url: https://github.com/symfony/symfony/blob/8.0/src/Symfony/Component/Security/Core/User/UserInterface.php
    symbol_or_lines: 'interface UserInterface — the whole interface declares exactly two methods: getRoles(): array and getUserIdentifier(): string'
    branch: '8.0'
    verified_at: '2026-09-01'
- id: FLC-y8dwv3bw5s2b
  official_item: OIT-ta627mbwfz7m
  language: fr
  front: Changer algorithm en cours de route casse-t-il les mots de passe existants ?
  back: 'Non : le hachage stocké porte son propre algorithme. migrate_from accepte l''ancien et réencode
    à la connexion.'
  explanation: Le réencodage n'est sauvegardé que si le fournisseur implémente PasswordUpgraderInterface.
  memorization_justification: La crainte de tout casser fait éviter une migration pourtant transparente.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/security/passwords.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/security/passwords.rst
    symbol_or_lines: '"if a better hash algorithm is supported on your system, the user''s password should be rehashed using the newer algorithm and stored. That''s possible with the migrate_from option"; and the tip listing the migrate_from algorithms the auto/native/bcrypt/argon hashers enable'
    branch: '8.0'
    verified_at: '2026-09-01'
- id: FLC-dxqgyh6g3w9z
  official_item: OIT-fw6db7ryrk4q
  language: fr
  front: Quelle est la seule contrainte sur le nom d'un rôle ?
  back: Il doit commencer par ROLE_. Le reste est libre.
  explanation: IS_AUTHENTICATED_FULLY et PUBLIC_ACCESS s'emploient comme des rôles mais décrivent l'état
    de l'authentification.
  memorization_justification: La règle est arbitraire et ne se déduit pas.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/security.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/security.rst
    symbol_or_lines: 'Roles — "ROLE_ prefix - otherwise, things won''t work as expected"'
    branch: '8.0'
    verified_at: '2026-09-01'
- id: FLC-1vc4j2vszk96
  official_item: OIT-cwfr5t1ngj23
  language: fr
  front: 'Plusieurs règles access_control correspondent : lesquelles s''appliquent ?'
  back: Seulement la première. Les suivantes sont ignorées, même si elles correspondent aussi.
  explanation: 'D''où l''ordre à respecter : du plus spécifique au plus général.'
  memorization_justification: On attend un cumul des contraintes, qui n'a pas lieu.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/security/access_control.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/security/access_control.rst
    symbol_or_lines: '"For each incoming request, Symfony checks each access_control entry ... it stops - only the first matching access_control is used"'
    branch: '8.0'
    verified_at: '2026-09-01'
- id: FLC-kmf16st6cbrg
  official_item: OIT-kqm5mxq4jnkj
  language: fr
  front: 'Un votant accorde, un autre refuse : quelle est la décision ?'
  back: 'Avec affirmative, la stratégie par défaut : accorde. Avec unanimous : refuse.'
  explanation: 'unanimous signifie « aucun refus », pas « tous accordent » : les abstentions n''empêchent
    rien.'
  memorization_justification: 'Le défaut affirmative surprend : un seul accord suffit malgré un refus.'
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/security/voters.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/security/voters.rst
    symbol_or_lines: 'Changing the Access Decision Strategy — "affirmative (default) This grants access as soon as there is one voter granting access"; "unanimous This only grants access if there is no voter denying access"'
    branch: '8.0'
    verified_at: '2026-09-01'
