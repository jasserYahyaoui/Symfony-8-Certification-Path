  official_item: OIT-qpjnpc56hjj0
  language: fr
  level: UNDERSTANDING
  front: 'Symfony : pourquoi un DatePoint créé en test suit-il l''horloge figée ?'
  back: Parce qu'il prend son heure de l'horloge globale `Clock`.
  explanation: 'Exécuté : `Clock::set(new MockClock(''2000-01-01''))`, puis `new DatePoint()` rend 2000-01-01.'
