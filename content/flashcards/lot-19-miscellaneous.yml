- id: FLC-pffdfpvfbb85
  official_item: OIT-qpjnpc56hjj0
  language: fr
  level: UNDERSTANDING
  front: 'Symfony : pourquoi un service avec ClockAwareTrait reçoit-il son horloge ?'
  back: Parce que `setClock()` porte `#[Required]`, que l'autocâblage appelle ; l'autoconfiguration seule ne l'appelle pas.
  explanation: Exécuté sur DependencyInjection 8.0.15 ; la documentation parle d'autoconfiguration.
  memorization_justification: Écart documentation-code.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Clock/ClockAwareTrait.php
    readable_url: https://github.com/symfony/symfony/blob/8.0/src/Symfony/Component/Clock/ClockAwareTrait.php
    repository: symfony/symfony
    branch: '8.0'
    symbol_or_lines: '#[Required] setClock(); now() falls back to new Clock()'
    verified_at: '2026-10-02'
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/components/clock.rst
