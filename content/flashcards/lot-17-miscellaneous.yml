    branch: '8.0'
    symbol_or_lines: 'isMethodCacheable(): GET, HEAD, QUERY'
    verified_at: '2026-10-02'
- id: FLC-7qy4nkypdrjc
  official_item: OIT-zezwg9nya501
  language: fr
  level: RECALL
  front: 'Symfony : comment s''écrit max_age sur l''attribute #[Cache] ?'
  back: '`maxage` — l''attribute prend des arguments camelCase (`smaxage`, `mustRevalidate`), `setCache()` des keys snake_case.'
  explanation: Lu dans `Attribute/Cache.php` (8.0).
  memorization_justification: Nommage attribute contre setCache().
  verification_status: VERIFIED
  official_sources:
