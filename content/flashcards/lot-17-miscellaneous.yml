  official_item: OIT-zezwg9nya501
  language: fr
  level: TRAP
  front: 'Symfony : un POST avec max-age=60 est-il servi depuis le cache Symfony ?'
  back: 'Non : `pass, invalidate` à chaque Request.'
  explanation: Exécuté sur HttpKernel 8.0.15.
  memorization_justification: POST jamais caché.
