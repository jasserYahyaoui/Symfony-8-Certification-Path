# Lot 17 — Miscellaneous (HTTP Caching) flashcards (Master Plan §6).
#
# One card per official item: the point fact that re-reading the course does
# not anchor, and that decides an exam answer.

schema_version: 2

flashcards:
- id: FLC-tgvah1kzef9y
  official_item: OIT-zezwg9nya501
  language: fr
  level: TRAP
  front: 'Un controller porte #[Cache] et pose aussi des headers sur la Response. Lequel gagne ?'
  back: Les headers posés dans le controller. L'attribute fixe une politique par défaut que le code peut contredire.
  explanation: La documentation l'énonce explicitement ; l'ordre inverse serait tout aussi plausible a priori.
  memorization_justification: Un attribute paraît plus déclaratif donc plus fort ; c'est le contraire.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/http_cache.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/http_cache.rst
    symbol_or_lines: '"When both are used, the cache headers defined in the controller take precedence over those configured with the #[Cache] attribute"'
    branch: '8.0'
    verified_at: '2026-09-02'
- id: FLC-446h1t6qewa1
  official_item: OIT-zezwg9nya501
  language: fr
  level: RECALL
  front: 'Symfony : quelle option active le reverse proxy intégré ?'
  back: '`framework.http_cache: true`, en général sous `when@prod`.'
  explanation: Documentation *HTTP Cache*, branche 8.0.
  memorization_justification: Activation du proxy.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/http_cache.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/http_cache.rst
    repository: symfony/symfony-docs
    branch: '8.0'
    symbol_or_lines: 'Symfony Reverse Proxy; Safe Methods: Only caching GET or HEAD requests; More Response Methods'
    verified_at: '2026-10-02'
- id: FLC-rkg976vqj9ss
  official_item: OIT-zezwg9nya501
  language: fr
  level: RECALL
  front: 'Symfony : quelles methods Request::isMethodCacheable() retient-elle en 8.0 ?'
  back: '`GET`, `HEAD` et `QUERY`.'
  explanation: Lu dans `Request.php` (8.0).
  memorization_justification: Methods cachables.
  verification_status: VERIFIED
  official_sources:
