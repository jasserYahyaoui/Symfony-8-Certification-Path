- id: FLC-3c72hkh5bgd9
  official_item: OIT-zezwg9nya501
  language: fr
  level: UNDERSTANDING
  front: 'Symfony : pourquoi une Response servie du cache n''a-t-elle pas de header X-Symfony-Cache en prod ?'
  back: Parce que `trace_level` vaut `none` hors debug, sauf configuration explicite.
  explanation: 'Exécuté : `fresh` en debug, aucun header sans debug, Response pourtant servie du cache.'
  memorization_justification: Trace et debug.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/HttpKernel/HttpCache/HttpCache.php
    readable_url: https://github.com/symfony/symfony/blob/8.0/src/Symfony/Component/HttpKernel/HttpCache/HttpCache.php
    repository: symfony/symfony
    branch: '8.0'
    symbol_or_lines: 'trace_level default: full in debug, none otherwise'
    verified_at: '2026-10-02'
- id: FLC-7ny77rw1wy5k
  official_item: OIT-zezwg9nya501
  language: fr
  level: UNDERSTANDING
  front: 'Symfony : pourquoi setMaxAge(10) dans l''action l''emporte-t-il sur #[Cache(maxage: 60)] ?'
  back: Parce que le listener de l'attribute, sur `kernel.response`, ne pose `max-age` que si la Response n'en a pas.
  explanation: 'Exécuté : `max-age=10`.'
  memorization_justification: Mécanisme de priority.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/HttpKernel/EventListener/CacheAttributeListener.php
    readable_url: https://github.com/symfony/symfony/blob/8.0/src/Symfony/Component/HttpKernel/EventListener/CacheAttributeListener.php
    repository: symfony/symfony
    branch: '8.0'
    symbol_or_lines: onKernelResponse(); max-age set only when absent
    verified_at: '2026-10-02'
- id: FLC-abrq8k152jn3
  official_item: OIT-zezwg9nya501
  language: fr
  level: UNDERSTANDING
  front: 'Symfony : pourquoi deux Requests QUERY sur la même URL peuvent-elles avoir deux entrées de cache ?'
  back: Parce que la key d'une Request `QUERY` est l'URI plus le body.
  explanation: 'Lu dans `Store::generateCacheKey()` ; exécuté : corps `a` en cache, corps `b` en `miss`.'
  memorization_justification: Key de cache QUERY.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/HttpKernel/HttpCache/Store.php
    readable_url: https://github.com/symfony/symfony/blob/8.0/src/Symfony/Component/HttpKernel/HttpCache/Store.php
    repository: symfony/symfony
    branch: '8.0'
    symbol_or_lines: 'generateCacheKey(): URI, plus the body for QUERY'
    verified_at: '2026-10-02'
