- id: FLC-j2w3nctadf72
  official_item: OIT-zezwg9nya501
  language: fr
  level: APPLICATION
  front: 'Symfony : rendre une réponse publique, 600 s, avec un ETag, en un seul appel.'
  back: '`$response->setCache([''public'' => true, ''max_age'' => 600, ''etag'' => ''abcdef''])`.'
  explanation: Documentation *More Response Methods*.
  memorization_justification: setCache().
  verification_status: VERIFIED
