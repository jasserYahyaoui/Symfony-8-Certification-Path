  official_item: OIT-zezwg9nya501
  language: fr
  level: APPLICATION
  front: 'Symfony : journaliser l''efficacité du cache route par route en production.'
  back: '`trace_level: short`, et l''en-tête `X-Symfony-Cache` dans le format de log du serveur.'
  explanation: Documentation *Symfony Reverse Proxy*.
  memorization_justification: Trace en production.
  verification_status: VERIFIED
