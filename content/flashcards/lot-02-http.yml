  - id: FLC-mt68eb5dmvwz
    official_item: OIT-qnm508g1ktqm
    language: fr
    level: APPLICATION
    front: "Symfony : pour quelles méthodes `createFromGlobals()` analyse-t-elle elle-même le corps de la requête ?"
    back: "PUT, DELETE, PATCH et QUERY — via `request_parse_body()`, parce que PHP ne remplit `$_POST` que pour un POST."
    explanation: >-
      Pour toute autre méthode, la fabrique se contente des superglobales. Si
      l'analyse échoue, elle retombe sur `$_POST` et `$_FILES` plutôt que de
      lever. C'est ce qui permet à `$request->request` de contenir quelque chose
      sur un PUT de formulaire, là où PHP nu laisserait le tableau vide.
    memorization_justification: >-
      Liste de quatre méthodes traitées à part dans une méthode qu'on croit
      uniforme, et qui explique une différence de comportement observable.
    verification_status: VERIFIED
    official_sources:
