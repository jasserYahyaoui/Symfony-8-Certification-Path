    official_item: OIT-d3nyk9z0q2pd
    language: fr
    level: APPLICATION
    front: "L'URL est `/s?tags=php` (valeur unique). Que fait `$request->query->all('tags')` ?"
    back: "Elle lève une `BadRequestException` : la valeur existe mais n'est pas un tableau."
    explanation: >-
      C'est le cas inverse du piège habituel, et il mord dans le code défensif :
      passer systématiquement par `all()` « pour être tranquille » échoue dès
      qu'un seul paramètre arrive. Pour accepter les deux formes, il faut
      tester, ou lire la valeur brute via `$request->query->all()` sans clé.
    memorization_justification: >-
      Cas concret où la parade au piège connu crée le piège symétrique.
