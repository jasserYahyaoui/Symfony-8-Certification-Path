  - id: FLC-sk50h4dwpmbk
    official_item: OIT-bz1f5nh8g9b2
    language: fr
    level: APPLICATION
    front: "Que donne `Cookie::create('x')->withExpires(-1)` ?"
    back: "Un cookie de **session**, pas un cookie expiré : `expiresTimestamp()` ramène toute valeur non strictement positive à `0`."
    explanation: >-
      La ligne est `return 0 < $expire ? (int) $expire : 0;`. Un timestamp
      négatif, censé exprimer « déjà expiré », produit donc exactement le
      contraire : un cookie qui vit jusqu'à la fermeture du navigateur. Pour
      effacer, il faut un timestamp **passé mais positif** — ce que fait
      `clearCookie()` avec la valeur `1`.
    memorization_justification: >-
      Normalisation silencieuse qui inverse l'intention ; aucune erreur n'est
      levée pour le signaler.
