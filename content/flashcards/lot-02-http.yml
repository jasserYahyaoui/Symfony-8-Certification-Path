    back: "Une page HTML complète, avec un `meta http-equiv=\"refresh\"` et un lien cliquable vers l'URL."
    explanation: >-
      Le corps n'est pas vide : `setTargetUrl()` écrit un document entier, pose
      `Location` et `Content-Type: text/html; charset=utf-8`. L'URL y est
