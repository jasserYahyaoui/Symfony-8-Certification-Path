    front: "`getHost()` a levé une `SuspiciousOperationException` sur un hôte invalide. Que renvoie le second appel ?"
    back: "La chaîne vide. L'exception n'est levée qu'une fois : ensuite `getHost()` renvoie `''`."
    explanation: >-
      Le garde est `if (!$this->isHostValid) { return ''; }` avant la levée :
      le premier appel bascule le drapeau, les suivants sortent silencieusement.
      Un code qui attrape l'exception et réessaie obtient donc une chaîne vide,
      pas une seconde exception — et une chaîne vide se propage sans bruit.
    memorization_justification: >-
