  - id: FLC-92b1m783f7pc
    official_item: OIT-jh06tkfrhthq
    language: fr
    level: UNDERSTANDING
    front: "Pourquoi `RedirectResponse` retire-t-il `cache-control` sur un 301 ?"
    back: "Pour laisser la redirection permanente être mise en cache : `Response` pose `no-cache, private` par défaut, ce qui l'en empêcherait."
    explanation: >-
      Le retrait est conditionnel — il n'a lieu que si l'appelant n'a **pas**
      fourni lui-même un `cache-control` dans les en-têtes du constructeur. La
      distinction rejoint la RFC : 301 et 308 sont *heuristically cacheable*,
      302 ne l'est pas. Le framework aligne donc son défaut sur la sémantique
      du code choisi.
    memorization_justification: >-
      Effet de bord silencieux, conditionné à un argument du constructeur, et
      qui ne se produit que pour un seul code de statut.
