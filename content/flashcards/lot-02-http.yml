  - id: FLC-1h9hg9hmge3e
    official_item: OIT-jh06tkfrhthq
    language: fr
    level: RECALL
    front: "Symfony : quelles sont les cinq sous-classes de `Response` à connaître, et ce qui les distingue ?"
    back: "`JsonResponse` (encode et pose le type), `RedirectResponse` (pose `Location`, 302 par défaut), `BinaryFileResponse` (fichier, requêtes de plage), `StreamedResponse` (corps produit par un callable), `StreamedJsonResponse` (JSON diffusé depuis un itérable)."
    explanation: >-
      Choisir la sous-classe plutôt que poser les en-têtes à la main, c'est
      hériter des règles qui vont avec : `RedirectResponse` valide son statut,
      `JsonResponse` échappe pour HTML, `BinaryFileResponse` sait répondre à un
      `Range`. Un `new Response(json_encode($d))` n'a aucune de ces garanties.
    memorization_justification: >-
      Liste fermée, et le choix se fait au moment d'écrire la ligne de retour :
      chercher la classe après coup coûte plus que la connaître.
    verification_status: VERIFIED
    official_sources:
