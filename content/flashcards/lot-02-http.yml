    front: "`withSameSite('Strict')` avec une majuscule : accepté ou refusé ?"
    back: "Accepté — la valeur est passée en minuscules avant contrôle. Une valeur hors de la liste lève une `\\InvalidArgumentException`."
    explanation: >-
      La méthode fait `strtolower()`, traite la chaîne vide comme `null`, puis
