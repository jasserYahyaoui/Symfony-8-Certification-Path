  - id: FLC-s300d2t0hjcb
    official_item: OIT-jh06tkfrhthq
    language: fr
    level: UNDERSTANDING
    front: "Pourquoi le constructeur de `RedirectResponse` peut-il lever une exception ?"
    back: "Parce qu'il valide son statut avec `isRedirect()` : tout code hors de `[201, 301, 302, 303, 307, 308]` lève une `\\InvalidArgumentException`."
    explanation: >-
      La conséquence est directe et contre-intuitive : `new RedirectResponse($u, 304)`
      **échoue**, alors que `new RedirectResponse($u, 201)` est **accepté** —
      201 porte un `Location`, 304 n'en porte pas. La même classe refuse aussi
      une URL vide, via `setTargetUrl()`.
    memorization_justification: >-
      La validation s'appuie sur une liste que rien dans le nom de la classe
      ne laisse deviner ; deux codes 3xx y sont refusés et un code 2xx accepté.
