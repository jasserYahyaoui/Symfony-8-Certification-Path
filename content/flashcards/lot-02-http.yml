  - id: FLC-d4q9k3gjvj4s
    official_item: OIT-512se83ab7qj
    language: fr
    level: TRAP
    front: "Symfony : les noms des constantes `HTTP_*` donnent-ils l'intitulé actuel du code ?"
    back: "Pas toujours. 413 est `HTTP_REQUEST_ENTITY_TOO_LARGE` alors que son texte est « Content Too Large » ; 422 est `HTTP_UNPROCESSABLE_ENTITY` alors que son texte est « Unprocessable Content »."
    explanation: >-
      RFC 9110 a renommé ces deux codes ; les constantes gardent l'ancien nom
      pour ne pas casser la compatibilité, tandis que le tableau
      `Response::$statusTexts` a suivi la RFC. Le même fichier porte donc les
      deux générations de vocabulaire. À l'examen, la question peut être posée
      dans l'un ou l'autre : 413 et « Content Too Large » désignent la même chose.
    memorization_justification: >-
      Décalage de nommage entre deux endroits d'un même fichier ; aucun
      raisonnement ne permet de deviner lequel est à jour.
