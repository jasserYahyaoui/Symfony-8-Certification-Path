  - id: FLC-ndrjckq2359p
    official_item: OIT-d3nyk9z0q2pd
    language: fr
    level: RECALL
    front: "Symfony 8.0 : que renvoie `$request->get('id')` ?"
    back: "Rien : la méthode n'existe plus. Il faut nommer le sac — `$request->attributes->get('id')`, `$request->query->get('id')`…"
    explanation: >-
      L'ancien raccourci cherchait dans `attributes`, puis `query`, puis
      `request`, dans cet ordre : une valeur de route pouvait donc être masquée
      ou remplacée selon l'origine de la donnée. Sa suppression force à dire
      d'où vient l'entrée, ce qui est exactement ce que l'ordre de recherche
      rendait flou.
    memorization_justification: >-
      Appel encore présent dans beaucoup de code et de tutoriels ; son absence
      en 8.0 est une connaissance de version, non un raisonnement.
    verification_status: VERIFIED
