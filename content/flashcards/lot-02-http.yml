        verified_at: "2026-09-17"

  - id: FLC-g4t4cwpx368d
    official_item: OIT-d3nyk9z0q2pd
    language: fr
    level: UNDERSTANDING
    front: "Pourquoi `InputBag` refuse-t-il une valeur non scalaire là où `ParameterBag` l'accepte ?"
    back: "Parce que le contenu d'un `InputBag` vient du client, qui peut envoyer un tableau là où le code attend une chaîne."
    explanation: >-
      `?id=1` et `?id[]=1` sont tous deux des URL valides ; sans la contrainte,
      la seconde ferait circuler un `array` dans du code écrit pour une chaîne.
      `InputBag::get()` lève donc une `BadRequestException` — un échec bruyant
      et immédiat. `$attributes`, rempli par l'application, n'a pas cette
      exposition : c'est un `ParameterBag`.
    memorization_justification: >-
      La règle paraît arbitraire tant qu'on ne relie pas le type du sac à
      l'origine de la donnée ; ce lien est ce qui la rend prévisible.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/HttpFoundation/InputBag.php"
        readable_url: "https://github.com/symfony/symfony/blob/8.0/src/Symfony/Component/HttpFoundation/InputBag.php"
        repository: "symfony/symfony"
        branch: "8.0"
        symbol_or_lines: "get lignes 37-50"
        verified_at: "2026-09-17"

  - id: FLC-krjpqt3gabtc
    official_item: OIT-d3nyk9z0q2pd
    language: fr
    level: UNDERSTANDING
    front: "`all('tags')` est-il simplement la version « tableau » de `get('tags')` ?"
    back: "C'est son miroir exact : `get()` refuse un tableau, `all($clé)` refuse ce qui n'en est pas un — même exception, `BadRequestException`."
    explanation: >-
      `ParameterBag::all($clé)` lève « Unexpected value for parameter … :
      expecting « array » » si la valeur n'est pas un tableau. Une clé
      **absente**, en revanche, ne lève pas : elle renvoie `[]`. Les deux
      accesseurs sont donc stricts dans des directions opposées, et aucun n'est
      un repli sûr pour l'autre.
    memorization_justification: >-
      Symétrie que l'intuition « all = tout, get = un » ne prépare pas, avec un
      troisième cas — clé absente — qui se comporte encore autrement.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/HttpFoundation/ParameterBag.php"
        readable_url: "https://github.com/symfony/symfony/blob/8.0/src/Symfony/Component/HttpFoundation/ParameterBag.php"
        repository: "symfony/symfony"
        branch: "8.0"
        symbol_or_lines: "all lignes 45-56"
        verified_at: "2026-09-17"

  - id: FLC-vgxs994c4k9q
    official_item: OIT-d3nyk9z0q2pd
    language: fr
    level: UNDERSTANDING
    front: "Pourquoi un motif de `setTrustedHosts()` doit-il porter `^` et `$` ?"
    back: "Parce que Symfony n'enveloppe le motif que par `{motif}i` : il est insensible à la casse et **non ancré**, donc satisfait par une sous-chaîne."
    explanation: >-
      `setTrustedHosts(['example.com'])` accepte `example.com.attaquant.test` :
      le motif y est trouvé au milieu. Le point non échappé accepte en prime
      `exampleXcom`. Le motif juste s'écrit `^(.+\.)?example\.com$`. Une liste
      mal écrite est pire qu'une liste absente : elle donne l'apparence d'un
      contrôle.
    memorization_justification: >-
      L'API accepte une chaîne qui ressemble à un nom de domaine et se comporte
      comme une expression régulière ; rien dans l'appel ne le signale.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/HttpFoundation/Request.php"
