  - id: FLC-mkhjd9pf3m32
    official_item: OIT-512se83ab7qj
    language: fr
    level: APPLICATION
    front: "On renvoie `new Response('déjà écrit', 204)`. Que reste-t-il après `prepare()` ?"
    back: "Rien : le contenu est mis à `null`, et `Content-Type` comme `Content-Length` sont retirés."
    explanation: >-
      `prepare()` traite ensemble les réponses informatives et « vides » —
      `isEmpty()` est exactement `in_array($statusCode, [204, 304], true)`. Il
      va jusqu'à `ini_set('default_mimetype', '')` pour empêcher PHP de poser
      un `Content-Type` de son côté. Le corps n'est donc pas « ignoré par le
      client » : il n'est pas émis.
    memorization_justification: >-
      Effet de bord silencieux : le code appelant paraît écrire un corps, et
      rien ne signale sa disparition.
    verification_status: VERIFIED
