        verified_at: "2026-09-17"

  - id: FLC-pqpskd63gfzz
    official_item: OIT-qnm508g1ktqm
    language: fr
    level: APPLICATION
    front: "Que signifie `OPTIONS * HTTP/1.1` ?"
    back: "La requête porte sur le **serveur en général**, pas sur une ressource : c'est un ping ou un no-op."
    explanation: >-
      La RFC le dit dans ces termes : la forme astérisque « is only useful as a
      *ping* or *no-op* type of method », puisque les options dépendent
      normalement de la ressource. Une réponse OPTIONS peut porter un corps
      décrivant les options, avec un `Content-Type` — mais la spécification ne
      définit aucun usage pour ce contenu.
    memorization_justification: >-
      Forme de cible de requête sans équivalent ailleurs dans le protocole, et
      dont l'usage réel est étroit.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/httpwg/httpwg.github.io/master/specs/rfc9110.html"
        readable_url: "https://github.com/httpwg/httpwg.github.io/blob/master/specs/rfc9110.html"
        branch: "master"
        symbol_or_lines: "section 9.3.7 OPTIONS"
        verified_at: "2026-09-17"

  - id: FLC-jmknqenys9jn
    official_item: OIT-qnm508g1ktqm
    language: fr
    level: APPLICATION
    front: "Une réponse à HEAD doit-elle porter les mêmes en-têtes qu'à GET ?"
    back: "Le serveur **SHOULD** envoyer les mêmes, mais **MAY** omettre ceux qui ne se déterminent qu'en produisant le contenu."
    explanation: >-
      HEAD est « identical to GET except that the server MUST NOT send content
      in the response ». L'exemple de la RFC : un serveur qui met en tampon une
      réponse dynamique pour calculer `Content-Length` peut ne pas le faire pour
      un HEAD. Conclure d'un HEAD que `Content-Length` sera présent sur le GET
      correspondant est donc une inférence, pas une garantie.
    memorization_justification: >-
      Un MUST NOT, un SHOULD et un MAY dans la même définition : seule la
      hiérarchie exacte permet de répondre.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/httpwg/httpwg.github.io/master/specs/rfc9110.html"
        readable_url: "https://github.com/httpwg/httpwg.github.io/blob/master/specs/rfc9110.html"
        branch: "master"
        symbol_or_lines: "section 9.3.2 HEAD"
        verified_at: "2026-09-17"

  - id: FLC-mj4vstzqtfxd
    official_item: OIT-qnm508g1ktqm
    language: fr
    level: TRAP
    front: "Où RFC 9110 définit-elle la méthode PATCH ?"
    back: "Nulle part. PATCH est définie par RFC 5789 ; 9110 ne fait que la mentionner en y renvoyant."
    explanation: >-
      Les trois seules occurrences du mot dans le document renvoient à
      `[RFC5789]` : l'en-tête `Accept-Patch`, la mise à jour partielle citée en
      §14.4, et la référence bibliographique. C'est aussi pourquoi PATCH
      n'apparaît dans aucune des listes de §9.2 : ces listes portent sur « the
      request methods **defined by this specification** ».
    memorization_justification: >-
      Absence structurante : elle explique pourquoi PATCH manque aux listes de
      propriétés, ce qu'on interprète autrement comme un oubli.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/httpwg/httpwg.github.io/master/specs/rfc9110.html"
        readable_url: "https://github.com/httpwg/httpwg.github.io/blob/master/specs/rfc9110.html"
        branch: "master"
        symbol_or_lines: "section 12.5.3 (Accept-Patch) ; section 14.4 ; références normatives, entrée RFC5789"
        verified_at: "2026-09-17"

  - id: FLC-2q6jnswvxx6e
    official_item: OIT-qnm508g1ktqm
    language: fr
    level: TRAP
    front: "`$request->isMethodIdempotent()` renvoie `true` sur une méthode `PURGE`. Est-ce une erreur ?"
    back: "Non : `PURGE` est bien dans la liste de Symfony. Ce n'est pourtant pas une méthode standard, mais une convention de reverse proxy."
    explanation: >-
      Elle ne figure ni dans RFC 9110 ni dans le registre des méthodes HTTP.
      Symfony la reconnaît parce que les caches qui l'emploient — Varnish et
      apparentés — la traitent comme rejouable sans effet supplémentaire. Répondre
      « PURGE n'existe pas donc `false` » est donc faux **en Symfony**, et juste
      du point de vue de la RFC.
    memorization_justification: >-
      Entrée non standard dans une liste standard : le raisonnement « ce n'est
      pas dans la RFC » conduit à la mauvaise réponse sur le code.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/HttpFoundation/Request.php"
        readable_url: "https://github.com/symfony/symfony/blob/8.0/src/Symfony/Component/HttpFoundation/Request.php"
        repository: "symfony/symfony"
        branch: "8.0"
        symbol_or_lines: "isMethodIdempotent ligne 1452"
        verified_at: "2026-09-17"

  - id: FLC-zrjxg09xv5mq
    official_item: OIT-qnm508g1ktqm
    language: fr
    level: TRAP
    front: "Combien de méthodes `isMethodSafe()` reconnaît-il, et combien la RFC en déclare-t-elle sûres ?"
    back: "Cinq côté Symfony — GET, HEAD, OPTIONS, TRACE, QUERY — contre quatre dans RFC 9110, qui ne définit pas QUERY."
    explanation: >-
      L'écart va dans les deux sens selon la propriété : Symfony ajoute QUERY
      aux méthodes sûres et QUERY plus PURGE aux idempotentes, mais **retire**
      POST des cacheables, que la RFC y met. Aucune des trois listes n'est donc
      « la RFC plus QUERY ».
    memorization_justification: >-
      Écart de cardinalité entre deux sources également officielles, qui ne se
      résume à aucune règle simple.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/HttpFoundation/Request.php"
        readable_url: "https://github.com/symfony/symfony/blob/8.0/src/Symfony/Component/HttpFoundation/Request.php"
        repository: "symfony/symfony"
        branch: "8.0"
        symbol_or_lines: "isMethodSafe ligne 1444, isMethodIdempotent ligne 1452, isMethodCacheable ligne 1462"
        verified_at: "2026-09-17"
      - url: "https://raw.githubusercontent.com/httpwg/httpwg.github.io/master/specs/rfc9110.html"
        readable_url: "https://github.com/httpwg/httpwg.github.io/blob/master/specs/rfc9110.html"
        branch: "master"
        symbol_or_lines: "sections 9.2.1, 9.2.2, 9.2.3"
        verified_at: "2026-09-17"

  - id: FLC-p3vmjc4wdfzy
    official_item: OIT-qnm508g1ktqm
    language: fr
    level: TRAP
    front: "Une API renvoie 200 à un `DELETE` déjà appliqué, puis 404 au suivant. L'idempotence est-elle rompue ?"
    back: "Non. L'idempotence porte sur l'effet sur le serveur de requêtes répétées, pas sur l'égalité des réponses."
    explanation: >-
      La formulation de §9.2.2 est sans ambiguïté : « the intended effect on the
      server of multiple identical requests … is the same as the effect for a
      single such request ». Le code de statut peut varier ; l'état final, non.
      La RFC ajoute qu'un serveur reste libre de journaliser chaque requête ou
      d'en garder un historique de révisions.
    memorization_justification: >-
      Le contre-exemple qui vient à l'esprit — deux codes différents — porte sur
      la mauvaise grandeur ; la définition doit être connue mot pour mot.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/httpwg/httpwg.github.io/master/specs/rfc9110.html"
        readable_url: "https://github.com/httpwg/httpwg.github.io/blob/master/specs/rfc9110.html"
        branch: "master"
        symbol_or_lines: "section 9.2.2 Idempotent Methods"
