  - id: FLC-mkmte3ak5h1n
    official_item: OIT-bz1f5nh8g9b2
    language: fr
    level: UNDERSTANDING
    front: "L'attribut `Domain` restreint-il la portée d'un cookie ?"
    back: "Non, il l'**élargit** : c'est son absence qui restreint. Sans `Domain`, « the user agent will return the cookie only to the origin server »."
    explanation: >-
      Avec `Domain=site.example`, le cookie part vers `site.example`,
      `www.site.example` **et** `www.corp.site.example`. Le navigateur refuse en
      revanche un `Domain` qui n'inclurait pas le serveur d'origine — depuis
      `foo.site.example`, `site.example` est accepté mais `bar.site.example` ne
      l'est pas. `Path`, lui, restreint bel et bien, mais la spécification
      avertit qu'on ne peut pas s'y fier pour la sécurité.
    memorization_justification: >-
      Attribut dont l'effet est l'inverse de ce que son voisinage avec `Path`
      suggère ; l'erreur conduit à élargir la portée d'un cookie de session en
      croyant la réduire.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/httpwg/http-extensions/main/draft-ietf-httpbis-rfc6265bis.md"
        readable_url: "https://github.com/httpwg/http-extensions/blob/main/draft-ietf-httpbis-rfc6265bis.md"
        repository: "httpwg/http-extensions"
        branch: "main"
        symbol_or_lines: "The Domain Attribute ; The Path Attribute ; Domain Matching"
        verified_at: "2026-09-17"

  - id: FLC-g6zv0n288byc
    official_item: OIT-bz1f5nh8g9b2
    language: fr
    level: UNDERSTANDING
    front: "Que change `withPartitioned(true)` sur un cookie tiers ?"
    back: "Le cookie est rangé dans un pot séparé **par site intégrateur** : même nom, stockages distincts selon le site visité."
    explanation: >-
      C'est CHIPS. Le widget reconnaît son visiteur sur `a.test` sans que ce
      soit le même cookie que sur `b.test` : le suivi intersites tombe, l'usage
      légitime survit. L'attribut n'a de sens qu'avec `Secure` et
      `SameSite=None`, et Symfony le sérialise **en dernier**, après `samesite`.
    memorization_justification: >-
      Attribut récent dont l'effet — une partition du stockage — ne se déduit
      ni de son nom ni de la forme de l'en-tête.
