    explanation: >-
      `setCookie()`, `removeCookie()` et `clearCookie()` vivent sur ce sac. Un
      cookie n'est donc pas une propriété de la réponse mais un en-tête en
      attente de sérialisation, ce qui explique pourquoi il disparaît si les
      en-têtes sont déjà partis. Côté requête, `$request->cookies` est un
      `InputBag` : les deux côtés ne se ressemblent pas.
    memorization_justification: >-
      Asymétrie entre requête et réponse pour une même notion, et emplacement
      non deviné d'une API qu'on cherche ailleurs.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/HttpFoundation/ResponseHeaderBag.php"
        readable_url: "https://github.com/symfony/symfony/blob/8.0/src/Symfony/Component/HttpFoundation/ResponseHeaderBag.php"
        repository: "symfony/symfony"
        branch: "8.0"
        symbol_or_lines: "setCookie, removeCookie, clearCookie"
        verified_at: "2026-09-17"

  - id: FLC-rpe8vx2qy4gx
    official_item: OIT-jh06tkfrhthq
    language: fr
    level: TRAP
    front: "`JsonResponse::fromJsonString($data)` reçoit un tableau. Que se passe-t-il ?"
    back: "Une `\\TypeError` : avec `$json = true`, l'argument doit être une chaîne, un nombre ou un objet `\\Stringable`."
    explanation: >-
      La fabrique existe pour du JSON **déjà encodé** — une charge produite par
      le sérialiseur, par exemple — et lui passer un tableau reviendrait à
      écrire `Array` dans le corps. Le contrôle est fait dans le constructeur,
      avant tout encodage.
    memorization_justification: >-
      Deux points d'entrée de la même classe attendent des types opposés ; le
      nom `fromJsonString` est le seul indice, et il est facile à survoler.
