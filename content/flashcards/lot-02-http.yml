  - id: FLC-swct473zwy2w
    official_item: OIT-bz1f5nh8g9b2
    language: fr
    level: TRAP
    front: "`HttpOnly` protège-t-il du CSRF ?"
    back: "Non. Il empêche la **lecture** par script, pas l'**envoi** automatique par le navigateur. C'est `SameSite` qui traite ce risque."
    explanation: >-
      Les deux attributs répondent à deux attaques distinctes : `HttpOnly`
      atténue le vol de cookie par XSS, `SameSite` atténue l'usage du cookie
      depuis un autre site. Un cookie `httponly` sans `samesite` part toujours
      avec une requête intersite — et c'est précisément le CSRF.
    memorization_justification: >-
      Deux attributs de sécurité qu'on regroupe en « cookie sécurisé » alors
      qu'ils ne couvrent pas la même menace.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/httpwg/http-extensions/main/draft-ietf-httpbis-rfc6265bis.md"
        readable_url: "https://github.com/httpwg/http-extensions/blob/main/draft-ietf-httpbis-rfc6265bis.md"
        repository: "httpwg/http-extensions"
        branch: "main"
        symbol_or_lines: "HttpOnly et SameSite, sections de sécurité"
        verified_at: "2026-09-17"

