        verified_at: "2026-09-17"

  - id: FLC-36jw118n66v5
    official_item: OIT-jh06tkfrhthq
    language: fr
    level: RECALL
    front: "Symfony : qui appelle `Response::send()`, et avec quel argument ?"
    back: "Le runner du composant Runtime, derrière `public/index.php` : `HttpKernelRunner::run()` appelle `send(false)`."
    explanation: >-
      Un contrôleur **rend** une `Response` ; il ne l'émet pas. Le `false`
      saute la clôture des tampons à l'intérieur de `send()`, parce que le
      runner exécute lui-même `fastcgi_finish_request()` (sauf en debug) avant
      d'appeler `terminate()`. C'est de là que vient la promesse de
      `kernel.terminate` : ses écouteurs tournent après le relâchement du client.
    memorization_justification: >-
      Chaîne d'appels invisible depuis le code applicatif, et qui explique un
      comportement — `kernel.terminate` — qu'on utilise sans savoir d'où il vient.
    verification_status: VERIFIED
    official_sources:
