        verified_at: "2026-09-17"

  - id: FLC-g06p29cbe5hv
    official_item: OIT-d3nyk9z0q2pd
    language: fr
    level: APPLICATION
    front: "Un POST porte `X-HTTP-Method-Override: GET`. Que renvoie `getMethod()` ?"
    back: "`POST`. GET, HEAD, CONNECT et TRACE sont ignorés comme cibles d'override en Symfony 8.0."
    explanation: >-
      La liste est écrite en dur dans `getMethod()`, et `setAllowedHttpMethodOverride()`
      refuse d'ailleurs qu'on l'y remette : l'appel lève une
      `\InvalidArgumentException`. Un override vers `PATCH` fonctionne, lui.
      Et une valeur qui n'est pas faite que de lettres majuscules — `P@TCH` —
      lève une `SuspiciousOperationException`.
    memorization_justification: >-
      Quatre méthodes traitées à part, sans message ni avertissement : la
      requête est simplement traitée comme un POST.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/HttpFoundation/Request.php"
        readable_url: "https://github.com/symfony/symfony/blob/8.0/src/Symfony/Component/HttpFoundation/Request.php"
        repository: "symfony/symfony"
        branch: "8.0"
        symbol_or_lines: "getMethod lignes 1202-1239 ; setAllowedHttpMethodOverride lignes 710-716"
        verified_at: "2026-09-17"

  - id: FLC-smdzenndjcyp
    official_item: OIT-d3nyk9z0q2pd
    language: fr
    level: TRAP
    front: "L'en-tête `X-HTTP-Method-Override` demande-t-il d'être activé, comme `_method` ?"
    back: "Non. L'en-tête est lu sur tout POST sans rien activer ; seul le paramètre `_method` exige `enableHttpMethodParameterOverride()`."
    explanation: >-
      Les deux mécanismes sont souvent présentés ensemble, ce qui laisse croire
      au même interrupteur. Pour désactiver l'en-tête, il faut
      `setAllowedHttpMethodOverride([])` — une liste vide, que `getMethod()`
      traite comme « aucun override permis ». Le défaut, `null`, veut dire
