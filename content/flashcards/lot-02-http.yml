  - id: FLC-p2rbfr0mr4cb
    official_item: OIT-512se83ab7qj
    language: fr
    level: TRAP
    front: "Vrai ou faux : « une réponse 404 n'est jamais mise en cache »."
    back: "Faux. 404 figure dans la liste des codes *heuristically cacheable* de §15.1, aux côtés de 405, 410, 414 et 501."
    explanation: >-
      Un cache peut réutiliser un 404 avec une expiration heuristique tant
      qu'aucune directive explicite ne l'en empêche. C'est voulu : les erreurs
      de ce type sont stables et coûteuses à recalculer. Pour l'empêcher
      réellement, il faut une directive — `no-store`, par exemple — et non
      l'espoir que le code de statut suffise.
    memorization_justification: >-
      Affirmation répandue et rassurante, que la liste de §15.1 contredit
      nommément.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/httpwg/httpwg.github.io/master/specs/rfc9110.html"
        readable_url: "https://github.com/httpwg/httpwg.github.io/blob/master/specs/rfc9110.html"
        branch: "master"
        symbol_or_lines: "section 15.1 Overview of Status Codes"
        verified_at: "2026-09-17"

  - id: FLC-x58em8v5yb1v
    official_item: OIT-512se83ab7qj
    language: fr
    level: TRAP
    front: "Symfony expose `Response::HTTP_I_AM_A_TEAPOT`. Le code 418 est-il donc utilisable ?"
    back: "Non. RFC 9110 §15.5.19 l'intitule « 418 (Unused) » : il est **réservé** au registre IANA et ne peut être attribué à aucun usage."
    explanation: >-
      La RFC raconte pourquoi : RFC 2324 était un poisson d'avril, et le code a
      été déployé en plaisanterie assez souvent pour devenir inutilisable. La
      constante existe côté Symfony parce que la bibliothèque suit le registre,
      pas parce que le code a un sens applicatif. L'utiliser dans une API, c'est
      envoyer un code que la spécification déclare non attribuable.
    memorization_justification: >-
      La présence de la constante dans le code du framework fait office de
      caution ; seule la RFC dit son vrai statut.
    verification_status: VERIFIED
    official_sources:
