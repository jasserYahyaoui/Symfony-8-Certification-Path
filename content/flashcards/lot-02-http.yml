  - id: FLC-zmgmcf43j6m1
    official_item: OIT-bz1f5nh8g9b2
    language: fr
    level: APPLICATION
    front: "Le cookie `sid` a été posé avec `secure` et `samesite=lax`. Que produit `clearCookie('sid')` ?"
    back: "Un cookie d'effacement aux attributs **différents** : `clearCookie()` a ses propres défauts — `secure = false`, `httpOnly = true`, `sameSite = null`."
    explanation: >-
      La signature est `clearCookie($name, $path = '/', $domain = null,
      $secure = false, $httpOnly = true, $sameSite = null, $partitioned = false)`.
      Elle ne relit pas le cookie d'origine : elle en fabrique un neuf. Pour que
      l'effacement porte, il faut lui repasser les mêmes `path`, `domain` — et
      les mêmes attributs quand le navigateur les compare.
    memorization_justification: >-
      Défauts d'une méthode d'effacement qui ne sont pas ceux de la fabrique de
      création ; l'oubli produit un effacement qui ne prend pas.
