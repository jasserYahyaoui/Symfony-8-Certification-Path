    front: "Pourquoi `isOk()` et `isSuccessful()` ne sont-elles pas la même chose ?"
    back: "`isOk()` teste **200 exactement** ; `isSuccessful()` teste toute la classe 2xx."
    explanation: >-
      La même logique vaut pour `isNotFound()`, qui teste 404 exactement, face
      à `isClientError()` qui couvre 4xx. Un test fonctionnel qui assertait
      `isSuccessful()` passe donc sur un 201 ou un 204 — ce qui est parfois
      voulu, et parfois exactement le bug qu'on croyait couvert.
    memorization_justification: >-
      Deux méthodes proches dont l'une est un cas particulier de l'autre ; le
