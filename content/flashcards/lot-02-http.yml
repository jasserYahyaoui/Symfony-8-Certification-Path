  - id: FLC-pv48hs5tsar0
    official_item: OIT-jh06tkfrhthq
    language: fr
    level: TRAP
    front: "Vrai ou faux : « une `JsonResponse` contient le même JSON que `json_encode($data)` »."
    back: "Faux par défaut : `JsonResponse` ajoute quatre options d'échappement HTML que `json_encode()` n'applique pas."
    explanation: >-
      `<`, `>`, `'`, `&` et le guillemet droit sortent sous forme `\uXXXX`. Le JSON reste
      valide et se décode à l'identique — seule la **chaîne** diffère. D'où la
      règle de test : comparer les données décodées, jamais les octets.
      `setEncodingOptions()` permet de changer ce choix, au prix de la sûreté
      d'insertion dans du HTML.
    memorization_justification: >-
      Différence invisible à la lecture du code appelant, qui ne se manifeste
      que par un échec d'assertion sur une chaîne.
