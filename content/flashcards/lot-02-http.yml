  - id: FLC-2q4760k550k3
    official_item: OIT-bz1f5nh8g9b2
    language: fr
    level: TRAP
    front: "Quels appels au constructeur de `Cookie` lèvent une exception ?"
    back: "Un nom vide, un nom contenant des caractères réservés **en mode `raw`**, un `sameSite` hors liste, un `path` ou `domain` invalide, et une date d'expiration non analysable."
    explanation: >-
      Le contrôle des caractères réservés — `=,; \t\r\n\v\f` — ne s'applique
      qu'en mode `raw` : hors de ce mode, ils sont **encodés** par
      `__toString()` au lieu d'être refusés. Une chaîne d'expiration part par
      `strtotime()`, et lève « The cookie expiration time is not valid » si elle
      n'est pas comprise.
    memorization_justification: >-
      Cinq conditions d'échec dont une seule dépend d'un autre paramètre
      (`raw`) ; l'encodage silencieux du cas courant masque la règle.
