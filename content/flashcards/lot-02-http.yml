  - id: FLC-cxqsvb6y4nva
    official_item: OIT-bz1f5nh8g9b2
    language: fr
    level: UNDERSTANDING
    front: "`removeCookie()` et `clearCookie()` : laquelle efface le cookie chez le client ?"
    back: "`clearCookie()`. `removeCookie()` retire seulement le `Set-Cookie` de la réponse — « does not unset it in the browser », dit son docblock."
    explanation: >-
      `removeCookie()` agit sur le tableau interne du sac, indexé par domaine
      puis par chemin. `clearCookie()` **ajoute** au contraire un cookie dont
      l'expiration est dans le passé : c'est cet envoi qui demande au navigateur
      d'oublier le sien. Annuler l'intention d'écrire et demander l'effacement
      sont deux actions opposées.
    memorization_justification: >-
      Deux méthodes voisines dont les noms suggèrent le même effet alors que
      l'une n'envoie rien du tout.
