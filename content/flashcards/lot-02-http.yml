  - id: FLC-pdbzzrej8yrk
    official_item: OIT-d3nyk9z0q2pd
    language: fr
    level: RECALL
    front: "Symfony : combien de listes de confiance `Request` porte-t-elle, et sur quoi portent-elles ?"
    back: "Deux, indépendantes : `setTrustedProxies()` sur des adresses IP d'intermédiaires, `setTrustedHosts()` sur des motifs d'expression régulière pour l'hôte."
    explanation: >-
      Elles gardent deux valeurs que le client contrôle : `X-Forwarded-For`
      pour la première, `Host` pour la seconde. Déclarer l'une ne configure pas
      l'autre, et les deux sont vides par défaut. Une application derrière un
      proxy correctement déclaré peut donc rester exposée à l'empoisonnement de
      `Host`.
    memorization_justification: >-
      Deux mécanismes de nom voisin qu'on croit volontiers liés ; leur
      indépendance est ce qui crée l'angle mort.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/HttpFoundation/Request.php"
