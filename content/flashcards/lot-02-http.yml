  - id: FLC-c6kdb458s7bn
    official_item: OIT-d3nyk9z0q2pd
    language: fr
    level: APPLICATION
    front: "Sur un POST de formulaire, modifier le sac renvoyé par `getPayload()` modifie-t-il `$request->request` ?"
    back: "Non : quand le sac POST est non vide, `getPayload()` en renvoie un **clone**."
    explanation: >-
      Le corps de la méthode est explicite : `if ($this->request->count())
      { return clone $this->request; }`. Sinon elle décode le corps en JSON et
      construit un `InputBag` neuf. Dans les deux cas, l'objet rendu est
      détaché : `getPayload()` est un accesseur de lecture, pas une vue.
    memorization_justification: >-
      Le clonage est invisible à l'appel et change le résultat de toute écriture
      faite sur le sac rendu.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/HttpFoundation/Request.php"
