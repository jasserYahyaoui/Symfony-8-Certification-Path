  - id: FLC-p7maqwtprtca
    official_item: OIT-bz1f5nh8g9b2
    language: fr
    level: UNDERSTANDING
    front: "Pourquoi `secure: null` ne veut-il pas dire « non sécurisé » ?"
    back: "Parce que `isSecure()` est `$this->secure ?? $this->secureDefault` : `null` délègue la décision à un défaut posé d'après la requête."
    explanation: >-
      Le défaut est renseigné par `setSecureDefault()` quand la requête courante
      est déjà en HTTPS. Conséquence : le même code produit un cookie `secure`
      en production et non `secure` en HTTP local, ce qui est voulu — forcer
      `true` sur un site servi en HTTP empêcherait le cookie d'être posé.
    memorization_justification: >-
      Troisième état d'un booléen, dont l'effet dépend du contexte d'exécution
      et non de la valeur écrite.
