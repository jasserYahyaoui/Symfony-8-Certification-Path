  - id: FLC-edpmhmymcjfd
    official_item: OIT-d3nyk9z0q2pd
    language: fr
    level: APPLICATION
    front: "Quelle exception lève `$request->query->get('page', ['défaut'])` ?"
    back: "Une `\\InvalidArgumentException` — pas une `BadRequestException` : c'est la **valeur par défaut** qui est fautive, pas l'entrée."
    explanation: >-
      `InputBag::get()` vérifie d'abord son deuxième argument : « Expected a
      scalar value as a 2nd argument ». La distinction est logique — une entrée
      non scalaire vient du client et donne un 400, un défaut non scalaire est
      une faute du programmeur et n'a rien à voir avec la requête. Les deux
      contrôles acceptent aussi un objet `\Stringable`.
    memorization_justification: >-
      Deux exceptions de types différents levées par la même méthode, selon
      lequel de ses deux arguments est en cause.
    verification_status: VERIFIED
