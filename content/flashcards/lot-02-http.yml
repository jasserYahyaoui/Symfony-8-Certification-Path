  - id: FLC-keg9pm2d1bcq
    official_item: OIT-jh06tkfrhthq
    language: fr
    level: RECALL
    front: "Symfony : quelle version de protocole porte une `Response` fraîchement construite ?"
    back: "`HTTP/1.0`. C'est `prepare()` qui la promeut en 1.1 quand `SERVER_PROTOCOL` n'est pas `HTTP/1.0`."
    explanation: >-
      Le noyau appelle `prepare()` pour vous ; une réponse fabriquée hors du
      cycle — dans un test, dans une commande — garde donc `HTTP/1.0` tant que
      personne ne l'a préparée. `prepare()` fait d'ailleurs bien plus : il vide
      le corps d'une réponse 204 ou 304, retire le corps d'un `HEAD`, et
      complète le `Content-Type`.
    memorization_justification: >-
      Valeur par défaut contre-intuitive en 2026, et invisible tant qu'on reste
      dans le cycle HTTP normal.
