  - id: FLC-c1n5fb6sdjzt
    official_item: OIT-d3nyk9z0q2pd
    language: fr
    level: RECALL
    front: "Symfony : quels sacs de `Request` sont des `InputBag`, et lesquels ne le sont pas ?"
    back: "`$query`, `$request` et `$cookies` sont des `InputBag`. `$attributes` est un `ParameterBag`, `$headers` un `HeaderBag`, `$server` un `ServerBag`, `$files` un `FileBag`."
    explanation: >-
      Le partage n'est pas décoratif : seuls les trois `InputBag` portent la
      contrainte scalaire, parce que seuls eux contiennent des données venues du
      client. `$attributes` est rempli par l'application — le routeur y écrit
      `_route` et `_controller` — et accepte donc n'importe quelle valeur.
    memorization_justification: >-
      Sept propriétés de quatre types différents ; la répartition porte toute la
      différence de comportement et ne se devine pas depuis les noms.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/HttpFoundation/Request.php"
