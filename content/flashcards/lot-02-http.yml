    front: "Un cookie est déjà expiré. Que renvoie `getMaxAge()` ?"
    back: "`0`, jamais un nombre négatif : la méthode est `max(0, $this->expire - time())`."
    explanation: >-
      Pour savoir si un cookie est un cookie d'effacement, l'accesseur à lire
