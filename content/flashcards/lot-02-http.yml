    language: fr
    level: TRAP
    front: "`JsonResponse::fromJsonString($data)` reçoit un tableau. Que se passe-t-il ?"
    back: "Une `\\TypeError` : avec `$json = true`, l'argument doit être une chaîne, un nombre ou un objet `\\Stringable`."
    explanation: >-
      La fabrique existe pour du JSON **déjà encodé** — une charge produite par
      le sérialiseur, par exemple — et lui passer un tableau reviendrait à
      écrire `Array` dans le corps. Le contrôle est fait dans le constructeur,
      avant tout encodage.
    memorization_justification: >-
      Deux points d'entrée de la même classe attendent des types opposés ; le
      nom `fromJsonString` est le seul indice, et il est facile à survoler.
    verification_status: VERIFIED
