  - id: FLC-fh8kpbtbv5yc
    official_item: OIT-bz1f5nh8g9b2
    language: fr
    level: RECALL
    front: "Dans quel ordre les attributs sont-ils sérialisés dans l'en-tête `Set-Cookie` par Symfony ?"
    back: "valeur, puis `expires` et `Max-Age`, puis `path`, `domain`, `secure`, `httponly`, `samesite`, et `partitioned` en dernier."
    explanation: >-
      L'ordre est celui des `if` successifs de `__toString()`. Chaque attribut
      n'est écrit que s'il est renseigné : pas de `domain` vide, pas de
      `samesite` à `null`. `expires` et `Max-Age` partent ensemble ou pas du
      tout — un cookie de session n'a ni l'un ni l'autre.
    memorization_justification: >-
