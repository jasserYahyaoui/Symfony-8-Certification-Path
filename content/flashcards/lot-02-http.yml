        readable_url: "https://github.com/httpwg/httpwg.github.io/blob/master/specs/rfc9110.html"
        branch: "master"
        symbol_or_lines: "section 15.1 Overview of Status Codes"
        verified_at: "2026-09-17"

  - id: FLC-p8jj4e88a3hq
    official_item: OIT-512se83ab7qj
    language: fr
    level: APPLICATION
    front: "Que se passe-t-il à l'exécution de `$response->setStatusCode(600)` ?"
    back: "Une `\\InvalidArgumentException` : « The HTTP status code \"600\" is not valid ». 599 passe, avec le texte `unknown status`."
    explanation: >-
      `setStatusCode()` affecte d'abord, teste ensuite via `isInvalid()`, qui
      est littéralement `< 100 || >= 600` — la plage de la RFC. Un code valide
      mais inconnu de Symfony n'échoue pas : il reçoit `'unknown status'` comme
      phrase de raison, ce qui est cohérent avec le fait que cette phrase n'est
      pas normative.
    memorization_justification: >-
      Comportement exact d'une borne — exception d'un côté, texte de repli de
      l'autre — que seule la lecture du code révèle.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/HttpFoundation/Response.php"
        readable_url: "https://github.com/symfony/symfony/blob/8.0/src/Symfony/Component/HttpFoundation/Response.php"
        repository: "symfony/symfony"
        branch: "8.0"
        symbol_or_lines: "setStatusCode lignes 476-492 ; isInvalid lignes 1164-1167"
