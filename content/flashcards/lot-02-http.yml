  - id: FLC-7d9bz5d43cgf
    official_item: OIT-bz1f5nh8g9b2
    language: fr
    level: RECALL
    front: "Que le navigateur exige-t-il d'un cookie nommé `__Host-…`, et d'un cookie nommé `__Secure-…` ?"
    back: "`__Secure-` : l'attribut `Secure`. `__Host-` : `Secure`, `Path=/` et **aucun** `Domain`."
    explanation: >-
      Ce sont des règles de **nommage**, tenues par le navigateur, qu'aucune API
      ne pose. Le serveur écrit le préfixe exactement ; le navigateur le
      reconnaît **sans tenir compte de la casse**, ce qui empêche un
      `__SeCuRe-SID` posé par un tiers de passer pour un cookie ordinaire.
      Symfony 8.0 ne vérifie rien de tout cela.
    memorization_justification: >-
      Trois exigences pour l'un, une pour l'autre, appliquées par un acteur —
      le navigateur — que le code ne montre jamais.
