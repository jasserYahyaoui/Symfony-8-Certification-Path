  - id: FLC-3wf2w0xzcb18
    official_item: OIT-d3nyk9z0q2pd
    language: fr
    level: RECALL
    front: "Symfony : que distingue `getMethod()`, `getRealMethod()` et `isMethod()` ?"
    back: "`getRealMethod()` renvoie `REQUEST_METHOD` tel quel ; `getMethod()` applique l'override et mémorise le résultat ; `isMethod()` compare à `getMethod()` sans tenir compte de la casse."
    explanation: >-
      `getMethod()` met son résultat en cache dans `$this->method` dès le
      premier appel : changer un en-tête après coup ne le fait pas changer
      d'avis. Les deux renvoient toujours une chaîne **en majuscules**.
    memorization_justification: >-
      Trois méthodes voisines dont deux peuvent renvoyer des valeurs
      différentes sur la même requête ; le nom `getRealMethod` ne dit pas
      laquelle des deux est « la vraie » pour le code applicatif.
    verification_status: VERIFIED
    official_sources:
