        branch: "8.0"
        symbol_or_lines: "setTrustedHosts lignes 642-647, sprintf('{%s}i', $hostPattern)"
        verified_at: "2026-09-17"

  - id: FLC-xwwc4rksxk78
    official_item: OIT-d3nyk9z0q2pd
    language: fr
    level: UNDERSTANDING
    front: "Pourquoi `getClientIp()` ne renvoie-t-il pas la première adresse de `X-Forwarded-For` ?"
    back: "Parce qu'il renvoie l'adresse non fiable la **plus proche du serveur** : tout ce qui est à sa gauche a été écrit par un maillon auquel on ne fait pas confiance."
    explanation: >-
      Symfony complète la chaîne avec `REMOTE_ADDR`, retire les adresses des
      proxys déclarés de confiance, puis renverse ce qui reste et prend le
      premier élément. Le client d'origine n'est donc obtenu que si **toute** la
      chaîne est déclarée. C'est le comportement sûr : la partie gauche de
      l'en-tête est falsifiable par le client.
    memorization_justification: >-
      La règle « le client est la première adresse » est vraie dans le cas
      nominal et fausse dès qu'un saut n'est pas déclaré — donc juste assez
      souvent pour s'installer.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/HttpFoundation/Request.php"
        readable_url: "https://github.com/symfony/symfony/blob/8.0/src/Symfony/Component/HttpFoundation/Request.php"
