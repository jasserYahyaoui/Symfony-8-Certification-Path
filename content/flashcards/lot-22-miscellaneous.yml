- id: FLC-h5335799gy53
  official_item: OIT-j4vpn5bh9f27
  language: fr
  level: UNDERSTANDING
  front: 'Symfony Mailer : que garantit un envoi réussi ?'
  back: Seulement que le transport a accepté le message ; sa remise ultérieure échappe à l'application.
  explanation: Section *Handling Sending Failures*, branche 8.0 ; une erreur de remise au transport lève une `TransportExceptionInterface`.
  memorization_justification: Sens du succès.
  verification_status: VERIFIED
