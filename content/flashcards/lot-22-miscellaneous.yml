  official_item: OIT-j4vpn5bh9f27
  language: fr
  level: UNDERSTANDING
  front: 'Symfony Mailer : pourquoi la documentation déconseille-t-elle native://default ?'
  back: 'Parce que la configuration de `sendmail` vient de `php.ini` et échappe à l''application : avec `sendmail -t`, ni remontée d''erreur ni retrait des en-têtes `Bcc`.'
  explanation: Avertissement de *Using Built-in Transports*, branche 8.0, qui recommande `sendmail://default`.
  memorization_justification: Risque du transport native.
