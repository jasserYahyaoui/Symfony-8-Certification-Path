  official_item: OIT-j4vpn5bh9f27
  language: fr
  level: APPLICATION
  front: 'Symfony Mailer : envoyer un message par le transport nommé alternative plutôt que par le défaut.'
  back: '`$email->getHeaders()->addTextHeader(''X-Transport'', ''alternative'');` puis `$mailer->send($email);`'
  explanation: Section *Multiple Email Transports*, branche 8.0 ; Mailer retire l'en-tête du message final.
  memorization_justification: Choisir un transport.
  verification_status: VERIFIED
