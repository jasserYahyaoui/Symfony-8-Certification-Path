  official_item: OIT-9xdjjsqcbn13
  language: fr
  level: UNDERSTANDING
  front: 'Symfony Mime : pourquoi l''UTF-8 est-il refusé dans la partie locale de l''expéditeur seul ?'
  back: Pour éviter les problèmes de messages en retour (rebonds) ; les destinataires, eux, l'acceptent.
  explanation: 'Exécuté : `Envelope` lève une `InvalidArgumentException` pour l''expéditeur `jösé@…` et accepte le même destinataire.'
  memorization_justification: Exception expéditeur.
