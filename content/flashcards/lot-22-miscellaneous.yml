  language: fr
  level: APPLICATION
  front: 'Symfony Mailer : obtenir les informations de débogage d''un envoi réussi.'
  back: 'Injecter `TransportInterface` : `$sentMessage = $transport->send($email);` puis `$sentMessage->getDebug()`.'
