  back: 'Parce qu''`Email` ne crée un conteneur que s''il en faut un : texte seul donne `text/plain`, texte et HTML `multipart/alternative`.'
  explanation: Exécuté sur Mime 8.0.15 ; une pièce jointe ajoutée au texte donne `multipart/mixed`.
  memorization_justification: Structure à la demande.
