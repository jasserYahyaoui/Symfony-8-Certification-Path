  level: RECALL
  front: 'Symfony Mailer : quel événement permet d''empêcher l''envoi d''un message ?'
  back: '`MessageEvent`, par sa méthode `reject()`.'
  explanation: 'Lu dans `MessageEvent::reject()` (8.0) : elle marque le message rejeté et arrête la propagation.'
