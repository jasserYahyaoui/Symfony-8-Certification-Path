- id: FLC-pn9snya6z2f5
  official_item: OIT-tjn6kyvyc2h9
  language: fr
  level: UNDERSTANDING
  front: 'Symfony : pourquoi Path::canonicalize() ne garantit-il pas que le chemin existe ?'
  back: Parce que `Path` ne manipule que des chaînes, sans toucher au disque.
  explanation: 'Exécuté : `/var/www/../lib/./x/` donne `/var/lib/x`, qui n''existe pas.'
  memorization_justification: Chaîne contre disque.
  verification_status: VERIFIED
  official_sources:
