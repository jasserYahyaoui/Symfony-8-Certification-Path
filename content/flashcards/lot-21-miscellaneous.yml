- id: FLC-500k6pc92xev
  official_item: OIT-tjn6kyvyc2h9
  language: fr
  level: TRAP
  front: 'Sous Linux, que rend `isAbsolutePath(''c:\Windows'')` ?'
  back: '`false`. `\` et `C:` ne sont séparateur et racine que si `DIRECTORY_SEPARATOR` vaut `\` ; la documentation montre `true`, ce que rend Windows.'
  explanation: 'De même, `Path::canonicalize(''a\b/../c'')` rend `c` sous Unix : `\` y est un caractère de nom. Un test portable écrit ses paths avec `/`. Exécuté avec Filesystem 8.0.15 sous Linux.'
  memorization_justification: L'exemple de la documentation est vrai sous Windows seulement ; rien ne le précise.
  verification_status: VERIFIED
  official_sources:
