- id: FLC-8y959g67n4ez
  official_item: OIT-tjn6kyvyc2h9
  language: fr
  level: RECALL
  front: 'Symfony : que fait rename() quand la cible existe ?'
  back: Il lève une `IOException`, sauf troisième argument à `true`, qui remplace la cible.
  explanation: Exécuté sur Filesystem 8.0.15.
