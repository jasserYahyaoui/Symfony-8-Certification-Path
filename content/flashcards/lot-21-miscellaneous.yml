# Lot 21 — Miscellaneous (Filesystem, Finder) flashcards (Master Plan §6).
#
# One card per official item: the point fact that re-reading the course does
# not anchor, and that decides an exam answer.

schema_version: 1

flashcards:
- id: FLC-e2refpyf7ra0
  official_item: OIT-tjn6kyvyc2h9
  language: fr
  front: Qu'apporte dumpFile() qu'une écriture ordinaire n'apporte pas ?
  back: 'L''atomicité : elle écrit un fichier temporaire puis le déplace, si bien qu''un lecteur simultané voit
    l''ancien fichier complet ou le nouveau complet, jamais un fichier à moitié écrit.'
  explanation: Elle crée aussi le fichier et son répertoire au besoin. appendToFile(), elle, n'est pas atomique.
  memorization_justification: L'atomicité ne se voit pas à l'usage courant ; elle ne se remarque que sous lecture
    concurrente.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/components/filesystem.rst
    symbol_or_lines: 'dumpFile — "It does this in an atomic manner: it writes a temporary file first and then moves it to the new file location when it''s finished. This means that the user will always see either the complete old file or complete new file (but never a partially-written file)"'
    branch: '8.0'
    verified_at: '2026-09-02'
- id: FLC-zw88x7tcje1m
  official_item: OIT-a1anzcv85my3
  language: fr
  front: 'Deux appels successifs à name() sur le même Finder : que cherche-t-on au final ?'
  back: 'Les deux motifs à la fois. Le Finder est à état : un appel de méthode s''ajoute à la configuration au lieu
    de la remplacer.'
  explanation: Pour plusieurs recherches partageant une base commune, il faut cloner l'objet.
  memorization_justification: On attend d'un setter qu'il écrase la valeur précédente ; ici il l'accumule.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/components/finder.rst
    symbol_or_lines: 'the warning — "The Finder object is stateful. Any method call will change all its instances. If you need to perform several searches, create multiple instances of Finder or clone it after setting the common configuration"'
    branch: '8.0'
    verified_at: '2026-09-02'
