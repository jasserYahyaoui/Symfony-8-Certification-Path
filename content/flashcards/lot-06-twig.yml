        repository: "symfony/symfony"
        branch: "8.0"
        symbol_or_lines: "getBundleTemplatePaths, normalizeBundleName"
        verified_at: "2026-09-24"

  - id: FLC-2zn2kq10b7x5
    official_item: OIT-b9x8az2bx4t8
    language: fr
    level: RECALL
    front: "Symfony : sous quel espace de noms atteindre le gabarit d'origine d'un bundle dont on a surchargé un fichier ?"
    back: "@!AcmeBlog — le point d'exclamation désigne le répertoire du bundle seul."
    explanation: >-
      TwigExtension enregistre le répertoire du bundle une seconde fois sous !Nom, ce qui permet à la surcharge d'étendre l'original.
    memorization_justification: >-
      Syntaxe rare, qu'aucun autre mécanisme n'utilise.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Bundle/TwigBundle/DependencyInjection/TwigExtension.php"
        readable_url: "https://github.com/symfony/symfony/blob/8.0/src/Symfony/Bundle/TwigBundle/DependencyInjection/TwigExtension.php"
        repository: "symfony/symfony"
        branch: "8.0"
        symbol_or_lines: "getBundleTemplatePaths, normalizeBundleName"
        verified_at: "2026-09-24"

  - id: FLC-r2wsckvngvtb
    official_item: OIT-b9x8az2bx4t8
    language: fr
    level: UNDERSTANDING
    front: "Symfony : une variable mal orthographiée lève une erreur en dev mais rend une chaîne vide en prod. Pourquoi ?"
    back: "strict_variables vaut %kernel.debug% par défaut : vraie en dev, fausse en prod."
    explanation: >-
      Sans mode strict, Twig retourne null pour une variable absente, et null s'affiche vide.
    memorization_justification: >-
      Relier un symptôme d'environnement à la valeur par défaut qui l'explique.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Bundle/TwigBundle/DependencyInjection/Configuration.php"
        readable_url: "https://github.com/symfony/symfony/blob/8.0/src/Symfony/Bundle/TwigBundle/DependencyInjection/Configuration.php"
        repository: "symfony/symfony"
        branch: "8.0"
        symbol_or_lines: "strict_variables, default_path, paths, globals, form_themes"
        verified_at: "2026-09-24"

