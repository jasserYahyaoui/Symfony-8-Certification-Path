        repository: "symfony/symfony"
        branch: "8.0"
        symbol_or_lines: "getBundleTemplatePaths, normalizeBundleName"
        verified_at: "2026-09-24"

  - id: FLC-r2wsckvngvtb
    official_item: OIT-b9x8az2bx4t8
    language: fr
    level: UNDERSTANDING
    front: "Symfony : une variable mal orthographiée lève une erreur en dev mais rend une string vide en prod. Pourquoi ?"
    back: "strict_variables vaut %kernel.debug% par défaut : vraie en dev, fausse en prod."
    explanation: >-
      Sans mode strict, Twig retourne null pour une variable absente, et null s'affiche vide.
    memorization_justification: >-
      Relier un symptôme d'environment à la default value qui l'explique.
    verification_status: VERIFIED
    official_sources:
