    language: fr
    level: UNDERSTANDING
    front: "Twig : pourquoi une variable déclarée avant la boucle garde-t-elle la valeur reçue dedans, alors qu'une variable créée dedans disparaît ?"
    back: "À la sortie, `ForNode` ne conserve que les clés du contexte d'avant la boucle, avec leurs valeurs courantes."
    explanation: >-
      Le code compilé fait `array_intersect_key($context, $_parent) + $_parent` : une clé nouvelle est écartée, une clé ancienne garde sa valeur modifiée.
    memorization_justification: >-
      Le mécanisme explique les deux comportements d'un coup.
