  - id: FLC-zwcpa6rw09yy
    official_item: OIT-b9x8az2bx4t8
    language: fr
    level: RECALL
    front: "Symfony : dans quel directory surcharger le template user/profile.html.twig d'AcmeBlogBundle ?"
    back: "templates/bundles/AcmeBlogBundle/user/profile.html.twig"
    explanation: >-
      Le directory de surcharge garde le suffixe Bundle, contrairement au namespace @AcmeBlog.
    memorization_justification: >-
      Deux conventions de nommage voisines, faciles à croiser.
    verification_status: VERIFIED
