  - id: FLC-f27y3b5p87k1
    official_item: OIT-b9x8az2bx4t8
    language: fr
    level: UNDERSTANDING
    front: "Symfony : que fait une entrée de twig.paths sans espace de noms ?"
    back: "Elle ajoute le répertoire à l'espace principal, à côté de templates/."
    explanation: >-
      La clé est le chemin, la valeur l'espace de noms ; une valeur absente laisse le gabarit accessible sans préfixe @.
    memorization_justification: >-
      On croit l'espace de noms obligatoire parce que les exemples en montrent toujours un.
