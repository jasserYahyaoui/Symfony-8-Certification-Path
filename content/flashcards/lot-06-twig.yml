  - id: FLC-e2kwrjzymqsx
    official_item: OIT-ds2p5d4eg0pq
    language: fr
    level: TRAP
    front: "Twig : pourquoi l'échappement par nom de fichier ne marche-t-il pas comme attendu avec `embed` ?"
    back: "Un gabarit embarqué n'a pas de nom ; embarquer du CSS ou du JavaScript dans du HTML demande de fixer la stratégie avec la balise `autoescape`."
    explanation: >-
      Avertissement de la documentation d'`embed`. Dans Symfony, TwigBundle choisit la stratégie d'après l'extension du nom — précisément ce qui manque ici.
    memorization_justification: >-
      Interaction peu visible entre embed et l'échappement.
