  - id: FLC-f27y3b5p87k1
    official_item: OIT-b9x8az2bx4t8
    language: fr
    level: UNDERSTANDING
    front: "Symfony : que fait une entrée de twig.paths sans namespace ?"
    back: "Elle ajoute le directory à l'espace principal, à côté de templates/."
    explanation: >-
      La key est le path, la valeur le namespace ; une valeur absente laisse le template accessible sans préfixe @.
    memorization_justification: >-
      On croit le namespace obligatoire parce que les exemples en montrent toujours un.
