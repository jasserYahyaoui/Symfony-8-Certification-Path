# Lot 06 flashcards (Master Plan §6).
#
# Seize cartes pour quatorze items. PED-010 a comblé les sept absences — les
# six listées ici plus Global variables, que l'en-tête d'origine omettait sans
# justification. Chaque carte tient au critère : ce qui rend Twig configurable,
# `app.user` nul sur page publique, ce qui sépare filtre et fonction, le
# contexte hérité par défaut dans une inclusion, `path()` qui peut devenir
# absolue, la sous-requête d'un rendu de contrôleur, la barre initiale
# d'`asset()`.

schema_version: 2

flashcards:
  - id: FLC-2e8x0yx9hbbp
    official_item: OIT-vhd83fn6w9wy
    language: fr
    level: RECALL
    front: "Twig : dans quel ordre {{ foo.bar }} est-il résolu ?"
    back: "foo['bar'], puis foo->bar, la constante Foo::bar, foo->bar(), getBar(), isBar(), hasBar(), __call(), sinon null."
    explanation: >-
      Le tableau est essayé en premier, avant la propriété : un objet qui
      implémente ArrayAccess verra donc l'accès tableau gagner. La dernière
      étape lève une Twig\Error\RuntimeError au lieu de retourner null si
      l'option strict_variables est active.
    memorization_justification: >-
      Séquence ordonnée de six tentatives dont l'ordre décide du résultat, et
      dont rien dans la syntaxe du gabarit ne donne d'indice.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/symfony/symfony-docs/8.0/templates.rst"
        readable_url: "https://github.com/symfony/symfony-docs/blob/8.0/templates.rst"
        branch: "8.0"
        symbol_or_lines: "section Template Variables, resolution order"
        verified_at: "2026-09-01"

  - id: FLC-zv7yngs0n7zm
    official_item: OIT-vhd83fn6w9wy
    language: fr
    level: TRAP
    front: "Twig : que produit {{ 'a' + 'b' }} ?"
    back: "Une TypeError. Le + est l'addition ; la concaténation s'écrit ~."
    explanation: >-
      Twig compile + vers le + de PHP. Sur PHP 8.4, la version exigée par
      Symfony 8.0, additionner deux chaînes non numériques lève une TypeError.
    memorization_justification: >-
      L'habitude de PHP et de JavaScript pousse à écrire +, et l'erreur ne se
      voit qu'au rendu du gabarit.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/twigphp/Twig/v3.22.0/doc/templates.rst"
        readable_url: "https://github.com/twigphp/Twig/blob/v3.22.0/doc/templates.rst"
        branch: "v3.22.0"
        symbol_or_lines: "section Operators"
        verified_at: "2026-09-01"

  - id: FLC-a64hqxfhfzpc
    official_item: OIT-ns36thqnh2jk
    language: fr
    front: "Twig : quelle stratégie d'échappement pour data-x={{ v }}, sans guillemets ?"
    back: "html_attr. La stratégie html ne couvre que le corps HTML et les attributs entre guillemets."
    explanation: >-
      Les cinq stratégies sont html, js, css, url et html_attr. url ne vaut que
      pour un sous-composant d'URI, jamais pour une URI entière.
    memorization_justification: >-
      La stratégie par défaut semble suffire partout ; la faille ouverte par un
      attribut sans guillemets ne produit aucun signe visible.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/twigphp/Twig/v3.22.0/doc/filters/escape.rst"
        readable_url: "https://github.com/twigphp/Twig/blob/v3.22.0/doc/filters/escape.rst"
        branch: "v3.22.0"
        symbol_or_lines: "escaping strategies list"
        verified_at: "2026-09-01"

  - id: FLC-mype643dt889
    official_item: OIT-g3p8wdtww344
    language: fr
    front: "Twig : que devient le contenu écrit hors d'un bloc dans un gabarit qui étend un parent ?"
    back: "Il est ignoré. Un enfant n'affiche que ses blocs."
    explanation: >-
      L'héritage est simple — un seul extends — et la balise extends doit être
      la première du gabarit. {{ parent() }} reprend le contenu du bloc parent.
    memorization_justification: >-
      Le contenu est écrit, valide, et disparaît sans erreur ni avertissement.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/twigphp/Twig/v3.22.0/doc/tags/extends.rst"
        readable_url: "https://github.com/twigphp/Twig/blob/v3.22.0/doc/tags/extends.rst"
        branch: "v3.22.0"
        symbol_or_lines: "child template renders only blocks"
        verified_at: "2026-09-01"

  - id: FLC-y4mtc33awnjy
    official_item: OIT-84j0qwkbcgq6
    language: fr
    front: "Twig : loop.index commence à quelle valeur, et quelles variables de loop exigent un tableau ?"
    back: "loop.index commence à 1. length, revindex, revindex0 et last exigent un tableau ou un Countable."
    explanation: >-
      loop.index0 commence à 0. Sur un itérateur ordinaire, Twig ne peut pas
      connaître la taille sans consommer la séquence, donc ces quatre variables
      n'existent pas.
    memorization_justification: >-
      Un indice à 1 contredit l'habitude PHP, et la restriction sur les
      itérateurs ne se manifeste qu'à l'exécution, sur un type particulier.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/twigphp/Twig/v3.22.0/doc/tags/for.rst"
        readable_url: "https://github.com/twigphp/Twig/blob/v3.22.0/doc/tags/for.rst"
        branch: "v3.22.0"
        symbol_or_lines: "loop variable table and note"
        verified_at: "2026-09-01"

  - id: FLC-n6w80mr1j8s1
    official_item: OIT-84j0qwkbcgq6
    language: fr
    front: "Twig : comment sortir d'une boucle par anticipation ?"
    back: "On ne peut pas : il n'y a ni break ni continue. On restreint la séquence avec filter, slice ou sort."
    explanation: >-
      La clause else de {% for %} couvre le cas de la séquence vide, ce qui
      évite un if englobant.
    memorization_justification: >-
      L'absence d'une construction attendue dans tous les autres langages ; on
      la cherche avant de comprendre qu'il faut filtrer en amont.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/twigphp/Twig/v3.22.0/doc/tags/for.rst"
        readable_url: "https://github.com/twigphp/Twig/blob/v3.22.0/doc/tags/for.rst"
        branch: "v3.22.0"
        symbol_or_lines: "no break/continue, filter and slice"
        verified_at: "2026-09-01"

  - id: FLC-2qe2jetwm5pq
    official_item: OIT-sd08j04k60m0
    language: fr
    front: "Twig : quel est l'ordre des arguments du filtre trans ?"
    back: "trans(paramètres, domaine, locale). Domaine par défaut : messages."
    explanation: >-
      Les paramètres classiques s'écrivent %nom% ; ICU utilise {nom} et exige un
      fichier suffixé +intl-icu.
    memorization_justification: >-
      Trois arguments positionnels dont deux facultatifs ; inverser domaine et
      locale produit une traduction manquante plutôt qu'une erreur.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/symfony/symfony-docs/8.0/reference/twig_reference.rst"
        readable_url: "https://github.com/symfony/symfony-docs/blob/8.0/reference/twig_reference.rst"
        branch: "8.0"
        symbol_or_lines: "trans filter signature"
        verified_at: "2026-09-01"

  - id: FLC-he6t8kt6dpva
    official_item: OIT-30gnb617ksex
    language: fr
    front: "Twig : dans quel type de chaîne l'interpolation #{…} fonctionne-t-elle ?"
    back: "Uniquement dans une chaîne à guillemets doubles. En guillemets simples, c'est du texte littéral."
    explanation: >-
      Le choix des guillemets n'a aucun effet sur les performances : il ne décide
      que de cela. Une barre oblique inverse échappe l'interpolation.
    memorization_justification: >-
      Contrainte arbitraire, sans erreur à la clé : la chaîne s'affiche
      littéralement, ce qui se remarque tard.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/twigphp/Twig/v3.22.0/doc/templates.rst"
        readable_url: "https://github.com/twigphp/Twig/blob/v3.22.0/doc/templates.rst"
        branch: "v3.22.0"
        symbol_or_lines: "section String Interpolation"
        verified_at: "2026-09-01"

  - id: FLC-f2fz5g5z16nj
    official_item: OIT-3r7rp470754w
    language: fr
    front: "Twig : où s'affiche {% dump x %}, et où {{ dump(x) }} ?"
    back: "La balise envoie à la barre de débogage ; la fonction affiche dans la page."
    explanation: >-
      Les deux ne sont disponibles qu'en environnement dev et test. En prod,
      l'appel produit une erreur PHP, ce qui est délibéré.
    memorization_justification: >-
      Deux écritures du même nom pour deux destinations opposées ; se tromper
      casse la mise en page ou fait chercher une sortie qui n'apparaît pas.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/symfony/symfony-docs/8.0/templates.rst"
        readable_url: "https://github.com/symfony/symfony-docs/blob/8.0/templates.rst"
        branch: "8.0"
        symbol_or_lines: "section Debugging Variables"
        verified_at: "2026-09-01"
  - id: FLC-aj7ff8fdwg48
    official_item: OIT-b9x8az2bx4t8
    language: fr
    level: RECALL
    front: 'Twig dans Symfony : lequel des trois paquets rend Twig configurable ?'
    back: TwigBundle — c'est lui qui tire le moteur et le pont, et lui seul qui apporte la configuration.
    explanation: Le moteur (`twig/twig`), le pont et le bundle sont distincts. Chercher la configuration
      dans le moteur, c'est ne pas la trouver.
    memorization_justification: Partage arbitraire entre trois paquets dont un seul s'installe.
    verification_status: VERIFIED
    official_sources:
    - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/templates.rst
      readable_url: https://github.com/symfony/symfony-docs/blob/8.0/templates.rst
      branch: '8.0'
      symbol_or_lines: template locations, namespaces and configuration
      verified_at: '2026-09-11'
  - id: FLC-6952dw009qzf
    official_item: OIT-dp7w7s85wxjg
    language: fr
    front: 'Twig : que vaut `app.user` sur une page publique sans authentification ?'
    back: '`null` — y accéder sans test produit une erreur.'
    explanation: '`app.session` peut de même valoir `null`, et la lire démarre la session, avec l''effet
      que cela a sur la cachabilité de la page.'
    memorization_justification: Valeur nulle non signalée par la syntaxe, et qui casse une page publique
      en production seulement.
    verification_status: VERIFIED
    official_sources:
    - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/templates.rst
      readable_url: https://github.com/symfony/symfony-docs/blob/8.0/templates.rst
      branch: '8.0'
      symbol_or_lines: the app global variable and twig.globals
      verified_at: '2026-09-11'
  - id: FLC-qhsttsmdnhx6
    official_item: OIT-sqekx9pkbe5v
    language: fr
    front: 'Twig : qu''est-ce qui décide qu''un élément est un filtre plutôt qu''une fonction ?'
    back: 'La source de la valeur : on part d''une valeur existante, c''est un filtre ; on part de rien,
      c''est une fonction.'
    explanation: 'Le même mot peut exister sous les deux formes. Les ajouts de Symfony — route, asset,
      traduction, formulaire — viennent du pont, pas du moteur : ils n''existent pas dans un Twig installé
      seul.'
    memorization_justification: 'Critère de classement plutôt qu''une liste à apprendre : c''est lui
      qui tranche pour un nom jamais vu.'
    verification_status: VERIFIED
    official_sources:
    - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/reference/twig_reference.rst
      readable_url: https://github.com/symfony/symfony-docs/blob/8.0/reference/twig_reference.rst
      branch: '8.0'
      symbol_or_lines: filters and functions
      verified_at: '2026-09-11'
  - id: FLC-hhtpt2r6ppfc
    official_item: OIT-ds2p5d4eg0pq
    language: fr
    front: 'Twig : par défaut, un gabarit inclus voit-il le contexte de l''appelant ?'
    back: Oui, tout le contexte. Le mot `only` est ce qui le restreint.
    explanation: 'C''est un piège : le fragment marche par accident tant que l''appelant possède la
      variable, puis casse ailleurs. Un gabarit absent fait par ailleurs échouer l''inclusion, sauf
      mention explicite l''autorisant.'
    memorization_justification: Défaut permissif qui produit une panne différée, loin du code fautif.
    verification_status: VERIFIED
    official_sources:
    - url: https://raw.githubusercontent.com/twigphp/Twig/v3.22.0/doc/tags/include.rst
      readable_url: https://github.com/twigphp/Twig/blob/v3.22.0/doc/tags/include.rst
      branch: v3.22.0
      symbol_or_lines: include tag and options
      verified_at: '2026-09-11'
  - id: FLC-gmr3e6ms0rw6
    official_item: OIT-yh6zx9shv9vs
    language: fr
    front: 'Twig : la fonction `path()` peut-elle retourner une URL absolue ?'
    back: Oui — si la route exige un schéma différent de celui de la requête courante, la sortie devient
      absolue.
    explanation: En dehors de ce cas, `path()` et `url()` ne diffèrent que par la forme du résultat
      et prennent exactement les mêmes arguments.
    memorization_justification: Exception au comportement que le nom de la fonction annonce.
    verification_status: VERIFIED
    official_sources:
    - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/reference/twig_reference.rst
      readable_url: https://github.com/symfony/symfony-docs/blob/8.0/reference/twig_reference.rst
      branch: '8.0'
      symbol_or_lines: path and url functions
      verified_at: '2026-09-11'
  - id: FLC-ynhbpp2dtxs4
    official_item: OIT-c34hn4px3czj
    language: fr
    front: 'Twig : rendre un contrôleur depuis un gabarit, est-ce un appel de fonction ?'
    back: 'Non — cela déclenche une sous-requête : le noyau retraverse son cycle pour chaque fragment.'
    explanation: En semer partout se paie. Les fragments passent par une URL interne réservée, configurable,
      qui n'est pas une route ordinaire de l'application.
    memorization_justification: Coût invisible à la lecture du gabarit, et qui décide les questions
      de performance.
    verification_status: VERIFIED
    official_sources:
    - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/templates.rst
      readable_url: https://github.com/symfony/symfony-docs/blob/8.0/templates.rst
      branch: '8.0'
      symbol_or_lines: embedding controllers and fragments path
      verified_at: '2026-09-11'
  - id: FLC-1rh42q3b0njr
    official_item: OIT-tw3xaqbz8xjy
    language: fr
    front: 'Twig : le chemin donné à `asset()` doit-il commencer par une barre ?'
    back: Non — il est relatif au répertoire public. Une barre en tête casse le préfixe de base.
    explanation: 'Le site cesse alors de fonctionner dès qu''il n''est pas servi à la racine du domaine.
      La fonction applique le préfixe *et* la stratégie de version : un chemin écrit en dur perd les
      deux.'
    memorization_justification: Détail de syntaxe dont l'effet ne se voit qu'en déploiement sous-répertoire.
    verification_status: VERIFIED
    official_sources:
    - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/reference/twig_reference.rst
      readable_url: https://github.com/symfony/symfony-docs/blob/8.0/reference/twig_reference.rst
      branch: '8.0'
      symbol_or_lines: asset and asset_version
      verified_at: '2026-09-11'

  - id: FLC-qthbpr7whnmj
    official_item: OIT-b9x8az2bx4t8
    language: fr
    level: RECALL
    front: "Symfony 8.0 : quelle est la valeur par défaut de twig.strict_variables ?"
    back: "%kernel.debug% : stricte en dev, permissive en prod."
    explanation: >-
      Une variable absente lève une RuntimeError en développement et rend null en production si l'option n'est pas fixée.
    memorization_justification: >-
      Une valeur par défaut qui change d'un environnement à l'autre se retient à part.
    verification_status: VERIFIED
    official_sources:
