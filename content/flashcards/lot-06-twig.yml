  - id: FLC-2znxkf50cst4
    official_item: OIT-b9x8az2bx4t8
    language: fr
    level: UNDERSTANDING
    front: "Symfony : que signifie twig.globals: { mailer: '@app.mailer' } ?"
    back: "La globale mailer est le service app.mailer, pas la chaîne @app.mailer."
    explanation: >-
      Un @ en tête désigne un service ; @@ l'échappe et produit une chaîne qui commence par @.
