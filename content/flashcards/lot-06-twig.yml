    official_item: OIT-b9x8az2bx4t8
    language: fr
    level: UNDERSTANDING
    front: "Symfony : comment Twig choisit-il entre templates/bundles/AcmeBlogBundle/ et le directory du bundle ?"
    back: "Le premier, s'il existe, est enregistré avant le second pour l'espace @AcmeBlog : il gagne."
    explanation: >-
      Le directory du bundle reste consulté pour les files non surchargés, et seul sous @!AcmeBlog.
    memorization_justification: >-
      L'ordre d'enregistrement explique la surcharge sans toucher au bundle.
