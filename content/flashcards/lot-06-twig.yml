    language: fr
    level: TRAP
    front: "Twig : que change le troisième argument true dans path(), puis dans url() ?"
    back: "path(…, true) rend un path relatif à la page courante ; url(…, true) rend une URL sans schéma, `//example.com/…`."
    explanation: >-
      Les parameters s'appellent `relative` et `schemeRelative` : `RELATIVE_PATH` d'un côté, `NETWORK_PATH` de l'autre.
