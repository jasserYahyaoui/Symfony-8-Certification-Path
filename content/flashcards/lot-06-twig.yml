        readable_url: "https://github.com/symfony/symfony/blob/8.0/src/Symfony/Bundle/TwigBundle/DependencyInjection/Configuration.php"
        repository: "symfony/symfony"
        branch: "8.0"
        symbol_or_lines: "strict_variables, default_path, paths, globals, form_themes"
        verified_at: "2026-09-24"

  - id: FLC-zwcpa6rw09yy
    official_item: OIT-b9x8az2bx4t8
    language: fr
    level: RECALL
    front: "Symfony : dans quel répertoire surcharger le gabarit user/profile.html.twig d'AcmeBlogBundle ?"
    back: "templates/bundles/AcmeBlogBundle/user/profile.html.twig"
    explanation: >-
      Le répertoire de surcharge garde le suffixe Bundle, contrairement à l'espace de noms @AcmeBlog.
    memorization_justification: >-
      Deux conventions de nommage voisines, faciles à croiser.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Bundle/TwigBundle/DependencyInjection/TwigExtension.php"
