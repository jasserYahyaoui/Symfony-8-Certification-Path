# Lot 06 flashcards (Master Plan §6).
#
# Seize cartes pour quatorze items. PED-010 a comblé les sept absences — les
# six listées ici plus Global variables, que l'en-tête d'origine omettait sans
# justification. Chaque carte tient au critère : ce qui rend Twig configurable,
# `app.user` nul sur page publique, ce qui sépare filtre et fonction, le
# contexte hérité par défaut dans une inclusion, `path()` qui peut devenir
# absolue, la sous-requête d'un rendu de contrôleur, la barre initiale
# d'`asset()`.

schema_version: 2

flashcards:
  - id: FLC-2e8x0yx9hbbp
    official_item: OIT-vhd83fn6w9wy
    language: fr
    level: RECALL
    front: "Twig : dans quel ordre {{ foo.bar }} est-il résolu ?"
    back: "foo['bar'], puis foo->bar, la constant Foo::bar, foo->bar(), getBar(), isBar(), hasBar(), __call(), sinon null."
    explanation: >-
      L'array est essayé en premier, avant la property : un object qui
      implémente ArrayAccess verra donc l'accès array gagner. La dernière
      étape lève une Twig\Error\RuntimeError au lieu de retourner null si
      l'option strict_variables est active.
    memorization_justification: >-
      Séquence ordonnée de six tentatives dont l'ordre décide du résultat, et
      dont rien dans la syntaxe du template ne donne d'indice.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/symfony/symfony-docs/8.0/templates.rst"
        readable_url: "https://github.com/symfony/symfony-docs/blob/8.0/templates.rst"
        branch: "8.0"
        symbol_or_lines: "section Template Variables, resolution order"
        verified_at: "2026-09-01"

  - id: FLC-zv7yngs0n7zm
    official_item: OIT-vhd83fn6w9wy
    language: fr
    level: TRAP
    front: "Twig : que produit {{ 'a' + 'b' }} ?"
    back: "Une TypeError. Le + est l'addition ; la concaténation s'écrit ~."
    explanation: >-
      Twig compile + vers le + de PHP. Sur PHP 8.4, la version exigée par
      Symfony 8.0, additionner deux strings non numériques lève une TypeError.
    memorization_justification: >-
      L'habitude de PHP et de JavaScript pousse à écrire +, et l'erreur ne se
      voit qu'au rendu du template.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/twigphp/Twig/v3.22.0/doc/templates.rst"
        readable_url: "https://github.com/twigphp/Twig/blob/v3.22.0/doc/templates.rst"
        branch: "v3.22.0"
        symbol_or_lines: "section Operators"
        verified_at: "2026-09-01"

  - id: FLC-a64hqxfhfzpc
    official_item: OIT-ns36thqnh2jk
    language: fr
    level: RECALL
    front: "Twig : quelle escaping strategy pour data-x={{ v }}, sans guillemets ?"
    back: "html_attr. La strategy html ne couvre que le body HTML et les attributes entre guillemets."
    explanation: >-
      Les cinq strategies sont html, js, css, url et html_attr. url ne vaut que
      pour un sous-composant d'URI, jamais pour une URI entière.
    memorization_justification: >-
      La strategy par défaut semble suffire partout ; la faille ouverte par un
      attribute sans guillemets ne produit aucun signe visible.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/twigphp/Twig/v3.22.0/doc/filters/escape.rst"
        readable_url: "https://github.com/twigphp/Twig/blob/v3.22.0/doc/filters/escape.rst"
        branch: "v3.22.0"
        symbol_or_lines: "escaping strategies list"
        verified_at: "2026-09-01"

  - id: FLC-mype643dt889
    official_item: OIT-g3p8wdtww344
    language: fr
    level: RECALL
    front: "Twig : que devient le contenu écrit hors d'un block dans un template qui étend un parent ?"
    back: "Une Twig\\Error\\SyntaxError en Twig 3.22 : content outside Twig blocks. Seuls les blancs sont tolérés."
    explanation: >-
      Parser::filterBodyNodes() rejette tout texte non blanc et tout {{ }} hors
      block dans un template enfant ; un tag qui n'affiche rien, comme set,
      reste permise.
    memorization_justification: >-
      On croit le contenu silencieusement perdu ; Twig 3.22 refuse de compiler.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/twigphp/Twig/v3.22.0/doc/tags/extends.rst"
        readable_url: "https://github.com/twigphp/Twig/blob/v3.22.0/doc/tags/extends.rst"
        branch: "v3.22.0"
        symbol_or_lines: "child template renders only blocks"
        verified_at: "2026-09-01"

  - id: FLC-y4mtc33awnjy
    official_item: OIT-84j0qwkbcgq6
    language: fr
    level: RECALL
    front: "Twig : loop.index commence à quelle valeur, et quelles variables de loop exigent un array ?"
    back: "loop.index commence à 1. length, revindex, revindex0 et last exigent un array ou un Countable."
    explanation: >-
      loop.index0 commence à 0. Sur un iterator ordinaire, Twig ne peut pas
      connaître la taille sans consommer la séquence, donc ces quatre variables
      n'existent pas.
    memorization_justification: >-
      Un indice à 1 contredit l'habitude PHP, et la restriction sur les
      iterators ne se manifeste qu'à l'exécution, sur un type particulier.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/twigphp/Twig/v3.22.0/doc/tags/for.rst"
        readable_url: "https://github.com/twigphp/Twig/blob/v3.22.0/doc/tags/for.rst"
        branch: "v3.22.0"
        symbol_or_lines: "loop variable table and note"
        verified_at: "2026-09-01"

  - id: FLC-n6w80mr1j8s1
    official_item: OIT-84j0qwkbcgq6
    language: fr
    level: TRAP
    front: "Twig : comment sortir d'une loop par anticipation ?"
    back: "On ne peut pas : il n'y a ni break ni continue. On restreint la séquence avec filter, slice ou sort."
    explanation: >-
      La clause else de {% for %} couvre le cas de la séquence vide, ce qui
      évite un if englobant.
    memorization_justification: >-
      L'absence d'une construction attendue dans tous les autres langages ; on
      la cherche avant de comprendre qu'il faut filtrer en amont.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/twigphp/Twig/v3.22.0/doc/tags/for.rst"
        readable_url: "https://github.com/twigphp/Twig/blob/v3.22.0/doc/tags/for.rst"
        branch: "v3.22.0"
        symbol_or_lines: "no break/continue, filter and slice"
        verified_at: "2026-09-01"

  - id: FLC-2qe2jetwm5pq
    official_item: OIT-sd08j04k60m0
    language: fr
    level: RECALL
    front: "Twig : quel est l'ordre des arguments du filter trans ?"
    back: "trans(parameters, domain, locale). Domain par défaut : messages."
    explanation: >-
      Les parameters classiques s'écrivent %nom% ; ICU utilise {nom} et exige un
      file suffixé +intl-icu.
    memorization_justification: >-
      Trois arguments positionnels dont deux facultatifs ; inverser domain et
      locale produit une translation manquante plutôt qu'une erreur.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/symfony/symfony-docs/8.0/reference/twig_reference.rst"
        readable_url: "https://github.com/symfony/symfony-docs/blob/8.0/reference/twig_reference.rst"
        branch: "8.0"
        symbol_or_lines: "trans filter signature"
        verified_at: "2026-09-01"

  - id: FLC-he6t8kt6dpva
    official_item: OIT-30gnb617ksex
    language: fr
    level: RECALL
    front: "Twig : dans quel type de string l'interpolation #{…} fonctionne-t-elle ?"
    back: "Uniquement dans une string à guillemets doubles. En guillemets simples, c'est du texte littéral."
    explanation: >-
      Le choix des guillemets n'a aucun effet sur les performances : il ne décide
      que de cela. Une barre oblique inverse échappe l'interpolation.
    memorization_justification: >-
      Constraint arbitraire, sans erreur à la key : la string s'affiche
      littéralement, ce qui se remarque tard.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/twigphp/Twig/v3.22.0/doc/templates.rst"
        readable_url: "https://github.com/twigphp/Twig/blob/v3.22.0/doc/templates.rst"
        branch: "v3.22.0"
        symbol_or_lines: "section String Interpolation"
        verified_at: "2026-09-01"

  - id: FLC-f2fz5g5z16nj
    official_item: OIT-3r7rp470754w
    language: fr
    level: RECALL
    front: "Twig : où s'affiche {% dump x %}, et où {{ dump(x) }} ?"
    back: "Le tag envoie à la debug toolbar ; la function affiche dans la page."
    explanation: >-
      Les deux ne sont disponibles qu'en environment dev et test. En prod,
      l'appel produit une erreur PHP, ce qui est délibéré.
    memorization_justification: >-
      Deux écritures du même nom pour deux destinations opposées ; se tromper
      casse la mise en page ou fait chercher un output qui n'apparaît pas.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/symfony/symfony-docs/8.0/templates.rst"
        readable_url: "https://github.com/symfony/symfony-docs/blob/8.0/templates.rst"
        branch: "8.0"
        symbol_or_lines: "section Debugging Variables"
        verified_at: "2026-09-01"
  - id: FLC-aj7ff8fdwg48
    official_item: OIT-b9x8az2bx4t8
    language: fr
    level: RECALL
    front: 'Twig dans Symfony : lequel des trois packages rend Twig configurable ?'
    back: TwigBundle — c'est lui qui tire l'engine et le bridge, et lui seul qui apporte la configuration.
    explanation: L'engine (`twig/twig`), le bridge et le bundle sont distincts. Chercher la configuration
      dans l'engine, c'est ne pas la trouver.
    memorization_justification: Partage arbitraire entre trois packages dont un seul s'installe.
    verification_status: VERIFIED
    official_sources:
    - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/templates.rst
      readable_url: https://github.com/symfony/symfony-docs/blob/8.0/templates.rst
      branch: '8.0'
      symbol_or_lines: template locations, namespaces and configuration
      verified_at: '2026-09-11'
  - id: FLC-6952dw009qzf
    official_item: OIT-dp7w7s85wxjg
    language: fr
    level: RECALL
    front: 'Twig : que vaut `app.user` sur une page publique sans authentication ?'
    back: '`null`. Lire une de ses properties lève une RuntimeError en mode strict — dev par défaut — et rend null sinon.'
    explanation: '`app.session` peut de même valoir `null`, et la lire démarre la session, avec l''effet
      que cela a sur la cachabilité de la page.'
    memorization_justification: La même ligne de template échoue en dev et passe en silence en prod, selon strict_variables.
    verification_status: VERIFIED
    official_sources:
    - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/templates.rst
      readable_url: https://github.com/symfony/symfony-docs/blob/8.0/templates.rst
      branch: '8.0'
      symbol_or_lines: the app global variable and twig.globals
      verified_at: '2026-09-11'
  - id: FLC-qhsttsmdnhx6
    official_item: OIT-sqekx9pkbe5v
    language: fr
    level: UNDERSTANDING
    front: 'Twig : qu''est-ce qui décide qu''un élément est un filter plutôt qu''une function ?'
    back: 'La source de la valeur : on part d''une valeur existante, c''est un filter ; on part de rien,
      c''est une function.'
    explanation: 'Le même mot peut exister sous les deux formes. Les ajouts de Symfony — route, asset,
      translation, form — viennent du bridge, pas de l''engine : ils n''existent pas dans un Twig installé
      seul.'
    memorization_justification: 'Critère de classement plutôt qu''une liste à apprendre : c''est lui
      qui tranche pour un nom jamais vu.'
    verification_status: VERIFIED
    official_sources:
    - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/reference/twig_reference.rst
      readable_url: https://github.com/symfony/symfony-docs/blob/8.0/reference/twig_reference.rst
      branch: '8.0'
      symbol_or_lines: filters and functions
      verified_at: '2026-09-11'
  - id: FLC-hhtpt2r6ppfc
    official_item: OIT-ds2p5d4eg0pq
    language: fr
    level: TRAP
    front: 'Twig : par défaut, un template inclus voit-il le contexte de l''appelant ?'
    back: Oui, tout le contexte. Le mot `only` est ce qui le restreint.
    explanation: 'C''est un piège : le fragment marche par accident tant que l''appelant possède la
      variable, puis casse ailleurs. Un template absent fait par ailleurs échouer l''inclusion, sauf
      mention explicite l''autorisant.'
    memorization_justification: Défaut permissif qui produit une panne différée, loin du code fautif.
    verification_status: VERIFIED
    official_sources:
    - url: https://raw.githubusercontent.com/twigphp/Twig/v3.22.0/doc/tags/include.rst
      readable_url: https://github.com/twigphp/Twig/blob/v3.22.0/doc/tags/include.rst
      branch: v3.22.0
      symbol_or_lines: include tag and options
      verified_at: '2026-09-11'
  - id: FLC-gmr3e6ms0rw6
    official_item: OIT-yh6zx9shv9vs
    language: fr
    level: TRAP
    front: 'Twig : la function `path()` peut-elle retourner une URL absolue ?'
    back: Oui — si la route exige un schéma différent de celui de la Request courante, l'output devient
      absolue.
    explanation: >-
      `UrlGenerator` force une URL absolue quand le schéma exigé diffère, et une référence `//hôte/…` quand le host de la route diffère. Les deux functions partagent le route name et les parameters, mais pas le sens de leur troisième argument.
    memorization_justification: Exception au comportement que le nom de la function annonce.
    verification_status: VERIFIED
    official_sources:
    - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/reference/twig_reference.rst
      readable_url: https://github.com/symfony/symfony-docs/blob/8.0/reference/twig_reference.rst
      branch: '8.0'
      symbol_or_lines: path and url functions
      verified_at: '2026-09-11'
  - id: FLC-ynhbpp2dtxs4
    official_item: OIT-c34hn4px3czj
    language: fr
    level: TRAP
    front: 'Twig : rendre un controller depuis un template, est-ce un appel de function ?'
    back: 'Non — cela déclenche une sub-Request : le kernel retraverse son cycle pour chaque fragment.'
    explanation: En semer partout se paie. Les fragments passent par une URL interne réservée, configurable,
      qui n'est pas une route ordinaire de l'application.
    memorization_justification: Coût invisible à la lecture du template, et qui décide les questions
      de performance.
    verification_status: VERIFIED
    official_sources:
    - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/templates.rst
      readable_url: https://github.com/symfony/symfony-docs/blob/8.0/templates.rst
      branch: '8.0'
      symbol_or_lines: embedding controllers and fragments path
      verified_at: '2026-09-11'
  - id: FLC-1rh42q3b0njr
    official_item: OIT-tw3xaqbz8xjy
    language: fr
    level: TRAP
    front: 'Twig : le path donné à `asset()` doit-il commencer par une barre ?'
    back: Non — il est relatif au directory public. Une barre en tête casse le préfixe de base.
    explanation: 'Le site cesse alors de fonctionner dès qu''il n''est pas servi à la racine du domain.
      La function applique le préfixe *et* la strategy de version : un path écrit en dur perd les
      deux.'
    memorization_justification: Détail de syntaxe dont l'effet ne se voit qu'en deployment sous-répertoire.
    verification_status: VERIFIED
    official_sources:
    - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/reference/twig_reference.rst
      readable_url: https://github.com/symfony/symfony-docs/blob/8.0/reference/twig_reference.rst
      branch: '8.0'
      symbol_or_lines: asset and asset_version
      verified_at: '2026-09-11'

  - id: FLC-qthbpr7whnmj
    official_item: OIT-b9x8az2bx4t8
    language: fr
    level: RECALL
    front: "Symfony 8.0 : quelle est la default value de twig.strict_variables ?"
    back: "%kernel.debug% : stricte en dev, permissive en prod."
    explanation: >-
      Une variable absente lève une RuntimeError en développement et rend null en production si l'option n'est pas fixée.
    memorization_justification: >-
      Une default value qui change d'un environment à l'autre se retient à part.
    verification_status: VERIFIED
    official_sources:
