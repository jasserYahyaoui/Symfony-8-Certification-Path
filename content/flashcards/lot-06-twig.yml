  - id: FLC-wj8skyxke5yj
    official_item: OIT-ds2p5d4eg0pq
    language: fr
    level: APPLICATION
    front: "Twig : un encart est répété sur plusieurs pages, seul son titre change à chaque appel. `include` ou `embed` ?"
    back: "`embed` : il insère le gabarit et permet de redéfinir son bloc de titre au point d'insertion."
    explanation: >-
      Critère : identique à chaque appel, `include` ; une partie à changer, `embed` — le « micro squelette de mise en page » de la documentation.
    memorization_justification: >-
      Choix de balise directement interrogeable.
