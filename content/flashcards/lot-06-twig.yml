  - id: FLC-jqp9kbfen7jr
    official_item: OIT-ds2p5d4eg0pq
    language: fr
    level: UNDERSTANDING
    front: "Twig : la balise `embed` accepte-t-elle `with`, `only` et `ignore missing` ?"
    back: "Oui : elle prend exactement les mêmes arguments que la balise `include`."
    explanation: >-
      `embed` combine `include` et `extends` ; la partie inclusion garde toute sa syntaxe, la partie héritage ajoute la redéfinition de blocs.
    memorization_justification: >-
      Parité d'arguments que la documentation affirme explicitement.
    verification_status: VERIFIED
