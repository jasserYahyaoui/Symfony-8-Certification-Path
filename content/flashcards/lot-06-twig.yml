    language: fr
    level: RECALL
    front: "Twig : quel argument de `include()` la documentation conseille-t-elle pour un gabarit écrit par un utilisateur final ?"
    back: "`sandboxed: true`, qui place le gabarit inclus dans le bac à sable."
    explanation: >-
      La fonction accepte quatre arguments après le nom : `variables`, `with_context`, `ignore_missing`, `sandboxed`. `CoreExtension::include()` n'active le bac à sable que si l'extension `SandboxExtension` est enregistrée.
    memorization_justification: >-
