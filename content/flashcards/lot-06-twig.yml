  - id: FLC-2zn2kq10b7x5
    official_item: OIT-b9x8az2bx4t8
    language: fr
    level: RECALL
    front: "Symfony : sous quel namespace atteindre le template d'origine d'un bundle dont on a surchargé un file ?"
    back: "@!AcmeBlog — le point d'exclamation désigne le directory du bundle seul."
    explanation: >-
      TwigExtension enregistre le directory du bundle une seconde fois sous !Nom, ce qui permet à la surcharge d'étendre l'original.
    memorization_justification: >-
      Syntaxe rare, qu'aucun autre mécanisme n'utilise.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Bundle/TwigBundle/DependencyInjection/TwigExtension.php"
