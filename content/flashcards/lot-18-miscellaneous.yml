- id: FLC-4yr0yphyhwvd
  official_item: OIT-78k7kbfpgfxt
  language: fr
  level: RECALL
  front: 'Symfony : quelle valeur de beta force un recalcul immédiat ?'
  back: '`INF` ; `0` désactive le recalcul anticipé, `1.0` est la valeur par défaut.'
  explanation: 'Exécuté : avec `INF`, le rappel tourne sur une clé présente.'
  memorization_justification: Paramètre beta.
  verification_status: VERIFIED
  official_sources:
