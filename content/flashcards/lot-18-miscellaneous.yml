  official_item: OIT-78k7kbfpgfxt
  language: fr
  level: APPLICATION
  front: 'Symfony : ne pas mettre en cache un résultat douteux renvoyé par le rappel.'
  back: Déclarer `bool &$save` en second paramètre du rappel et le mettre à `false`.
  explanation: 'Exécuté : `hasItem()` rend `false` ensuite.'
