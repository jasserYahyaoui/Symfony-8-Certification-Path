- id: FLC-q4e27600aa61
  official_item: OIT-78k7kbfpgfxt
  language: fr
  level: UNDERSTANDING
  front: 'Symfony : pourquoi isHit() peut-il rendre true à l''intérieur du rappel de get() ?'
  back: Parce que le rappel tourne aussi lors d'un recalcul anticipé, alors que la valeur est encore en cache.
  explanation: 'Exécuté avec un grand `beta` et avec `INF` : `isHit()` vaut `true`.'
  memorization_justification: Recalcul anticipé.
  verification_status: VERIFIED
