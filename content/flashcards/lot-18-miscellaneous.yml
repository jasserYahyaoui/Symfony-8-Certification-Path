- id: FLC-ya4eqxfa2bre
  official_item: OIT-78k7kbfpgfxt
  language: fr
  level: APPLICATION
  front: 'Symfony : effacer d''un coup tous les items étiquetés bar.'
  back: '`$pool->invalidateTags([''bar''])` sur un pool `TagAwareCacheInterface`.'
  explanation: 'Exécuté : l''item étiqueté `bar` disparaît, l''item étiqueté seulement `foo` reste.'
  memorization_justification: Invalidation par étiquette.
  verification_status: VERIFIED
