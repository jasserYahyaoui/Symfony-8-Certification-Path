- id: FLC-phg8gvczvthr
  official_item: OIT-78k7kbfpgfxt
  language: fr
  level: UNDERSTANDING
  front: 'Symfony : pourquoi deux pools peuvent-ils partager un stockage sans conflit de clés ?'
  back: Parce que chaque pool préfixe ses clés par son espace de noms.
  explanation: 'Exécuté : deux `FilesystemAdapter` sur un même répertoire, même clé, valeurs distinctes.'
  memorization_justification: Étanchéité des pools.
  verification_status: VERIFIED
