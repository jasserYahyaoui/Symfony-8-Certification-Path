  official_item: OIT-78k7kbfpgfxt
  language: fr
  front: Pourquoi les Cache Contracts n'ont-ils pas de méthode set() ?
  back: 'Parce que get() lit et écrit : son second argument est un appelable exécuté uniquement en cas de manque,
    qui produit la valeur et la stocke.'
  explanation: 'L''API ne définit que get() et delete(). Conséquence : on ne peut pas lire une clé sans déclarer
    comment la reconstruire.'
  memorization_justification: Toute autre API de cache expose un set() ; son absence ici surprend et s'oublie.
  verification_status: VERIFIED
