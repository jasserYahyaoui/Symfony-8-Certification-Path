# Lot 18 — Miscellaneous (Cache component) flashcards (Master Plan §6).
#
# One card per official item: the point fact that re-reading the course does
# not anchor, and that decides an exam answer.

schema_version: 2

flashcards:
- id: FLC-5ph49r9vszd1
  official_item: OIT-78k7kbfpgfxt
  language: fr
  level: UNDERSTANDING
  front: Pourquoi les Cache Contracts n'ont-ils pas de méthode set() ?
  back: 'Parce que get() lit et écrit : son second argument est un appelable exécuté uniquement en cas de manque,
    qui produit la valeur et la stocke.'
  explanation: 'L''API ne définit que get() et delete(). Conséquence : on ne peut pas lire une clé sans déclarer
    comment la reconstruire.'
  memorization_justification: Toute autre API de cache expose un set() ; son absence ici surprend et s'oublie.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/cache.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/cache.rst
    symbol_or_lines: '"The Cache Contracts define only two methods: get() and delete(). There''s no set() method because the get() method both gets and sets"; the second argument "is a PHP callable which is executed when the key is not found in the cache"'
    branch: '8.0'
    verified_at: '2026-09-02'
