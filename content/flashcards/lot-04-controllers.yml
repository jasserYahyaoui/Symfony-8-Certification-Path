  - id: FLC-x6n4fj9jjwhh
    official_item: OIT-qr7gnht5s847
    language: fr
    level: RECALL
    front: "Quelles interfaces la classe abstraite `Kernel` implémente-t-elle ?"
    back: "`KernelInterface`, `RebootableInterface` et `TerminableInterface`."
    explanation: >-
      Trois interfaces, mais deux d'entre elles n'apportent qu'une seule méthode :
      `reboot()` et `terminate()`. Tout le reste vient de `KernelInterface`.
    memorization_justification: >-
      Liste close de trois noms, énoncée telle quelle dans la déclaration de
      classe ; une question peut en ajouter ou en retirer une.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/HttpKernel/Kernel.php"
        readable_url: "https://github.com/symfony/symfony/blob/8.0/src/Symfony/Component/HttpKernel/Kernel.php"
        repository: "symfony/symfony"
        branch: "8.0"
        symbol_or_lines: "abstract class Kernel implements ..."
        verified_at: "2026-09-22"

  - id: FLC-c00cp4t07pcz
    official_item: OIT-qr7gnht5s847
    language: fr
    level: RECALL
    front: "Quelle interface `KernelInterface` étend-elle ?"
    back: "`HttpKernelInterface`."
    explanation: >-
      C'est par cet héritage qu'un `Kernel` porte `handle()`. Chercher `handle()`
      dans la liste des méthodes déclarées par `KernelInterface` ne le donne
      donc pas.
    memorization_justification: >-
      Relation d'héritage qui explique la présence d'une méthode absente de la
      déclaration ; elle ne se devine pas.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/HttpKernel/KernelInterface.php"
        readable_url: "https://github.com/symfony/symfony/blob/8.0/src/Symfony/Component/HttpKernel/KernelInterface.php"
        repository: "symfony/symfony"
        branch: "8.0"
        symbol_or_lines: "interface KernelInterface extends HttpKernelInterface"
        verified_at: "2026-09-22"

  - id: FLC-yrdkk3y2mncr
    official_item: OIT-qr7gnht5s847
    language: fr
    level: RECALL
    front: "Quel argument reçoit la méthode unique de `RebootableInterface`, et que renvoie-t-elle ?"
    back: "`reboot(?string $warmupDir): void` — l'argument est nullable."
    explanation: >-
      C'est la seule méthode de l'interface. `TerminableInterface` est bâtie de
      la même façon, avec `terminate(Request, Response): void` pour unique
      méthode.
    memorization_justification: >-
      Signature exacte d'une interface à méthode unique ; l'argument nullable
      est le détail qu'une proposition altère.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/HttpKernel/RebootableInterface.php"
        readable_url: "https://github.com/symfony/symfony/blob/8.0/src/Symfony/Component/HttpKernel/RebootableInterface.php"
        repository: "symfony/symfony"
        branch: "8.0"
        symbol_or_lines: "reboot"
        verified_at: "2026-09-22"

  - id: FLC-tqy6vzx06wyb
    official_item: OIT-qr7gnht5s847
    language: fr
    level: RECALL
    front: "Quelles deux méthodes `MicroKernelTrait` implémente-t-il à votre place ?"
    back: "`registerBundles()` et `registerContainerConfiguration()` — les deux qu'exige `KernelInterface`."
    explanation: >-
      En échange, il appelle deux points d'extension que vous écrivez :
      `configureContainer()` et `configureRoutes()`.
    memorization_justification: >-
      Le partage exact entre ce que le trait fournit et ce qu'il réclame ; les
      quatre noms se confondent facilement.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Bundle/FrameworkBundle/Kernel/MicroKernelTrait.php"
        readable_url: "https://github.com/symfony/symfony/blob/8.0/src/Symfony/Bundle/FrameworkBundle/Kernel/MicroKernelTrait.php"
        repository: "symfony/symfony"
        branch: "8.0"
        symbol_or_lines: "registerBundles, registerContainerConfiguration"
        verified_at: "2026-09-22"

  - id: FLC-77v79574hbs0
    official_item: OIT-qr7gnht5s847
    language: fr
    level: UNDERSTANDING
    front: "Pourquoi `configureContainer()` peut-elle être `private` dans votre `Kernel` ?"
    back: "Parce que `MicroKernelTrait` l'appelle **par réflexion**, ce qui contourne la visibilité."
    explanation: >-
      Une méthode privée ne serait pas appelable normalement depuis le trait.
      `ReflectionMethod::getClosure()` y accède, d'où le squelette Symfony qui
      les déclare `private`.
    memorization_justification: >-
      Explique une bizarrerie visible dans tout projet Symfony et qu'on prend
      pour une règle de PHP mal comprise.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Bundle/FrameworkBundle/Kernel/MicroKernelTrait.php"
        readable_url: "https://github.com/symfony/symfony/blob/8.0/src/Symfony/Bundle/FrameworkBundle/Kernel/MicroKernelTrait.php"
        repository: "symfony/symfony"
        branch: "8.0"
        symbol_or_lines: "ReflectionMethod, configureContainer, configureRoutes"
        verified_at: "2026-09-22"

  - id: FLC-e5g4j3jgmjrd
    official_item: OIT-qr7gnht5s847
    language: fr
    level: UNDERSTANDING
    front: "Le composant HttpKernel fonctionne-t-il sans FrameworkBundle ?"
    back: "Oui. L'inverse est faux : le bundle **câble** le composant, il ne le réécrit pas."
    explanation: >-
      Le contrat `handle()`, la classe `Kernel`, les huit événements, les
      résolveurs et les exceptions HTTP sont dans le composant. On peut écrire
      son propre framework avec cela seul.
    memorization_justification: >-
      Sens de la dépendance, qui commande toutes les questions « où se trouve
      X ? » du sujet.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/symfony/symfony-docs/8.0/configuration/micro_kernel_trait.rst"
        readable_url: "https://github.com/symfony/symfony-docs/blob/8.0/configuration/micro_kernel_trait.rst"
        repository: "symfony/symfony-docs"
        branch: "8.0"
        symbol_or_lines: "Building your own Framework with the MicroKernelTrait"
        verified_at: "2026-09-22"

  - id: FLC-nnq1m6nqc4yn
    official_item: OIT-qr7gnht5s847
    language: fr
    level: UNDERSTANDING
    front: "Pourquoi `Kernel` est-elle **abstraite** ?"
    back: "Parce que `registerBundles()` et `registerContainerConfiguration()` restent à fournir — c'est l'application qui les écrit."
    explanation: >-
      `MicroKernelTrait` existe précisément pour les fournir toutes deux, ce qui
      permet un noyau en une seule classe sans fichiers de configuration
      séparés.
    memorization_justification: >-
      Relie l'abstraction de la classe au rôle du trait ; les deux notions
      s'éclairent mutuellement.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/HttpKernel/KernelInterface.php"
        readable_url: "https://github.com/symfony/symfony/blob/8.0/src/Symfony/Component/HttpKernel/KernelInterface.php"
        repository: "symfony/symfony"
        branch: "8.0"
        symbol_or_lines: "registerBundles, registerContainerConfiguration"
        verified_at: "2026-09-22"

  - id: FLC-erdbww3gcdne
    official_item: OIT-qr7gnht5s847
    language: fr
    level: APPLICATION
    front: "Vous cherchez l'arbre de configuration `framework:`. Composant ou bundle ?"
    back: "**Bundle.** Un arbre de configuration suppose un conteneur de services, que le composant n'a pas."
