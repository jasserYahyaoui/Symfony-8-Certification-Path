    language: fr
    level: UNDERSTANDING
    front: "Pourquoi chaque service déclaré est-il préfixé par un point d'interrogation ?"
    back: "Il est facultatif : la classe s'utilise sans Twig ni Security, et le raccourci concerné lève alors une exception explicite."
