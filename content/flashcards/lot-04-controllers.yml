  - id: FLC-1g7a96r31q4m
    official_item: OIT-tb3bnd6b0f01
    language: fr
    level: RECALL
    front: "Un file téléversé n'est pas déplacé par le controller. Qu'en reste-t-il après la Request ?"
    back: "Rien : PHP supprime le file temporaire à la fin de la Request. Il faut `move()` pendant la Request."
    explanation: "La documentation PHP : le file est effacé du directory temporaire à la fin de la Request s'il n'a été ni déplacé ni renommé."
    memorization_justification: "On croit le file disponible pour un traitement ultérieur ; c'est la fin de la Request qui l'efface."
    verification_status: VERIFIED
