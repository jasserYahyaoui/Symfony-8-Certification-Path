    front: 'On veut qu un paramètre de requête invalide donne null plutôt qu une erreur avec #[MapQueryParameter]. Que passer ?'
    back: 'Le drapeau FILTER_NULL_ON_FAILURE dans flags.'
    explanation: >-
      Sans lui, une valeur invalide lève une HttpException de statut 404.
