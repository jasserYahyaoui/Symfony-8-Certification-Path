    front: "Symfony : le type d'un flash message doit-il être `success`, `notice`, `warning` ou `error` ?"
    back: "Non : c'est une string libre, `add(string $type, mixed $message)`. Ces noms sont des usages, pas une liste imposée."
    explanation: "Exécuté avec HttpFoundation 8.0.15 : `add('anything-goes', 'hi')` puis `peek('anything-goes')` rend `['hi']`."
