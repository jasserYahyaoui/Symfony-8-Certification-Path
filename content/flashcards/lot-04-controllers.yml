        verified_at: "2026-09-22"

  - id: FLC-5be6f1hbz8fg
    official_item: OIT-6cr9b8ea8g32
    language: fr
    level: TRAP
    front: "Piège : « un corps JSON invalide donne un sac vide »."
    back: "Non, il lève. Le sac vide correspond au cas où le corps est vide, pas au cas où il est illisible."
    explanation: >-
      Les deux situations se ressemblent côté appelant et se traitent
      autrement : l'une est une absence, l'autre une erreur du client.
    memorization_justification: >-
      Traiter une erreur comme une absence renvoie un succès là où le client
      attend un refus.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/HttpFoundation/Request.php"
        readable_url: "https://github.com/symfony/symfony/blob/8.0/src/Symfony/Component/HttpFoundation/Request.php"
        repository: "symfony/symfony"
        branch: "8.0"
        symbol_or_lines: "getPayload, empty content branch"
        verified_at: "2026-09-22"

  - id: FLC-k5rhfzcq75ys
    official_item: OIT-6cr9b8ea8g32
    language: fr
    level: TRAP
    front: "Piège : « il suffit de typer un argument `Request` pour obtenir la requête, partout »."
    back: "Dans un contrôleur, oui. Dans un service, non : un service est construit une fois, il reçoit `RequestStack`."
    explanation: >-
      La règle du contrôleur est si simple qu'on la généralise sans voir que la
      durée de vie n'est pas la même.
    memorization_justification: >-
      L'erreur ne se voit pas à l'écriture : elle produit une requête figée ou
      une injection refusée.
    verification_status: VERIFIED
    official_sources:
