    front: "Symfony : poser un flash message démarre-t-il la session ?"
    back: "Oui : le flash est stocké en session. `isStarted()` passe de `false` à `true` dès `getFlashBag()->add()`."
    explanation: "Exécuté avec HttpFoundation 8.0.15. Il n'y a pas de flash sans session — donc sans cookie de session."
