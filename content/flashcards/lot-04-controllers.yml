  - id: FLC-e45ff59mktqe
    official_item: OIT-2emwghgkkrdy
    language: fr
    level: UNDERSTANDING
    front: "Pourquoi un statut explicite empêche-t-il la promotion en 422 ?"
    back: "Parce que la promotion n'est tentée que si la réponse est encore en 200 : un statut choisi n'est jamais écrasé."
    explanation: >-
      Le test sur le statut vient avant la boucle sur les paramètres, donc les
      formulaires ne sont même pas examinés.
    memorization_justification: >-
      Savoir lequel des deux mécanismes gagne est la seule façon de répondre à
      une question qui les combine.
