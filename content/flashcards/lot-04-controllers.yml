        repository: "symfony/symfony"
        branch: "8.0"
        symbol_or_lines: "getSession, SessionNotFoundException"
        verified_at: "2026-09-22"

  - id: FLC-9k1zssrhm6zk
    official_item: OIT-6cr9b8ea8g32
    language: fr
    level: TRAP
    front: "Piège : « `getPayload()` fusionne les données de formulaire et le corps JSON »."
    back: "Non. Si le sac de formulaire n'est pas vide, elle le rend et ignore le corps brut."
    explanation: >-
      C'est un choix en cascade, pas une union : formulaire, puis corps vide,
      puis JSON.
    memorization_justification: >-
      « Lit le corps quel que soit son format » est une paraphrase séduisante et
      fausse du comportement réel.
    verification_status: VERIFIED
    official_sources:
