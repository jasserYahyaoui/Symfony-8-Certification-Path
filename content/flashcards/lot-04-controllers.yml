        branch: "8.0"
        symbol_or_lines: "route wildcards matched by argument name"
        verified_at: "2026-09-22"

  - id: FLC-cqjwwbac7c60
    official_item: OIT-6cr9b8ea8g32
    language: fr
    level: APPLICATION
    front: "Un service appelle `getSession()` sur `RequestStack` hors de toute requête : que reçoit-il ?"
    back: "Une `SessionNotFoundException`. C'est le seul accesseur de la pile qui lève au lieu de rendre `null`."
    explanation: >-
      Les trois accesseurs de requête rendent `null` ; la session est
      l'exception de la classe.
    memorization_justification: >-
      Une exception isolée au milieu de méthodes nullables : le contrat n'est
      pas homogène, et on le suppose homogène.
    verification_status: VERIFIED
    official_sources:
