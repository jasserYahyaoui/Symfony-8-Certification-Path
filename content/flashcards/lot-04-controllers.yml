  - id: FLC-y5fcddvz4y8z
    official_item: OIT-ycc2c8tnv68h
    language: fr
    level: UNDERSTANDING
    front: "Pourquoi le nom généré est-il `app_lucky_number` et non `app_lucky_controller_number` ?"
    back: "Le chargeur du bundle retire le segment `controller_`. La casse n'est pas découpée, elle est aplatie."
    explanation: >-
      Le composant produit `app_controller_luckycontroller_number` ; le bundle
      remplace les segments `bundle_` et `controller_` par un tiret bas, puis
      écrase les tirets bas doublés.
    memorization_justification: >-
      Le résultat ressemble à un découpage de casse alors qu'aucun n'a lieu ;
      comprendre l'opération évite d'inventer un nom plausible et faux.
    verification_status: VERIFIED
    official_sources:
