  - id: FLC-5sck1baedk5d
    official_item: OIT-6cr9b8ea8g32
    language: fr
    level: APPLICATION
    front: "Le client poste un JSON mal formé et le contrôleur appelle `getPayload()` : que se passe-t-il ?"
    back: "Une `JsonException` est levée. Le sac vide est réservé au cas où le corps est vide."
    explanation: >-
      Le décodage est fait avec l'option qui transforme l'erreur en exception,
      donc l'échec est bruyant.
    memorization_justification: >-
      On attend un sac vide par symétrie avec le corps vide ; la différence
      décide du code de statut renvoyé au client.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/HttpFoundation/Request.php"
        readable_url: "https://github.com/symfony/symfony/blob/8.0/src/Symfony/Component/HttpFoundation/Request.php"
        repository: "symfony/symfony"
        branch: "8.0"
        symbol_or_lines: "getPayload, JsonException"
        verified_at: "2026-09-22"

  - id: FLC-nrzrqrya0yap
    official_item: OIT-6cr9b8ea8g32
    language: fr
    level: APPLICATION
    front: "Le corps de la requête est le JSON valide `42`, et rien d'autre. Que rend `getPayload()` ?"
    back: "Rien : elle lève. Un JSON qui ne décode pas en tableau est refusé."
    explanation: >-
      Un nombre, une chaîne ou un booléen seuls sont du JSON valide, mais la
      méthode exige un tableau pour construire son sac.
    memorization_justification: >-
      « JSON valide » et « acceptable par getPayload » ne sont pas la même
      chose, et c'est un cas que l'on n'essaie jamais.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/HttpFoundation/Request.php"
        readable_url: "https://github.com/symfony/symfony/blob/8.0/src/Symfony/Component/HttpFoundation/Request.php"
        repository: "symfony/symfony"
        branch: "8.0"
        symbol_or_lines: "getPayload, JSON content was expected to decode to an array"
        verified_at: "2026-09-22"

  - id: FLC-w924c4pch14q
    official_item: OIT-6cr9b8ea8g32
    language: fr
    level: APPLICATION
    front: "On réordonne les arguments d'une méthode d'action liée à une route à deux paramètres : que se passe-t-il ?"
    back: "Rien. L'appariement se fait sur le nom, jamais sur la position."
    explanation: >-
      En renommer un, en revanche, casse tout : le paramètre n'est plus trouvé
      dans le sac `attributes`.
    memorization_justification: >-
      La forme d'un appel de fonction suggère un appariement positionnel, qui
      n'a pas lieu ici.
    verification_status: VERIFIED
    official_sources:
