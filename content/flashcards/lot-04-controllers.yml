    back: "Rien : elle lève. Un JSON qui ne décode pas en tableau est refusé."
    explanation: >-
      Un nombre, une chaîne ou un booléen seuls sont du JSON valide, mais la
      méthode exige un tableau pour construire son sac.
    memorization_justification: >-
