    language: fr
    level: RECALL
    front: "Que fait le composant Routing du nom de classe pour fabriquer un nom de route ?"
    back: "Il remplace les antislash par des tirets bas, ajoute un tiret bas et le nom de méthode, puis met tout en minuscules."
    explanation: >-
      `getDefaultRouteName()` ajoute ensuite un index numérique à partir de la
      deuxième route rencontrée dans la même classe.
    memorization_justification: >-
      Trois opérations dans un ordre précis ; c'est l'étape que l'on saute en
      supposant que le nom court vient directement du composant.
