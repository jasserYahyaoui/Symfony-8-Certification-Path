        symbol_or_lines: "The Request Object as a Controller Argument"
        verified_at: "2026-09-22"

  - id: FLC-tnx6vsq56721
    official_item: OIT-6cr9b8ea8g32
    language: fr
    level: TRAP
    front: "Piège : « `getCurrentRequest()` rend toujours la requête entrée par le serveur »."
    back: "Non. Pendant une sous-requête, elle rend la sous-requête ; la requête d'entrée est rendue par `getMainRequest()`."
    explanation: >-
      Hors sous-requête les deux coïncident, ce qui rend le piège invisible
      jusqu'au premier `forward()`.
    memorization_justification: >-
      Deux méthodes qui donnent le même résultat 99 % du temps, et un résultat
      différent exactement dans le cas qu'on teste le moins.
    verification_status: VERIFIED
