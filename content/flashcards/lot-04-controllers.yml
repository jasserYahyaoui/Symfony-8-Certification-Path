    front: "Pourquoi la condition du 422 exige-t-elle que le formulaire soit soumis, et pas seulement invalide ?"
    back: "Pour que l'affichage initial du formulaire, qui n'a encore rien reçu, sorte en 200."
    explanation: >-
      Un formulaire non soumis n'a pas été validé : le promouvoir en 422 ferait
      passer la première visite d'une page pour une erreur du client.
    memorization_justification: >-
      La distinction soumis / valide est le cœur du cycle de vie d'un
      formulaire, et elle décide ici du code de statut.
