      remplace les segments `bundle_` et `controller_` par un tiret bas, puis
      écrase les tirets bas doublés.
    memorization_justification: >-
      Le résultat ressemble à un découpage de casse alors qu'aucun n'a lieu ;
      comprendre l'opération évite d'inventer un nom plausible et faux.
