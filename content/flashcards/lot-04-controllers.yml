  - id: FLC-a68zce7jg14p
    official_item: OIT-bwfqarnn6s2f
    language: fr
    level: UNDERSTANDING
    front: "Un controller rend `redirectToRoute('home')`. Le controller de `home` s'exécute-t-il dans la même Request ?"
    back: "Non : le redirect est une Response 3xx portant `Location`. Le navigateur repart, l'URL affichée change, et `home` s'exécute dans une seconde Request."
    explanation: "C'est l'opposé de `forward()`, qui exécute la cible en sub-Request sans quitter la Request courante."
    memorization_justification: "Redirect et forward se confondent ; ce qui les sépare — une ou deux Requests HTTP — se retient."
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/httpwg/httpwg.github.io/master/specs/rfc9110.html"
        readable_url: "https://github.com/httpwg/httpwg.github.io/blob/master/specs/rfc9110.html"
        branch: "master"
        symbol_or_lines: "section 15.4 Redirection 3xx — \"further action needs to be taken by the user agent in order to fulfill the request\""
        verified_at: "2026-10-24"

