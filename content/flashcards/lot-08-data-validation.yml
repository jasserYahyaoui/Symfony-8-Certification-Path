  front: 'Validator : quelles valeurs NotBlank refuse-t-il ?'
  back: '`null`, `''''`, `false` et `[]` ; avec `allowNull: true`, `null` est accepté.'
  explanation: Exécuté sur chaque valeur. `NotNull` ne refuse que `null`.
  memorization_justification: Tableau de décision NotBlank / NotNull.
