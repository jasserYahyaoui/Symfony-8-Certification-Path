  language: fr
  level: APPLICATION
  front: 'Validator : tester un e-mail candidat contre les contraintes de User::$email, sans instance de User.'
  back: '`$validator->validatePropertyValue(User::class, ''email'', $candidate)`.'
  explanation: 'La méthode accepte un nom de classe et ne touche à aucun objet. Exécuté : une violation pour `''nope''`.'
  memorization_justification: Cas d'usage typique d'un formulaire en plusieurs étapes.
  verification_status: VERIFIED
