  level: RECALL
  front: 'Validator : qu''arrête une séquence de groupes ?'
  back: Le premier groupe — ou la première étape — qui produit au moins une violation ; les suivants ne sont pas validés.
  explanation: 'Exécuté : `username` vide, seule sa violation ; rempli, la violation du groupe `Strict` apparaît.'
  memorization_justification: Condition d'arrêt de la séquence.
