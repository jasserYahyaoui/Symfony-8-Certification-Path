  back: 'Non : une property typée non initialisée est validée comme `null`, et `Length` ignore `null`. Exécuté : `NotBlank` sur une telle property, elle, la refuse.'
  explanation: Documentation 8.0, « The validator will use a value null if a typed property is uninitialized » ; exécuté avec Validator 8.0.15.
  memorization_justification: Non initialisée = `null` pour le Validator, pas une erreur PHP.
