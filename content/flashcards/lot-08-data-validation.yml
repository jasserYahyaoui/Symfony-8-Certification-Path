- id: FLC-3varyj6x10n9
  official_item: OIT-6wd8860brzfy
  language: fr
  level: UNDERSTANDING
  front: 'Validator : pourquoi if ($violations) ne dit-il pas si la validation a échoué ?'
  back: 'Parce qu''une liste vide reste un objet : convertie en booléen, elle vaut `true`. Il faut tester `count($violations)`.'
  explanation: 'Exécuté : `(bool)` d''une liste vide donne `true`.'
  memorization_justification: Erreur de test la plus fréquente.
  verification_status: VERIFIED
  official_sources:
