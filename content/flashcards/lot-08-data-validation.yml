flashcards:
- id: FLC-3sceej8y8a54
  official_item: OIT-6wd8860brzfy
  language: fr
  level: TRAP
  front: 'Validator : que retourne validate() quand tout est valide ?'
  back: Une ConstraintViolationListInterface vide — jamais true, jamais null.
  explanation: 'Une liste vide reste un object, donc une valeur vraie : le test doit porter sur count(),
    pas sur la liste elle-même.'
  memorization_justification: L'habitude des validators qui retournent un bool fait écrire if ($violations),
    qui est toujours vrai.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Validator/Validator/ValidatorInterface.php
    readable_url: https://github.com/symfony/symfony/blob/8.0/src/Symfony/Component/Validator/Validator/ValidatorInterface.php
    branch: '8.0'
    symbol_or_lines: ValidatorInterface::validate
    verified_at: '2026-09-01'
- id: FLC-qb5nx97jkjav
  official_item: OIT-d3yp0sq36xrx
  language: fr
  level: TRAP
  front: Valider un object valide-t-il les objects qu'il contient ?
  back: "Non. Il faut poser `#[Assert\\Valid]` sur la property, ou `#[Assert\\Cascade]` sur la class, pour cascader."
  explanation: 'Sans la constraint de cascade, l''object imbriqué est ignoré en silence : aucune erreur,
    aucune violation.'
  memorization_justification: L'absence de cascade ne produit aucun signal ; le défaut se manifeste par
    une validation qui passe alors qu'elle ne devrait pas.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/reference/constraints/Valid.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/reference/constraints/Valid.rst
    symbol_or_lines: '"This constraint is used to enable validation on objects that are embedded as properties on an object being validated" — i.e. cascading requires #[Assert\\Valid] on the property'
    branch: '8.0'
    verified_at: '2026-09-01'
- id: FLC-7p2ygq8ft3x4
  official_item: OIT-9x3strrjdng7
  language: fr
  level: TRAP
  front: Quelle est la différence entre NotBlank et NotNull ?
  back: "NotNull refuse seulement null. NotBlank refuse aussi '', false et [] — mais laisse passer la string '0', l'int 0, 0.0 et une string d'espaces."
  explanation: Le validator teste false === $value ou (!$value && '0' != $value), d'où le cas particulier
    de la string '0'.
  memorization_justification: Les deux noms se ressemblent et le choix change le comportement sur une
    valeur vide ou nulle.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Validator/Constraints/NotBlankValidator.php
    readable_url: https://github.com/symfony/symfony/blob/8.0/src/Symfony/Component/Validator/Constraints/NotBlankValidator.php
    branch: '8.0'
    symbol_or_lines: NotBlankValidator::validate
    verified_at: '2026-09-01'
- id: FLC-swztaetynk4y
  official_item: OIT-ttwpe00f32q9
  language: fr
  level: RECALL
  front: Quelles methods peuvent porter une constraint de validation ?
  back: Celles dont le nom commence par get, is ou has, sans argument — quelle que soit la visibilité.
  explanation: "Le scope accessor valide la valeur retournée, ce qui permet une règle calculée au moment de la validation. Un autre nom lève une MappingException."
  memorization_justification: La règle de nommage est arbitraire et ne se déduit pas ; la liberté de visibilité
    surprend.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/validation.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/validation.rst
    anchor: getters
    branch: '8.0'
    verified_at: '2026-09-01'
- id: FLC-mvq0exxwwfxa
  official_item: OIT-kkhb3wd341ex
  language: fr
  level: RECALL
  front: Sans group passé à validate(), quelles constraints s'appliquent ?
  back: Celles du group Default uniquement — pas toutes les constraints de la class.
  explanation: Une constraint étiquetée dans un group personnalisé reste donc inerte tant que personne
    ne demande ce group.
  memorization_justification: L'intuition dit « par défaut, tout est vérifié » ; c'est l'inverse pour
    les constraints groupées.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/validation/groups.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/validation/groups.rst
    symbol_or_lines: '"Constraints in the Default group of a class are the constraints that have either no explicit group configured or that are configured to a group equal to the class name or the string Default"'
    branch: '8.0'
    verified_at: '2026-09-01'
- id: FLC-rstx3zwpz28w
  official_item: OIT-rwavvsx2d7nq
  language: fr
  level: TRAP
  front: Avec quel group déclare-t-on une séquence, et pourquoi pas Default ?
  back: "Avec le nom de la class, obligatoire. Sous séquence, Default désigne la séquence : l'y inclure lève une GroupDefinitionException, « The group \"Default\" is not allowed in group sequences. »"
  explanation: "La documentation parle de récursion infinie ; le code 8.0 refuse la séquence avant. Hors séquence, Default et le nom de la class ne diffèrent que sur les objects imbriqués."
  memorization_justification: "La règle d'écriture est connue, sa sanction réelle l'est moins : l'exécution contredit la documentation."
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/validation/sequence_provider.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/validation/sequence_provider.rst
    symbol_or_lines: '"you have to use the {ClassName} (e.g. User) group when specifying a group sequence. When using Default, you get an infinite recursion (as the Default group references the group sequence, which will contain the Default group which references the same group sequence, ...)"'
    branch: '8.0'
    verified_at: '2026-09-01'
  - url: https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Validator/Mapping/ClassMetadata.php
    readable_url: https://github.com/symfony/symfony/blob/8.0/src/Symfony/Component/Validator/Mapping/ClassMetadata.php
    repository: symfony/symfony
    branch: '8.0'
    symbol_or_lines: ClassMetadata::setGroupSequence(), Default not allowed
    verified_at: '2026-09-29'
- id: FLC-6n0qg98nptxe
  official_item: OIT-hcdrp2y7kbct
  language: fr
  level: RECALL
  front: 'Callback : quel est l''ordre des arguments, en instance et en statique ?'
  back: 'Instance : (context, payload). Statique : (value, context, payload) — la valeur passe devant.'
  explanation: Une method statique n'a pas $this, donc l'object valide lui est passé en premier argument.
  memorization_justification: Les deux signatures se ressemblent et l'inversion des deux premiers arguments
    est la seule différence.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/reference/constraints/Callback.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/reference/constraints/Callback.rst
    anchor: static-callbacks
    branch: '8.0'
    verified_at: '2026-09-01'
- id: FLC-crtrxfbtxbrw
  official_item: OIT-0wnxbapegqhv
  language: fr
  level: TRAP
  front: Que produit une chaîne d'appels buildViolation() qui ne finit pas par addViolation() ?
  back: Rien. Le builder prépare la violation ; seule addViolation() l'enregistre.
  explanation: La validation passe alors sans erreur alors que la règle est violée, ce qui en fait un
    défaut silencieux.
  memorization_justification: L'oubli du dernier maillon ne produit ni erreur ni avertissement.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Validator/Violation/ConstraintViolationBuilderInterface.php
    readable_url: https://github.com/symfony/symfony/blob/8.0/src/Symfony/Component/Validator/Violation/ConstraintViolationBuilderInterface.php
    branch: '8.0'
    symbol_or_lines: addViolation
    verified_at: '2026-09-01'
- id: FLC-gs9qaxhpg8rd
  official_item: OIT-6wd8860brzfy
  language: fr
  level: TRAP
  front: 'Validator hors framework : Validation::createValidator() valide un object portant des constraints en attributes, aux valeurs invalides. Combien de violations ?'
  back: 'Zéro. Ce validator ne lit pas les attributes : il faut `Validation::createValidatorBuilder()->enableAttributeMapping()->getValidator()`.'
  explanation: '`ValidatorBuilder` démarre avec la lecture des attributes désactivée. Exécuté avec symfony/validator 8.0.15 : 0 violation, puis 2 avec `enableAttributeMapping()`.'
  memorization_justification: 'Un oubli silencieux : l''object paraît valide.'
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Validator/ValidatorBuilder.php
    readable_url: https://github.com/symfony/symfony/blob/8.0/src/Symfony/Component/Validator/ValidatorBuilder.php
    repository: symfony/symfony
    branch: '8.0'
    symbol_or_lines: ValidatorBuilder::enableAttributeMapping(), default false
    verified_at: '2026-09-25'
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/components/validator/resources.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/components/validator/resources.rst
    repository: symfony/symfony-docs
    branch: '8.0'
    symbol_or_lines: Loading Resources, attribute mapping
    verified_at: '2026-09-25'
