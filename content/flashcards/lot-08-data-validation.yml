  front: 'Validator : pourquoi dit-on que Default et le nom de la classe sont identiques pour la classe elle-même ?'
  back: Parce que toute contrainte de `Default` reçoit aussi le nom de la classe ; ils ne diffèrent que sur les objets imbriqués et dans une séquence de groupes.
