  official_item: OIT-6wd8860brzfy
  language: fr
  level: RECALL
  front: 'Validator : que fait la fonction produite par Validation::createCallable() pour une valeur invalide ?'
  back: Elle lève `ValidationFailedException`, alors que `createIsValidCallable()` retourne `false`.
  explanation: Exécuté avec `Email` sur `'x'`.
  memorization_justification: Deux raccourcis voisins aux comportements opposés.
