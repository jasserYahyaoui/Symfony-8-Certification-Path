    verified_at: '2026-09-25'
- id: FLC-b13mpdyc01bc
  official_item: OIT-6wd8860brzfy
  language: fr
  level: RECALL
  front: 'Validator : quand new Assert\Length() sans option lève-t-il une exception, et laquelle ?'
  back: 'À la construction de la contrainte : `MissingOptionsException`, « Either option "min" or "max" must be given… ».'
  explanation: Une contrainte mal configurée échoue avant toute validation. Exécuté.
  memorization_justification: L'erreur de configuration n'attend pas la donnée.
  verification_status: VERIFIED
