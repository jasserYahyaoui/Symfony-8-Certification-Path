- id: FLC-a8nj0yz701k3
  official_item: OIT-9x3strrjdng7
  language: fr
  level: UNDERSTANDING
  front: 'Validator : pourquoi Sequentially réduit-il le nombre de violations ?'
  back: Parce qu'il s'arrête à la première contrainte violée ; sans lui, toutes s'exécutent et cumulent leurs violations.
  explanation: 'Exécuté : `''ab''` contre `Length(min: 5)` puis `Email` donne une violation avec `Sequentially`, deux sans.'
  memorization_justification: Ordre et arrêt, pas simple regroupement.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/reference/constraints/Sequentially.rst
