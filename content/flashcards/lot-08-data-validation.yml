  front: 'Validator : quelles sont les trois méthodes d''entrée de ValidatorInterface ?'
  back: '`validate()`, `validateProperty()` et `validatePropertyValue()`, chacune avec les groupes en dernier argument.'
  explanation: Toutes retournent une `ConstraintViolationListInterface`.
