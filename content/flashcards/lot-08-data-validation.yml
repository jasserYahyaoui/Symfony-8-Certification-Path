- id: FLC-cy846z54y072
  official_item: OIT-d3yp0sq36xrx
  language: fr
  level: UNDERSTANDING
  front: 'Validator : pourquoi valider un Author ne signale-t-il rien sur son Address invalide ?'
  back: Parce que la validation ne descend pas dans un objet imbriqué sans qu'on le demande, par `Valid` ou `Cascade`.
  explanation: 'Exécuté : aucune violation sans cascade, `address.zipCode` avec.'
  memorization_justification: Point central de l'item.
