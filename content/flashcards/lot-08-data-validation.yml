  language: fr
  level: TRAP
  front: 'Validator : l''entier 0 passe-t-il la contrainte NotBlank ?'
  back: Oui. Le validateur teste `false === $value || (!$value && '0' != $value)`, et en PHP 8 `'0' != 0` est faux.
  explanation: 'Exécuté avec symfony/validator 8.0.15 : `0`, `0.0` et `''0''` passent `NotBlank`.'
  memorization_justification: 'Idée reçue : NotBlank refuserait toute valeur « falsy ».'
  verification_status: VERIFIED
