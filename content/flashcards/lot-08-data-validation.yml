  language: fr
  level: TRAP
  front: 'Validator : une propriété porte #[Assert\Valid] et vaut null. Y a-t-il une violation ?'
  back: Non. `Valid` cascade dans l'objet présent ; il n'impose pas sa présence — `NotNull` s'en charge.
  explanation: 'Exécuté : aucune violation pour une propriété à `null`.'
  memorization_justification: Cascade et présence sont deux contraintes distinctes.
  verification_status: VERIFIED
