  language: fr
  level: TRAP
  front: 'Validator : que fait $validator->validate(''x'') sans constraint ?'
  back: 'Il lève une `RuntimeException` : « Cannot validate values of type "string" automatically. Please provide a constraint. »'
  explanation: 'Exécuté : même chose pour un int ou `null`. Un object ou un array sans constraint donne une liste vide.'
  memorization_justification: Contredit l'idée que validate() ne lève jamais.
