  language: fr
  level: UNDERSTANDING
  front: 'Symfony Runtime : pourquoi composer install --no-plugins casse-t-il les contrôleurs frontaux ?'
  back: 'Parce que `autoload_runtime.php` est écrit par le plugin Composer du composant : sans plugin, le fichier requis n''existe pas.'
  explanation: Avertissement de *Usage*, branche 8.0, et exécuté.
  memorization_justification: Dépendance au plugin.
  verification_status: VERIFIED
