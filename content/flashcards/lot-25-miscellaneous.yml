- id: FLC-qd7nt6cxp0rs
  official_item: OIT-r3qcmsehzex1
  language: fr
  level: RECALL
  front: 'Symfony Runtime : quels arguments de type array les deux runtimes résolvent-ils ?'
  back: '`array $context`, `array $argv` et `array $request`.'
  explanation: Section *Resolvable Arguments*, branche 8.0, et `GenericRuntime::getArgument()`.
  memorization_justification: Trois tableaux.
  verification_status: VERIFIED
