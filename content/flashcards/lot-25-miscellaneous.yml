- id: FLC-2sbkpjz891ky
  official_item: OIT-r3qcmsehzex1
  language: fr
  level: UNDERSTANDING
  front: 'Symfony Runtime : pourquoi renommer $context en $ctx casse-t-il le démarrage ?'
  back: 'Parce que ces arguments sont résolus par leur type et leur nom : `array $ctx` n''est reconnu par aucun.'
  explanation: 'Exécuté : `InvalidArgumentException` qui énumère les trois noms admis.'
  memorization_justification: Nom significatif.
  verification_status: VERIFIED
