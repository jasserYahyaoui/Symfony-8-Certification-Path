  official_item: OIT-r3qcmsehzex1
  language: fr
  level: TRAP
  front: 'Symfony Runtime : le runtime est-il instancié avant que le script d''entrée soit inclus à nouveau ?'
  back: 'Non, pas dans le code 8.0 : le script est inclus d''abord, le runtime instancié ensuite — l''inverse de l''ordre documenté.'
  explanation: Exécuté avec un runtime qui journalise son constructeur.
  memorization_justification: Ordre réel.
