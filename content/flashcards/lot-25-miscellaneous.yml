- id: FLC-mph07jqcjtmk
  official_item: OIT-r3qcmsehzex1
  language: fr
  level: UNDERSTANDING
  front: 'Symfony Runtime : pourquoi une ligne placée sous le require_once du runtime ne s''exécute-t-elle qu''une fois ?'
  back: Parce que la première exécution se termine dans `autoload_runtime.php`, par `exit` ; seule la seconde, qui trouve le fichier déjà chargé, atteint cette ligne.
  explanation: Lu dans `autoload_runtime.template` (8.0) et exécuté.
  memorization_justification: Deux passes inégales.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Runtime/Internal/autoload_runtime.template
    readable_url: https://github.com/symfony/symfony/blob/8.0/src/Symfony/Component/Runtime/Internal/autoload_runtime.template
    repository: symfony/symfony
    branch: '8.0'
    symbol_or_lines: require $_SERVER[SCRIPT_FILENAME]; new $_SERVER[APP_RUNTIME]
    verified_at: '2026-10-03'
