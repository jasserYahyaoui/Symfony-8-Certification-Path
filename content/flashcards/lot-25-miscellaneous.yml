# does not anchor, and that decides an exam answer.

schema_version: 2

flashcards:
- id: FLC-0p88y5fvnr6d
  official_item: OIT-r3qcmsehzex1
  language: fr
  level: TRAP
  front: Combien de fois le script d'entrée s'exécute-t-il, et quelle contrainte cela impose-t-il ?
  back: 'Deux fois pour ce qui précède le require_once de autoload_runtime.php, une fois pour ce qui le suit : le
    runtime inclut le script à nouveau, et la première exécution se termine dans ce fichier. D''où la règle : aucun
    effet de bord avant ce require.'
  explanation: La documentation décrit la réinclusion ; exécuté sur Runtime 8.0.14, une ligne placée au-dessus du
    require a tourné deux fois, une ligne placée au-dessous une seule.
  memorization_justification: Rien dans le fichier ne laisse deviner qu'il sera réexécuté ; on l'écrit naturellement
    comme un script joué une seule fois.
  verification_status: VERIFIED
  reviewed_at: '2026-10-03'
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/components/runtime.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/components/runtime.rst
    branch: '8.0'
    symbol_or_lines: usage
    verified_at: '2026-10-03'
- id: FLC-hd9b4kddng5z
  official_item: OIT-r3qcmsehzex1
  language: fr
  level: RECALL
  front: 'Symfony Runtime : quel fichier le contrôleur frontal charge-t-il, et qui le produit ?'
  back: '`vendor/autoload_runtime.php`, produit par le plugin Composer du composant.'
  explanation: 'Section *Usage*, branche 8.0 ; exécuté : `composer dump-autoload --no-plugins` ne le recrée pas.'
  memorization_justification: Origine du fichier.
  verification_status: VERIFIED
  official_sources:
