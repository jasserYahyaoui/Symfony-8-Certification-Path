- id: FLC-t0n1h9svqtyc
  official_item: OIT-r3qcmsehzex1
  language: fr
  level: APPLICATION
  front: 'Symfony Runtime : démarrer SymfonyRuntime sans fichier .env.'
  back: Passer l'option `disable_dotenv`, par exemple `APP_RUNTIME_OPTIONS='{"disable_dotenv":true}'`.
  explanation: 'Section *Using Options* ; exécuté : sans `.env` ni option, `PathException`.'
  memorization_justification: Désactiver Dotenv.
  verification_status: VERIFIED
