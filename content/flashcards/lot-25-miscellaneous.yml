- id: FLC-7bffp29qxx4z
  official_item: OIT-r3qcmsehzex1
  language: fr
  level: RECALL
  front: 'Symfony Runtime : quelle variable d''environnement choisit la classe de runtime ?'
  back: '`APP_RUNTIME` ; à défaut, `extra.runtime.class` dans `composer.json`.'
  explanation: Section *Selecting Runtimes*, branche 8.0.
  memorization_justification: Choix du runtime.
