  language: fr
  level: TRAP
  front: 'Symfony Runtime : que se passe-t-il si public/index.php charge vendor/autoload.php avant autoload_runtime.php ?'
  back: 'Rien ne s''exécute : le runtime s''interrompt, le script va au bout, code de sortie `0`, aucun message.'
  explanation: Lu dans `autoload_runtime.template` (8.0), qui s'arrête si `autoload.php` est déjà chargé, et exécuté.
