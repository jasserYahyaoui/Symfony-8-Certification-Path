  - id: FLC-kd8bjcga0ty0
    official_item: OIT-ceaw3ewfsw85
    language: fr
    level: UNDERSTANDING
    front: 'Pourquoi une sub-Request produite par forward() n est-elle pas routée à nouveau ?'
    back: 'Parce que RouterListener saute le routage quand la Request porte déjà l attribute _controller.'
    explanation: >-
      forward() pose _controller dans les attributes de la sub-Request avant de la confier au kernel.
    memorization_justification: >-
      Le lien entre deux mécanismes éloignés se retient mieux qu une règle isolée.
    verification_status: VERIFIED
    official_sources:
