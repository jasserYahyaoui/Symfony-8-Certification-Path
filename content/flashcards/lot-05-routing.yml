  - id: FLC-m0hsxjn3889s
    official_item: OIT-d51jbkfs21pt
    language: fr
    level: UNDERSTANDING
    front: "Symfony : pourquoi le routage ne redirige-t-il pas un POST vers la forme de l'URL avec ou sans barre finale ?"
    back: "Un 301 autorise le client à rejouer la requête en GET : le corps du POST serait perdu."
    explanation: >-
      RFC 9110, section 15.4.2 : pour des raisons historiques, un client peut changer POST en GET après un 301. Le routage limite donc ses redirections à GET et HEAD.
    memorization_justification: >-
      Comprendre la raison évite de réciter la restriction sans pouvoir l'appliquer au schéma.
    verification_status: VERIFIED
    official_sources:
