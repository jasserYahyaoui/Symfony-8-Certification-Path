  - id: FLC-azt7yf0s7hnr
    official_item: OIT-8sr74a2wnb3r
    language: fr
    level: UNDERSTANDING
    front: "Symfony : que signale router:match par « almost matches » ?"
    back: "Une route presque appariée, écartée par un requirement de parameter, le host, la condition, le schéma ou la method."
    explanation: >-
      Ces lignes s'affichent toujours ; les routes qui ne correspondent pas du tout n'apparaissent qu'en mode verbeux.
