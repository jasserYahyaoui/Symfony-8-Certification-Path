  - id: FLC-07zmbesy2j39
    official_item: OIT-ceaw3ewfsw85
    language: fr
    level: TRAP
    front: 'Piège : « RouterListener est une classe de FrameworkBundle ».'
    back: 'Non. Elle appartient au composant HttpKernel ; le bundle l enregistre seulement comme service.'
    explanation: >-
      Son espace de noms le montre directement.
