  - id: FLC-kd8bjcga0ty0
    official_item: OIT-ceaw3ewfsw85
    language: fr
    level: UNDERSTANDING
    front: 'Pourquoi une sous-requête produite par forward() n est-elle pas routée à nouveau ?'
    back: 'Parce que RouterListener saute le routage quand la requête porte déjà l attribut _controller.'
    explanation: >-
      forward() pose _controller dans les attributs de la sous-requête avant de la confier au noyau.
    memorization_justification: >-
      Le lien entre deux mécanismes éloignés se retient mieux qu une règle isolée.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/HttpKernel/EventListener/RouterListener.php"
        readable_url: "https://github.com/symfony/symfony/blob/8.0/src/Symfony/Component/HttpKernel/EventListener/RouterListener.php"
        repository: "symfony/symfony"
        branch: "8.0"
        symbol_or_lines: "onKernelRequest"
        verified_at: "2026-09-24"

  - id: FLC-c0rzj41myn6h
    official_item: OIT-ceaw3ewfsw85
    language: fr
    level: UNDERSTANDING
    front: 'Pourquoi une URL inexistante donne-t-elle un 404 et une mauvaise méthode un 405 ?'
    back: 'Parce que RouterListener traduit ResourceNotFoundException en NotFoundHttpException et MethodNotAllowedException en MethodNotAllowedHttpException.'
    explanation: >-
      Le 405 porte les méthodes admises dans l en-tête Allow.
    memorization_justification: >-
      Le composant lève ses propres exceptions ; c est l écouteur qui les rend HTTP.
    verification_status: VERIFIED
    official_sources:
