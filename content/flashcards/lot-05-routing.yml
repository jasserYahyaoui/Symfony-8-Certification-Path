# Lot 05 flashcards (Master Plan §6).
#
# Douze cartes pour les onze items. PED-010 a comblé les cinq absences.
# « Table consultée plutôt que mémorisée » vaut pour le travail quotidien ; à
# l'examen rien ne se consulte. Chaque carte tient à un fait discriminant :
# l'autonomie du composant, le paramètre surnuméraire qui part en query string,
# le seul paramètre réservé absent des imports, l'hôte permissif par défaut,
# et l'ordre d'évaluation de `debug:router`.

schema_version: 2

flashcards:
  - id: FLC-qtcf6sp62jpq
    official_item: OIT-d51jbkfs21pt
    language: fr
    level: RECALL
    front: "Symfony route /foo : que se passe-t-il si l'URL demandée est /foo/ ?"
    back: "Redirect 301 vers /foo — mais seulement pour GET et HEAD."
    explanation: >-
      Le redirect va toujours vers la forme déclarée par la route, dans les
      deux sens : une route /foo/ redirige /foo vers /foo/. La restriction aux
      safe methods évite qu'un POST perde son body.
    memorization_justification: >-
      Deux détails arbitraires que rien ne rappelle à la lecture du code : le
      code exact (301, pas 302) et la restriction aux deux methods.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/symfony/symfony-docs/8.0/routing.rst"
        readable_url: "https://github.com/symfony/symfony-docs/blob/8.0/routing.rst"
        branch: "8.0"
        symbol_or_lines: "Redirecting URLs with Trailing Slashes, table"
        verified_at: "2026-09-01"

  - id: FLC-hyrr6qtdkfh9
    official_item: OIT-e2zrm9qkpx7j
    language: fr
    level: RECALL
    front: "L'option condition d'une route est-elle évaluée lors de la génération d'URL ?"
    back: "Non. Les conditions sont ignorées à la génération ; elles ne filtrent que l'appariement."
    explanation: >-
      Le generator ne connaît ni la Request ni l'agent user, donc il ne
      peut pas évaluer l'expression. Une route sous condition reste générable
      vers un contexte où elle ne correspondrait pas. requirements, lui, compte
      dans les deux sens.
    memorization_justification: >-
      Asymétrie invisible : rien dans l'écriture d'une condition ne signale
      qu'elle ne vaut que dans un sens, et le symétrique requirements se
      comporte autrement.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/symfony/symfony-docs/8.0/routing.rst"
        readable_url: "https://github.com/symfony/symfony-docs/blob/8.0/routing.rst"
        branch: "8.0"
        symbol_or_lines: "note: conditions are not taken into account when generating URLs"
        verified_at: "2026-09-01"

  - id: FLC-x8ga0twzt6g1
    official_item: OIT-ff0kghjbzvpm
    language: fr
    level: APPLICATION
    front: "Path /{page}/blog avec une default value pour page : /blog correspond-il ?"
    back: "Non. Tout ce qui suit un parameter facultatif doit être facultatif, donc page reste obligatoire."
    explanation: >-
      Le path est valide, mais comme le segment /blog suit le parameter et
      n'est pas facultatif, la default value ne rend pas page omissible.
    memorization_justification: >-
      Règle structurelle contre-intuitive : la default value est bien
      définie et semble suffire, mais la position dans le path décide.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/symfony/symfony-docs/8.0/routing.rst"
        readable_url: "https://github.com/symfony/symfony-docs/blob/8.0/routing.rst"
        branch: "8.0"
        symbol_or_lines: "warning under Optional Parameters"
        verified_at: "2026-09-01"

  - id: FLC-5j4yp6wp9yzk
    official_item: OIT-ff0kghjbzvpm
    language: fr
    level: RECALL
    front: "À quoi sert le préfixe ! dans un parameter de route, comme /blog/{!page} ?"
    back: "À forcer l'inclusion de la default value dans l'URL générée : /blog/1 au lieu de /blog."
    explanation: >-
      Sans le point d exclamation, une valeur égale au défaut disparaît de l URL
      produite. Le compiler de routes en tire un second effet : une variable
      importante n est jamais facultative, donc /blog ne correspond plus.
    memorization_justification: >-
      Syntaxe d un seul caractère dont la documentation ne décrit que l effet sur
      la génération, alors qu elle change aussi l appariement.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/symfony/symfony-docs/8.0/routing.rst"
        readable_url: "https://github.com/symfony/symfony-docs/blob/8.0/routing.rst"
        branch: "8.0"
        symbol_or_lines: "Optional Parameters, ! character"
        verified_at: "2026-09-01"

  - id: FLC-s7es8e4pq9vf
    official_item: OIT-1cj08dhtp9hj
    language: fr
    level: RECALL
    front: "Une default value doit-elle satisfaire le requirement de son parameter ?"
    back: "Non. La documentation l'autorise explicitement à ne pas le respecter."
    explanation: >-
      Le requirement filtre la valeur venue de l'URL. Une default value n'est
      pas dans l'URL, donc elle n'est pas filtrée.
    memorization_justification: >-
      Contre-intuitif : on suppose une validation uniforme, et l'exception ne se
      manifeste par aucune erreur.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/symfony/symfony-docs/8.0/routing.rst"
        readable_url: "https://github.com/symfony/symfony-docs/blob/8.0/routing.rst"
        branch: "8.0"
        symbol_or_lines: "tip: the default value is allowed to not match the requirement"
        verified_at: "2026-09-01"

  - id: FLC-v2wg754jbxy7
    official_item: OIT-5g82spham3vm
    language: fr
    level: RECALL
    front: "Sans option methods, quelles methods HTTP une route accepte-t-elle ?"
    back: "Toutes. La restriction n'existe que si methods est déclarée."
    explanation: >-
      Deux routes peuvent donc partager le même path et ne différer que par
      methods. Un form HTML n'envoyant que GET et POST, un field caché
      _method simule les autres, si framework.http_method_override vaut true.
    memorization_justification: >-
      L'absence d'option se lit spontanément comme « GET seulement », alors que
      le défaut est le plus permissif possible.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/symfony/symfony-docs/8.0/routing.rst"
        readable_url: "https://github.com/symfony/symfony-docs/blob/8.0/routing.rst"
        branch: "8.0"
        symbol_or_lines: "Matching HTTP Methods, default behaviour and _method tip"
        verified_at: "2026-09-01"

  - id: FLC-hdwv8cdrrdwb
    official_item: OIT-xxcpx1qssp93
    language: fr
    level: RECALL
    front: "Appeler $request->setLocale() dans un controller configure-t-il le translator ?"
    back: "Non, c'est trop tard. Il faut l'URL, un listener prioritaire, ou setLocale() sur le service translator."
    explanation: >-
      Un listener maison doit passer avant LocaleListener, donc porter une
      priority supérieure. Le parameter _locale dans le path pose la locale
      automatiquement, sans code.
    memorization_justification: >-
      L'appel réussit sans erreur et la locale change bien sur la Request ; seul
      le translator reste en arrière, ce qui rend le symptôme déroutant.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/symfony/symfony-docs/8.0/translation.rst"
        readable_url: "https://github.com/symfony/symfony-docs/blob/8.0/translation.rst"
        branch: "8.0"
        symbol_or_lines: "note on setLocale() being too late in a controller"
        verified_at: "2026-09-01"
  - id: FLC-6dw96ps91ywe
    official_item: OIT-ceaw3ewfsw85
    language: fr
    level: RECALL
    front: 'Symfony : le component Routing dépend-il d''autres components Symfony ?'
    back: Non — PHP et un package de contrats, c'est tout. Il s'installe seul hors du framework.
    explanation: 'Apparier et générer sont par ailleurs deux classes distinctes du component : c''est
      pourquoi une option de route peut compter dans un sens et pas dans l''autre, le generator ne
      voyant aucune Request.'
    memorization_justification: Fait d'architecture arbitraire qui décide les questions « ce component
      fonctionne-t-il seul ? ».
    verification_status: VERIFIED
    official_sources:
    - url: https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Routing/composer.json
      readable_url: https://github.com/symfony/symfony/blob/8.0/src/Symfony/Component/Routing/composer.json
      branch: '8.0'
      symbol_or_lines: description and require keys
      verified_at: '2026-09-11'
  - id: FLC-rrt3hj10ddp2
    official_item: OIT-81b2c0jmv2j3
    language: fr
    level: RECALL
    front: 'Symfony : que devient un parameter passé à la génération d''URL et absent de la route ?'
    back: Il part en query string — aucune erreur n'est levée.
    explanation: 'Une faute de frappe dans un nom de parameter ne produit donc aucun message : juste
      une URL avec un parameter en trop. Le type de référence par défaut est par ailleurs le path
      absolu, pas l''URL absolue.'
    memorization_justification: 'Absence d''erreur contre-intuitive : le réflexe est d''attendre une
      exception.'
    verification_status: VERIFIED
    official_sources:
    - url: https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Routing/Generator/UrlGeneratorInterface.php
      readable_url: https://github.com/symfony/symfony/blob/8.0/src/Symfony/Component/Routing/Generator/UrlGeneratorInterface.php
      branch: '8.0'
      symbol_or_lines: ABSOLUTE_URL, ABSOLUTE_PATH, RELATIVE_PATH, NETWORK_PATH
      verified_at: '2026-09-11'
  - id: FLC-z20216cjkhsp
    official_item: OIT-4pgc74ctc3vc
    language: fr
    level: RECALL
    front: 'Symfony : lequel des parameters de routage réservés ne s''emploie pas dans un import de
      routes ?'
    back: Celui qui pose l'identifier de fragment (`_fragment`). Les quatre autres valent pour une
      route isolée comme pour un group importé.
    explanation: Les parameters réservés commencent tous par un souligné ; les options courtes de l'attribute,
      non — ce sont deux écritures de la même chose.
    memorization_justification: Exception unique dans une liste homogène de cinq, exactement la forme
      interrogée.
    verification_status: VERIFIED
    official_sources:
    - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/routing.rst
      readable_url: https://github.com/symfony/symfony-docs/blob/8.0/routing.rst
      branch: '8.0'
      symbol_or_lines: section Special Parameters
      verified_at: '2026-09-11'
  - id: FLC-x5tjtg0h3pm1
    official_item: OIT-21m4pmtymygn
    language: fr
    level: RECALL
    front: 'Symfony : sans requirement de host, quels hosts une route accepte-t-elle ?'
    back: N'importe lequel. L'absence de l'option n'est pas une restriction implicite au domain principal.
    explanation: 'Le host n''a par ailleurs pas son propre mécanisme de parameters : default values
      et requirements sont exactement ceux d''un parameter de path.'
    memorization_justification: 'Défaut permissif contre-intuitif : on suppose une restriction là où
      il n''y en a aucune.'
    verification_status: VERIFIED
    official_sources:
    - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/routing.rst
      readable_url: https://github.com/symfony/symfony-docs/blob/8.0/routing.rst
      branch: '8.0'
      symbol_or_lines: section Sub-Domain Routing
      verified_at: '2026-09-11'
  - id: FLC-jjgd2xj2w7y4
    official_item: OIT-8sr74a2wnb3r
    language: fr
    level: RECALL
    front: 'Symfony : dans quel ordre `debug:router` liste-t-il les routes ?'
    back: Dans l'ordre d'évaluation, pas alphabétique.
    explanation: 'C''est ce qui en fait un outil de diagnostic : la première correspondance gagne, donc
      l''ordre affiché explique « pourquoi est-ce l''autre route qui répond ? ».'
    memorization_justification: Détail d'affichage qui change la valeur diagnostique de la command,
      et qu'on suppose alphabétique.
    verification_status: VERIFIED
    official_sources:
    - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/routing.rst
      readable_url: https://github.com/symfony/symfony-docs/blob/8.0/routing.rst
      branch: '8.0'
      symbol_or_lines: section Debugging Routes
      verified_at: '2026-09-11'

