        verified_at: "2026-09-24"

  - id: FLC-ppe48hfsmg28
    official_item: OIT-ceaw3ewfsw85
    language: fr
    level: UNDERSTANDING
    front: 'Pourquoi une classe de contrôleur hors de src/Controller peut-elle fournir des routes d attributs ?'
    back: 'Parce que routing.controllers charge les classes étiquetées routing.controller, et que toute classe portant #[Route] reçoit cette étiquette par autoconfiguration.'
    explanation: >-
