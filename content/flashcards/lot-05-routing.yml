    level: RECALL
    front: 'Dans quel composant se trouve la classe RouterListener ?'
    back: 'Dans HttpKernel, espace de noms Symfony\Component\HttpKernel\EventListener. FrameworkBundle ne fait que l enregistrer comme service.'
    explanation: >-
      Le bundle déclare le service router_listener en lui passant la classe du composant HttpKernel.
    memorization_justification: >-
      On attribue spontanément au bundle tout ce qui touche au routage applicatif.
