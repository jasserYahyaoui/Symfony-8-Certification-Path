- id: FLC-rjw9k3v453hd
  official_item: OIT-3dd7821h069b
  language: fr
  level: UNDERSTANDING
  front: 'Symfony : pourquoi Hello {name}! devient-il Hello {Ann}! sans +intl-icu ?'
  back: 'Parce que le format classique fait un `strtr` littéral des clés passées : la clé `name` est remplacée, les accolades restent.'
  explanation: 'Exécuté : `[''{name}'' => ''Ann'']` donne `Hello Ann!`.'
  memorization_justification: Remplacement littéral.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Translation/Translator.php
    readable_url: https://github.com/symfony/symfony/blob/8.0/src/Symfony/Component/Translation/Translator.php
    repository: symfony/symfony
    branch: '8.0'
    symbol_or_lines: computeFallbackLocales(); INTL_DOMAIN_SUFFIX
    verified_at: '2026-10-02'
- id: FLC-m8ddzz6hcqvq
  official_item: OIT-3dd7821h069b
  language: fr
  level: UNDERSTANDING
  front: 'Symfony : pourquoi la balise {% trans %} est-elle risquée avec un paramètre utilisateur ?'
  back: Parce qu'elle n'échappe pas sa sortie, paramètres compris, contrairement au filtre.
  explanation: 'Exécuté : `<i>x</i>` brut par la balise, échappé par le filtre.'
  memorization_justification: Échappement balise contre filtre.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/translation.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/translation.rst
    repository: symfony/symfony-docs
    branch: '8.0'
    symbol_or_lines: Translations in Templates; Using Twig Tags; Fallback Translation Locales
    verified_at: '2026-10-02'
- id: FLC-649mmrcx2afa
  official_item: OIT-3dd7821h069b
  language: fr
  level: UNDERSTANDING
  front: 'Symfony : pourquoi un catalogue +intl-icu échoue-t-il sans l''extension intl ?'
  back: Parce que le formateur ICU exige `MessageFormatter` et lève une `LogicException` sinon.
  explanation: Lu dans `IntlFormatter` (8.0).
  memorization_justification: Dépendance ICU.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Translation/Formatter/IntlFormatter.php
    readable_url: https://github.com/symfony/symfony/blob/8.0/src/Symfony/Component/Translation/Formatter/IntlFormatter.php
    repository: symfony/symfony
    branch: '8.0'
    symbol_or_lines: 'formatIntl(): LogicException without MessageFormatter'
    verified_at: '2026-10-02'
- id: FLC-qgqztnwteg9n
  official_item: OIT-3dd7821h069b
  language: fr
  level: APPLICATION
  front: 'Symfony : écrire un pluriel anglais pour un nombre de pommes.'
  back: '`{n, plural, =0 {no apples} one {one apple} other {# apples}}` dans un catalogue `+intl-icu`.'
  explanation: 'Exécuté : 0, 1 et 5 donnent les trois formes.'
  memorization_justification: Pluriel ICU.
  verification_status: VERIFIED
