  language: fr
  front: Qu'est-ce qui déclenche le traitement ICU MessageFormat d'un catalogue ?
  back: 'Le suffixe +intl-icu dans le nom du fichier : messages+intl-icu.en.yaml. Sans lui, {name} reste littéral.'
  explanation: 'C''est aussi ce qui sépare les deux syntaxes : %name% en format classique, {name} en ICU.'
  memorization_justification: On cherche une option de configuration, alors que le déclencheur est le nom du fichier.
  verification_status: VERIFIED
