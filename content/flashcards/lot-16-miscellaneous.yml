schema_version: 2

flashcards:
- id: FLC-7ar3ewagp1y0
  official_item: OIT-3dd7821h069b
  language: fr
  level: RECALL
  front: Qu'est-ce qui déclenche le traitement ICU MessageFormat d'un catalogue ?
  back: 'Le suffixe +intl-icu dans le nom du fichier : messages+intl-icu.en.yaml. Sans lui, strtr remplace les clés
    passées telles quelles : avec name, Hello {name}! devient Hello {Ann}!.'
  explanation: 'C''est aussi ce qui sépare les deux syntaxes : %name% en format classique, {name} en ICU.'
  memorization_justification: On cherche une option de configuration, alors que le déclencheur est le nom du fichier.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/reference/formats/message_format.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/reference/formats/message_format.rst
    symbol_or_lines: '"suffixed with +intl-icu", with the table pairing messages.en.yaml against messages+intl-icu.en.yaml'
    branch: '8.0'
    verified_at: '2026-09-02'
- id: FLC-bhpwspqa16h9
  official_item: OIT-3dd7821h069b
  language: fr
  level: RECALL
  front: 'Symfony : que rend trans() pour une clé absente de tous les catalogues ?'
  back: La clé elle-même, sans erreur.
  explanation: 'Exécuté : `missing.key` rendu tel quel.'
  memorization_justification: Traduction manquante silencieuse.
  verification_status: VERIFIED
  official_sources:
