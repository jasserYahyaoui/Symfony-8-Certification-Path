    branch: '8.0'
    symbol_or_lines: Translations in Templates; Using Twig Tags; Fallback Translation Locales
    verified_at: '2026-10-02'
- id: FLC-abc319rde1bh
  official_item: OIT-3dd7821h069b
  language: fr
  level: RECALL
  front: 'Symfony : dans quel ordre le traducteur cherche-t-il une clé pour es_AR ?'
  back: '`es_AR`, puis la locale parente `es_419`, puis `es`, puis l''option `fallbacks`.'
  explanation: Exécuté sur Translation 8.0.14.
  memorization_justification: Cascade de repli.
  verification_status: VERIFIED
  official_sources:
