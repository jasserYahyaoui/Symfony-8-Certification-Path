  - id: FLC-wmwy4jyq8r8k
    official_item: OIT-pk5s7cnhk776
    language: fr
    level: RECALL
    front: "Comment se découpent les six mois d'un cycle ?"
    back: "**Quatre mois** de développement, puis **deux mois** de stabilisation."
    explanation: >-
      La stabilisation sert à corriger, préparer la publication et laisser
      l'écosystème suivre. Une fonctionnalité non prête pendant les quatre
      premiers mois est reportée au cycle suivant.
    memorization_justification: >-
      Découpage chiffré, avec une somme qui se vérifie ; le 4+2 ne se devine
      pas depuis la durée totale.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/symfony/symfony-docs/8.0/contributing/code/releases.rst"
        readable_url: "https://github.com/symfony/symfony-docs/blob/8.0/contributing/code/releases.rst"
        repository: "symfony/symfony-docs"
        branch: "8.0"
