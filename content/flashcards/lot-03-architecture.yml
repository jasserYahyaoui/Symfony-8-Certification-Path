        symbol_or_lines: "Controllers"
        verified_at: "2026-09-21"

  - id: FLC-ty2vdbda215k
    official_item: OIT-efzq92vdtayj
    language: fr
    level: APPLICATION
    front: "Vous voulez ajouter `NotBlank` sur une propriété d'une entité de bundle. Possible ?"
    back: "Oui : **ajouter** une contrainte est permis. C'est la remplacer qui ne l'est pas."
    explanation: >-
      La fusion des métadonnées empile les contraintes de tous les bundles. Pour
      neutraliser une contrainte existante, il faut que le bundle ait prévu un
      groupe de validation.
    memorization_justification: >-
      Distingue les deux gestes qu'on croit symétriques ; l'un passe, l'autre
      est impossible.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/symfony/symfony-docs/8.0/bundles/override.rst"
        readable_url: "https://github.com/symfony/symfony-docs/blob/8.0/bundles/override.rst"
        repository: "symfony/symfony-docs"
        branch: "8.0"
        symbol_or_lines: "Validation Metadata"
        verified_at: "2026-09-21"

  - id: FLC-sta9z8n1jdna
    official_item: OIT-efzq92vdtayj
    language: fr
    level: APPLICATION
    front: "Vous devez **supprimer** une définition de service posée par un bundle. Comment ?"
    back: "Par une **passe de compilation**. La décoration ne sait qu'envelopper."
    explanation: >-
      La passe s'exécute pendant la compilation du conteneur, quand toutes les
      définitions sont connues et avant qu'elles ne soient figées.
    memorization_justification: >-
      Cas concret où la réponse la plus familière — décorer — ne fonctionne
      pas du tout.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/symfony/symfony-docs/8.0/bundles/override.rst"
        readable_url: "https://github.com/symfony/symfony-docs/blob/8.0/bundles/override.rst"
        repository: "symfony/symfony-docs"
        branch: "8.0"
        symbol_or_lines: "Services & Configuration"
        verified_at: "2026-09-21"

