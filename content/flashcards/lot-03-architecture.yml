        verified_at: "2026-09-21"

  - id: FLC-3bfj091w0m3y
    official_item: OIT-ehf5zdnmdb1j
    language: fr
    level: UNDERSTANDING
    front: "Pourquoi `trigger_deprecation()` vit-elle hors du framework ?"
    back: "Pour qu'une bibliothèque tierce puisse signaler ses dépréciations sans dépendre de Symfony."
    explanation: >-
      Le paquet de contrats est minuscule et sans dépendance. C'est la même
      logique que les autres contrats : offrir une interface commune sans
      imposer l'implémentation.
    memorization_justification: >-
      Explique un placement surprenant, et généralise à la philosophie des
      paquets de contrats.
