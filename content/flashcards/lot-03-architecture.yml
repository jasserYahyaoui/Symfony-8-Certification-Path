    front: "Par quelle clé se déplace le fichier `.env` ?"
    back: "`extra.runtime.dotenv_path` — sous `extra`, mais imbriquée d'un cran."
    explanation: >-
      Les quatre autres clés sont plates sous `extra` ; celle-ci vit sous
