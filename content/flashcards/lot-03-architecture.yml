      verified_at: '2026-09-11'
  - id: FLC-82hpxh6bv6y3
    official_item: OIT-p3p7te94qc1n
    language: fr
    level: UNDERSTANDING
    front: 'Symfony : où se déplacent `var/cache/` et `var/log/`, contrairement à `src/` ou `public/`
      ?'
    back: En PHP, par `getCacheDir()` et `getLogDir()` sur le `Kernel` — pas par la clé `extra` du `composer.json`.
    explanation: >-
      Seuls `bin/`, `config/`, `src/` et `public/` se déplacent par `extra` ;
      `templates/` et `translations/` par configuration de bundle, `vendor/` par
      la clé `config` de Composer. Les deux répertoires générés font exception à
      tout cela : ils se surchargent par code, ou par une variable
      d'environnement que lit `MicroKernelTrait`.
    memorization_justification: 'Exception arbitraire : la règle générale est le `composer.json`, et
      rien n''annonce que ces deux-là s''en écartent.'
    verification_status: VERIFIED
    official_sources:
    - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/best_practices.rst
      readable_url: https://github.com/symfony/symfony-docs/blob/8.0/best_practices.rst
      branch: '8.0'
      symbol_or_lines: Use the Default Directory Structure
      verified_at: '2026-09-11'
  - id: FLC-g0kpwp6w0xg6
    official_item: OIT-hzbednd04fd4
    language: fr
    level: TRAP
    front: 'Best practices Symfony : sous quelle forme définir une valeur qui ne change presque jamais
      ?'
    back: Une constante de classe — pas un paramètre du conteneur.
    explanation: 'La recommandation est contre-intuitive : une constante est lisible partout, y compris
      depuis un gabarit, là où un paramètre exige le conteneur. Les paramètres restent pour ce qui varie
      par environnement.'
    memorization_justification: 'Recommandation contre-intuitive : le réflexe est d''en faire un paramètre,
      et l''examen interroge précisément l''écart.'
    verification_status: VERIFIED
    official_sources:
    - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/best_practices.rst
