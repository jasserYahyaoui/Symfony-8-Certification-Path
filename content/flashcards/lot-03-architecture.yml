  - id: FLC-4n13szbsvrj8
    official_item: OIT-xc4zfr70jjas
    language: fr
    level: UNDERSTANDING
    front: "Pourquoi le critère du statut est-il l'interface et non la classe mère ?"
    back: "Parce que `HttpException extends \\RuntimeException implements HttpExceptionInterface` : l'ascendance ne dit rien du statut."
    explanation: >-
      `NotFoundHttpException`, `AccessDeniedHttpException` et
      `BadRequestHttpException` sont toutes des `\RuntimeException`. Raisonner
      sur la classe mère mène donc à la mauvaise réponse dans le cas le plus
      courant.
    memorization_justification: >-
      Le contre-exemple qu'on croit valable est précisément le cas standard ;
      la distinction se teste en une question.
