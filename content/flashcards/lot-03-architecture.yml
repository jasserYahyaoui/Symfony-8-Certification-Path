    language: fr
    level: UNDERSTANDING
    front: "À quelle condition `stopPropagation()` a-t-il un effet ?"
    back: "L'événement doit implémenter `StoppableEventInterface` — `callListeners()` ne teste la propagation que dans ce cas."
    explanation: >-
      `Symfony\Contracts\EventDispatcher\Event` l'implémente, et `KernelEvent`
      l'étend : les huit événements du noyau sont arrêtables. Un simple objet
      dispatché, lui, ne l'est pas.
    memorization_justification: >-
      Condition jamais visible dans l'usage courant, parce que tout ce qu'on
      manipule l'implémente déjà ; elle ne se révèle que sur un événement maison.
