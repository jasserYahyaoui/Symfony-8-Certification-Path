    level: UNDERSTANDING
    front: "Pourquoi une valeur qui change rarement devient-elle une constante plutôt qu'un paramètre ?"
    back: "Parce qu'une constante est lisible partout, y compris depuis un gabarit, là où un paramètre exige le conteneur."
    explanation: >-
      Le document donne l'exemple d'une constante `NUMBER_OF_ITEMS` sur
      l'entité. Le prix à payer est qu'une constante est difficile à redéfinir
      dans un test.
    memorization_justification: >-
      Recommandation qui contredit le réflexe « tout ce qui est configurable est
      un paramètre » ; sa raison est ce qui permet de trancher.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/symfony/symfony-docs/8.0/best_practices.rst"
        readable_url: "https://github.com/symfony/symfony-docs/blob/8.0/best_practices.rst"
        repository: "symfony/symfony-docs"
        branch: "8.0"
        symbol_or_lines: "Use Constants to Define Options that Rarely Change"
        verified_at: "2026-09-21"

  - id: FLC-dcyrc9j32m03
    official_item: OIT-hzbednd04fd4
    language: fr
    level: UNDERSTANDING
    front: "Pourquoi coder une URL en dur dans un test fonctionnel plutôt que la générer ?"
    back: "Pour que le test **échoue** si l'URL publique change — la générer masquerait le changement."
    explanation: >-
      Une URL publique fait partie du contrat avec l'extérieur. La générer
      depuis la route rendrait le test insensible à une modification que des
      liens externes, eux, subiraient.
    memorization_justification: >-
      Ressemble à un raccourci toléré alors que c'est la recommandation ; la
      raison est ce qui empêche de répondre l'inverse.
