  - id: FLC-srxd7601p8cb
    official_item: OIT-p3p7te94qc1n
    language: fr
    level: RECALL
    front: "Quelles clés `extra` du `composer.json` déplacent un répertoire ?"
    back: "Quatre : `bin-dir`, `config-dir`, `src-dir`, `public-dir`."
    explanation: >-
      `templates/` et `translations/` se déplacent par configuration de bundle,
      `vendor/` par la clé `config` de Composer, `var/cache/` et `var/log/` par
      le noyau. Une clé `extra.templates-dir` n'existe pas.
    memorization_justification: >-
      Liste close et courte, que le QCM allonge ou raccourcit d'une entrée ;
      elle ne se reconstruit pas par raisonnement.
    verification_status: VERIFIED
