    front: "Quelle exception est levée si le résolveur ne trouve aucun contrôleur ?"
    back: "`NotFoundHttpException`, avec le message « the route is wrongly configured »."
    explanation: >-
      `ControllerResolverInterface::getController()` rend `false` quand il
      échoue, et `handleRaw()` traduit ce `false` en 404. L'erreur est donc
      présentée comme une route mal configurée, pas comme un contrôleur absent.
    memorization_justification: >-
