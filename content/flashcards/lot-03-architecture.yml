  - id: FLC-y9tr0v3tmzyw
    official_item: OIT-y0ah7pq9c4hv
    language: fr
    level: TRAP
    front: "Avec une seule sous-requête en cours, `getMainRequest()` et `getParentRequest()` rendent-elles la même chose ?"
    back: "Oui — et c'est ce qui masque leur différence. Elles divergent dès qu'il y a **deux** niveaux d'imbrication."
    explanation: >-
      À deux éléments, `$requests[0]` et `$requests[count - 2]` désignent le
      même objet. À trois, `getMainRequest()` rend toujours le premier tandis
      que `getParentRequest()` rend le deuxième. Un code écrit et testé sur un
      seul niveau peut donc être faux sans que rien ne le montre.
    memorization_justification: >-
      Deux accesseurs qui coïncident dans le cas testé et divergent dans le cas
      réel : la confusion ne se manifeste qu'en production.
