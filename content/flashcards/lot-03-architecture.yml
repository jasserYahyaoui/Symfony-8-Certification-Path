    official_item: OIT-p3p7te94qc1n
    language: fr
    level: UNDERSTANDING
    front: "Pourquoi `getShareDir()` peut-il rendre `null` alors que les trois autres non ?"
    back: "Le répertoire partagé est facultatif ; sans lui, le paramètre `%kernel.share_dir%` n'est simplement pas enregistré."
    explanation: >-
      Il sert aux installations où plusieurs frontaux partagent un système de
