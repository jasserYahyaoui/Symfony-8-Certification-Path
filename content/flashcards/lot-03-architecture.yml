  - id: FLC-2w9n254n3n42
    official_item: OIT-pk5s7cnhk776
    language: fr
    level: UNDERSTANDING
    front: "Pourquoi le *dual maintenance mode* existe-t-il ?"
    back: "Pour servir deux publics : ceux qui veulent les nouveautés vite, et les entreprises qui veulent de la stabilité."
    explanation: >-
      Les premiers prennent les versions standard — une tous les six mois, deux
      mois pour migrer. Les secondes prennent les LTS — une tous les deux ans,
      un an pour migrer.
    memorization_justification: >-
