  - id: FLC-zmm7jna0qtwp
    official_item: OIT-pk5s7cnhk776
    language: fr
    level: UNDERSTANDING
    front: "Pourquoi la période de six mois a-t-elle été choisie ?"
    back: "Parce que deux publications tiennent dans une année, et qu'une fonctionnalité non prête attend peu avant le cycle suivant."
    explanation: >-
      Le document ajoute que le rythme laisse assez de temps pour travailler
      les nouveautés. C'est un arbitrage entre vitesse de livraison et coût du
      report.
    memorization_justification: >-
      La raison rend le chiffre reconstructible, et le rythme annuel est le
      point d'ancrage le plus stable du calendrier.
    verification_status: VERIFIED
    official_sources:
