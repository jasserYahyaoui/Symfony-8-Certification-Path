    front: "Quelles méthodes d'introspection le dispatcher expose-t-il ?"
    back: "`hasListeners($nom)`, `getListeners($nom)` et `getListenerPriority($nom, $listener)`."
    explanation: >-
      `getListenerPriority()` rend la priorité réelle, ou `null` si l'écouteur
