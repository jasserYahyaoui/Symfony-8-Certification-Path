        symbol_or_lines: "lignes 181-184"
        verified_at: "2026-09-17"

  - id: FLC-pf6cfqws97ac
    official_item: OIT-132nwnh9c6bc
    language: fr
    level: TRAP
    front: "Un alias pointe-t-il toujours vers un bundle Symfony ?"
    back: "Non. `api` pointe vers `api-platform/api-pack` — un pack, d'un éditeur tiers."
    explanation: >-
      Un alias est une entrée dans la liste des recettes, rien de plus : il peut
      désigner un bundle (`twig` → `symfony/twig-bundle`), un pack, ou un
      paquet qui n'a rien de Symfony. En déduire la cible depuis le nom court
      est un pari, d'où l'existence de `RECIPES.md`.
    memorization_justification: >-
      Généralisation naturelle à partir des alias les plus connus, que le cas
      `api` suffit à démentir.
