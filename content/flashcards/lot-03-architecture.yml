    official_item: OIT-ehf5zdnmdb1j
    language: fr
    level: RECALL
    front: "Quel est le titre principal obligatoire d'un `CHANGELOG.md` de composant ?"
    back: "`CHANGELOG`, toujours."
    explanation: >-
