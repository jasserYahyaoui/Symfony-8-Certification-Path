    language: fr
    level: APPLICATION
    front: "Une `HttpException` porte des en-têtes. Sont-ils appliqués à la réponse ?"
    back: "Oui, quand la règle 2 s'applique : le noyau ajoute `getHeaders()` en même temps que `getStatusCode()`."
