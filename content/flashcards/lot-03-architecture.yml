  - id: FLC-wkfzbd6nmgkn
    official_item: OIT-kcj9a5846b1s
    language: fr
    level: UNDERSTANDING
    front: "Pourquoi PSR-7 demande-t-elle un pont quand les autres n'en demandent pas ?"
    back: "Parce que HttpFoundation a son propre modèle `Request` / `Response`, antérieur à PSR-7 et **mutable** là où PSR-7 est immuable."
    explanation: >-
      Pour les autres PSR, Symfony **est** l'implémentation. Pour PSR-7 il faut
      convertir, et le pont ne fournit pas d'implémentation : il en faut une
      tierce.
    memorization_justification: >-
      La raison — antériorité et mutabilité — explique pourquoi le cas ne se
      résoudra pas et restera une conversion.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/symfony/symfony-docs/8.0/components/psr7.rst"
