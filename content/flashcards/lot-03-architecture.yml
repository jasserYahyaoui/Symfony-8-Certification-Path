        verified_at: "2026-09-18"

  - id: FLC-4nmfssct51rz
    official_item: OIT-7sewqvmw6468
    language: fr
    level: UNDERSTANDING
    front: "Pourquoi une `StreamedResponse` reçoit-elle une fonction de rendu réenveloppée ?"
    back: "Parce que le flux s'exécute après la sortie de `handle()`, donc après le dépilement de la requête."
    explanation: >-
      Sans réenveloppement, `getCurrentRequest()` rendrait `null` à l'intérieur
      du `callback`. Le noyau réempile la requête le temps du flux, puis la
      dépile dans un `finally`.
    memorization_justification: >-
      Conséquence directe de la mécanique de la pile, et cas où l'intuition
      « la requête est toujours là » est fausse.
