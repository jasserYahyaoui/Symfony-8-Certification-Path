    official_item: OIT-ehf5zdnmdb1j
    language: fr
    level: TRAP
    front: "Une dépréciation peut-elle être supprimée dans la mineure suivante ?"
    back: "Non. Seule la **prochaine majeure** supprime — environ tous les deux ans."
    explanation: >-
      La mineure introduit la dépréciation, la majeure la consomme. Toute autre
      combinaison casserait la promesse de rétrocompatibilité.
    memorization_justification: >-
      Les deux règles de calendrier se ressemblent assez pour être
      interverties, et l'interversion est le piège standard.
