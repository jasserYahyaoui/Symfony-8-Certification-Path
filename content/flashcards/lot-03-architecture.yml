    language: fr
    level: TRAP
    front: "`getSubscribedEvents()` est-elle une méthode d'instance ?"
    back: "Non, elle est **statique** — le conteneur l'appelle sans construire le service."
    explanation: >-
      C'est ce qui permet de connaître les abonnements à la compilation, donc
      d'instancier l'abonné seulement quand son événement survient.
    memorization_justification: >-
