  - id: FLC-zqr17fen4pp3
    official_item: OIT-y0ah7pq9c4hv
    language: fr
    level: APPLICATION
    front: "Un contrôleur rend un fragment par `render(controller(...))`. Que vaut `getParentRequest()` dans le service appelé ?"
    back: "La requête principale : la sous-requête est empilée par-dessus elle, donc l'avant-dernier élément est bien la requête parente."
    explanation: >-
      La pile compte alors deux éléments. `getCurrentRequest()` rend la
      sous-requête, `getMainRequest()` et `getParentRequest()` rendent toutes
      deux la requête d'origine — elles coïncident tant qu'il n'y a qu'un
      niveau d'imbrication. Avec deux sous-requêtes imbriquées, elles
      divergent.
    memorization_justification: >-
      Cas où deux accesseurs rendent la même valeur, ce qui masque leur
      différence jusqu'au jour où elle compte.
