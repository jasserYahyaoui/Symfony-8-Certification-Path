    front: "Une seule commande installe dix paquets et cinq fichiers de configuration. Quels mécanismes sont en jeu ?"
    back: "Un alias vers un **pack**, le dépaquetage du pack, et une **recette** par paquet installé qui en possède une."
    explanation: >-
      C'est le cas d'`api` dans la documentation : alias vers
      `api-platform/api-pack`, qui dépend du Validator, de Security et de
      l'ORM Doctrine — et « Flex installed *5* recipes ». Le nombre de recettes
      n'est pas celui des paquets : seules celles qui existent s'appliquent.
    memorization_justification: >-
