  - id: FLC-xzepnd6qxex0
    official_item: OIT-efzq92vdtayj
    language: fr
    level: RECALL
    front: "Par quel mécanisme se surcharge un **type de formulaire** ?"
    back: "Par une **extension de type de formulaire**."
    explanation: >-
      C'est la seule réponse de la section « Forms » du document. Ni décoration,
      ni passe de compilation : un mécanisme propre au sous-système des
      formulaires.
    memorization_justification: >-
      Sous-système à mécanisme unique, qu'on confond volontiers avec la
      décoration de service.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/symfony/symfony-docs/8.0/bundles/override.rst"
        readable_url: "https://github.com/symfony/symfony-docs/blob/8.0/bundles/override.rst"
        repository: "symfony/symfony-docs"
        branch: "8.0"
        symbol_or_lines: "Forms"
        verified_at: "2026-09-21"

  - id: FLC-2yr31jgjhags
    official_item: OIT-efzq92vdtayj
    language: fr
    level: RECALL
    front: "À quelle condition le mapping d'une entité de bundle est-il surchargeable ?"
    back: "Uniquement si le bundle expose une *mapped superclass*."
    explanation: >-
      La surcharge porte alors sur les **attributs** et les **associations**.
      Hors de ce cas, le mapping d'une entité concrète ne se surcharge pas.
    memorization_justification: >-
      Condition unique et bloquante, et ce qu'elle autorise exactement est la
      seconde moitié de la réponse.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/symfony/symfony-docs/8.0/bundles/override.rst"
