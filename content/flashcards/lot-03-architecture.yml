        branch: "8.0"
        symbol_or_lines: "handle"
        verified_at: "2026-09-18"

  - id: FLC-yvta3dzcbb7k
    official_item: OIT-7sewqvmw6468
    language: fr
    level: UNDERSTANDING
    front: "Pourquoi un court-circuit sur `kernel.request` ne saute-t-il pas `kernel.response` ?"
    back: "Parce que la réponse posée par l'écouteur passe par le même filtre de réponse que la réponse d'un contrôleur."
    explanation: >-
      `handleRaw()` rend `filterResponse($event->getResponse(), …)`, et ce filtre
      dispatche `kernel.response` puis `kernel.finish_request`. Seules la
      résolution et l'exécution du contrôleur sont sautées.
    memorization_justification: >-
      Le mot « court-circuit » suggère une sortie immédiate ; comprendre par où
      passe la réponse évite l'erreur.
