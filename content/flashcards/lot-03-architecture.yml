    front: "Où placer un gabarit qui surcharge celui d'un bundle ?"
    back: "Sous `templates/bundles/<NomDuBundle>/`, avec le **même chemin relatif**."
    explanation: >-
      `registration/confirmed.html.twig` d'`AcmeUserBundle` devient
      `templates/bundles/AcmeUserBundle/registration/confirmed.html.twig`. Il
      faut parfois vider le cache après un ajout à un emplacement nouveau, même
      en mode debug.
    memorization_justification: >-
      Chemin exact, avec un segment `bundles/` que rien n'annonce ; il ne se
      reconstruit pas par raisonnement.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/symfony/symfony-docs/8.0/bundles/override.rst"
        readable_url: "https://github.com/symfony/symfony-docs/blob/8.0/bundles/override.rst"
        repository: "symfony/symfony-docs"
        branch: "8.0"
        symbol_or_lines: "Templates"
        verified_at: "2026-09-21"

  - id: FLC-zp0ygek9kbpa
    official_item: OIT-efzq92vdtayj
    language: fr
    level: RECALL
    front: "Que signifie le préfixe `@!` devant un nom de gabarit ?"
    back: "« Le gabarit **original**, pas la surcharge. »"
    explanation: >-
      Sans lui, `{% extends \"@AcmeUser/...\" %}` dans le gabarit qui surcharge
      ce même fichier résout vers lui-même et produit une boucle infinie.
    memorization_justification: >-
      Syntaxe d'un caractère, invisible à la lecture rapide, et seule solution
      à une panne dont la cause n'est pas évidente.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/symfony/symfony-docs/8.0/bundles/override.rst"
        readable_url: "https://github.com/symfony/symfony-docs/blob/8.0/bundles/override.rst"
