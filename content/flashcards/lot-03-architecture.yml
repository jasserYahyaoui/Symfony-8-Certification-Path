    level: TRAP
    front: "Le défaut d'un argument ajouté en mineure est-il la valeur annoncée dans le commentaire ?"
    back: "Non. C'est celle qui **préserve** le comportement actuel, même si le commentaire en annonce une autre."
    explanation: >-
      L'exemple du document montre `/* bool $stripWhitespace = true */` dans la
      signature commentée, et `false` comme valeur de repli dans le corps. Le
      commentaire décrit la signature **future**.
    memorization_justification: >-
      Deux valeurs contradictoires dans le même extrait ; savoir laquelle agit
      aujourd'hui est la question.
