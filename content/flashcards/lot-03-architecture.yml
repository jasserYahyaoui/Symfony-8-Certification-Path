    official_item: OIT-pk5s7cnhk776
    language: fr
    level: UNDERSTANDING
    front: "Pourquoi 8.0 et 7.4 ont-elles les mêmes fonctionnalités ?"
    back: "Parce que la majeure se développe **en parallèle** de la dernière mineure de la branche précédente."
    explanation: >-
      Elles ne diffèrent que par les dépréciations : présentes dans l'ancienne,
