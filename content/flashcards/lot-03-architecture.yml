  - id: FLC-zg0rky07xp5h
    official_item: OIT-ehf5zdnmdb1j
    language: fr
    level: RECALL
    front: "Quels trois traits caractérisent un message de `CHANGELOG` ?"
    back: "Verbe à l'**impératif**, ligne **capitalisée**, **sans point final**."
    explanation: >-
      Ce sont les conventions de message de commit, reprises telles quelles. Les
      nouvelles entrées s'ajoutent par ailleurs **en haut** de la liste.
    memorization_justification: >-
      Trois critères formels et indépendants ; une proposition qui en viole un
      seul est fausse, ce qui en fait un test commode.
