    explanation: >-
      La documentation prend le même exemple avec `logger` : hors Flex, « you'll
      see a Composer error explaining that `logger` is not a valid package
      name ». La résolution d'alias n'est donc pas une fonctionnalité de
      Composer, et elle ne survit pas au retrait du plugin.
    memorization_justification: >-
      Cas limite qui révèle qui fait quoi entre Composer et Flex, là où l'usage
      quotidien les confond.
    verification_status: VERIFIED
    official_sources:
