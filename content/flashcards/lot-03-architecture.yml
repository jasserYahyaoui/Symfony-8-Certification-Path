  - id: FLC-yg0rbde8bwnb
    official_item: OIT-347k8phdewem
    language: fr
    level: RECALL
    front: "Quels droits la licence MIT accorde-t-elle explicitement ?"
    back: "*use, copy, modify, merge, publish, distribute, sublicense, and/or sell* — huit verbes, gratuitement et sans restriction."
    explanation: >-
      La concession est ouverte à « any person obtaining a copy », « free of
      charge ». Le verbe qui compte en pratique est **sublicense** : il autorise
      à redistribuer sous une autre licence, ce qu'une licence copyleft interdit.
    memorization_justification: >-
      Énumération littérale dont un terme — sublicense — porte la différence
      juridique décisive avec le copyleft.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/symfony/symfony/8.0/LICENSE"
        readable_url: "https://github.com/symfony/symfony/blob/8.0/LICENSE"
        repository: "symfony/symfony"
        branch: "8.0"
        symbol_or_lines: "lignes 3-8"
        verified_at: "2026-09-17"

  - id: FLC-w28tr5p1yfm2
    official_item: OIT-347k8phdewem
    language: fr
    level: UNDERSTANDING
    front: "Pourquoi la MIT n'est-elle pas une licence *copyleft* ?"
    back: "Parce qu'elle n'exige aucune réciprocité : rien n'oblige à publier sous MIT — ni à publier du tout — le code qui utilise Symfony."
    explanation: >-
      Une licence copyleft impose aux œuvres dérivées la licence de l'original.
      La MIT ne pose qu'une condition documentaire, et autorise explicitement le
      sous-licenciement. C'est ce qui rend l'usage propriétaire et commercial
      possible sans contrepartie.
    memorization_justification: >-
      Le critère qui sépare les deux familles de licences ; le connaître rend
      inutile de mémoriser des listes de licences.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/symfony/symfony/8.0/LICENSE"
        readable_url: "https://github.com/symfony/symfony/blob/8.0/LICENSE"
        repository: "symfony/symfony"
        branch: "8.0"
        symbol_or_lines: "lignes 3-11"
        verified_at: "2026-09-17"

  - id: FLC-pd334sa7jk6x
    official_item: OIT-347k8phdewem
    language: fr
    level: UNDERSTANDING
    front: "Les deux dernières clauses de la MIT disent-elles la même chose ?"
    back: "Non : l'une écarte toute **garantie** (*AS IS*), l'autre écarte toute **responsabilité** en cas de dommage. Deux protections distinctes."
    explanation: >-
      La première nomme les garanties écartées — qualité marchande, adéquation à
      un usage particulier, non-contrefaçon. La seconde dit qu'« in no event
      shall the authors or copyright holders be liable », que la réclamation
      naisse d'un contrat, d'un délit ou d'autre chose. Sans garantie ne suffit
      pas à écarter la responsabilité : il faut les deux.
    memorization_justification: >-
      Deux paragraphes en majuscules qu'on lit comme un bloc, alors qu'ils
      couvrent deux risques juridiques différents.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/symfony/symfony/8.0/LICENSE"
        readable_url: "https://github.com/symfony/symfony/blob/8.0/LICENSE"
        repository: "symfony/symfony"
        branch: "8.0"
        symbol_or_lines: "lignes 13-19"
        verified_at: "2026-09-17"

  - id: FLC-fbn22h4d59vp
    official_item: OIT-347k8phdewem
    language: fr
    level: APPLICATION
    front: "Une société vend une application propriétaire bâtie sur Symfony. Que doit-elle faire ?"
    back: "Reproduire l'avis de copyright et le texte de la licence. Rien d'autre : ni publier son code, ni payer, ni demander une autorisation."
    explanation: >-
      La MIT accorde explicitement le droit de *sell* et de *sublicense*, et
      n'exige aucune réciprocité. L'obligation est documentaire — en pratique,
      une mention dans les crédits ou un fichier de licences tiers — et elle
      porte sur le logiciel copié, pas sur l'application qui l'utilise.
    memorization_justification: >-
      Cas d'usage le plus fréquent en entreprise, et celui dont on redoute à
      tort qu'il impose une contrepartie.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/symfony/symfony/8.0/LICENSE"
        readable_url: "https://github.com/symfony/symfony/blob/8.0/LICENSE"
        repository: "symfony/symfony"
        branch: "8.0"
        symbol_or_lines: "lignes 3-11"
        verified_at: "2026-09-17"

  - id: FLC-gmkk1qmy41zd
