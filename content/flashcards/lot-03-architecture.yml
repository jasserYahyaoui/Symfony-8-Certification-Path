  - id: FLC-256rcewrq2hm
    official_item: OIT-p3p7te94qc1n
    language: fr
    level: UNDERSTANDING
    front: "Pourquoi `public/` est-il le seul répertoire exposé ?"
    back: "C'est le serveur web qui décide, pas Symfony : sa racine documentaire pointe sur `public/`, et rien d'autre n'est atteignable."
    explanation: >-
      Aucune configuration Symfony ne rend accessible un fichier posé hors de
      cette racine. C'est la raison d'être de la séparation : `config/`, `src/`
