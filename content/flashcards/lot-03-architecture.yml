  - id: FLC-tndbf49d5spa
    official_item: OIT-ehf5zdnmdb1j
    language: fr
    level: UNDERSTANDING
    front: "Pourquoi une dépréciation se déclare-t-elle **deux** fois ?"
    back: "Deux publics : `@deprecated` pour qui **lit** le code, `trigger_deprecation()` pour le code qui **tourne**."
    explanation: >-
      L'annotation apparaît dans l'IDE et la documentation ; l'appel remonte
      dans les journaux et les tests. L'un sans l'autre laisse la moitié des
      utilisateurs sans avertissement.
    memorization_justification: >-
      La dualité est le cœur du mécanisme ; n'en retenir qu'une moitié est
      l'erreur que la question vise.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/symfony/symfony-docs/8.0/contributing/code/conventions.rst"
        readable_url: "https://github.com/symfony/symfony-docs/blob/8.0/contributing/code/conventions.rst"
        repository: "symfony/symfony-docs"
        branch: "8.0"
        symbol_or_lines: "Deprecating Code"
        verified_at: "2026-09-21"

  - id: FLC-7aeb1ekg4jqm
    official_item: OIT-ehf5zdnmdb1j
    language: fr
    level: UNDERSTANDING
    front: "Pourquoi monter d'abord à la dernière mineure avant de passer à la majeure suivante ?"
    back: "Parce que la majeure ne fait que **supprimer** ce que la dernière mineure a signalé comme déprécié."
    explanation: >-
      En corrigeant toutes les dépréciations sur la dernière mineure, on arrive
      à la majeure sans rien à changer. Sauter l'étape revient à découvrir les
      ruptures sans le filet des avertissements.
    memorization_justification: >-
      Conséquence pratique directe des deux règles de calendrier, et la seule
      qui serve réellement le jour d'une montée de version.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/symfony/symfony-docs/8.0/contributing/code/conventions.rst"
        readable_url: "https://github.com/symfony/symfony-docs/blob/8.0/contributing/code/conventions.rst"
        repository: "symfony/symfony-docs"
        branch: "8.0"
        symbol_or_lines: "Removing Deprecated Code"
        verified_at: "2026-09-21"

  - id: FLC-0qcpge4ckz7d
    official_item: OIT-ehf5zdnmdb1j
    language: fr
    level: APPLICATION
    front: "Vous dépréciez une méthode. Combien de fichiers documenter, et lesquels ?"
    back: "Trois : le `CHANGELOG.md` du composant, `UPGRADE-<mineure>.md` et `UPGRADE-<majeure>.md` — dans la **même** pull request."
    explanation: >-
      Le premier `UPGRADE` annonce la dépréciation, le second la suppression à
      venir. Une quatrième entrée de `CHANGELOG.md` s'ajoutera le jour de la
      suppression.
    memorization_justification: >-
      Liste close de trois fichiers, plus une quatrième écriture différée ;
      le compte exact est la question.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/symfony/symfony-docs/8.0/contributing/code/conventions.rst"
        readable_url: "https://github.com/symfony/symfony-docs/blob/8.0/contributing/code/conventions.rst"
        repository: "symfony/symfony-docs"
        branch: "8.0"
        symbol_or_lines: "Deprecating Code"
        verified_at: "2026-09-21"

  - id: FLC-tr10g3xdvq9f
    official_item: OIT-ehf5zdnmdb1j
    language: fr
    level: APPLICATION
    front: "Vous supprimez du code déprécié. Que faut-il écrire, et où ?"
    back: "Les conséquences, dans le `CHANGELOG.md` du composant, dans la **même** pull request que la suppression."
    explanation: >-
      Exemple du document : sous la section `5.0`,
      « Remove the `Deprecated` class, use `Replacement` instead ». La tâche est
      qualifiée d'obligatoire.
    memorization_justification: >-
      Étape qu'on croit réservée au moment de la dépréciation ; la suppression
      a sa propre obligation d'écriture.
    verification_status: VERIFIED
    official_sources:
