  - id: FLC-85hfb5gq1xpk
    official_item: OIT-rd9b27fkb72r
    language: fr
    level: APPLICATION
    front: "On veut modifier la réponse. Quels événements du noyau le permettent ?"
    back: "`kernel.request`, `kernel.view`, `kernel.exception` la **posent** ; `kernel.response` la modifie. Ni `finish_request` ni `terminate`."
    explanation: >-
      `kernel.finish_request` intervient après `kernel.response`, et
      `kernel.terminate` après l'envoi : à ces deux moments, plus rien n'est
      modifiable.
    memorization_justification: >-
      Reformule le catalogue sous la forme d'un besoin réel, qui est celle sous
      laquelle la question se pose.
