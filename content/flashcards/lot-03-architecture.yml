  - id: FLC-f6phwa9qmmek
    official_item: OIT-kcj9a5846b1s
    language: fr
    front: 'Symfony : quelle PSR de la liste n''est pas implémentée nativement, et que faut-il alors
      ?'
    back: 'PSR-7 : elle demande le pont `symfony/psr-http-message-bridge` **plus** une implémentation
      tierce, que le pont ne fournit pas.'
    explanation: Pour toutes les autres PSR de la liste, Symfony *est* l'implémentation — le conteneur
