        branch: "8.0"
        symbol_or_lines: "Controllers"
        verified_at: "2026-09-21"

  - id: FLC-e0q12qrdbyw0
    official_item: OIT-efzq92vdtayj
    language: fr
    level: APPLICATION
    front: "Le contrôleur à surcharger **n'est pas** un service. Que fait-on ?"
    back: "Une route de **même chemin**, chargée **avant** celle du bundle."
    explanation: >-
      L'ordre de chargement décide : la première route qui correspond gagne.
      C'est la branche de repli du document, pas sa réponse principale.
    memorization_justification: >-
      L'autre moitié de la condition ; la mention « chargée avant » est la
      partie qu'on oublie et qui fait échouer la surcharge.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/symfony/symfony-docs/8.0/bundles/override.rst"
        readable_url: "https://github.com/symfony/symfony-docs/blob/8.0/bundles/override.rst"
