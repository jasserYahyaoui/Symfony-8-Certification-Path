  - id: FLC-bfy6s9xy7qnq
    official_item: OIT-y0ah7pq9c4hv
    language: fr
    level: UNDERSTANDING
    front: "Dans quel sens va la dépendance entre HttpFoundation et le reste du framework ?"
    back: "Du framework **vers** HttpFoundation. Le composant est autonome ; le contrat du noyau, `handle(Request): Response`, est écrit dans son vocabulaire."
    explanation: >-
      HttpFoundation s'installe et s'utilise dans n'importe quel projet PHP,
      sans Symfony et sans dépendre d'un autre composant. L'inverse est
      impossible : tout ce qui manipule une requête ou une réponse dans le
      framework parle son langage. C'est la brique la plus basse de la pile
      HTTP.
    memorization_justification: >-
