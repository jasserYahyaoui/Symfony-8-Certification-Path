  - id: FLC-et9ra0ah1ve6
    official_item: OIT-132nwnh9c6bc
    language: fr
    level: TRAP
    front: "Vrai ou faux : « les recettes du dépôt contrib ne sont pas garanties de fonctionner »."
    back: "Faux. La documentation dit exactement l'inverse : « All of them are guaranteed to work ». C'est leur **paquet** qui peut être abandonné."
    explanation: >-
      L'approximation est répandue et déplace le risque : on se méfie de la
      recette alors que le doute porte sur la maintenance du paquet qu'elle
      configure. Elle explique aussi pourquoi Flex ne refuse pas ces recettes —
      il demande seulement la permission.
    memorization_justification: >-
      Affirmation plausible que le texte officiel contredit mot pour mot ;
      c'est le matériau d'un QCM vrai/faux.
