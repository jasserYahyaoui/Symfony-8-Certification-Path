  - id: FLC-g6tm7zgffmj0
    official_item: OIT-kcj9a5846b1s
    language: fr
    level: UNDERSTANDING
    front: "Pourquoi PSR-4 et PSR-12 ne figurent-elles pas dans `provide` ?"
    back: "Parce qu'on ne « fournit » pas une convention : `provide` déclare des **interfaces implémentées**."
    explanation: >-
      PSR-4 organise les espaces de noms, PSR-12 le style du code. Ni l'une ni
      l'autre n'est un contrat qu'un paquet puisse satisfaire au sens de
      Composer.
    memorization_justification: >-
      Relie le statut d'une PSR à la mécanique qui l'enregistre ; le critère
      permet de classer une PSR jamais vue.
