  - id: FLC-vpyxr6rxb8j5
    official_item: OIT-p3p7te94qc1n
    language: fr
    level: RECALL
    front: "Quelle est la valeur par défaut de `Kernel::getCacheDir()` ?"
    back: "`<racine du projet>/var/cache/<environnement>` — l'environnement est dans le chemin."
    explanation: >-
      Chaque environnement génère sa propre configuration compilée ; le
      cloisonnement par défaut évite qu'ils se marchent dessus. C'est aussi
      pourquoi la documentation avertit de garder des répertoires distincts si
      l'on surcharge la méthode.
    memorization_justification: >-
      Valeur exacte, avec un segment que la lecture rapide de « var/cache »
      fait oublier ; elle est la moitié d'une asymétrie que le QCM teste.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/HttpKernel/Kernel.php"
