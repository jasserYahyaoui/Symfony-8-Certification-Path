        verified_at: "2026-09-17"

  - id: FLC-tcn0v3xtezsx
    official_item: OIT-y0ah7pq9c4hv
    language: fr
    level: TRAP
    front: "Vrai ou faux : « sur la requête principale, `getParentRequest()` rend cette requête »."
    back: "Faux : elle rend `null`. L'index visé est `count - 2`, qui n'existe pas quand la pile n'a qu'un élément."
    explanation: >-
      L'implémentation est `$this->requests[$pos] ?? null` avec
      `$pos = count($this->requests) - 2`. Sur une pile d'un élément, l'index
      vaut `-1` : absent, donc `null`. Un code qui suppose une requête parente
      toujours présente échoue précisément dans le cas le plus courant — une
      requête sans sous-requête.
    memorization_justification: >-
      Le cas nominal est celui qui rend `null`, à rebours de l'intuition selon
      laquelle un `null` signale une situation exceptionnelle.
