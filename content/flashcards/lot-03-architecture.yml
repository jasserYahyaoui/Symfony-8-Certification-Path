  - id: FLC-vtkb4x03q17a
    official_item: OIT-132nwnh9c6bc
    language: fr
    level: APPLICATION
    front: "Après `composer require --dev debug`, que trouve-t-on dans `composer.json` ?"
    back: "Les paquets réels — `symfony/var-dumper` et ses voisins dans `require-dev` — mais **pas** `symfony/debug-pack`."
    explanation: >-
      Le pack est un métapaquet : il tire `symfony/debug-bundle`,
      `symfony/monolog-bundle`, `symfony/var-dumper` et d'autres, puis Flex le
      dépaquette. Chercher le pack dans son `composer.json` revient à chercher
      ce que Flex a délibérément retiré.
    memorization_justification: >-
      Résultat observable et contre-intuitif d'une commande courante ; il se
      constate en ouvrant un fichier.
