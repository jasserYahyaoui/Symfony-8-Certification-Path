  - id: FLC-y51trsyr41em
    official_item: OIT-efzq92vdtayj
    language: fr
    front: 'Twig : que se passe-t-il si un gabarit de surcharge étend le gabarit qu''il surcharge par
      son nom ordinaire ?'
    back: 'Une boucle infinie : le nom résout vers la surcharge, donc vers lui-même. Le préfixe `@!`
      désigne l''original et rompt le cycle.'
    explanation: Sans `@!`, la page ne rend jamais. C'est le seul emploi de ce préfixe et il n'a pas
      d'équivalent.
    memorization_justification: 'Syntaxe arbitraire à un seul usage : `@!` ne se devine pas et sa seule
      alternative est un défaut silencieux.'
    verification_status: VERIFIED
    official_sources:
