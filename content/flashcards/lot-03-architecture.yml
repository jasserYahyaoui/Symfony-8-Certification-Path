  - id: FLC-pk83wg9jz0br
    official_item: OIT-rd9b27fkb72r
    language: fr
    level: TRAP
    front: "Tout objet dispatché peut-il voir sa propagation arrêtée ?"
    back: "Non. Sans `StoppableEventInterface`, tous les écouteurs sont appelés quoi qu'il arrive."
    explanation: >-
      `callListeners()` ne teste `isPropagationStopped()` que sur un événement
      arrêtable. PSR-14 autorise à dispatcher n'importe quel objet ; l'arrêt,
      lui, suppose l'interface.
    memorization_justification: >-
      L'expérience quotidienne dit « oui » parce que tout hérite de `Event` ;
      le cas contraire ne se rencontre que sur un événement maison.
    verification_status: VERIFIED
    official_sources:
