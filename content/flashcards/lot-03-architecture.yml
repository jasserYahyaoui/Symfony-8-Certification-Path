  - id: FLC-71nhnm9tc4m2
    official_item: OIT-347k8phdewem
    language: fr
    level: TRAP
    front: "Vrai ou faux : « utiliser Symfony oblige à publier son propre code »."
    back: "Faux. C'est la confusion MIT / copyleft : la MIT n'exige aucune réciprocité."
