        branch: "8.0"
        symbol_or_lines: "Entities & Entity Mapping"
        verified_at: "2026-09-21"

  - id: FLC-d6tnwq9ft53f
    official_item: OIT-efzq92vdtayj
    language: fr
    level: UNDERSTANDING
    front: "Pourquoi une contrainte de validation ne se remplace-t-elle pas ?"
    back: "Parce que Symfony fusionne la configuration de **tous** les bundles en un seul arbre de métadonnées."
    explanation: >-
      On peut donc ajouter une contrainte à une propriété, jamais en retirer
      une. Le seul contournement suppose que le bundle ait prévu des **groupes
      de validation**.
    memorization_justification: >-
      Exception unique parmi les huit sous-systèmes, et sa raison — la fusion —
      explique aussi pourquoi le contournement passe par les groupes.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/symfony/symfony-docs/8.0/bundles/override.rst"
        readable_url: "https://github.com/symfony/symfony-docs/blob/8.0/bundles/override.rst"
        repository: "symfony/symfony-docs"
        branch: "8.0"
        symbol_or_lines: "Validation Metadata"
        verified_at: "2026-09-21"

  - id: FLC-fbs970tcxxje
    official_item: OIT-efzq92vdtayj
    language: fr
    level: UNDERSTANDING
    front: "Pourquoi « surcharger » une route de bundle revient-il à ne rien faire ?"
    back: "Parce que Symfony n'importe **jamais** une route de bundle automatiquement : il n'y a rien à neutraliser."
    explanation: >-
      La route n'existe que si l'application l'importe. Pour la modifier, on
      copie le fichier dans le projet et on importe la copie, sans jamais
      importer l'original.
    memorization_justification: >-
      Le sous-système où la question elle-même est mal posée ; comprendre
      pourquoi évite de chercher un mécanisme inexistant.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/symfony/symfony-docs/8.0/bundles/override.rst"
        readable_url: "https://github.com/symfony/symfony-docs/blob/8.0/bundles/override.rst"
        repository: "symfony/symfony-docs"
        branch: "8.0"
        symbol_or_lines: "Routing"
        verified_at: "2026-09-21"

  - id: FLC-5qfn4kx12w4c
    official_item: OIT-efzq92vdtayj
    language: fr
    level: UNDERSTANDING
    front: "Pourquoi une traduction se surcharge-t-elle sans rien déclarer ?"
    back: "Parce que les traductions sont liées à un **domaine**, pas à un bundle."
    explanation: >-
      Un fichier du `translations/` du projet portant le même domaine l'emporte.
      Le nom du bundle dans `AcmeUserBundle.es.yaml` n'est là que parce qu'il
      **est** le nom du domaine.
    memorization_justification: >-
      Le nom de fichier suggère un lien au bundle qui n'existe pas ; la vraie
      clé est le domaine.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/symfony/symfony-docs/8.0/bundles/override.rst"
        readable_url: "https://github.com/symfony/symfony-docs/blob/8.0/bundles/override.rst"
        repository: "symfony/symfony-docs"
        branch: "8.0"
        symbol_or_lines: "Translations"
        verified_at: "2026-09-21"

  - id: FLC-tqn1hds5k79p
    official_item: OIT-efzq92vdtayj
    language: fr
    level: UNDERSTANDING
    front: "Décoration ou passe de compilation : qu'est-ce qui les sépare ?"
    back: "La décoration **enveloppe** un service existant ; la passe de compilation **manipule la définition** elle-même."
    explanation: >-
      Supprimer une définition, en modifier une créée par un autre bundle ou
      ajouter un argument demande une passe : la configuration ne le permet pas.
    memorization_justification: >-
      Deux mécanismes du même sous-système, à des niveaux différents ; choisir
      le mauvais mène à une impasse technique.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/symfony/symfony-docs/8.0/bundles/override.rst"
        readable_url: "https://github.com/symfony/symfony-docs/blob/8.0/bundles/override.rst"
        repository: "symfony/symfony-docs"
        branch: "8.0"
        symbol_or_lines: "Services & Configuration"
        verified_at: "2026-09-21"

  - id: FLC-fzbbb7r82r7p
    official_item: OIT-efzq92vdtayj
    language: fr
    level: APPLICATION
    front: "Le contrôleur à surcharger **est un service**. Que fait-on ?"
    back: "On le **décore**, comme n'importe quel service."
    explanation: >-
      Le document ouvre sa section par cette condition : « si le contrôleur est
      un service, voir la section suivante ». La route de même chemin n'est que
      la branche **sinon**.
    memorization_justification: >-
      Branche prioritaire du document, et celle qui s'applique le plus souvent
      dans une application moderne où les contrôleurs sont des services.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/symfony/symfony-docs/8.0/bundles/override.rst"
        readable_url: "https://github.com/symfony/symfony-docs/blob/8.0/bundles/override.rst"
