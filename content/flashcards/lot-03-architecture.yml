  - id: FLC-32zq739dq12k
    official_item: OIT-vk57zg2wpep7
    language: fr
    level: APPLICATION
    front: "Vous étendez une classe Symfony et ajoutez `public array $cache = [];`. Couvert ?"
    back: "Non. Ajouter une **propriété** à une classe étendue n'est pas garanti."
    explanation: >-
      Symfony peut introduire une propriété du même nom en version mineure. La
      règle vaut pour les propriétés comme pour les méthodes ; ce sont les deux
      lignes du tableau qui concernent le code ordinaire.
    memorization_justification: >-
      Geste banal qu'on ne soupçonne pas d'être hors promesse ; il se pose
      sous forme de cas concret.
    verification_status: VERIFIED
    official_sources:
