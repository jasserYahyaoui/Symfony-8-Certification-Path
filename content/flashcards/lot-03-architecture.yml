  - id: FLC-qdk1yk0gat8z
    official_item: OIT-kcj9a5846b1s
    language: fr
    level: RECALL
    front: "Quelles PSR Symfony **suit** sans les implémenter ?"
    back: "**PSR-4** (autoloading) et **PSR-12** (style de code)."
    explanation: >-
      Elles ne figurent pas dans `provide` : on ne « fournit » pas une
      convention. PSR-4 fait correspondre `src/` à `App\` ; les standards de
      codage de Symfony sont fondés sur PSR-12 et PSR-4.
    memorization_justification: >-
      Deux PSR d'un statut différent des huit autres ; les ranger avec elles
      est l'erreur attendue.
    verification_status: VERIFIED
    official_sources:
