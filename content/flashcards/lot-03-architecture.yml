  - id: FLC-9469gwk4ptrb
    official_item: OIT-vk57zg2wpep7
    language: fr
    level: APPLICATION
    front: "Une faille de sécurité impose une rupture en version mineure. Est-ce permis ?"
    back: "Oui. C'est la tolérance explicite du document, et elle n'est pas une exclusion."
    explanation: >-
      La promesse cède devant la sécurité. À distinguer des trois exclusions —
      `@internal`, expérimental, traductions internes — qui, elles, n'ont jamais
      été couvertes.
    memorization_justification: >-
      Exception d'une nature différente des trois autres ; les ranger ensemble
      est l'erreur attendue.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/symfony/symfony-docs/8.0/contributing/code/bc.rst"
