  - id: FLC-dmvvzny8189q
    official_item: OIT-ehf5zdnmdb1j
    language: fr
    level: RECALL
    front: "Quels sont les trois premiers arguments de `trigger_deprecation()` ?"
    back: "Le **paquet**, la **version** d'introduction, le **message** formaté."
    explanation: >-
      Exemple :
      `trigger_deprecation('symfony/routing', '4.4', 'The \"%s\" class is deprecated…', Old::class)`.
      Les arguments suivants alimentent le format.
    memorization_justification: >-
      Ordre exact des arguments d'une fonction qu'on écrit rarement, et que
      l'intuition range volontiers autrement.
