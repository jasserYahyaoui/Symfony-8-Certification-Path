  - id: FLC-4mrg5tgjhrz3
    official_item: OIT-7sewqvmw6468
    language: fr
    level: RECALL
    front: "Que fait `handle()` avec le `RequestStack` ?"
    back: "Il empile la requête à l'entrée et la dépile dans un `finally`."
    explanation: >-
      Le `finally` garantit le dépilement même si une exception remonte. C'est
      ce mécanisme, et rien d'autre, qui fait fonctionner `getCurrentRequest()`
      et `getParentRequest()`.
    memorization_justification: >-
      Relie une méthode très utilisée à son implémentation réelle ; sans elle,
      `getCurrentRequest()` reste magique.
