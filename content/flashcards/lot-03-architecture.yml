  - id: FLC-96yjsk63bse0
    official_item: OIT-d416348gfhde
    language: fr
    level: RECALL
    front: "Que déclare la clé `replace` du `composer.json` de `symfony/symfony` ?"
    back: "Que `symfony/symfony` **remplace** 65 paquets individuels — il ne les installe pas en plus."
    explanation: >-
