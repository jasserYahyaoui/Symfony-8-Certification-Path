  - id: FLC-1akezpqxhagj
    official_item: OIT-ehf5zdnmdb1j
    language: fr
    level: RECALL
    front: "Où se place l'appel `trigger_deprecation()` quand c'est une classe entière qui est dépréciée ?"
    back: "**Après les déclarations `use`**, avant la classe."
    explanation: >-
      L'appel doit s'exécuter au chargement du fichier, et non à l'instanciation :
      le placer dans le constructeur ne signalerait rien à qui se contente de
      référencer la classe.
    memorization_justification: >-
      Position précise dans le fichier, qui ne se devine pas et dont la raison
      éclaire le mécanisme.
    verification_status: VERIFIED
    official_sources:
