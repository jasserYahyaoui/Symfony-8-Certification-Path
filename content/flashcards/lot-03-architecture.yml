    language: fr
    level: TRAP
    front: "Vrai ou faux : « tout ce qui vit dans `src/Symfony/Bridge/` dépend d'une bibliothèque tierce »."
    back: "Faux. `symfony/phpunit-bridge` ne requiert que `php >=8.1.0`."
    explanation: >-
      La définition — un pont entre un composant et une bibliothèque tierce —
      décrit trois des quatre répertoires. Le quatrième porte le nom et le type
      sans la structure. Généraliser à partir du bridge Twig, qui est le cas
      canonique, conduit exactement à cette erreur.
    memorization_justification: >-
      Généralisation naturelle à partir de l'exemple le plus enseigné, que le
