  - id: FLC-n17zfdyt572z
    official_item: OIT-ehf5zdnmdb1j
    language: fr
    level: TRAP
    front: "Une nouvelle classe peut-elle être introduite avec des méthodes déjà dépréciées ?"
    back: "Non. Rien ne naît déprécié — ni une classe, ni une méthode."
    explanation: >-
      Introduire du code déjà déprécié reviendrait à livrer une dette dès le
      premier jour, et à ouvrir une fenêtre de suppression sans qu'aucune
      version n'ait jamais recommandé l'usage.
    memorization_justification: >-
      Interdit qui ne se déduit d'aucune règle de calendrier, et que rien
      n'empêche techniquement.
