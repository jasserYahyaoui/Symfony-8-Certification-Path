  - id: FLC-g0kpwp6w0xg6
    official_item: OIT-hzbednd04fd4
    language: fr
    front: 'Best practices Symfony : sous quelle forme définir une valeur qui ne change presque jamais
      ?'
    back: Une constante de classe — pas un paramètre du conteneur.
    explanation: 'La recommandation est contre-intuitive : une constante est lisible partout, y compris
      depuis un gabarit, là où un paramètre exige le conteneur. Les paramètres restent pour ce qui varie
      par environnement.'
    memorization_justification: 'Recommandation contre-intuitive : le réflexe est d''en faire un paramètre,
      et l''examen interroge précisément l''écart.'
