        repository: "symfony/symfony-docs"
        branch: "8.0"
        symbol_or_lines: "Hard-code URLs in a Functional Test"
        verified_at: "2026-09-21"

  - id: FLC-xh5wxnqqjrf6
    official_item: OIT-hzbednd04fd4
    language: fr
    level: UNDERSTANDING
    front: "Pourquoi le document déconseille-t-il un bundle pour le code de l'application ?"
    back: "Parce qu'un projet est **une** application. Les bundles servent à partager du code entre projets."
    explanation: >-
      L'organisation interne se fait par l'arborescence de `src/` et les
      espaces de noms. Créer un bundle applicatif ajoute une couche sans rien
      rendre réutilisable.
    memorization_justification: >-
      Contredit une pratique longtemps répandue, et le critère — réutilisation
      entre projets — permet de répondre sur un cas non vu.
