  - id: FLC-5rm5a89fpm9v
    official_item: OIT-7sewqvmw6468
    language: fr
    level: UNDERSTANDING
    front: "Pourquoi `kernel.finish_request` est-il fiable pour restaurer un état global ?"
    back: "Parce qu'il est dispatché sur les trois chemins : succès, exception rattrapée, exception relancée."
    explanation: >-
      Même quand `$catch` vaut `false` et que `kernel.exception` n'a pas lieu,
      `finishRequest()` est appelé avant que l'exception ne remonte. Aucun autre
      événement du cycle n'offre cette garantie.
    memorization_justification: >-
      Donne la raison d'être de l'événement ; sans elle, on le confond avec un
      simple synonyme tardif de `kernel.response`.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/HttpKernel/HttpKernel.php"
        readable_url: "https://github.com/symfony/symfony/blob/8.0/src/Symfony/Component/HttpKernel/HttpKernel.php"
        repository: "symfony/symfony"
        branch: "8.0"
        symbol_or_lines: "handle, filterResponse, handleThrowable"
        verified_at: "2026-09-18"

  - id: FLC-bje91n5wwq3x
    official_item: OIT-7sewqvmw6468
    language: fr
    level: UNDERSTANDING
    front: "Que décide exactement l'argument `$catch` de `handle()` ?"
    back: "Si `kernel.exception` est dispatché. À `false`, l'exception remonte sans passer par l'événement."
    explanation: >-
      À `true`, un écouteur peut convertir l'exception en réponse et le cycle
      reprend au filtre de réponse. À `false`, seule `finishRequest()` a lieu
      avant que l'exception ne soit relancée telle quelle.
    memorization_justification: >-
      Argument souvent lu comme « attraper ou non », alors qu'il commande la
      tenue d'un événement précis, avec des conséquences observables.
