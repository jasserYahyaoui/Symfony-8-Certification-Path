  - id: FLC-5w239fgrrrqc
    official_item: OIT-ehf5zdnmdb1j
    language: fr
    level: APPLICATION
    front: "Le remplacement d'une classe dépréciée vit dans un autre espace de noms. Comment l'écrire ?"
    back: "Avec son nom **pleinement qualifié** — c'est obligatoire dans ce cas."
    explanation: >-
      L'annotation `@deprecated` doit indiquer la version et, autant que
      possible, le remplacement. Un nom court serait ambigu hors de l'espace de
      noms d'origine.
    memorization_justification: >-
      Règle conditionnelle — elle ne s'applique qu'au changement d'espace de
      noms — donc facile à énoncer trop largement ou trop étroitement.
    verification_status: VERIFIED
