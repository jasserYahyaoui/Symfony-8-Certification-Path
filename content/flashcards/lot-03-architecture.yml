    official_item: OIT-xc4zfr70jjas
    language: fr
    level: UNDERSTANDING
    front: "Comment la page d'erreur est-elle produite ?"
    back: "Par une **sous-requête** vers le contrôleur d'erreur : `handle($request, SUB_REQUEST, false)`."
    explanation: >-
      `onKernelException` duplique la requête et rappelle le noyau. Ce n'est
      donc pas une réponse fabriquée à la main : c'est un cycle complet, avec
      ses propres événements.
    memorization_justification: >-
      Explique pourquoi une page d'erreur déclenche des écouteurs, ce qui
      surprend quand on croit à une réponse construite directement.
