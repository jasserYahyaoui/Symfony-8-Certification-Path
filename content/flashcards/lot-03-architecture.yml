    language: fr
    level: APPLICATION
    front: "Le contrôleur d'erreur lève lui-même une exception. Est-elle rattrapée ?"
    back: "Non. La sous-requête est lancée avec `$catch = false` : elle remonte, l'originale chaînée en `previous`."
    explanation: >-
