    language: fr
    level: APPLICATION
    front: "Où lit-on la licence de Symfony sans ouvrir le fichier `LICENSE` ?"
    back: "Dans la clé `license` du `composer.json` de `symfony/symfony`, qui porte la valeur `MIT`."
