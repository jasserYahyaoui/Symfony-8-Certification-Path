    level: TRAP
    front: "Symfony déclare-t-il satisfaire PSR-6 dans toutes ses versions majeures ?"
    back: "Non. `psr/cache-implementation` est déclarée à `2.0|3.0` — **pas** `1.0`."
    explanation: >-
      Les contraintes varient d'une entrée à l'autre : trois majeures pour
      PSR-3 et PSR-16, deux pour PSR-6, PSR-11 et PSR-13, une seule pour
      PSR-14, PSR-18 et PSR-20.
    memorization_justification: >-
      L'uniformité supposée des déclarations est fausse, et l'exception de
      PSR-6 est vérifiable d'un coup d'œil.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/symfony/symfony/8.0/composer.json"
        readable_url: "https://github.com/symfony/symfony/blob/8.0/composer.json"
        repository: "symfony/symfony"
        branch: "8.0"
        symbol_or_lines: "psr/cache-implementation"
        verified_at: "2026-09-21"

  - id: FLC-awet5d7w86j9
    official_item: OIT-kcj9a5846b1s
    language: fr
    level: TRAP
    front: "PSR-12 figure-t-elle dans `provide` ?"
    back: "Non — et elle ne peut pas y figurer : c'est une convention de style, pas une interface."
    explanation: >-
      Symfony la **suit**, au même titre que PSR-4. Seules des interfaces
      implémentées entrent dans `provide`.
    memorization_justification: >-
      Le mot « suivre » et le mot « implémenter » se confondent à l'oral ; la
      clé `provide` tranche mécaniquement.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/symfony/symfony/8.0/composer.json"
        readable_url: "https://github.com/symfony/symfony/blob/8.0/composer.json"
        repository: "symfony/symfony"
        branch: "8.0"
        symbol_or_lines: "clé provide"
        verified_at: "2026-09-21"

  - id: FLC-75qhxd0cfawg
    official_item: OIT-kcj9a5846b1s
    language: fr
    level: TRAP
    front: "PSR-17 est-elle implémentée nativement puisque PSR-7 a un pont ?"
    back: "Non. PSR-7 **et** PSR-17 sont hors de l'implémentation native."
    explanation: >-
      PSR-17 définit les fabriques de messages PSR-7 ; elle suit donc le même
      sort. Ni l'une ni l'autre n'apparaît dans `provide`.
    memorization_justification: >-
      La seconde PSR du couple s'oublie, et sa présence dans une proposition
      suffit à la rendre fausse.
    verification_status: VERIFIED
