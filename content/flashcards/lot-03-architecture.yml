  - id: FLC-87p1bd8b8xdp
    official_item: OIT-rd9b27fkb72r
    language: fr
    level: APPLICATION
    front: "Un écouteur de `kernel.request` appelle `stopPropagation()`. `kernel.response` a-t-il lieu ?"
    back: "Oui. L'arrêt ne concerne que les écouteurs restants du **même** événement."
    explanation: >-
      La propagation est une notion locale à un événement. Le cycle de la
      requête continue normalement, et tous les autres événements sont
      dispatchés.
    memorization_justification: >-
      Confusion classique entre arrêter un événement et arrêter le traitement ;
      les deux réponses sont plausibles sans la règle.
