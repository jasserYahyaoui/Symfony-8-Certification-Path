  - id: FLC-06jf9jywescz
    official_item: OIT-efzq92vdtayj
    language: fr
    level: TRAP
    front: "Surcharger un contrôleur, est-ce toujours une affaire de route ?"
    back: "Non. S'il est un service, c'est une affaire de **décoration**."
    explanation: >-
      Le document pose la condition avant tout le reste. Répondre « route de
      même chemin » sans se demander si le contrôleur est un service, c'est
      répondre à la branche de repli.
    memorization_justification: >-
      Question dont la réponse dépend d'une condition qu'on oublie de se poser ;
      c'est exactement ce que le piège exploite.
