    front: "Pourquoi le docblock déconseille-t-il de rendre son code conscient de la requête principale ?"
    back: "Parce que cela « might make it un-compatible with other features of your framework like ESI support »."
    explanation: >-
      Une sous-requête existe pour être traitée **comme si** elle était seule :
      c'est ce qui permet à un fragment ESI d'être rendu, mis en cache et servi
      indépendamment. Un service qui consulte `getMainRequest()` fait dépendre
      son résultat d'un contexte que le fragment n'aura pas quand il sera servi
      seul depuis un cache.
    memorization_justification: >-
