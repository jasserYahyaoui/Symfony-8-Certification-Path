  - id: FLC-z56s5mxrnev5
    official_item: OIT-7sewqvmw6468
    language: fr
    level: APPLICATION
    front: "Un écouteur de `kernel.request` pose une réponse. Quels événements ont encore lieu ?"
    back: "`kernel.response`, `kernel.finish_request`, puis `kernel.terminate` après l'envoi. Pas `kernel.controller` ni `kernel.view`."
    explanation: >-
      C'est exactement le fonctionnement d'une redirection de sécurité : le
      contrôleur n'est jamais résolu, mais la réponse traverse tout le reste du
      cycle et peut encore être modifiée.
    memorization_justification: >-
