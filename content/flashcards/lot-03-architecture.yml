    language: fr
    level: UNDERSTANDING
    front: "Que donne `getSubscribedEvents()` comme valeur pour un événement ?"
    back: "Soit un nom de méthode, soit `[méthode, priorité]`, soit une **liste** de tels couples."
    explanation: >-
      La troisième forme permet de s'abonner plusieurs fois au même événement à
      des priorités différentes — c'est exactement ce que fait `ErrorListener`
      sur `kernel.exception`.
    memorization_justification: >-
      La troisième forme est la moins connue et la seule qui explique un
      abonnement double ; elle se teste directement.
