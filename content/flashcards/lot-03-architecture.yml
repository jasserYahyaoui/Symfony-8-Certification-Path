  - id: FLC-cc8avw6cmxss
    official_item: OIT-rd9b27fkb72r
    language: fr
    level: UNDERSTANDING
    front: "Écouteur ou abonné : qu'est-ce qui change réellement ?"
    back: "Qui déclare l'abonnement. Le fonctionnement est identique."
    explanation: >-
      Avec un écouteur, c'est la configuration qui sait à quoi il s'abonne ;
      avec un abonné, c'est la classe, via la méthode statique
      `getSubscribedEvents()`. Déplacer la classe déplace alors l'abonnement.
    memorization_justification: >-
      Distinction de responsabilité, pas de mécanique ; l'erreur classique est
      de croire à une différence de comportement.
    verification_status: VERIFIED
    official_sources:
