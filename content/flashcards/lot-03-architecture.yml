        verified_at: "2026-09-18"

  - id: FLC-k6h61724mm78
    official_item: OIT-7sewqvmw6468
    language: fr
    level: UNDERSTANDING
    front: "Qui crée la `Request` et appelle `handle()` ?"
    back: "Le composant Runtime, via `vendor/autoload_runtime.php` — pas `public/index.php` lui-même."
    explanation: >-
      Le contrôleur frontal se contente de retourner une fonction qui construit
      le `Kernel`. C'est le Runtime qui crée la requête depuis les globales,
      appelle `handle()`, envoie la réponse et déclenche `terminate()`.
    memorization_justification: >-
