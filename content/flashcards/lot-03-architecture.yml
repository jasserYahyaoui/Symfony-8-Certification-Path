  - id: FLC-v4fng9pqsz6m
    official_item: OIT-y0ah7pq9c4hv
    language: fr
    level: APPLICATION
    front: "Faut-il appeler `push()` et `pop()` soi-même sur `RequestStack` ?"
    back: "Non : leur docblock dit que la gestion de la pile « should be taken care of by the application itself » — c'est le noyau qui empile et dépile."
    explanation: >-
      Empiler à la main désaligne la pile du cycle réel : un `pop()` manquant
      laisse une requête morte au sommet, et tous les services qui appellent
      `getCurrentRequest()` la reçoivent. Les deux méthodes existent pour le
      noyau et pour les tests qui simulent une sous-requête, pas pour le code
      applicatif.
    memorization_justification: >-
      Deux méthodes publiques dont le docblock déconseille l'usage direct — ce
      que la visibilité `public` ne laisse pas deviner.
