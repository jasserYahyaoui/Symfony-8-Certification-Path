    front: "Comment fabriquer une requête pour un test, sans serveur web ?"
    back: "`Request::create('/blog')` — la fabrique qui ne lit aucune superglobale."
    explanation: >-
      C'est la contrepartie de `createFromGlobals()`, qui emballe `$_GET`,
      `$_POST` et les autres. `create()` prend la méthode, les paramètres, le
      corps et les en-têtes en arguments, et produit un objet complet. C'est
      précisément ce que le remplacement des superglobales rend possible, et
      c'est ce qui rend la pile HTTP testable.
    memorization_justification: >-
