    language: fr
    level: UNDERSTANDING
    front: "Alias, recette, pack : que fait chacun des trois ?"
    back: "L'**alias** est un nom court que Flex résout. La **recette** est la configuration que le paquet apporte. Le **pack** est un métapaquet sans code, qui ne regroupe que des dépendances."
    explanation: >-
