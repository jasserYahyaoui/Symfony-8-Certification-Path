  - id: FLC-5jt2wnzjjq3p
    official_item: OIT-347k8phdewem
    language: fr
    level: RECALL
    front: "Quelle est l'unique obligation imposée par la licence de Symfony ?"
    back: "Inclure l'avis de copyright **et** le texte de la licence dans toute copie ou « substantial portion » du logiciel."
    explanation: >-
      C'est la seule phrase conditionnelle du document : « The above copyright
      notice and this permission notice shall be included in all copies or
      substantial portions of the Software. » Deux avis, pas un — et un seuil
      qui n'est pas « le logiciel entier ».
    memorization_justification: >-
      Formulation exacte d'une obligation unique, dont on retient souvent une
      moitié — l'avis de copyright — en oubliant le texte de la licence.
    verification_status: VERIFIED
    official_sources:
