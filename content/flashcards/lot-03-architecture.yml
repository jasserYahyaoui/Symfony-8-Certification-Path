  - id: FLC-er7yqf77t3jx
    official_item: OIT-efzq92vdtayj
    language: fr
    level: TRAP
    front: "Faut-il vider le cache après avoir ajouté un gabarit de surcharge, en mode debug ?"
    back: "Parfois oui — le document le signale explicitement, **même en debug**."
    explanation: >-
      Le mode debug recompile les gabarits modifiés, mais l'apparition d'un
      fichier à un **emplacement nouveau** n'est pas toujours détectée.
    memorization_justification: >-
      Contredit la garantie que l'on prête au mode debug, et explique une
      surcharge qui semble sans effet.
