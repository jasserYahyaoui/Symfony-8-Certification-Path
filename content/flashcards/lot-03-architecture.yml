  - id: FLC-b0qfp09pj6zn
    official_item: OIT-d416348gfhde
    language: fr
    level: TRAP
    front: "`replace` dans le `composer.json` du mono-dépôt installe-t-il les 65 paquets ?"
    back: "Non : il déclare que `symfony/symfony` les **remplace**. Rien n'est installé en plus."
    explanation: >-
      Confondre `replace` et `require` fait attendre 65 dépendances là où il n'y
      en a aucune de ce fait. L'effet réel est un effet de résolution : Composer
      sait qu'il ne doit pas installer `symfony/console` à côté de
      `symfony/symfony`, puisque le second le fournit déjà.
    memorization_justification: >-
      Deux clés voisines aux effets opposés ; la confusion se voit rarement,
      parce qu'elle ne casse rien immédiatement.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/symfony/symfony/8.0/composer.json"
        readable_url: "https://github.com/symfony/symfony/blob/8.0/composer.json"
        repository: "symfony/symfony"
        branch: "8.0"
        symbol_or_lines: "clés replace et require"
        verified_at: "2026-09-17"

  - id: FLC-mrsnat360xye
    official_item: OIT-d416348gfhde
    language: fr
    level: TRAP
    front: "Un bridge installé seul dans un projet Symfony enregistre-t-il ses services ?"
    back: "Non : aucun. C'est le **bundle** qui enregistre des services et apporte la configuration."
    explanation: >-
      Le symptôme est déroutant — les classes sont là, l'autowiring ne trouve
      rien — parce qu'on attend d'un paquet installé qu'il « marche ». Le bridge
      fournit du code ; sans bundle, personne ne le déclare au conteneur.
    memorization_justification: >-
      Erreur dont le symptôme ne désigne pas la cause : on cherche une faute de
      configuration là où il manque une couche entière.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Bridge/Twig/composer.json"
        readable_url: "https://github.com/symfony/symfony/blob/8.0/src/Symfony/Bridge/Twig/composer.json"
        repository: "symfony/symfony"
        branch: "8.0"
        symbol_or_lines: "clé description ; absence d'extension de configuration"
        verified_at: "2026-09-17"
