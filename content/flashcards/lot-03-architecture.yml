    official_item: OIT-132nwnh9c6bc
    language: fr
    level: TRAP
    front: "`symfony.lock` fait-il double emploi avec `composer.lock` ?"
    back: "Non : l'un recense les **recettes** appliquées, l'autre les **dépendances** verrouillées. Les deux se committent."
    explanation: >-
      Supprimer `symfony.lock` ne casse aucune dépendance — il n'en contient
      pas — mais fait perdre la trace des recettes appliquées et de leur
      version, donc la capacité de détecter qu'une recette a évolué depuis
      l'installation.
    memorization_justification: >-
