  - id: FLC-sv4mb5ykzn41
    official_item: OIT-132nwnh9c6bc
    language: fr
    level: TRAP
    front: "Flex est-il un bundle Symfony ?"
    back: "Non : un **plugin Composer**. Il n'apparaît pas dans `config/bundles.php` et n'expose aucune commande."
    explanation: >-
      La documentation est explicite : « Technically speaking, Symfony Flex is a
      Composer plugin ». Conséquence pratique : on ne l'active pas, on ne le
      configure pas par un fichier de `config/packages/`, et le chercher parmi
      les bundles est une impasse. Il est installé par défaut à la création
      d'une application.
    memorization_justification: >-
      Tout ce qui porte le nom Symfony est supposé être un bundle ou un
      composant ; celui-ci n'est ni l'un ni l'autre.
    verification_status: VERIFIED
