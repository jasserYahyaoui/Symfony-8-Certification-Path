  - id: FLC-97zy6sabcx93
    official_item: OIT-y0ah7pq9c4hv
    language: fr
    level: RECALL
    front: "Symfony : que rendent `getCurrentRequest()`, `getMainRequest()` et `getParentRequest()` en termes de pile ?"
    back: "Le **dernier** empilé, le **premier**, et l'**avant-dernier** — soit `end($requests)`, `$requests[0]`, et l'index `count - 2`."
    explanation: >-
      Ce sont trois positions dans une même pile, pas trois notions distinctes.
      Les trois rendent `null` sur une pile vide, et `getParentRequest()` rend
      `null` dès que la requête courante **est** la principale : il n'y a alors
      aucun élément avant elle.
    memorization_justification: >-
      Trois noms qui évoquent des rôles alors qu'ils désignent des indices ;
      réduire la question à une position rend la réponse immédiate.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/HttpFoundation/RequestStack.php"
        readable_url: "https://github.com/symfony/symfony/blob/8.0/src/Symfony/Component/HttpFoundation/RequestStack.php"
        repository: "symfony/symfony"
        branch: "8.0"
        symbol_or_lines: "getCurrentRequest l. 67, getMainRequest l. 79, getParentRequest l. 97"
        verified_at: "2026-09-17"

  - id: FLC-m278q8xqqpv8
    official_item: OIT-y0ah7pq9c4hv
    language: fr
    level: RECALL
    front: "Symfony : quel accesseur de `RequestStack` lève une exception plutôt que de rendre `null` ?"
    back: "`getSession()` — une `SessionNotFoundException`. Les trois accesseurs de requête rendent `null`."
    explanation: >-
      Son type de retour est `SessionInterface` sans `?` : il ne **peut** rien
      rendre d'autre. Elle lève dans deux cas — la pile est vide, ou la requête
      courante n'a pas de session. L'asymétrie avec les trois autres accesseurs
      est donc portée par la signature, pas par une convention.
    memorization_justification: >-
      Un accesseur sur quatre a un contrat d'échec opposé aux autres, dans la
      même classe.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/HttpFoundation/RequestStack.php"
        readable_url: "https://github.com/symfony/symfony/blob/8.0/src/Symfony/Component/HttpFoundation/RequestStack.php"
        repository: "symfony/symfony"
        branch: "8.0"
        symbol_or_lines: "getSession lignes 109-116"
        verified_at: "2026-09-17"

  - id: FLC-0jh21k7na6rp
    official_item: OIT-y0ah7pq9c4hv
    language: fr
    level: RECALL
    front: "Quelles superglobales PHP HttpFoundation remplace-t-il, et par quoi ?"
    back: "`$_GET`, `$_POST`, `$_FILES`, `$_COOKIE`, `$_SERVER` — remplacées par des objets `Request` et `Response`."
    explanation: >-
      L'intérêt n'est pas cosmétique : un objet se **fabrique**.
      `Request::create('/blog')` produit une requête complète sans serveur web,
      donc une pile HTTP testable — ce qu'aucune superglobale ne permet. Côté
      réponse, `header()` et `echo` deviennent un objet qu'on peut inspecter
      avant émission.
    memorization_justification: >-
      Liste fermée de cinq superglobales, et la raison — la testabilité — qui
      explique toute l'architecture qui suit.
    verification_status: VERIFIED
    official_sources:
      - url: "https://raw.githubusercontent.com/symfony/symfony-docs/8.0/components/http_foundation.rst"
        readable_url: "https://github.com/symfony/symfony-docs/blob/8.0/components/http_foundation.rst"
        repository: "symfony/symfony-docs"
        branch: "8.0"
        anchor: "the-httpfoundation-component"
        symbol_or_lines: "introduction du composant"
        verified_at: "2026-09-17"

  - id: FLC-er0y5dcb5p86
    official_item: OIT-y0ah7pq9c4hv
    language: fr
    level: UNDERSTANDING
    front: "Pourquoi n'injecte-t-on jamais `Request` dans un service ?"
    back: "Parce qu'un service est construit **une fois** et que la requête change à chaque appel : on injecte `RequestStack`."
    explanation: >-
      Injecter la requête figerait, dans un objet à durée de vie longue, une
      valeur qui n'est vraie que pendant un traitement. `RequestStack` résout
      cela en déplaçant la lecture au moment de l'appel :
      `getCurrentRequest()`. C'est le même raisonnement que pour n'importe quel
      état changeant confié à un conteneur.
    memorization_justification: >-
      Règle d'architecture dont la raison — deux durées de vie différentes — est
      ce qui permet de la retrouver plutôt que de la mémoriser.
    verification_status: VERIFIED
    official_sources:
