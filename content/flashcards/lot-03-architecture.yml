  - id: FLC-396ywyjsv9pb
    official_item: OIT-d416348gfhde
    language: fr
    level: UNDERSTANDING
    front: 'Symfony : quel est le critère qui sépare un bridge d''un bundle ?'
    back: Le bundle apporte la configuration et enregistre des services ; un bridge ne configure rien.
    explanation: 'Le bridge relie un composant à une bibliothèque tierce. Posé seul dans un projet Symfony,
      il n''enregistre aucun service : c''est le bundle qui branche l''ensemble dans le framework.'
    memorization_justification: 'Critère discriminant : c''est lui, et non la liste des paquets, qui
      permet de classer un paquet inconnu le jour de l''examen.'
    verification_status: VERIFIED
    official_sources:
