    back: "Non. Huit sections, chacune avec son mécanisme propre."
    explanation: >-
      Gabarits, routage, contrôleurs, services et configuration, entités,
      formulaires, métadonnées de validation, traductions. Chercher une réponse
      universelle est l'erreur de départ.
    memorization_justification: >-
