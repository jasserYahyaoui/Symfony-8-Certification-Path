- id: FLC-6d7d31nsnpg2
  official_item: OIT-qkcr4bat6dsb
  language: fr
  level: UNDERSTANDING
  front: 'Symfony Process : pourquoi wait() peut-il lever ProcessTimedOutException ?'
  back: Parce qu'il vérifie le délai pendant qu'il attend la fin du processus.
  explanation: 'Exécuté : `sleep 3` avec un délai d''une seconde ; `isRunning()` et `getOutput()` ne lèvent rien, `wait()` lève.'
  memorization_justification: Qui vérifie le délai.
  verification_status: VERIFIED
