- id: FLC-e7drrh9xfx3m
  official_item: OIT-qkcr4bat6dsb
  language: fr
  level: UNDERSTANDING
  front: 'Symfony Process : pourquoi désactiver la sortie interdit-il le délai d''inactivité ?'
  back: 'Parce que ce délai se mesure depuis la dernière sortie produite : sans sortie collectée, il n''a rien à observer.'
  explanation: 'Exécuté : `LogicException` dans les deux ordres d''appel.'
  memorization_justification: Inactivité et sortie.
