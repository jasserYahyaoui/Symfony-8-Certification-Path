- id: FLC-afd7y03jwtv5
  official_item: OIT-qkcr4bat6dsb
  language: fr
  level: UNDERSTANDING
  front: 'Symfony Process : pourquoi le tableau d''arguments est-il la forme recommandée ?'
  back: Parce que chaque argument passe tel quel, sans échappement à écrire ni shell à traverser.
  explanation: 'Exécuté : `[''printf'', ''%s'', ''a b;c $HOME'']` affiche `a b;c $HOME`, littéral.'
  memorization_justification: Pas d'échappement.
