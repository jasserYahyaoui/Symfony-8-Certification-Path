  front: "Une command écrit avec `echo`. Que voit `CommandTester::getDisplay()`, et que fait `-q` ?"
  back: "Rien de cet `echo`, et `-q` ne le fait pas taire : il sort hors de l'`OutputInterface`, donc hors de la verbosity, du formateur et des tests."
  explanation: "Exécuté avec Console 8.0.15 : `getDisplay()` ne contient que ce qui passe par `$output` ; l'`echo` part sur STDOUT, hors de `$output`, même en `VERBOSITY_QUIET`."
  memorization_justification: "`echo` s'affiche à l'écran, donc l'erreur ne se voit qu'en test ou avec `-q`."
