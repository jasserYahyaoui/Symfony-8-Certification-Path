    readable_url: https://github.com/symfony/symfony/blob/8.0/src/Symfony/Component/Console/Application.php
    repository: symfony/symfony
    branch: '8.0'
    symbol_or_lines: run() — exception code as exit code, 1 if not positive, 255 cap; configureIO() — -n, -q, --silent set the input non-interactive
    verified_at: '2026-10-02'
