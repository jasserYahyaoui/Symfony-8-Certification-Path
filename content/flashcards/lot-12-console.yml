  official_item: OIT-481gmkgbksnr
  language: fr
  level: UNDERSTANDING
  front: 'Symfony : pourquoi interact() est-elle appelée sous cron, sans -n ?'
  back: Parce que seule une option (`-n`, `-q`, `--silent`) rend l'entrée non interactive ; l'absence de terminal ne suffit pas.
