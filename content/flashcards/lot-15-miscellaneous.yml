    branch: '8.0'
    symbol_or_lines: Common Deployment Tasks; Install/Update your Vendors; Clear your Symfony Cache; Deployments not Using the composer.json File
    verified_at: '2026-10-02'
- id: FLC-7rwqd0my9v4w
  official_item: OIT-6xqn9ybksrbr
  language: fr
  level: UNDERSTANDING
  front: 'Symfony : pourquoi les migrations précèdent-elles le vidage du cache ?'
  back: Pour que le cache soit reconstruit contre le code, les dépendances et les données déjà à jour.
  explanation: Ordre des quatre étapes de la documentation.
  memorization_justification: Ordre de déploiement.
