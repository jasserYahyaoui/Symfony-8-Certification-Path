  language: fr
  level: TRAP
  front: 'Symfony : getProjectDir() lève-t-il une erreur quand aucun composer.json n''est trouvé ?'
  back: 'Non : il rend silencieusement le répertoire de la classe noyau, par exemple `src/`.'
  explanation: 'Exécuté : `app/src` sans `composer.json`, `app` avec.'
