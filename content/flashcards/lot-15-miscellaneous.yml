  language: fr
  level: RECALL
  front: 'Symfony : quelle command vide le cache de production ?'
  back: '`APP_ENV=prod APP_DEBUG=0 php bin/console cache:clear`.'
  explanation: 'Le cache dépend de l''environment : les variables sont posées sur la command.'
  memorization_justification: Command exacte.
