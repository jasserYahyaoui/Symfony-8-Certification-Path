- id: FLC-p90betbvqv1q
  official_item: OIT-6xqn9ybksrbr
  language: fr
  level: UNDERSTANDING
  front: 'Symfony : pourquoi un dump() oublié ne devient-il pas fatal avec --no-dev ?'
  back: 'Parce que VarDumper est exigé par ErrorHandler, lui-même exigé par FrameworkBundle : il reste installé.'
  explanation: Lu dans les `composer.json` 8.0 ; exécuté sur la page *Code debugging*.
  memorization_justification: Dépendance transitive.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/ErrorHandler/composer.json
    readable_url: https://github.com/symfony/symfony/blob/8.0/src/Symfony/Component/ErrorHandler/composer.json
    repository: symfony/symfony
    branch: '8.0'
    symbol_or_lines: '"symfony/var-dumper": "^7.4|^8.0" under require'
    verified_at: '2026-10-02'
- id: FLC-ahm99nz50t4k
  official_item: OIT-6xqn9ybksrbr
  language: fr
  level: UNDERSTANDING
  front: 'Symfony : pourquoi exporter APP_ENV=prod quand composer install échoue sur « class not found » ?'
  back: Pour que les scripts `post-install-cmd` s'exécutent en `prod`, sans les classes de développement absentes.
  explanation: Avertissement de `deployment.rst`, branche 8.0.
  memorization_justification: Environnement des scripts Composer.
  verification_status: VERIFIED
  official_sources:
