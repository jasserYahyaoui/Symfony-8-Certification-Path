- id: FLC-sqzp7jq9h3ws
  official_item: OIT-d1qsxrtv25kk
  language: fr
  level: UNDERSTANDING
  front: 'Symfony : pourquoi un profil vieux de trois jours peut-il encore exister ?'
  back: Parce que la purge n'a lieu qu'une fois sur dix, à l'écriture d'un nouveau profil.
  explanation: 'Lu dans `FileProfilerStorage` (8.0) : `random_int(1, 10)`, seuil `2 * 86400`.'
  memorization_justification: Purge probabiliste.
  verification_status: VERIFIED
  official_sources:
