- id: FLC-f1nsnkc89qad
  official_item: OIT-d1qsxrtv25kk
  language: fr
  level: TRAP
  front: Un collector garde une Closure dans $this->data. Quel appel lève ?
  back: 'saveProfile() : « Serialization of ''Closure'' is not allowed ». collect() passe sans erreur.'
  explanation: Le profil range un clone de chaque collector, puis saveProfile() appelle lateCollect() et sérialise.
    ProfilerListener appelle saveProfile() sur kernel.terminate. Exécuté avec HttpKernel 8.0.15.
  memorization_justification: L'erreur survient loin de la ligne fautive, après l'envoi de la Response.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/HttpKernel/Profiler/Profiler.php
    readable_url: https://github.com/symfony/symfony/blob/8.0/src/Symfony/Component/HttpKernel/Profiler/Profiler.php
    repository: symfony/symfony
    symbol_or_lines: collect() — addCollector(clone $collector) ; saveProfile() — lateCollect() puis write()
    branch: '8.0'
    verified_at: '2026-10-16'
