- id: FLC-10nnxc9a65c4
  official_item: OIT-6xqn9ybksrbr
  language: fr
  level: APPLICATION
  front: 'Symfony : déployer sans composer.json sur le serveur.'
  back: Redéfinir `Kernel::getProjectDir()` pour rendre la racine du projet.
  explanation: Sans cela, le répertoire du noyau est rendu.
  memorization_justification: Racine du projet.
  verification_status: VERIFIED
