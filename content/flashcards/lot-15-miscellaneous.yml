schema_version: 2

flashcards:
- id: FLC-k4xbtfdew9m4
  official_item: OIT-6xqn9ybksrbr
  language: fr
  level: RECALL
  front: Que font --no-dev et --optimize-autoloader dans composer install ?
  back: --no-dev n'installe pas les paquets de développement ; --optimize-autoloader construit une class map qui
    accélère nettement l'autochargeur.
  explanation: 'Deux besoins distincts : ne pas embarquer le superflu, et charger plus vite. L''un n''implique pas
    l''autre.'
  memorization_justification: Les deux drapeaux voyagent ensemble dans la commande, ce qui fait croire à un seul
    effet.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/deployment.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/deployment.rst
    symbol_or_lines: '"composer install --no-dev --optimize-autoloader"; and "The --optimize-autoloader flag improves Composer''s autoloader performance significantly by building a class map. The --no-dev flag ensures that development packages are not installed"'
    branch: '8.0'
    verified_at: '2026-09-02'
- id: FLC-q9dj4gjhz31d
  official_item: OIT-d1qsxrtv25kk
  language: fr
  front: Une réponse JSON n'affiche aucune barre de débogage. Comment atteindre son profil ?
  back: Par l'en-tête X-Debug-Token-Link, qui porte l'URL du profil — ou X-Debug-Token puis /_profiler. La barre
    n'est injectée que dans les réponses HTML.
  explanation: Le profileur a bien collecté ; c'est seulement l'affichage qui manque.
  memorization_justification: L'absence de barre se lit comme une absence de profil, alors que les deux sont indépendants.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/profiler.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/profiler.rst
    symbol_or_lines: '"in the X-Debug-Token-Link HTTP response header. Browse the /_profiler ..."; and "this token is available in the X-Debug-Token HTTP header of the response"'
    branch: '8.0'
    verified_at: '2026-09-02'
- id: FLC-yqtabrwsk33e
  official_item: OIT-6xqn9ybksrbr
  language: fr
  level: RECALL
  front: 'Symfony : quelle commande vide le cache de production ?'
  back: '`APP_ENV=prod APP_DEBUG=0 php bin/console cache:clear`.'
  explanation: 'Le cache dépend de l''environnement : les variables sont posées sur la commande.'
  memorization_justification: Commande exacte.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/deployment.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/deployment.rst
    repository: symfony/symfony-docs
    branch: '8.0'
    symbol_or_lines: Common Deployment Tasks; Install/Update your Vendors; Clear your Symfony Cache; Deployments not Using the composer.json File
    verified_at: '2026-10-02'
- id: FLC-f8t6bzv4twhh
  official_item: OIT-6xqn9ybksrbr
  language: fr
  level: RECALL
  front: 'Symfony : que génère composer dump-env prod --empty ?'
  back: Un `.env.local.php` de même structure, sans valeurs, pour ne dépendre que des vraies variables d'environnement.
  explanation: '*How to Deploy a Symfony Application*, branche 8.0.'
  memorization_justification: Option --empty.
  verification_status: VERIFIED
  official_sources:
