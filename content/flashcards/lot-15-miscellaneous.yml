  official_item: OIT-d1qsxrtv25kk
  language: fr
  level: RECALL
  front: AbstractDataCollector — quel nom getName() rend-il par défaut, et que rend getTemplate() ?
  back: Le FQCN de la class du collector ; getTemplate() rend null.
  explanation: C'est sous ce nom que $profile->getCollector() le retrouve. La documentation conseille de redéfinir
    getName() avec un nom court. Tagué à la main, le data_collector porte un id égal à getName(). Exécuté avec
    FrameworkBundle 8.0.15.
  memorization_justification: Aucun nom court n'est déduit de la class ; on attend souvent un snake_case qui n'existe pas.
  verification_status: VERIFIED
