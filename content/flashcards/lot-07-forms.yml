    verified_at: '2026-09-24'
- id: FLC-ay1md2g1h5ax
  official_item: OIT-tsxxgp3ppj1n
  language: fr
  level: UNDERSTANDING
  front: 'Symfony Forms : quelle méthode des transformateurs la soumission appelle-t-elle, et dans quel ordre ?'
  back: '`reverseTransform()` : d''abord les transformateurs de vue, qui donnent la donnée normalisée, puis ceux de modèle, qui donnent la donnée du modèle.'
  explanation: 'Au rendu, `transform()` est appelé dans l''ordre inverse : modèle puis vue.'
  memorization_justification: Relie le sens du flux au nom de la méthode.
  verification_status: VERIFIED
  official_sources:
