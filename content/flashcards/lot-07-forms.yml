- id: FLC-e6rmxrw6vdbt
  official_item: OIT-p810t98zedem
  language: fr
  level: TRAP
  front: 'Symfony Forms : `CountryType`, `LanguageType`, `LocaleType`, `CurrencyType` et `TimezoneType`
    sont-ils des types indépendants ?'
  back: Non — ce sont le même type socle, `ChoiceType`, avec une liste pré-remplie.
  explanation: "Les options du socle valent donc pour eux tous. Les boutons, eux, s'ajoutent comme des fields mais ne descendent pas de `FormType` : `ButtonType` n'a pas de parent."
  memorization_justification: Factorisation invisible depuis le catalogue, où les cinq apparaissent
    comme des entrées séparées.
  verification_status: VERIFIED
  official_sources:
