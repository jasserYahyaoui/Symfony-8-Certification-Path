- id: FLC-f8xn62mg6njd
  official_item: OIT-tsxxgp3ppj1n
  language: fr
  level: RECALL
  front: 'Symfony Forms : dans quel ordre les couches sont-elles parcourues au rendu, puis à la soumission ?'
  back: 'Rendu : modèle → normalisée → vue. Soumission : vue → normalisée → modèle.'
  explanation: Les mêmes transformateurs servent dans les deux sens ; à la soumission, c'est leur méthode inverse qui est appelée.
  memorization_justification: Le sens du flux est une question classique.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/forms.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/forms.rst
    repository: symfony/symfony-docs
    branch: '8.0'
    symbol_or_lines: The Data Transformation Lifecycle, Accessing Form Data
    verified_at: '2026-09-24'
- id: FLC-ay1md2g1h5ax
  official_item: OIT-tsxxgp3ppj1n
  language: fr
  level: UNDERSTANDING
  front: 'Symfony Forms : quelle méthode des transformateurs la soumission appelle-t-elle, et dans quel ordre ?'
  back: '`reverseTransform()` : d''abord les transformateurs de vue, qui donnent la donnée normalisée, puis ceux de modèle, qui donnent la donnée du modèle.'
  explanation: 'Au rendu, `transform()` est appelé dans l''ordre inverse : modèle puis vue.'
  memorization_justification: Relie le sens du flux au nom de la méthode.
  verification_status: VERIFIED
  official_sources:
