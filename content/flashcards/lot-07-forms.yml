  level: APPLICATION
  front: 'Symfony Forms : un champ date se soumet mal. Quelles méthodes comparer pour savoir à quelle couche la conversion échoue ?'
  back: '`getViewData()` puis `getNormData()` : la première montre ce qui est arrivé du navigateur, la seconde ce qu''en a fait le transformateur de vue.'
  explanation: La documentation présente `getNormData()` comme utile pour déboguer les transformateurs.
  memorization_justification: Usage de diagnostic, rarement pratiqué.
