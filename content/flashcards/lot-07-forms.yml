  level: TRAP
  front: 'Symfony Forms : dans la vue d''un DateType en trois listes, les valeurs year, month et day sont-elles des entiers ?'
  back: 'Non : ce sont des chaînes, `''2026''`, `''10''`, `''18''`.'
  explanation: '`DateTimeToArrayTransformer::transform()` produit des chaînes ; la couche vue est textuelle parce qu''un navigateur n''envoie que du texte.'
  memorization_justification: Le type des valeurs de vue est souvent mal retenu.
