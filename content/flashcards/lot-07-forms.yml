- id: FLC-qxgkz5wy6bya
  official_item: OIT-tsxxgp3ppj1n
  language: fr
  level: TRAP
  front: 'Symfony : le composant Form est-il une fonctionnalité de FrameworkBundle ?'
  back: 'Non : c''est un composant autonome, utilisable hors du framework.'
  explanation: FrameworkBundle l'intègre et le configure ; il ne le définit pas.
  memorization_justification: Confusion fréquente entre composant et intégration.
