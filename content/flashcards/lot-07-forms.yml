- id: FLC-6kz6nw4196kj
  official_item: OIT-tsxxgp3ppj1n
  language: fr
  level: UNDERSTANDING
  front: 'Symfony Forms : pourquoi la donnée normalisée d''un DateType est-elle un DateTime quel que soit l''input ?'
  back: 'Parce que c''est le format pivot : les transformateurs de modèle ramènent string, timestamp, array, DateTimeImmutable ou DatePoint vers un DateTime, et la vue part de lui.'
  explanation: 'C''est la raison d''être de la couche normalisée : rendre le type indépendant du format de donnée que l''application choisit.'
  memorization_justification: Explique à quoi sert la couche intermédiaire.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Form/Extension/Core/Type/DateType.php
    readable_url: https://github.com/symfony/symfony/blob/8.0/src/Symfony/Component/Form/Extension/Core/Type/DateType.php
    repository: symfony/symfony
    branch: '8.0'
    symbol_or_lines: DateType::buildForm()
    verified_at: '2026-09-24'
- id: FLC-cdcsn1340q2n
  official_item: OIT-tsxxgp3ppj1n
  language: fr
  level: RECALL
  front: 'Symfony Forms : quels transformateurs relient quelles couches ?'
  back: Les transformateurs de modèle relient modèle et normalisée ; les transformateurs de vue relient normalisée et vue.
  explanation: Au rendu, on applique les transformations dans l'ordre modèle, puis vue ; à la soumission, les inverses dans l'ordre vue, puis modèle.
  memorization_justification: Vocabulaire indispensable pour l'item Data transformers.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/forms.rst
