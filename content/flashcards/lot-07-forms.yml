- id: FLC-k5cmghfvqk7h
  official_item: OIT-j6tqs8s8f54f
  language: fr
  level: TRAP
  front: 'Symfony Forms : un champ de fichier doit-il être mappé à la propriété de l''entité ?'
  back: 'Non, presque jamais : l''entité stocke un nom de fichier, pas un fichier.'
  explanation: Laisser le champ mappé fait écrire un objet dans une propriété qui attend une chaîne.
    Un champ non mappé se lit sur le formulaire et vaut `null` quand rien n'a été envoyé.
  memorization_justification: Exception à la règle générale du mapping, et source d'une erreur de
    type difficile à lire.
  verification_status: VERIFIED
  official_sources:
