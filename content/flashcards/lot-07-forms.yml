- id: FLC-g5safm0wr403
  official_item: OIT-tsxxgp3ppj1n
  language: fr
  level: RECALL
  front: 'Symfony Forms : quelle méthode rend chaque couche de données d''un formulaire ?'
  back: '`getData()` pour le modèle, `getNormData()` pour la couche normalisée, `getViewData()` pour la vue.'
  explanation: La documentation présente `getNormData()` comme utile pour déboguer les transformateurs ; `getData()` est la méthode d'usage courant.
  memorization_justification: Trois méthodes pour trois couches, souvent confondues.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/forms.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/forms.rst
