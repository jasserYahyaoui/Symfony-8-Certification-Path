#
# Seize cartes pour treize items. Les sept items sans carte avant PED-010
# n'étaient couverts par AUCUNE justification écrite, contrairement aux lots 01
# à 06 : c'était une lacune, pas une décision. PED-010 les comble.
# La carte CSRF ne porte pas sur `form_end()`, déjà couvert par la carte
