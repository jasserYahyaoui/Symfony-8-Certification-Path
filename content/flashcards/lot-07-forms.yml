  front: 'Symfony Forms : après une soumission valide, faut-il recopier getData() dans l''objet passé à createForm() ?'
  back: 'Non : c''est le même objet, déjà mis à jour par le formulaire.'
  explanation: 'La documentation le précise : la variable d''origine a aussi été modifiée, et peut être persistée telle quelle.'
