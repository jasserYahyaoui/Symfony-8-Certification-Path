# Lot 07 — Forms flashcards (Master Plan §6).
#
# Seize cartes pour treize items. Les sept items sans carte avant PED-010
# n'étaient couverts par AUCUNE justification écrite, contrairement aux lots 01
# à 06 : c'était une lacune, pas une décision. PED-010 les comble.
# La carte CSRF ne porte pas sur `form_end()`, déjà couvert par la carte
# « Forms rendering with Twig » : elle porte sur la nature du refus.

schema_version: 2
flashcards:
- id: FLC-jsbfc1cnv01y
  official_item: OIT-mgvdw7cfpwyz
  language: fr
  level: RECALL
  front: 'Forms : que fait le second argument de submit(), et que vaut-il par défaut ?'
  back: 'C''est $clearMissing, vrai par défaut : les fields absents sont mis à null. À false — cas d''un
    PATCH — ils restent intacts.'
  explanation: Avec $clearMissing à false, la validation ne s'applique qu'aux fields soumis. Pour valider
    un field absent, il faut l'ajouter explicitement à la donnée soumise avec la valeur null.
  memorization_justification: Un bool positionnel dont la default value détruit silencieusement
    des données sur une Request partielle, et dont l'effet de bord sur la validation n'est pas devinable.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/forms.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/forms.rst
    branch: '8.0'
    symbol_or_lines: section Using the submit() Method, clearMissing
    verified_at: '2026-09-01'
- id: FLC-e83vsz7hvkpp
  official_item: OIT-v7zyhcm44m88
  language: fr
  level: TRAP
  front: 'Forms : à partir de quel event la structure du form est-elle verrouillée ?'
  back: "À partir de SUBMIT, selon la documentation : un field ajouté là n'est jamais soumis. Le code ne lève `AlreadySubmittedException` qu'à POST_SUBMIT."
  explanation: "Exécuté avec symfony/form 8.0.15 : à SUBMIT, `add()` réussit sans erreur, mais le field garde sa donnée initiale. Les ajouts se font sur PRE_SET_DATA ou POST_SET_DATA, d'après la donnée initiale, ou sur PRE_SUBMIT, d'après la donnée brute soumise."
  memorization_justification: "Cinq events dont trois seulement autorisent une modification de structure ; se tromper produit un field ignoré sans erreur explicite."
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/form/events.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/form/events.rst
    branch: '8.0'
    symbol_or_lines: form event order and constraints
    verified_at: '2026-09-01'
- id: FLC-7904k5rak62c
  official_item: OIT-v7zyhcm44m88
  language: fr
  level: RECALL
  front: 'Forms : sur quel event la validation s''exécute-t-elle ?'
  back: POST_SUBMIT, par un listener.
  explanation: "C'est pour cela qu'un object peuplé et validé est disponible une fois la submission terminée, et que la validation ne peut pas être observée plus tôt dans le cycle."
  memorization_justification: On suppose spontanément que la validation précède la submission ; l'ordre
    réel explique ce qui est disponible et quand.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/form/events.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/form/events.rst
    branch: '8.0'
    symbol_or_lines: form event order and constraints
    verified_at: '2026-09-01'
- id: FLC-gg8d18g1cqqv
  official_item: OIT-v7zyhcm44m88
  language: fr
  level: UNDERSTANDING
  front: 'Forms : PRE_SUBMIT reçoit quelle forme de donnée ?'
  back: "La donnée brute de la Request, non transformée : strings et arrays, plus les objects `UploadedFile` d'un field de file."
  explanation: 'PRE_SET_DATA reçoit au contraire la model data, qui vient de l''object. La question
    qui tranche : réagit-on à la donnée initiale ou à la donnée soumise ?'
  memorization_justification: Deux events aux noms voisins portant des couches de données opposées
    ; le code compile dans les deux cas.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/form/events.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/form/events.rst
    branch: '8.0'
    symbol_or_lines: form event order and constraints
    verified_at: '2026-09-01'
- id: FLC-tta4ns1abpfy
  official_item: OIT-58r9dadx916v
  language: fr
  level: RECALL
  front: 'DataTransformer : que fait reverseTransform() ?'
  back: Elle convertit la donnée soumise vers le modèle. transform() fait le trajet modèle vers vue, au
    rendu.
  explanation: Les noms se lisent depuis le modèle. Une valeur non convertible doit lever TransformationFailedException,
    que le form traduit en erreur de validation.
  memorization_justification: Le préfixe reverse invite à lire l'inverse de ce qu'on veut ; l'erreur produit
    un form qui affiche mais ne soumet pas.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/form/data_transformers.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/form/data_transformers.rst
    branch: '8.0'
    symbol_or_lines: transform and reverseTransform
    verified_at: '2026-09-01'
- id: FLC-8yczcp0s4a1c
  official_item: OIT-j2vjdxcer4ft
  language: fr
  level: RECALL
  front: 'Themes de form : dans quel ordre les blocks sont-ils cherchés ?'
  back: "Du plus spécifique au plus général : le block unique _formulaire_champ_partie, puis celui du type, puis ceux des types parents, jusqu'à form_partie."
  explanation: Le block le plus spécifique commence par un souligné et porte le nom du form puis
    celui du field. C'est cette chaîne de repli qui permet de personnaliser à n'importe quel niveau.
  memorization_justification: Chaîne de repli à trois niveaux dont la syntaxe du block le plus spécifique
    — souligné initial, nom du form, nom du field — ne s'invente pas.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/form/form_themes.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/form/form_themes.rst
    branch: '8.0'
    symbol_or_lines: block lookup chain and form_themes order
    verified_at: '2026-09-01'
- id: FLC-5g65x0xtgdn7
  official_item: OIT-j2vjdxcer4ft
  language: fr
  level: TRAP
  front: 'twig.form_themes : dans quel ordre la liste est-elle consultée ?'
  back: De la fin vers le début. Le dernier theme listé est consulté en premier, le premier sert de dernier
    recours.
  explanation: L'ordre naturel de lecture d'une liste YAML suggère l'inverse, et une surcharge placée
    en première ligne n'a alors aucun effet visible.
  memorization_justification: 'Ordre inverse de l''intuition, sans erreur à la key : le theme est simplement
    ignoré.'
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/form/form_themes.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/form/form_themes.rst
    branch: '8.0'
    symbol_or_lines: block lookup chain and form_themes order
    verified_at: '2026-09-01'
- id: FLC-yvey5gkx1zhd
  official_item: OIT-gxew257vwhm8
  language: fr
  level: RECALL
  front: 'Forms : que rend form_end() en plus du tag fermant ?'
  back: Tous les fields non encore rendus, dont le token CSRF.
  explanation: 'Passer render_rest à false supprime ce filet, et fait disparaître le token : le form
    devient alors invalide à la submission.'
  memorization_justification: Comportement implicite dont la suppression casse la protection CSRF sans
    message explicite.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/forms.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/forms.rst
    branch: '8.0'
    symbol_or_lines: section Rendering Forms, form_end
    verified_at: '2026-09-01'
- id: FLC-rpr50wc4n7f6
  official_item: OIT-rj9web4whgmz
  language: fr
  level: RECALL
  front: 'OptionsResolver : quelle différence entre setDefined() et setDefaults() ?'
  back: setDefined déclare qu'une option est acceptée, sans valeur ; setDefaults lui donne une valeur
    par défaut.
  explanation: 'Une option ni définie ni pourvue d''un défaut provoque une exception : c''est précisément
    l''intérêt du component.'
  memorization_justification: Deux methods aux noms proches dont l'une seule fournit une valeur ; la
    confusion produit une option absente de l'array résolu.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/components/options_resolver.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/components/options_resolver.rst
    branch: '8.0'
    symbol_or_lines: setDefined vs setDefaults
    verified_at: '2026-09-01'
- id: FLC-jd951drcz26t
  official_item: OIT-tsxxgp3ppj1n
  language: fr
  level: RECALL
  front: 'Symfony Forms : combien de couches de données un form manipule-t-il, et lesquelles
    ?'
  back: 'Trois : modèle, normalisée, vue.'
  explanation: La couche normalisée est identique au modèle pour la plupart des types, ce qui la rend
    facile à oublier — jusqu'à ce qu'un transformer doive s'attacher au bon niveau. La couche vue
    est faite de strings.
  memorization_justification: Comptage exact d'une structure qu'on croit binaire, et qui décide où
    brancher un transformer.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/forms.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/forms.rst
    branch: '8.0'
    symbol_or_lines: The Data Transformation Lifecycle
    verified_at: '2026-09-11'
- id: FLC-18xdehm33xa9
  official_item: OIT-fhpttc4c5x0k
  language: fr
  level: TRAP
  front: 'Symfony Forms : un field peut-il fonctionner sans property publique du même nom ?'
  back: "Oui — l'accès essaie d'abord les accessors `get`, `is`, `has`, `can`, puis une method du nom de la property, et seulement ensuite la property publique."
  explanation: "Un getter l'emporte donc sur une property publique du même nom. Une property privée sans accessor, elle, fait échouer la lecture (`NoSuchPropertyException`) ; un field sans property correspondante doit être déclaré `mapped: false`."
  memorization_justification: 'Chaîne de résolution invisible : on suppose un accès direct à la property.'
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/forms.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/forms.rst
    branch: '8.0'
    symbol_or_lines: Building Forms and Mapping Fields to Object Properties
    verified_at: '2026-09-11'
- id: FLC-cafrwa53g55w
  official_item: OIT-5xvjqa4203xe
  language: fr
  level: TRAP
  front: 'Symfony Forms : quel est le parent d''un form type qui n''en déclare aucun ?'
  back: '`FormType`, la racine de tous les types — pas « aucun parent ».'
  explanation: Hériter est la règle, pas l'exception. C'est aussi pourquoi un form est un type
    comme un autre et s'imbrique en l'ajoutant comme un field.
  memorization_justification: Défaut implicite non écrit dans le code du type, et qui explique le
    comportement des extensions.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/form/create_custom_field_type.rst
