- id: FLC-be3pranpsvn1
  official_item: OIT-gcs0jathkv9b
  language: fr
  level: RECALL
  front: 'Symfony : pour ajouter une option à un form type fourni par Symfony, écrit-on un
    nouveau type ou une extension ?'
  back: 'Une type extension : un type crée un field, une extension modifie ceux qui existent.'
  explanation: "La method qui désigne les types étendus est statique et retourne un itérable. Étendre le type racine touche tous les fields de l'application, puisque tous en héritent — mais pas les boutons, dont le type n'a pas de parent."
  memorization_justification: Distinction que l'examen pose directement, et où écrire un nouveau type
    est l'erreur naturelle.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/form/create_form_type_extension.rst
