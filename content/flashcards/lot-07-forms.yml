- id: FLC-f8xn62mg6njd
  official_item: OIT-tsxxgp3ppj1n
  language: fr
  level: RECALL
  front: 'Symfony Forms : dans quel ordre les couches sont-elles parcourues au rendu, puis à la submission ?'
  back: 'Rendu : modèle → normalisée → vue. Submission : vue → normalisée → modèle.'
  explanation: Les mêmes transformers servent dans les deux sens ; à la submission, c'est leur method inverse qui est appelée.
  memorization_justification: Le sens du flux est une question classique.
  verification_status: VERIFIED
  official_sources:
