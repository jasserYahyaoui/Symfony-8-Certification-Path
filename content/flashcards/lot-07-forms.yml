    verified_at: '2026-09-24'
- id: FLC-qqbsdx04cqqr
  official_item: OIT-tsxxgp3ppj1n
  language: fr
  level: APPLICATION
  front: 'Symfony Forms : un DateType a input: ''string'' et reçoit ''2026-10-18''. Que contiennent les trois couches ?'
  back: 'Modèle : la string `''2026-10-18''` ; normalisée : un `DateTime` ; vue : `[''year'' => ''2026'', ''month'' => ''10'', ''day'' => ''18'']`.'
  explanation: Le model transformer inversé `DateTimeToStringTransformer` convertit la string ; `DateTimeToArrayTransformer` produit la vue. Résultat observé par exécution.
  memorization_justification: Mise en œuvre concrète des trois couches.
