- id: FLC-g5safm0wr403
  official_item: OIT-tsxxgp3ppj1n
  language: fr
  level: RECALL
  front: 'Symfony Forms : quelle method rend chaque couche de données d''un form ?'
  back: '`getData()` pour le modèle, `getNormData()` pour la couche normalisée, `getViewData()` pour la vue.'
  explanation: La documentation présente `getNormData()` comme utile pour déboguer les transformers ; `getData()` est la method d'usage courant.
  memorization_justification: Trois methods pour trois couches, souvent confondues.
  verification_status: VERIFIED
  official_sources:
