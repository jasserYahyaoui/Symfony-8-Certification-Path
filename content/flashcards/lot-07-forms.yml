- id: FLC-v0nf94j0re4x
  official_item: OIT-mgvdw7cfpwyz
  language: fr
  level: APPLICATION
  front: 'Symfony Forms : un formulaire désactivé (disabled) est soumis. Que rend isValid() ?'
  back: '`true` : un formulaire soumis et désactivé est valide sans examen de ses erreurs.'
  explanation: '`Form::isValid()` teste d''abord la soumission, puis `isDisabled()`, et seulement ensuite compte les erreurs.'
  memorization_justification: Cas limite lu dans le code.
  verification_status: VERIFIED
