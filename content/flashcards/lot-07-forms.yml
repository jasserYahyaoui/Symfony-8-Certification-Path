- id: FLC-ay1md2g1h5ax
  official_item: OIT-tsxxgp3ppj1n
  language: fr
  level: UNDERSTANDING
  front: 'Symfony Forms : quelle method des transformers la submission appelle-t-elle, et dans quel ordre ?'
  back: '`reverseTransform()` : d''abord les view transformers, qui donnent la norm data, puis ceux de modèle, qui donnent la model data.'
  explanation: 'Au rendu, `transform()` est appelé dans l''ordre inverse : modèle puis vue.'
  memorization_justification: Relie le sens du flux au nom de la method.
  verification_status: VERIFIED
  official_sources:
