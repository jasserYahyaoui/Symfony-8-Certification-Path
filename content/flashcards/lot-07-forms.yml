- id: FLC-cdcsn1340q2n
  official_item: OIT-tsxxgp3ppj1n
  language: fr
  level: RECALL
  front: 'Symfony Forms : quels transformers relient quelles couches ?'
  back: Les model transformers relient modèle et normalisée ; les view transformers relient normalisée et vue.
  explanation: Au rendu, on applique les transformations dans l'ordre modèle, puis vue ; à la submission, les inverses dans l'ordre vue, puis modèle.
  memorization_justification: Vocabulaire indispensable pour l'item Data transformers.
  verification_status: VERIFIED
  official_sources:
