    symbol_or_lines: CSRF protection in Symfony forms
    verified_at: '2026-09-11'
- id: FLC-k5cmghfvqk7h
  official_item: OIT-j6tqs8s8f54f
  language: fr
  level: TRAP
  front: 'Symfony Forms : un field de file doit-il être mappé à la property de l''entité ?'
  back: 'Non, presque jamais : l''entité stocke un nom de file, pas un file.'
  explanation: Laisser le field mappé fait écrire un object dans une property qui attend une string.
    Un field non mappé se lit sur le form et vaut `null` quand rien n'a été envoyé.
  memorization_justification: Exception à la règle générale du mapping, et source d'une erreur de
    type difficile à lire.
  verification_status: VERIFIED
