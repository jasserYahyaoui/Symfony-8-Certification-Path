  language: fr
  level: RECALL
  front: 'Symfony Forms : quel événement reçoit la donnée normalisée à la soumission ?'
  back: '`FormEvents::SUBMIT`. `PRE_SUBMIT` reçoit les valeurs brutes, `POST_SUBMIT` la donnée entièrement transformée.'
  explanation: Chaque événement de soumission se place à un niveau précis de la chaîne de transformation.
  memorization_justification: Relie les couches aux événements.
