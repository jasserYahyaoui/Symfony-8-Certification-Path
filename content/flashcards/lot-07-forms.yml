    symbol_or_lines: creating a custom form field type
    verified_at: '2026-09-11'
- id: FLC-4476zezkxadx
  official_item: OIT-dmkbj2x94rks
  language: fr
  level: TRAP
  front: 'Symfony : un form soumis sans token CSRF valide est-il invalide, ou valide avec une
    erreur en plus ?'
  back: 'Invalide. Aucun code applicatif ne teste quoi que ce soit : c''est le component qui refuse.'
  explanation: 'Un identifier de token distinct par form est par ailleurs préférable : avec
    un identifier partagé, un token obtenu sur un form vaut pour les autres.'
  memorization_justification: 'Nature du refus souvent mal située : on croit à une constraint de validation
    applicative.'
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/security/csrf.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/security/csrf.rst
