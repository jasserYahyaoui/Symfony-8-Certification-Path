  language: fr
  level: UNDERSTANDING
  front: 'Symfony Forms : pourquoi un bloc du thème par défaut peut-il l''emporter sur un bloc d''un thème personnalisé ?'
  back: 'Parce que la recherche essaie tous les thèmes à un niveau de spécificité avant de descendre au suivant : un bloc plus spécifique, où qu''il soit, gagne.'
  explanation: L'ordre des thèmes ne départage que des blocs de même nom.
