# Lot 07 — Forms flashcards (Master Plan §6).
#
# Seize cartes pour treize items. Les sept items sans carte avant PED-010
# n'étaient couverts par AUCUNE justification écrite, contrairement aux lots 01
# à 06 : c'était une lacune, pas une décision. PED-010 les comble.
# La carte CSRF ne porte pas sur `form_end()`, déjà couvert par la carte
# « Forms rendering with Twig » : elle porte sur la nature du refus.

schema_version: 1
flashcards:
- id: FLC-jsbfc1cnv01y
  official_item: OIT-mgvdw7cfpwyz
  language: fr
  front: 'Formulaires : que fait le second argument de submit(), et que vaut-il par défaut ?'
  back: 'C''est $clearMissing, vrai par défaut : les champs absents sont mis à null. À false — cas d''un
    PATCH — ils restent intacts.'
  explanation: Avec $clearMissing à false, la validation ne s'applique qu'aux champs soumis. Pour valider
    un champ absent, il faut l'ajouter explicitement à la donnée soumise avec la valeur null.
  memorization_justification: Un booléen positionnel dont la valeur par défaut détruit silencieusement
    des données sur une requête partielle, et dont l'effet de bord sur la validation n'est pas devinable.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/forms.rst
    branch: '8.0'
    symbol_or_lines: section Using the submit() Method, clearMissing
    verified_at: '2026-09-01'
- id: FLC-e83vsz7hvkpp
  official_item: OIT-v7zyhcm44m88
  language: fr
  front: 'Formulaires : à partir de quel événement la structure du formulaire est-elle verrouillée ?'
  back: À partir de SUBMIT. On ne peut plus ajouter ni retirer de champ dès cet événement.
  explanation: Les ajouts de champs se font donc sur PRE_SET_DATA, d'après la donnée initiale, ou sur
    PRE_SUBMIT, d'après la donnée brute soumise.
  memorization_justification: Cinq événements dont deux seulement autorisent une modification de structure
    ; se tromper produit un champ absent sans erreur explicite.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/form/events.rst
    branch: '8.0'
    symbol_or_lines: form event order and constraints
    verified_at: '2026-09-01'
- id: FLC-7904k5rak62c
  official_item: OIT-v7zyhcm44m88
  language: fr
  front: 'Formulaires : sur quel événement la validation s''exécute-t-elle ?'
  back: POST_SUBMIT, par un écouteur.
  explanation: C'est pour cela qu'un objet peuple et valide est disponible une fois la soumission terminée,
    et que la validation ne peut pas être observée plus tôt dans le cycle.
  memorization_justification: On suppose spontanément que la validation précède la soumission ; l'ordre
    réel explique ce qui est disponible et quand.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/form/events.rst
    branch: '8.0'
    symbol_or_lines: form event order and constraints
    verified_at: '2026-09-01'
- id: FLC-gg8d18g1cqqv
  official_item: OIT-v7zyhcm44m88
  language: fr
  front: 'Formulaires : PRE_SUBMIT reçoit quelle forme de donnée ?'
  back: 'La donnée brute de la requête : des chaînes et des tableaux, non transformées.'
  explanation: 'PRE_SET_DATA reçoit au contraire la donnée du modèle, qui vient de l''objet. La question
    qui tranche : réagit-on à la donnée initiale ou à la donnée soumise ?'
  memorization_justification: Deux événements aux noms voisins portant des couches de données opposées
    ; le code compile dans les deux cas.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/form/events.rst
    branch: '8.0'
    symbol_or_lines: form event order and constraints
    verified_at: '2026-09-01'
- id: FLC-tta4ns1abpfy
  official_item: OIT-58r9dadx916v
  language: fr
  front: 'DataTransformer : que fait reverseTransform() ?'
  back: Elle convertit la donnée soumise vers le modèle. transform() fait le trajet modèle vers vue, au
    rendu.
  explanation: Les noms se lisent depuis le modèle. Une valeur non convertible doit lever TransformationFailedException,
    que le formulaire traduit en erreur de validation.
  memorization_justification: Le préfixe reverse invite à lire l'inverse de ce qu'on veut ; l'erreur produit
    un formulaire qui affiche mais ne soumet pas.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/form/data_transformers.rst
    branch: '8.0'
    symbol_or_lines: transform and reverseTransform
    verified_at: '2026-09-01'
- id: FLC-8yczcp0s4a1c
  official_item: OIT-j2vjdxcer4ft
  language: fr
  front: 'Thèmes de formulaire : dans quel ordre les blocs sont-ils cherchés ?'
  back: 'Du plus spécifique au plus général : _formulaire_champ_partie, puis type_partie, puis text_partie.'
  explanation: Le bloc le plus spécifique commence par un souligné et porte le nom du formulaire puis
    celui du champ. C'est cette chaîne qui permet de personnaliser à n'importe quel niveau.
  memorization_justification: Chaîne de repli à trois niveaux dont la syntaxe du bloc le plus spécifique
    — souligné initial, nom du formulaire, nom du champ — ne s'invente pas.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/form/form_themes.rst
    branch: '8.0'
    symbol_or_lines: block lookup chain and form_themes order
    verified_at: '2026-09-01'
- id: FLC-5g65x0xtgdn7
  official_item: OIT-j2vjdxcer4ft
  language: fr
  front: 'twig.form_themes : dans quel ordre la liste est-elle consultée ?'
  back: De la fin vers le début. Le dernier thème listé est consulté en premier, le premier sert de dernier
    recours.
  explanation: L'ordre naturel de lecture d'une liste YAML suggère l'inverse, et une surcharge placée
    en première ligne n'a alors aucun effet visible.
  memorization_justification: 'Ordre inverse de l''intuition, sans erreur à la clé : le thème est simplement
    ignoré.'
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/form/form_themes.rst
    branch: '8.0'
    symbol_or_lines: block lookup chain and form_themes order
    verified_at: '2026-09-01'
- id: FLC-yvey5gkx1zhd
  official_item: OIT-gxew257vwhm8
  language: fr
  front: 'Formulaires : que rend form_end() en plus de la balise fermante ?'
  back: Tous les champs non encore rendus, dont le jeton CSRF.
  explanation: 'Passer render_rest à false supprime ce filet, et fait disparaître le jeton : le formulaire
    devient alors invalide à la soumission.'
  memorization_justification: Comportement implicite dont la suppression casse la protection CSRF sans
    message explicite.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/forms.rst
    branch: '8.0'
    symbol_or_lines: section Rendering Forms, form_end
    verified_at: '2026-09-01'
- id: FLC-rpr50wc4n7f6
  official_item: OIT-rj9web4whgmz
  language: fr
  front: 'OptionsResolver : quelle différence entre setDefined() et setDefaults() ?'
  back: setDefined déclare qu'une option est acceptée, sans valeur ; setDefaults lui donne une valeur
    par défaut.
  explanation: 'Une option ni définie ni pourvue d''un défaut provoque une exception : c''est précisément
    l''intérêt du composant.'
  memorization_justification: Deux méthodes aux noms proches dont l'une seule fournit une valeur ; la
    confusion produit une option absente du tableau résolu.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/components/options_resolver.rst
    branch: '8.0'
    symbol_or_lines: setDefined vs setDefaults
    verified_at: '2026-09-01'
- id: FLC-jd951drcz26t
  official_item: OIT-tsxxgp3ppj1n
  language: fr
  front: 'Symfony Forms : combien de couches de données un formulaire manipule-t-il, et lesquelles
    ?'
  back: 'Trois : modèle, normalisée, vue.'
  explanation: La couche normalisée est identique au modèle pour la plupart des types, ce qui la rend
    facile à oublier — jusqu'à ce qu'un transformateur doive s'attacher au bon niveau. La couche vue
    est faite de chaînes.
  memorization_justification: Comptage exact d'une structure qu'on croit binaire, et qui décide où
    brancher un transformateur.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/forms.rst
    branch: '8.0'
    symbol_or_lines: The Data Transformation Lifecycle
    verified_at: '2026-09-11'
- id: FLC-18xdehm33xa9
  official_item: OIT-fhpttc4c5x0k
  language: fr
  front: 'Symfony Forms : un champ peut-il fonctionner sans propriété publique du même nom ?'
  back: Oui — l'accès essaie la propriété publique, puis les accesseurs usuels.
  explanation: 'Symétriquement, un champ peut échouer alors qu''une propriété existe mais est privée
    sans accesseur. Un champ sans propriété correspondante doit être déclaré `mapped: false`.'
  memorization_justification: 'Chaîne de résolution invisible : on suppose un accès direct à la propriété.'
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/forms.rst
    branch: '8.0'
    symbol_or_lines: Building Forms and Mapping Fields to Object Properties
    verified_at: '2026-09-11'
- id: FLC-cafrwa53g55w
  official_item: OIT-5xvjqa4203xe
  language: fr
  front: 'Symfony Forms : quel est le parent d''un type de formulaire qui n''en déclare aucun ?'
  back: '`FormType`, la racine de tous les types — pas « aucun parent ».'
  explanation: Hériter est la règle, pas l'exception. C'est aussi pourquoi un formulaire est un type
    comme un autre et s'imbrique en l'ajoutant comme un champ.
  memorization_justification: Défaut implicite non écrit dans le code du type, et qui explique le
    comportement des extensions.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/form/create_custom_field_type.rst
    branch: '8.0'
    symbol_or_lines: creating a custom form field type
    verified_at: '2026-09-11'
- id: FLC-4476zezkxadx
  official_item: OIT-dmkbj2x94rks
  language: fr
  front: 'Symfony : un formulaire soumis sans jeton CSRF valide est-il invalide, ou valide avec une
    erreur en plus ?'
  back: 'Invalide. Aucun code applicatif ne teste quoi que ce soit : c''est le composant qui refuse.'
  explanation: 'Un identifiant de jeton distinct par formulaire est par ailleurs préférable : avec
    un identifiant partagé, un jeton obtenu sur un formulaire vaut pour les autres.'
  memorization_justification: 'Nature du refus souvent mal située : on croit à une contrainte de validation
    applicative.'
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/security/csrf.rst
    branch: '8.0'
    symbol_or_lines: CSRF protection in Symfony forms
    verified_at: '2026-09-11'
- id: FLC-k5cmghfvqk7h
  official_item: OIT-j6tqs8s8f54f
  language: fr
  front: 'Symfony Forms : un champ de fichier doit-il être mappé à la propriété de l''entité ?'
  back: 'Non, presque jamais : l''entité stocke un nom de fichier, pas un fichier.'
  explanation: Laisser le champ mappé fait écrire un objet dans une propriété qui attend une chaîne.
    Un champ non mappé se lit sur le formulaire et vaut `null` quand rien n'a été envoyé.
  memorization_justification: Exception à la règle générale du mapping, et source d'une erreur de
    type difficile à lire.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/controller/upload_file.rst
    branch: '8.0'
    symbol_or_lines: adding the file field to the form
    verified_at: '2026-09-11'
- id: FLC-e6rmxrw6vdbt
  official_item: OIT-p810t98zedem
  language: fr
  front: 'Symfony Forms : `CountryType`, `LanguageType`, `LocaleType`, `CurrencyType` et `TimezoneType`
    sont-ils des types indépendants ?'
  back: Non — ce sont le même type socle, `ChoiceType`, avec une liste pré-remplie.
  explanation: Les options du socle valent donc pour eux tous. Les boutons sont eux aussi des types
    comme les autres, ajoutés au formulaire de la même façon que les champs.
  memorization_justification: Factorisation invisible depuis le catalogue, où les cinq apparaissent
    comme des entrées séparées.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/reference/forms/types.rst
    branch: '8.0'
    symbol_or_lines: supported field types
    verified_at: '2026-09-11'
- id: FLC-be3pranpsvn1
  official_item: OIT-gcs0jathkv9b
  language: fr
  front: 'Symfony : pour ajouter une option à un type de formulaire fourni par Symfony, écrit-on un
    nouveau type ou une extension ?'
  back: 'Une extension de type : un type crée un champ, une extension modifie ceux qui existent.'
  explanation: La méthode qui désigne les types étendus est statique et retourne un itérable. Étendre
    le type racine touche tous les champs de l'application, puisque tous en héritent.
  memorization_justification: Distinction que l'examen pose directement, et où écrire un nouveau type
    est l'erreur naturelle.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/form/create_form_type_extension.rst
    branch: '8.0'
    symbol_or_lines: creating a form type extension
    verified_at: '2026-09-11'
