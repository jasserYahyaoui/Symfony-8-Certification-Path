  language: fr
  level: APPLICATION
  front: 'Symfony Forms : envelopper les champs e-mail dans une div sans perdre type="email".'
  back: '`{% use ''form_div_layout.html.twig'' %}` puis, dans `email_widget`, `<div>{{ parent() }}</div>`.'
  explanation: '`parent()` appelle l''`email_widget` importé, qui fixe `type` à `email` ; vérifié par rendu réel.'
  memorization_justification: Parade à l'exemple documenté.
