    verified_at: '2026-09-24'
- id: FLC-cdcsn1340q2n
  official_item: OIT-tsxxgp3ppj1n
  language: fr
  level: RECALL
  front: 'Symfony Forms : quels transformateurs relient quelles couches ?'
  back: Les transformateurs de modèle relient modèle et normalisée ; les transformateurs de vue relient normalisée et vue.
  explanation: Au rendu, on applique les transformations dans l'ordre modèle, puis vue ; à la soumission, les inverses dans l'ordre vue, puis modèle.
  memorization_justification: Vocabulaire indispensable pour l'item Data transformers.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/forms.rst
