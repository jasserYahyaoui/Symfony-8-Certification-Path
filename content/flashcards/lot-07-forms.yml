  level: UNDERSTANDING
  front: 'Twig : pourquoi les fonctions de rendu prennent-elles form.task plutôt que la chaîne ''task'' ?'
  back: 'Parce qu''elles travaillent sur une `FormView` : l''objet de vue du champ porte ses variables et l''état « déjà rendu ».'
  explanation: Le contrôleur passe le formulaire ; `render()` le convertit en vue, et chaque enfant est une `FormView`.
  memorization_justification: Explique le type d'argument attendu.
  verification_status: VERIFIED
