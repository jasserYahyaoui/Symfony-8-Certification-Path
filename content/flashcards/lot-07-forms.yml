  front: 'Symfony Forms : que vaut par défaut le second argument de submit() ?'
  back: '`true` : `$clearMissing`, qui met à `null` les champs absents de la soumission.'
  explanation: 'Exécuté : `submit([''task'' => ''new''])` sur `[''task'' => ''old'', ''other'' => ''keep'']` rend `other` à `null` ; avec `false`, `other` reste `keep`.'
  memorization_justification: Valeur par défaut au cœur des mises à jour partielles.
  verification_status: VERIFIED
