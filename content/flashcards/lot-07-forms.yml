- id: FLC-6kz6nw4196kj
  official_item: OIT-tsxxgp3ppj1n
  language: fr
  level: UNDERSTANDING
  front: 'Symfony Forms : pourquoi la norm data d''un DateType est-elle un DateTime quel que soit l''input ?'
  back: 'Parce que c''est le format pivot : les model transformers ramènent string, timestamp, array, DateTimeImmutable ou DatePoint vers un DateTime, et la vue part de lui.'
  explanation: 'C''est la raison d''être de la couche normalisée : rendre le type indépendant du format de donnée que l''application choisit.'
  memorization_justification: Explique à quoi sert la couche intermédiaire.
  verification_status: VERIFIED
