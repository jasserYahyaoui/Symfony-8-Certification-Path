- id: FLC-q5n8e06ktpy3
  official_item: OIT-mgvdw7cfpwyz
  language: fr
  level: UNDERSTANDING
  front: 'Symfony Forms : pourquoi rediriger après une soumission valide plutôt que rendre le gabarit ?'
  back: 'Pour qu''un rafraîchissement du navigateur ne renvoie pas le POST : après une redirection, la page affichée provient d''un GET.'
  explanation: La documentation en fait une bonne pratique ; le rendu du gabarit reste réservé à la branche non soumise ou invalide.
  memorization_justification: Motif POST-redirect-GET.
  verification_status: VERIFIED
