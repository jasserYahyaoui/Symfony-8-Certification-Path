- id: FLC-4476zezkxadx
  official_item: OIT-dmkbj2x94rks
  language: fr
  level: TRAP
  front: 'Symfony : un formulaire soumis sans jeton CSRF valide est-il invalide, ou valide avec une
    erreur en plus ?'
  back: 'Invalide. Aucun code applicatif ne teste quoi que ce soit : c''est le composant qui refuse.'
  explanation: 'Un identifiant de jeton distinct par formulaire est par ailleurs préférable : avec
    un identifiant partagé, un jeton obtenu sur un formulaire vaut pour les autres.'
  memorization_justification: 'Nature du refus souvent mal située : on croit à une contrainte de validation
    applicative.'
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/security/csrf.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/security/csrf.rst
