- id: FLC-cf4h6aq2ft8n
  official_item: OIT-hs1297vvhr89
  language: fr
  level: RECALL
  front: 'Symfony : quels stamps porte l''enveloppe d''un message envoyé vers un transport ?'
  back: '`SentStamp` et `TransportMessageIdStamp`, en plus de `BusNameStamp` — mais aucun `HandledStamp`.'
  explanation: Exécuté avec un transport `in-memory://`.
  memorization_justification: Signature d'un envoi.
  verification_status: VERIFIED
