  official_item: OIT-hs1297vvhr89
  language: fr
  level: RECALL
  front: 'Symfony : quel stamp porte le résultat d''un handler ?'
  back: '`HandledStamp`, lu par `$envelope->last(HandledStamp::class)->getResult()`.'
  explanation: Posé par `HandleMessageMiddleware`, seulement en traitement synchrone.
  memorization_justification: Lecture d'un résultat.
