schema_version: 2
flashcards:
- id: FLC-7wbtaz9pzty2
  official_item: OIT-hs1297vvhr89
  language: fr
  level: TRAP
  front: dispatch() signifie-t-il que le message est traité ?
  back: Non. En asynchrone, dispatch() rend la main avant tout traitement ; le résultat ne se lit que
    sur l'enveloppe retournée, en synchrone.
  explanation: Le bus confie le message ; c'est le routage qui décide de la suite.
  memorization_justification: Le verbe suggère une exécution, alors qu'il s'agit d'une remise.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/messenger.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/messenger.rst
    symbol_or_lines: 'Routing Messages to a Transport — "its handler(s) will not be called immediately"; and Getting Results from your Handlers — $envelope->last(HandledStamp::class)->getResult()'
    branch: '8.0'
    verified_at: '2026-09-01'
- id: FLC-g0g67y6cwvv1
  official_item: OIT-ckr67pq9npyb
  language: fr
  level: TRAP
  front: Que devient un message qui n'est routé vers aucun transport ?
  back: 'Il est traité immédiatement, de façon synchrone — et s''il n''a aucun handler, `dispatch()` lève `NoHandlerForMessageException`.'
  explanation: 'Une classe mal orthographiée dans `routing` n''est pas silencieuse : le conteneur ne se construit pas. Seul un espace de noms avec `*` qui ne correspond à rien l''est.'
  memorization_justification: On attend une mise en attente ou une erreur ; il n'y a ni l'une ni l'autre.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/messenger.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/messenger.rst
    symbol_or_lines: 'Routing Messages to a Transport — "Any messages not matched under routing will still be handled immediately, i.e. synchronously"'
    branch: '8.0'
    verified_at: '2026-09-01'
- id: FLC-c1z191gbhw72
  official_item: OIT-9a8aa389vk48
  language: fr
  front: Qu'est-ce qui associe un handler à son message ?
  back: 'Le type de l''argument de __invoke(), plus l''attribut #[AsMessageHandler]. Aucune interface,
    aucune table de correspondance.'
  explanation: Plusieurs handlers peuvent traiter le même message ; tous sont appelés.
  memorization_justification: On cherche une interface ou une configuration qui n'existent pas.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/messenger.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/messenger.rst
    symbol_or_lines: 'Creating a Message & Handler — "a class that has the AsMessageHandler attribute and has an __invoke() method that''s type-hinted with the" message class'
    branch: '8.0'
    verified_at: '2026-09-01'
- id: FLC-sh7aqjgp5mzt
  official_item: OIT-dctf03ftx44f
  language: fr
  front: Après un déploiement, pourquoi un worker exécute-t-il encore l'ancien code ?
  back: Parce qu'il a chargé le code à son démarrage. messenger:stop-workers demande un arrêt après le
    message courant ; le superviseur relance.
  explanation: 'La commande ne tue pas le processus : elle pose un signal lu entre deux messages.'
  memorization_justification: Le worker étant invisible, on oublie qu'il n'est pas redémarré par le déploiement.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/messenger.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/messenger.rst
    symbol_or_lines: 'Restart Workers on Deploy — "restart all worker processes so they pick up the new code ... messenger:stop-workers ... tells each worker to finish its current message and exit cleanly. The process manager then restarts them"'
    branch: '8.0'
    verified_at: '2026-09-01'
- id: FLC-7hfxx70j2rhg
  official_item: OIT-76x1t7z916f4
  language: fr
  front: 'max_retries: 3 — combien de tentatives au total ?'
  back: 'Quatre : la tentative initiale plus trois réessais, avec un délai croissant.'
  explanation: Sans failure_transport, le message est définitivement perdu une fois les tentatives épuisées.
  memorization_justification: Le nom de l'option fait compter la tentative initiale dans le total.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/messenger.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/messenger.rst
    symbol_or_lines: 'Retries & Failures — "a message will be retried 3 times before being discarded", i.e. the initial attempt plus three retries'
    branch: '8.0'
    verified_at: '2026-09-01'
- id: FLC-c1cqrva0by96
  official_item: OIT-amnpjdprky6z
  language: fr
  front: Combien de fois la chaîne de middleware s'exécute-t-elle pour un message asynchrone ?
  back: 'Deux fois : à l''envoi, puis à la réception par le worker.'
  explanation: Un middleware qui journalise écrit donc deux lignes ; le ReceivedStamp distingue les deux
    passages.
  memorization_justification: On raisonne comme sur une requête HTTP, qui ne traverse la chaîne qu'une
    fois.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/messenger.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/messenger.rst
    symbol_or_lines: 'Concepts / Middleware — "Middleware are called both when a message is originally dispatched and again later when a message is received from a transport"'
    branch: '8.0'
    verified_at: '2026-09-01'
- id: FLC-69qezsfk9bcg
  official_item: OIT-16at9vwzww43
  language: fr
  front: WorkerRunningEvent est-il émis quand la file est vide ?
  back: Oui, à chaque itération de la boucle. isWorkerIdle() le signale.
  explanation: Y placer un traitement coûteux le fait donc tourner en permanence.
  memorization_justification: Le nom laisse croire à un événement lié au traitement d'un message.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Messenger/Event/WorkerRunningEvent.php
    readable_url: https://github.com/symfony/symfony/blob/8.0/src/Symfony/Component/Messenger/Event/WorkerRunningEvent.php
    symbol_or_lines: 'WorkerRunningEvent — "Dispatched after the worker processed a message or didn''t receive a message at all"; isWorkerIdle() "Returns true when no message has been received by the worker"'
    branch: '8.0'
    verified_at: '2026-09-01'
