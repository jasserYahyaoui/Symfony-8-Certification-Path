  official_item: OIT-hs1297vvhr89
  language: fr
  level: UNDERSTANDING
  front: 'Symfony : pourquoi un middleware peut-il voir passer deux fois le même message asynchrone ?'
  back: Parce que les middleware sont appelés à l'envoi, puis de nouveau quand le message est reçu du transport.
  explanation: Section « Concepts », définition de Middleware.
  memorization_justification: Double passage.
  verification_status: VERIFIED
