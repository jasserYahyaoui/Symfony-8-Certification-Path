  official_item: OIT-ckr67pq9npyb
  language: fr
  level: RECALL
  front: 'Symfony : quels transports particuliers Messenger fournit-il pour le synchrone et les tests ?'
  back: '`sync://` traite sur place ; `in-memory://` garde les messages sans les traiter.'
  explanation: Les ponts fournis couvrent AMQP, Doctrine, Redis, Amazon SQS et Beanstalkd.
  memorization_justification: Transports particuliers.
