  front: 'Symfony : quel attribut route une classe de message vers un transport ?'
  back: '`#[AsMessage(''async'')]`, ou `#[AsMessage([''async'', ''audit''])]` pour plusieurs transports.'
  explanation: Équivalent de la clé `routing` de la configuration.
