- id: FLC-pcafe57gwn5q
  official_item: OIT-hs1297vvhr89
  language: fr
  level: UNDERSTANDING
  front: 'Symfony : pourquoi un DelayStamp n''a-t-il aucun effet sur un message non routé ?'
  back: Parce que le délai est une consigne pour le **transport** ; sans transport, les handlers tournent pendant `dispatch()`.
  explanation: 'Exécuté : `DelayStamp(5000)`, handlers exécutés immédiatement.'
  memorization_justification: Portée d'un stamp.
  verification_status: VERIFIED
  official_sources:
