- id: FLC-1jdvr5ck5yp4
  official_item: OIT-43pt66xsft9f
  language: fr
  level: APPLICATION
  front: 'Symfony PropertyAccess : obtenir null plutôt qu''une exception pour une propriété d''objet absente.'
  back: '`PropertyAccess::createPropertyAccessorBuilder()->disableExceptionOnInvalidPropertyPath()->getPropertyAccessor()`.'
  explanation: Section *Accessing a Non-Existent Property Path*, branche 8.0, et exécuté.
  memorization_justification: Renverser le défaut objet.
  verification_status: VERIFIED
