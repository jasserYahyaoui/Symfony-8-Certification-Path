- id: FLC-bc3ab34c1448
  official_item: OIT-43pt66xsft9f
  language: fr
  level: UNDERSTANDING
  front: 'Symfony PropertyAccess : pourquoi écrire une collection n''appelle-t-il pas setChildren() ?'
  back: 'Parce que les méthodes d''ajout et de retrait l''emportent : seuls les éléments qui changent passent par `addChild()` et `removeChild()`.'
  explanation: 'Exécuté sur un objet qui possède aussi `setChildren()` : `getChildren()`, `removeChild()`, `addChild()`.'
  memorization_justification: Adder et remover.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/components/property_access.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/components/property_access.rst
    repository: symfony/symfony-docs
    branch: '8.0'
    symbol_or_lines: Writing to Array Properties
    verified_at: '2026-10-03'
- id: FLC-8yx8edb6pxyb
  official_item: OIT-43pt66xsft9f
  language: fr
  level: UNDERSTANDING
  front: 'Symfony PropertyAccess : pourquoi le chemin a lève-t-il sur un tableau qui a la clé a ?'
  back: Parce que sans crochets, le segment désigne une propriété d'objet ; il faut écrire `[a]`.
  explanation: 'Exécuté : `NoSuchPropertyException`, dont le message suggère `[a]`.'
  memorization_justification: Notation et cible.
  verification_status: VERIFIED
  official_sources:
