schema_version: 2

flashcards:
- id: FLC-zggyac2jqrp5
  official_item: OIT-43pt66xsft9f
  language: fr
  level: TRAP
  front: 'Chemin absent : que rend la lecture sur un tableau, et sur un objet ?'
  back: Sur un tableau, null. Sur un objet, une exception NoSuchPropertyException. Les deux défauts sont opposés,
    et chacun se renverse par le constructeur d'accesseur.
  explanation: enableExceptionOnInvalidIndex() fait lever le tableau ; disableExceptionOnInvalidPropertyPath() fait
    rendre null à l'objet.
  memorization_justification: On attend un comportement uniforme d'une même méthode ; ici il dépend de la nature
    de la cible, et rien dans l'appel ne le signale.
  verification_status: VERIFIED
  reviewed_at: '2026-09-02'
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/components/property_access.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/components/property_access.rst
    branch: '8.0'
    symbol_or_lines: accessing-a-non-existent-property-path
    verified_at: '2026-09-02'
- id: FLC-9m2xn9fzahds
  official_item: OIT-43pt66xsft9f
  language: fr
  level: RECALL
  front: 'Symfony PropertyAccess : quelle exception lève un index absent après enableExceptionOnInvalidIndex() ?'
  back: '`NoSuchIndexException`.'
  explanation: Exécuté sur PropertyAccess 8.0.8 ; sans cette option, le même chemin rend `null`.
  memorization_justification: Exception d'index.
  verification_status: VERIFIED
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/components/property_access.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/components/property_access.rst
    repository: symfony/symfony-docs
    branch: '8.0'
    symbol_or_lines: Reading from Arrays
    verified_at: '2026-10-03'
- id: FLC-phm7twmh7tvs
  official_item: OIT-43pt66xsft9f
  language: fr
  level: RECALL
  front: 'Symfony PropertyAccess : quelle méthode du constructeur d''accesseur active la lecture par __call() ?'
  back: '`enableMagicCall()`.'
  explanation: Section *Magic __call() Method*, branche 8.0, et exécuté ; `__get()` et `__set()` sont actifs par défaut.
  memorization_justification: Activer __call.
  verification_status: VERIFIED
  official_sources:
