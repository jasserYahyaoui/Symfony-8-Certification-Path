- id: FLC-8hhsxfx9bb9b
  official_item: OIT-43pt66xsft9f
  language: fr
  level: TRAP
  front: 'Symfony PropertyAccess : l''opérateur ? évite-t-il l''exception d''une propriété absente ?'
  back: 'Non : il n''arrête que sur `null` ; un objet sans la propriété lève toujours `NoSuchPropertyException`.'
  explanation: 'Exécuté : `person?.firstname` sur un `person` non nul sans `firstname`.'
  memorization_justification: Null contre absent.
  verification_status: VERIFIED
  official_sources:
