    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/components/property_access.rst
    repository: symfony/symfony-docs
    branch: '8.0'
    symbol_or_lines: Magic __call() Method
    verified_at: '2026-10-03'
- id: FLC-he98mq8yw8bd
  official_item: OIT-43pt66xsft9f
  language: fr
  level: RECALL
  front: 'Symfony PropertyAccess : quel opérateur arrête l''évaluation d''un chemin sur un maillon null ?'
  back: '`?` : `person?.firstname` rend `null` si `person` vaut `null`.'
  explanation: Section *Accessing Nullable Property Paths*, branche 8.0, et exécuté ; sans `?`, `UnexpectedTypeException`.
  memorization_justification: Opérateur nullsafe.
  verification_status: VERIFIED
  official_sources:
