- id: FLC-zbwz45ezmkka
  official_item: OIT-43pt66xsft9f
  language: fr
  level: APPLICATION
  front: 'Symfony PropertyAccess : lire person.firstname sur un commentaire dont person peut être null, sans exception.'
  back: '`$propertyAccessor->getValue($comment, ''person?.firstname'')`.'
  explanation: Section *Accessing Nullable Property Paths*, branche 8.0.
  memorization_justification: Chemin nullable.
  verification_status: VERIFIED
