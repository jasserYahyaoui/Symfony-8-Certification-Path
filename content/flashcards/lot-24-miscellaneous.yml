    verified_at: '2026-10-03'
- id: FLC-93f6yntrt66r
  official_item: OIT-43pt66xsft9f
  language: fr
  level: UNDERSTANDING
  front: 'Symfony PropertyAccess : pourquoi isReadable() peut-il déclencher un effet de bord ?'
  back: Parce qu'il lit réellement le chemin, getter compris ; il ne fait que convertir l'exception en `false`.
  explanation: 'Lu dans `PropertyAccessor::isReadable()` (8.0) et exécuté : `getFirstName()` appelé.'
  memorization_justification: Lecture réelle.
  verification_status: VERIFIED
  official_sources:
