  question: A page never reads or writes the session, but sessions are enabled in the configuration. Is a session
    cookie sent?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 60
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-01'
  tags:
  - session
  choices:
  - id: CHO-v2zsq4ckr2pa
    text: No — the session is only started on read, write or check
    correct: true
  - id: CHO-k5awzbz6aeaj
    text: Yes — enabling sessions always starts one
    correct: false
    explanation: Enabling only makes the session available; starting is lazy.
  - id: CHO-v4qhec5je9wc
    text: Yes, but only for authenticated users
    correct: false
    explanation: Authentication does start a session, but that is not what enabling does.
  - id: CHO-dfcbyrsgs9xs
    text: Only if the page returns a 200 response
    correct: false
    explanation: The status code has no bearing on session start.
  explanation: This is why a page that stays clear of the session remains cacheable by a shared proxy. Note that
    merely checking with has() is enough to start it.
  official_sources:
