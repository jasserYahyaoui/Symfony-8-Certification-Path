    text: The `#[ValueResolver]` attribute on the argument names it; the named resolver is then called first, ahead of the priority order
    correct: true
  - id: CHO-zbxy5kpcbc77
    text: Being registered with a higher priority than the others, "targeted" being the name for the
      top of that order
