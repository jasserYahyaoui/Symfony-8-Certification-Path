  question: AbstractController implements ServiceSubscriberInterface. What does that mean in practice?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 60
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-01'
  tags:
  - abstractcontroller
  - services
  choices:
  - id: CHO-vz8evttgdv4f
    text: It receives a container restricted to the services it declares
    correct: true
  - id: CHO-m2tp0p6xtvz4
    text: It receives the full service container
    correct: false
    explanation: Subscribing exists precisely to avoid handing over the whole container.
  - id: CHO-6q7t77cawgxh
    text: It cannot use any service at all
    correct: false
    explanation: It declares a fixed list — router, twig, form.factory and others.
  - id: CHO-wh11e9wjtb36
    text: Its services must be injected through the constructor
    correct: false
    explanation: 'They arrive through setContainer(), which is marked #[Required].'
  explanation: 'getSubscribedServices() lists the services, each prefixed with ''?'' to mark it optional. That is
    why the class works in an application without Twig: calling render() then fails with an explicit message.'
  official_sources: *id001
