  tags:
  - abstractcontroller
  choices:
  - id: CHO-bbaq74c4ts1q
    text: All of its helper methods are declared protected
    correct: true
  - id: CHO-vw0exq18dkxg
    text: The class is final
    correct: false
    explanation: AbstractController is abstract, not final; it is meant to be extended.
  - id: CHO-k3y6n79bxxjc
    text: The container is only injected during a request
    correct: false
    explanation: 'setContainer() is #[Required] and runs at instantiation.'
  - id: CHO-rkjrpt89qf59
    text: render() is a static method
    correct: false
    explanation: It is an instance method.
  explanation: Every AbstractController helper — render, json, redirect, forward, addFlash and the rest — is protected,
    so it is reachable only from the subclass.
