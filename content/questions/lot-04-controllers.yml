  question: A controller calls `return $this->render('form.html.twig', ['form' => $form]);` where $form is a submitted,
    invalid form. What status code does the response carry?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 60
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-01'
  tags:
  - response
  - forms
  choices:
  - id: CHO-g3saqaa323gf
    text: '422'
    correct: true
  - id: CHO-f70rckdg9ntz
    text: '200'
    correct: false
    explanation: render() detects an invalid form among its parameters and does not return 200.
  - id: CHO-3092jv8qrp1d
    text: '400'
    correct: false
    explanation: The documented status for an invalid form rendered this way is 422, not 400.
  - id: CHO-mcmjgqttjgqk
    text: '500'
    correct: false
    explanation: An invalid form is an expected outcome, not an error.
  explanation: 'render() and renderBlock() both document this: if an invalid form is found in the list of parameters,
    a 422 status code is returned. No third Response argument is needed.'
  official_sources: *id001
