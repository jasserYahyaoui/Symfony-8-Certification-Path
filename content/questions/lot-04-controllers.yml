    text: Non, c'est une convention
    correct: true
  - id: CHO-97mzx5x5ys90
    text: Oui, sinon le routeur ne trouve pas la classe
    correct: false
    explanation: Le routeur lit l'attribut `_controller`, qui porte le nom pleinement qualifié ; le suffixe ne joue
      aucun rôle.
