    text: forward() produces one HTTP request; redirectToRoute() produces two
    correct: true
  - id: CHO-y9bd5rhgzjnx
    text: forward() changes the displayed URL; redirectToRoute() does not
    correct: false
    explanation: 'Exactly inverted: the redirect changes the URL, the forward does not.'
  - id: CHO-na59vqgpb1pc
    text: Both return a RedirectResponse, with different status codes
    correct: false
