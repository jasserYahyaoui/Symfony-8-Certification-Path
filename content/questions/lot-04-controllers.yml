  reviewed_at: '2026-09-01'
  tags:
  - cookies
  - response
  choices:
  - id: CHO-1s228nmk6sra
    text: On the Response, through its headers bag
    correct: true
  - id: CHO-00f995njavcm
    text: On the Request, through its cookies bag
    correct: false
    explanation: The request holds what the client sent; writing to it sends nothing.
  - id: CHO-z0m74cqscca8
    text: On the session
    correct: false
    explanation: The session uses a cookie but is not the way to set an arbitrary one.
  - id: CHO-05061b55azm7
    text: On the container, as a parameter
    correct: false
    explanation: Parameters are configuration, unrelated to HTTP headers.
  explanation: A cookie travels in the Set-Cookie response header, so it is written with $response->headers->setCookie()
    and removed with clearCookie(). Reading uses $request->cookies.
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/HttpFoundation/ResponseHeaderBag.php
    branch: '8.0'
    symbol_or_lines: setCookie, clearCookie
    verified_at: '2026-09-01'
