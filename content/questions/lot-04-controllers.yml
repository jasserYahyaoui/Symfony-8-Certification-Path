  question: A route is declared as `/lucky/{max}` and the action signature is `number(Request $request, int $max)`.
    What determines that $max receives the route value?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 45
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-01'
  tags:
  - request
  - routing
  choices:
  - id: CHO-kfmeffvkzy22
    text: The argument name matching the route placeholder
    correct: true
  - id: CHO-p1ka9f15fzc5
    text: The position of the argument in the signature
    correct: false
    explanation: Order is irrelevant; matching is by name.
  - id: CHO-x7cjmba72hej
    text: The int type declaration
    correct: false
    explanation: The type is used for casting, not for matching.
  - id: CHO-ts47p1xq2wgh
    text: The order in which placeholders appear in the path
    correct: false
    explanation: Placeholders are matched by name, not by position.
  explanation: The router stores route parameters in $request->attributes, and the resolver matches an argument
    whose name equals an attribute key. Renaming the argument breaks it; reordering does not.
