  type: mcq
  answer_mode: single
  required_answer_count: 1
  question: A counter is incremented at the top of the application's entry script, before the closure is returned.
    It ends up at two instead of one. What explains it?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 65
  classification: OFFICIAL
  pool: VALIDATION
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-02'
  tags:
  - bootstrap
  - side-effects
  choices:
  - id: CHO-1tx5fvhmg8k2
    text: The bootstrapping layer includes that script a second time, so anything it does happens twice
    correct: true
  - id: CHO-m45fb59ttq5p
    text: Two requests were served and the counter persisted between them
    correct: false
    explanation: The doubling happens within a single execution.
  - id: CHO-sdjcpnmhebc7
    text: The closure is invoked twice, once to resolve arguments and once to build the application
    correct: false
    explanation: Argument resolution does not call the closure a second time.
  - id: CHO-x7jerwsn2z5c
    text: Debug mode runs the whole entry sequence twice to compare results
    correct: false
    explanation: No mode duplicates the sequence for comparison.
  explanation: The documented sequence has the runtime include the front-controller script again, which is why the
    docs warn it must produce no side effects.
