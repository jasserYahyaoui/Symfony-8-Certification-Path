  question: 'A class declares `public static function make(): static { return new static(); }`. A child class calls
    Child::make(). What is returned?'
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 60
  classification: OFFICIAL
  pool: VALIDATION
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-01'
  tags:
  - oop
  - late-static-binding
  choices:
  - id: CHO-z5d4ks0ae5bm
    text: An instance of Child
    correct: true
  - id: CHO-6s1fv0xwtjjc
    text: An instance of the parent class
    correct: false
    explanation: That is what `new self()` would give; `static` resolves to the called class.
  - id: CHO-5nt02nh75hg3
    text: 'A fatal error: static cannot be used as a return type'
    correct: false
    explanation: '`static` is a valid return type since PHP 8.0.'
  - id: CHO-ncqfhtjsvqy0
    text: null, because the constructor is not declared
    correct: false
    explanation: A class without an explicit constructor is still instantiable.
  explanation: '`static` is late static binding: it resolves to the class the method was called on, not the one
    it was written in. `self` would resolve to the declaring class.'
  official_sources:
  - url: https://raw.githubusercontent.com/php/doc-en/master/language/oop5/late-static-bindings.xml
    branch: master
    symbol_or_lines: new static
    verified_at: '2026-09-01'
