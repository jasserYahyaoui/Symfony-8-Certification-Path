  question: A closure needs to modify a variable of the enclosing scope so the change is visible after the call.
    What is required?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 60
  classification: OFFICIAL
  pool: VALIDATION
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-01'
  tags:
  - closures
  choices:
  - id: CHO-5cygmxjyaq57
    text: Capturing it by reference with use (&$x)
    correct: true
  - id: CHO-vb1anw8qjjeh
    text: Capturing it by value with use ($x)
    correct: false
    explanation: A by-value capture copies the variable; the outer one is unchanged.
  - id: CHO-q41je74rdq6t
    text: Using an arrow function, which captures by reference
    correct: false
    explanation: Arrow functions capture by value automatically, never by reference.
  - id: CHO-3twkny0p7knm
    text: Declaring the variable static inside the closure
    correct: false
    explanation: A static variable is local to the closure and unrelated to the outer one.
  explanation: Only `use (&$x)` binds the outer variable itself. Arrow functions capture automatically but always
    by value, which is why they cannot be used here.
