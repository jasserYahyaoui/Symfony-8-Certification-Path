  choices:
  - id: CHO-nma8my6d53f6
    text: kernel.response, kernel.finish_request and kernel.terminate
    correct: true
  - id: CHO-dhw69s7ww82b
    text: None — the kernel returns immediately
    correct: false
    explanation: The response still has to be filtered and sent, so the later events run.
  - id: CHO-tfcgwwjn31dh
    text: kernel.controller and everything after it
    correct: false
