  reviewed_at: '2026-09-01'
  tags:
  - attributes
  choices:
  - id: CHO-hvqcf0y4ayd4
    text: When the attribute is instantiated through reflection
    correct: true
  - id: CHO-csv96nb07qxh
    text: When the class carrying the attribute is autoloaded
    correct: false
    explanation: Autoloading does not evaluate attributes.
  - id: CHO-b72d3rxdjdm7
    text: At compile time, once per file
    correct: false
    explanation: Attributes are metadata; nothing runs at compile time.
  - id: CHO-pmbbrf08r15j
    text: When the object carrying the attribute is constructed
    correct: false
    explanation: Instantiating the annotated class does not touch its attributes.
  explanation: Attributes are inert metadata until something calls newInstance() on a ReflectionAttribute. That
    is why bad arguments produce no error until a reader asks for the object.
