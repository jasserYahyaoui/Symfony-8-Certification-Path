  - tech-lead
  reviewed_at: '2026-09-01'
  tags:
  - events
  - nested
  choices:
  - id: CHO-d8ep8nfx664x
    text: To the parent form, from the child's POST_SUBMIT
    correct: true
  - id: CHO-8dw5zkb6mts6
    text: To the child form, from its own POST_SUBMIT
    correct: false
    explanation: The child's structure is already fixed by then.
  - id: CHO-wpeyyqw2ec4e
    text: To the child form, from SUBMIT
