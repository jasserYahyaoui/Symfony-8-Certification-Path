  question: What is the practical benefit of stateless CSRF tokens over the default stateful ones?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 60
  classification: OFFICIAL
  pool: VALIDATION
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-01'
  tags:
  - csrf
  choices:
  - id: CHO-9ze3xjtc7wvg
    text: No session is started just to protect a form
    correct: true
  - id: CHO-sk8ngms5jzqg
    text: The token cannot be stolen
    correct: false
    explanation: Neither mode prevents theft; they differ in where the token lives.
  - id: CHO-v7m01d1kf1hj
    text: The token never expires
    correct: false
    explanation: Expiry is not the distinction.
  - id: CHO-5v5kp958p6jy
    text: They work without JavaScript, unlike stateful tokens
    correct: false
    explanation: Stateful tokens need no JavaScript either.
  explanation: A stateful token is stored in the session, so using one starts a session and emits its cookie, which
    costs the page its cacheability by a shared proxy.
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/security/csrf.rst
    branch: '8.0'
    symbol_or_lines: stateless CSRF tokens
    verified_at: '2026-09-01'
