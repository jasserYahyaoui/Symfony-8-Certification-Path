  choices:
  - id: CHO-r2hvq4qh7f0y
    text: A form that was never submitted has nothing to validate
    correct: true
  - id: CHO-8gcbwmkgm1ah
    text: isValid() throws when the form was not submitted
    correct: false
    explanation: It does not throw; the guard exists for correctness of the flow, not to avoid an exception.
  - id: CHO-00e3qvtwwex5
    text: isSubmitted() populates the object
    correct: false
    explanation: handleRequest() does that; isSubmitted() only reports.
  - id: CHO-y0333pe4xsj1
