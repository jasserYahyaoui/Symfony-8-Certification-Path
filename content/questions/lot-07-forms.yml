  - config
  choices:
  - id: CHO-646xp5rcq6bg
    text: The last one in the list
    correct: true
  - id: CHO-ba7j0messh20
    text: The first one in the list
    correct: false
    explanation: The list is walked from the end; the first entry is the last fallback.
  - id: CHO-ch4fc56d9gdf
    text: The one matching the field type
