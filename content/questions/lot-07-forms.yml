  question: How many data representations does a form value pass through?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 45
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-01'
  tags:
  - form-component
  choices:
  - id: CHO-4yev3wcgwj1w
    text: 'Three: model, normalized and view'
    correct: true
  - id: CHO-222j3pgqxeqe
    text: 'Two: model and view'
    correct: false
    explanation: The normalized layer sits between them and differs for types such as DateType.
  - id: CHO-6asec8y0e0n4
    text: Four, one per transformer
    correct: false
    explanation: The number of layers is fixed at three, whatever the transformers.
  - id: CHO-hrj77pyhan69
    text: 'One: the form works on the submitted strings only'
    correct: false
    explanation: That is the view layer alone; the model layer is what the application uses.
  explanation: Rendering goes model to view; submission goes view to model. The normalized layer is identical to
    the model for most types.
  official_sources: &id001
