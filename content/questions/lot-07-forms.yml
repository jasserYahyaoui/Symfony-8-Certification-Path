  question: 'A template renders every field with form_row() and then calls form_end(form, {''render_rest'': false}).
    What breaks?'
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 60
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-01'
  tags:
  - rendering
  - csrf
  choices:
  - id: CHO-y2g90hk612qj
    text: The CSRF token is no longer rendered, so submissions become invalid
    correct: true
  - id: CHO-qatgnk61e9m2
    text: Nothing — every field was rendered explicitly
    correct: false
    explanation: The token is a hidden field that was never rendered explicitly.
  - id: CHO-8trmfrsx9spy
    text: The closing form tag is omitted
    correct: false
    explanation: form_end() still emits it.
  - id: CHO-e82hkghhq25d
    text: The form method reverts to GET
    correct: false
    explanation: The method is unaffected by this option.
  explanation: form_end() renders the fields not yet rendered, which is what carries the hidden CSRF field. Disabling
    that is rarely what is wanted.
  official_sources: *id001
