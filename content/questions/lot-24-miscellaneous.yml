  - tech-lead
  reviewed_at: '2026-09-02'
  tags:
  - paths
  - notation
  choices:
  - id: CHO-16nmrk5dkyjk
    text: An array index
    correct: true
  - id: CHO-twnw7hg8t1d8
    text: An optional segment that is skipped when absent
    correct: false
    explanation: They do not make a segment optional.
  - id: CHO-td5g5bvb3cpc
    text: A method call rather than a property read
    correct: false
    explanation: Method resolution is not what the notation selects.
  - id: CHO-0kmwrhj7rbcj
    text: A nested path evaluated before the rest
    correct: false
    explanation: They do not change evaluation order.
  explanation: Brackets denote array index access and the dot denotes object property access; the two notations can
    be mixed in one path.
