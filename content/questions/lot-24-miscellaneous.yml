  question: Code must find out whether a value can be written at a given path, without writing anything. What does
    the component offer?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 50
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-02'
  tags:
  - checking
  - api
  choices:
  - id: CHO-edh4cj94fyym
    text: A dedicated query that answers whether the path could be written
    correct: true
  - id: CHO-bmm0yctbnnqv
    text: A write attempt wrapped in a try/catch, which is the only available approach
    correct: false
    explanation: A dedicated query exists, so the exception is not needed.
  - id: CHO-vsdypygcw4w6
    text: A dry-run flag passed to the write call itself
    correct: false
    explanation: The write call takes no such flag.
  - id: CHO-5ky9q5fpr3fz
    text: A read of the path, since a readable path is always writable
    correct: false
    explanation: Readability and writability are asked separately and are not equivalent.
  explanation: isWritable() reports whether the write could be performed without performing it, and isReadable() does
    the same for reads.
