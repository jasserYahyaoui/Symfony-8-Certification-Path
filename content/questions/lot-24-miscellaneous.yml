  question: 'The same read call is made twice with a path that does not exist: once against an array, once against
    an object. One returns quietly, the other stops the program. Is this a defect?'
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 65
  classification: OFFICIAL
  pool: VALIDATION
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-02'
  tags:
  - defaults
  - exceptions
  choices:
  - id: CHO-0jjmd2tcpzz0
    text: No; the two targets have opposite defaults, and each can be reversed through the accessor builder
    correct: true
  - id: CHO-520b6gghs9b0
    text: No, but only because the object was missing a matching accessor rather than the property itself
    correct: false
    explanation: The difference holds for a path that is simply absent.
  - id: CHO-6y0222b3dwye
    text: Yes; the two should behave alike, and the array case is a documented bug
    correct: false
    explanation: Both behaviours are documented and intended.
  - id: CHO-f94tstn8ef2r
    text: Yes; the object case should return quietly and the array case should stop
    correct: false
    explanation: That is the reverse of the documented defaults.
  explanation: A missing array index returns null by default while a missing object property path throws; the builder
    can reverse either.
