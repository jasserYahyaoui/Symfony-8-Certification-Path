  question: A listener calls stopPropagation(). What happens to the listeners that already ran?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 55
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-02'
  tags:
  - propagation
  choices:
  - id: CHO-xsvyjj99aw6n
    text: 'Nothing: their work stands, only the remaining listeners are skipped'
    correct: true
  - id: CHO-b5wc3wgf9q5e
    text: They are rolled back, since the event is cancelled
    correct: false
    explanation: No rollback mechanism exists; the dispatcher simply stops notifying.
  - id: CHO-x7w5q0zznvx7
    text: They are called a second time to let them react
    correct: false
    explanation: Nothing is re-notified.
  - id: CHO-28znpnc89yq4
    text: An exception is raised so the dispatcher can unwind them
    correct: false
    explanation: Stopping propagation is an ordinary, quiet control-flow decision.
  explanation: The method only prevents further notifications, which makes its effect entirely dependent on the
    priority order.
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/components/event_dispatcher.rst
    branch: '8.0'
    symbol_or_lines: stopping-event-flow-propagation
    verified_at: '2026-09-02'
