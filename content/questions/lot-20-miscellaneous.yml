  question: Why does an application usually define its own event class rather than dispatching the base Event?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 50
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-02'
  tags:
  - event-class
  choices:
  - id: CHO-nkkncxhkhbqp
    text: The base class is deliberately minimal and carries no application data
    correct: true
  - id: CHO-ye749t03jwte
    text: The base class is abstract and cannot be instantiated
    correct: false
    explanation: Dispatching it is possible; it simply conveys nothing useful.
  - id: CHO-ks4n0m10pwep
    text: The dispatcher refuses an event that is not a subclass
    correct: false
    explanation: Any event object is accepted.
  - id: CHO-31rvkrqwr3c2
    text: Subclassing is required to give the event a name
    correct: false
    explanation: A name can be passed explicitly to the dispatch call.
  explanation: It offers little beyond propagation control, so data is carried by a subclass exposing accessors
    — or by GenericEvent's subject and arguments.
