  answer_mode: single
  required_answer_count: 1
  question: What can a subscriber express that a single listener registration cannot?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 55
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-02'
  tags:
  - subscriber
  choices:
  - id: CHO-8d84vzpsq48x
    text: Several methods on the same event, each with its own priority
    correct: true
  - id: CHO-734mmzzcvrjy
    text: A listener that runs before the dispatcher itself is built
    correct: false
    explanation: Nothing runs before the dispatcher exists; subscription still happens through it.
  - id: CHO-an3kt0ggkmzt
    text: Registration without the dispatcher knowing the event name
    correct: false
    explanation: The names are exactly what the subscriber declares.
  - id: CHO-dpfc1mv7s98q
    text: An event handler that cannot be disabled
    correct: false
    explanation: If anything, the documentation notes the opposite advantage for listeners.
  explanation: getSubscribedEvents() may map one event to a list of method-and-priority pairs, which is why the
    framework uses subscribers internally.
  official_sources:
