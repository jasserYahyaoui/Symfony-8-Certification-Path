  answer_mode: single
  required_answer_count: 1
  question: An event object is dispatched with no name argument. Under what name do listeners have to subscribe?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 55
  classification: OFFICIAL
  pool: VALIDATION
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-02'
  tags:
  - dispatch
  choices:
  - id: CHO-exfdt52ajc5b
    text: The event object's class name
    correct: true
  - id: CHO-np6et07gt9pm
    text: An empty string, which matches every listener
    correct: false
    explanation: No wildcard subscription exists; a concrete name is always used.
  - id: CHO-133nbgmjjwvf
    text: The name given when the class was declared as a service
    correct: false
    explanation: Service identifiers play no part in naming a dispatched event.
  - id: CHO-j62edwpxs3wc
    text: A name derived from the method that dispatched it
    correct: false
    explanation: The caller's method is not inspected.
  explanation: The name argument is optional; omitted, the class of the event instance serves as the name, which
    is why subscriptions are commonly keyed on ::class.
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/components/event_dispatcher.rst
    branch: '8.0'
    symbol_or_lines: creating-and-dispatching-an-event
    verified_at: '2026-09-02'
