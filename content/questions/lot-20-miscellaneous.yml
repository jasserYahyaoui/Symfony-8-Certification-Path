- id: QST-xa6bq0yg86z5
  version: 1
  official_topic: Miscellaneous
  official_item: OIT-s601ppsyb9f7
  domain: symfony
  subtopic: priority
  language: en
  difficulty: medium
  cognitive_level: UNDERSTAND
  exam_skill: DIAGNOSE
  type: mcq
  answer_mode: single
  required_answer_count: 1
  question: Three listeners are registered for one event with priorities -5, 0 and 20. In which order does the dispatcher
    call them?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 55
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-02'
  tags:
  - priority
  choices:
  - id: CHO-b98pjs7aj28k
    text: 20, then 0, then -5
    correct: true
  - id: CHO-373ysd19c8m7
    text: -5, then 0, then 20
    correct: false
    explanation: That reads the number as a rank, where 1 would come first; the dispatcher does the opposite.
  - id: CHO-wn08bgx7phaj
    text: 0, then 20, then -5
    correct: false
    explanation: The default value has no special standing; it is simply the number zero.
  - id: CHO-a8bqema9z67v
    text: In the order they were registered, since priorities only break ties
    correct: false
    explanation: Registration order is the tie-breaker between equal priorities, not the primary rule.
  explanation: A higher number means earlier. Registration order decides only between listeners sharing a priority.
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/components/event_dispatcher.rst
    branch: '8.0'
    symbol_or_lines: connecting-listeners
    verified_at: '2026-09-02'
- id: QST-d95psbyzz9x4
