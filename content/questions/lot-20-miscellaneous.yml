  - id: CHO-17dfvch8w4ms
    text: A subject plus optional keyed arguments, with array access to those arguments
    correct: true
  - id: CHO-hcc6br375n1t
    text: Automatic naming of the event from its subject
    correct: false
    explanation: Naming is unrelated; it follows the same rules as any event.
  - id: CHO-9kzbbn0aakd4
