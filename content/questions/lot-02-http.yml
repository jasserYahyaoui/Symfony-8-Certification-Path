    choices:
      - id: CHO-nqcsknvst6bz
        text: Only portions of it, the rest passing to RFC 9112
        correct: true
      - id: CHO-4xj8ajkyyg33
        text: All of it, since everything 7230 held became semantics
        correct: false
        explanation: The abstract says "portions of 7230" precisely because the framing half did not become
          semantics.
      - id: CHO-0t9k4vbs0ayn
        text: All of it, together with 7234, which 9111 merely restates
        correct: false
        explanation: 7234 is absent from 9110's list. RFC 9111 carries "Obsoletes 7234" itself.
      - id: CHO-dpfc9fps8twf
        text: Nothing; 7230 was left entirely to RFC 9112
        correct: false
        explanation: 9112 takes the framing portions, but 7230's version-independent material did move into
          9110.
    explanation: 'The abstract reads: obsoletes RFCs 2818, 7231, 7232, 7233, 7235, 7538, 7615, 7694, and
      portions of 7230. The Table in section 1.4 marks that one line with an asterisk, alone in the table.
      The split is the whole point of the revision: semantics in 9110, caching in 9111, HTTP/1.1 framing
      in 9112.'
    official_sources:
