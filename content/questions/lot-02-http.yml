    question: A 200 response arrives, its body is not valid JSON, and toArray() is called on it. Which
      branch of the HttpClient exception hierarchy does the contract name, and on what grounds?
    scoring_policy: all-or-nothing
    shuffle_choices: true
    negative_wording: false
    estimated_time_seconds: 60
    classification: OFFICIAL
    pool: LEARNING
    verification_status: VERIFIED
    reviewers:
      - tech-lead
    reviewed_at: '2026-09-16'
    tags:
      - http-client
      - exceptions
    choices:
      - id: CHO-npzv1cc3ha2a
        text: 'Decoding: a response arrived, and only its body could not be read'
        correct: true
      - id: CHO-be0042ge1jmh
        text: 'Client: the contract charges an undecodable body to the caller'
        correct: false
        explanation: That branch is chosen by the status code, and this response is a 200.
      - id: CHO-z0nx0sgfef78
        text: 'Server: an unparseable payload is attributed to the origin'
        correct: false
        explanation: Also chosen by the status code, and a 200 rules it out.
      - id: CHO-44xnm8vsbdhk
        text: 'Transport: whatever denies the caller a usable value counts as one'
        correct: false
        explanation: Transport covers the network alone. The bytes arrived here; only their shape is wrong.
    explanation: 'The hierarchy splits by where the failure happened. TransportExceptionInterface covers
      the network, with TimeoutExceptionInterface beneath it; HttpExceptionInterface covers a response
      whose status is unwelcome, with the client, server and redirection interfaces beneath it, and it
      alone exposes getResponse(). DecodingExceptionInterface sits apart on ExceptionInterface: a
      response did arrive, and its body simply could not be decoded.'
    official_sources:
      - url: https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Contracts/HttpClient/ResponseInterface.php
        readable_url: https://github.com/symfony/symfony/blob/8.0/src/Symfony/Contracts/HttpClient/ResponseInterface.php
        branch: '8.0'
        symbol_or_lines: toArray() @throws DecodingExceptionInterface
        verified_at: '2026-09-16'
