    question: A first DELETE returns 204, a second DELETE on the same URI returns 404. Why is DELETE still
      idempotent?
    scoring_policy: all-or-nothing
    shuffle_choices: true
    negative_wording: false
    estimated_time_seconds: 45
    classification: OFFICIAL
    pool: LEARNING
    verification_status: VERIFIED
    reviewers:
      - tech-lead
    reviewed_at: '2026-09-11'
    tags:
      - http-methods
      - idempotence
    choices:
      - id: CHO-veeedv4h504n
        text: Idempotence constrains the effect on state, not the status code returned
        correct: true
      - id: CHO-p3mttp3jvp7x
        text: It is not; a differing status code breaks idempotence
        correct: false
        explanation: Idempotence is defined on the effect of repeated requests, not on response equality.
      - id: CHO-scy7erntj3nm
        text: The 404 is a server defect; a conforming server repeats the original 204 response
        correct: false
        explanation: Returning 404 for an absent resource is correct, and RFC 9110 does not require the
          responses to match.
      - id: CHO-c6vhbrnd4tqh
        text: DELETE is idempotent only when the resource still exists
        correct: false
        explanation: The property is declared for the method itself, unconditionally.
    explanation: RFC 9110 section 9.2.2 defines idempotence on the intended effect of repeating a request.
      Deleting what is already deleted leaves the same state, so the differing status code is irrelevant
      to the property.
    official_sources:
      - url: https://raw.githubusercontent.com/httpwg/httpwg.github.io/master/specs/rfc9110.html
        branch: master
        symbol_or_lines: section 9.2.2 Idempotent Methods
        verified_at: '2026-09-11'
