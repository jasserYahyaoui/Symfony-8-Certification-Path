        correct: true
      - id: CHO-v6y3ezktt9yw
        text: Symfony throws an InvalidArgumentException while the cookie is built
        correct: false
        explanation: Cookie validates the name characters and the path and domain syntax, never the prefix.
      - id: CHO-h79s8ade6cm6
        text: ResponseHeaderBag adds the Secure attribute because of the prefix
        correct: false
        explanation: Neither Cookie nor ResponseHeaderBag contains the string __Host- at all.
      - id: CHO-jvtc1adwpxgt
