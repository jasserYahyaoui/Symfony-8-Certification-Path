    question: 'A server can return HTML or JSON. The client sends Accept: text/*;q=0.9, application/json;q=0.9.
      Which representation should be served?'
    scoring_policy: all-or-nothing
    shuffle_choices: true
    negative_wording: false
    estimated_time_seconds: 45
    classification: OFFICIAL
    pool: LEARNING
    verification_status: VERIFIED
    reviewers:
      - tech-lead
    reviewed_at: '2026-09-11'
    tags:
      - content-negotiation
      - accept
    choices:
      - id: CHO-qf4pajeqej06
        text: JSON, because at equal quality the more specific media range wins
        correct: true
      - id: CHO-bk480530tn6r
        text: HTML, because text/* appears first in the header
        correct: false
        explanation: Position carries no weight in RFC 9110; only quality and specificity do.
      - id: CHO-jfhgygxqzqkn
        text: Either one, because the quality factors are equal
        correct: false
        explanation: Specificity is the documented tie-break, so the choice is determined.
      - id: CHO-s1bc7cpvnyw5
        text: Neither, and 406 Not Acceptable is the correct answer
        correct: false
        explanation: Both ranges are acceptable at q=0.9; 406 applies when nothing is.
    explanation: Quality factors rank the ranges first; where they tie, the more specific range prevails,
      so application/json outranks text/*. Order of appearance never enters the computation.
    official_sources:
      - url: https://raw.githubusercontent.com/httpwg/httpwg.github.io/master/specs/rfc9110.html
        branch: master
        symbol_or_lines: section 12.5.1 Accept
        verified_at: '2026-09-11'
