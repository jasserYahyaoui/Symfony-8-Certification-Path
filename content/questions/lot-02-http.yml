    question: RFC 9110 calls header field names case-insensitive. What exactly does that cover?
    scoring_policy: all-or-nothing
    shuffle_choices: true
    negative_wording: false
    estimated_time_seconds: 55
    classification: OFFICIAL
    pool: LEARNING
    verification_status: VERIFIED
    reviewers:
      - tech-lead
    reviewed_at: '2026-09-17'
    tags:
      - rfc9110
    choices:
      - id: CHO-67vx7fnztze6
        text: The name only; each field's own grammar rules its value
        correct: true
      - id: CHO-r68rwev3cbkr
        text: Both the name and the value, so any comparison may ignore case
        correct: false
        explanation: Values follow the grammar of their own field. An ETag is compared byte for byte, and
          a URI path is case-sensitive.
      - id: CHO-xhwyj00es0m0
        text: Neither; names are registered and so must be matched exactly
        correct: false
        explanation: Section 5.1 says the opposite in one sentence. Field names are case-insensitive,
          and registration is a separate recommendation.
      - id: CHO-b1xm7gjj00cn
        text: The value only, the registry having already fixed every name
        correct: false
        explanation: Reversed. The registry lists names; it does not make them case-sensitive.
    explanation: 'Section 5.1 states it plainly: "Field names are case-insensitive". The rule stops at the
      name. Whether a value may be compared without regard to case is decided field by field — some are
      tokens, some are quoted strings, some carry a URI — so there is no single answer below the name.'
    official_sources:
      - url: https://raw.githubusercontent.com/httpwg/httpwg.github.io/master/specs/rfc9110.html
        readable_url: https://github.com/httpwg/httpwg.github.io/blob/master/specs/rfc9110.html
        branch: master
        symbol_or_lines: section 5.1 Field Names
        verified_at: '2026-09-17'
