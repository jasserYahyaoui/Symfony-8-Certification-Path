    question: A controller handling a POST sets an ETag and calls $response->isNotModified($request).
      The client did send a matching If-None-Match. What does the call return?
    scoring_policy: all-or-nothing
    shuffle_choices: true
    negative_wording: false
    estimated_time_seconds: 45
    classification: OFFICIAL
    pool: LEARNING
    verification_status: VERIFIED
