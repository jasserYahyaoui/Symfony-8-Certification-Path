    question: 'This code sets a cookie that reaches the browser without HttpOnly and without the intended
      path. Why?


      ```php

      $cookie = Cookie::create(''theme'');

      $cookie->withValue(''dark'');

      $cookie->withPath(''/admin'');

      $response->headers->setCookie($cookie);

      ```'
    scoring_policy: all-or-nothing
    shuffle_choices: true
    negative_wording: false
    estimated_time_seconds: 45
    classification: OFFICIAL
    pool: LEARNING
    verification_status: VERIFIED
    reviewers:
      - tech-lead
    reviewed_at: '2026-09-11'
    tags:
      - cookies
      - immutability
    choices:
      - id: CHO-ef29738ssr8n
        text: 'Cookie is immutable: each with*() returns a new instance, discarded here'
        correct: true
      - id: CHO-ber0mdr4s5mv
        text: setCookie() only accepts a Cookie built through its constructor, not through create()
        correct: false
        explanation: create() returns a perfectly valid Cookie; the defect is that the chained calls are
          dropped.
      - id: CHO-r93q3s8g9b1p
        text: withPath() is applied only after withValue() has been persisted
        correct: false
        explanation: There is no ordering constraint; neither call mutates the original object.
      - id: CHO-e5zyw9jqq7ze
        text: HttpOnly must be set explicitly or it defaults to false
        correct: false
        explanation: Cookie::create() defaults httpOnly to true, so that attribute was never the problem.
    explanation: Every with*() method clones the cookie and returns the clone. Calling them without keeping
      the return value leaves the original untouched, so the cookie sent is the one create() produced.
    official_sources:
