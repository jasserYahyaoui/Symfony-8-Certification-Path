    question: >-
      Which RFC defines HTTP caching, as distinct from HTTP semantics?
    scoring_policy: all-or-nothing
    shuffle_choices: true
    negative_wording: false
    estimated_time_seconds: 40
    classification: OFFICIAL
    pool: LEARNING
    verification_status: VERIFIED
    reviewers: [tech-lead]
    reviewed_at: "2026-09-01"
    tags: [rfc9110]
    choices:
      - id: CHO-1w4eatstphjk
        text: "RFC 9111"
        correct: true
      - id: CHO-m7wne42v4xd7
        text: "RFC 9110"
        correct: false
        explanation: >-
          9110 defines semantics: methods, status codes, header fields and negotiation. Caching was split into its own document.
      - id: CHO-a5m918yvfkx8
        text: "RFC 9112"
        correct: false
        explanation: >-
          9112 specifies HTTP/1.1 message framing, not caching.
      - id: CHO-fcn7g6h1a4rz
        text: "RFC 2616"
        correct: false
        explanation: >-
          2616 is the obsolete single document that the 911x series replaced.
    explanation: >-
      The 911x series splits HTTP: 9110 semantics, 9111 caching, 9112 HTTP/1.1, 9113 HTTP/2, 9114 HTTP/3.
