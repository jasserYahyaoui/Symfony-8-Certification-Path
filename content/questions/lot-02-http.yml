    question: Fifty HttpClient requests are issued in a loop, each followed immediately by $response->toArray().
      They run sequentially. Why?
    scoring_policy: all-or-nothing
    shuffle_choices: true
    negative_wording: false
    estimated_time_seconds: 80
    classification: OFFICIAL
    pool: LEARNING
    verification_status: VERIFIED
    reviewers:
      - tech-lead
    reviewed_at: '2026-09-01'
    tags:
      - httpclient
    choices:
      - id: CHO-jcnpk1jm9dy2
        text: Reading a response inside the emitting loop serialises the requests
        correct: true
      - id: CHO-x6qg0apmangv
        text: HttpClient is synchronous by default
        correct: false
        explanation: request() is asynchronous and returns before the response arrives; the blocking happens
          on first read.
      - id: CHO-20j0hekhy15z
        text: toArray() cannot be used on responses that were issued concurrently
        correct: false
        explanation: toArray() works fine on concurrent responses once they have been issued.
      - id: CHO-e8p2cfwd5p5n
        text: A timeout option is required to enable concurrency
        correct: false
        explanation: Concurrency is the default behaviour; no option enables it.
    explanation: request() returns immediately. Awaiting happens on the first read of a response, so reading
      inside the emitting loop serialises everything. Issue all requests first, then read — or use stream().
