    question: A Symfony response is left at its default cacheability, then setSharedMaxAge(600) is called
      and nothing else. Which Cache-Control directives does it carry?
    scoring_policy: all-or-nothing
    shuffle_choices: true
    negative_wording: false
    estimated_time_seconds: 45
    classification: OFFICIAL
    pool: LEARNING
    verification_status: VERIFIED
    reviewers:
      - tech-lead
    reviewed_at: '2026-09-11'
    tags:
      - caching
      - cache-control
    choices:
      - id: CHO-zgdfcdsqbnjf
        text: public and s-maxage=600, because setSharedMaxAge() calls setPublic() itself
        correct: true
      - id: CHO-nbfhs1z5an60
        text: private and s-maxage=600, because the default is private and was not changed
        correct: false
        explanation: 'The default is indeed private, but setSharedMaxAge() flips it: shared freshness
          on a private response would be contradictory.'
      - id: CHO-rvx9e40rszmh
        text: public and max-age=600, because s-maxage is an alias
        correct: false
        explanation: They are distinct directives; s-maxage binds shared caches only.
      - id: CHO-weepqvwx5pm4
        text: s-maxage=600 alone, leaving cacheability unstated
        correct: false
        explanation: The public directive is added explicitly by the same call.
    explanation: 'setSharedMaxAge() is not only a setter: it calls setPublic() before adding the s-maxage
      directive, removing the private directive in the process. Declaring a shared freshness lifetime
      on a response no shared cache may store would otherwise be meaningless.'
    official_sources:
