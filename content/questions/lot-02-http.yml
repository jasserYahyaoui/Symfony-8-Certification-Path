    question: A request arrives as /search?tags[]=php&tags[]=http. What does $request->query->get('tags')
      do?
    scoring_policy: all-or-nothing
    shuffle_choices: true
    negative_wording: false
    estimated_time_seconds: 65
    classification: OFFICIAL
    pool: LEARNING
    verification_status: VERIFIED
    reviewers:
      - tech-lead
    reviewed_at: '2026-09-01'
    tags:
      - request
      - inputbag
    choices:
      - id: CHO-34se1p0kj0nt
        text: It throws a BadRequestException
        correct: true
      - id: CHO-cgkcm8y9ktep
        text: It returns ['php', 'http']
        correct: false
        explanation: That is what all('tags') returns. get() is restricted to scalar values.
      - id: CHO-j06d2envyqbt
        text: It returns 'php', the first value
        correct: false
        explanation: InputBag does not silently pick a value; it refuses the whole access.
      - id: CHO-6bhyq1nynn4x
        text: It returns null
        correct: false
        explanation: The key exists, so this is not a missing-key case; the value's shape is the problem.
    explanation: $query is an InputBag, whose get() accepts only scalars and throws BadRequestException
      otherwise. Use all() for multi-valued input.
    official_sources:
