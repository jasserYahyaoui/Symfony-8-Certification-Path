    type: mcq
    answer_mode: single
    required_answer_count: 1
    question: >-
      A Response carries status 304. What do isRedirection() and isRedirect() return?
    scoring_policy: all-or-nothing
    shuffle_choices: true
    negative_wording: false
    estimated_time_seconds: 75
    classification: OFFICIAL
    pool: LEARNING
    verification_status: VERIFIED
    reviewers: [tech-lead]
    reviewed_at: "2026-09-01"
    tags: [response]
    choices:
      - id: CHO-fgs0ch1d6fby
        text: "isRedirection() true, isRedirect() false"
        correct: true
      - id: CHO-wd30jcs2x50v
        text: "Both true"
        correct: false
        explanation: >-
          isRedirect() checks an explicit list — 201, 301, 302, 303, 307, 308 — which excludes 304.
      - id: CHO-bjehqmw9yjab
        text: "Both false"
        correct: false
        explanation: >-
          304 is in the 3xx class, so isRedirection() is true by definition.
      - id: CHO-egvs9886p2pc
        text: "isRedirection() false, isRedirect() true"
        correct: false
        explanation: >-
          This inverts both: 304 is 3xx, and it is absent from the isRedirect() list.
    explanation: >-
      isRedirection() is literally 300 <= code < 400. isRedirect() is an explicit list of statuses that actually carry a Location header: it includes 201 and excludes 300 and 304.
    official_sources:
      - url: "https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/HttpFoundation/Response.php"
        repository: "symfony/symfony"
        branch: "8.0"
        commit_sha: "6f841c00f41e5c037d40e1d739e2dc602c8f289d"
        symbol_or_lines: "isRedirect line 1254, isRedirection line 1194"
        verified_at: "2026-09-01"
