        text: The runner flushes the output itself, then calls terminate()
        correct: true
      - id: CHO-r8d2z4e8tfb8
        text: Response::send() returns before any byte has left the process
        correct: false
        explanation: send() writes the headers and echoes the body synchronously.
      - id: CHO-bzts80kgxw2v
