    explanation: '__Host- is a naming rule enforced by the user agent, which demands Secure, Path=/ and
      no Domain. The match is asymmetric and deliberately so: a server writes the prefix exactly, while
      a UA MUST recognise it case-insensitively, so that a third party cannot slip a __SeCuRe-SID past
      a server that compares without case either. Symfony 8.0 implements no part of it, so the mistake
