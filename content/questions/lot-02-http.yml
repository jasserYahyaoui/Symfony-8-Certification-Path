    question: >-
      Which Cache-Control directive prevents a response from being stored at all?
    scoring_policy: all-or-nothing
    shuffle_choices: true
    negative_wording: false
    estimated_time_seconds: 65
    classification: OFFICIAL
    pool: LEARNING
    verification_status: VERIFIED
    reviewers: [tech-lead]
    reviewed_at: "2026-09-01"
    tags: [caching]
    choices:
      - id: CHO-2g8cydpzhm6h
        text: "no-store"
        correct: true
      - id: CHO-jpsnta2c69j4
        text: "no-cache"
        correct: false
        explanation: >-
          Despite the name, no-cache allows storage and requires revalidation before each reuse.
      - id: CHO-fp224c7km0d1
        text: "private"
        correct: false
        explanation: >-
          private forbids shared caches from storing it, but the browser's own cache still may.
      - id: CHO-9kmbpzzghhts
        text: "max-age=0"
        correct: false
        explanation: >-
          That makes the response immediately stale, so it must be revalidated — but it is still stored.
    explanation: >-
      no-cache means store but revalidate. no-store is the directive that forbids retaining the response.
    official_sources:
      - url: "https://raw.githubusercontent.com/httpwg/httpwg.github.io/master/specs/rfc9111.html"
        branch: "master"
        symbol_or_lines: "section 5.2 Cache-Control"
        verified_at: "2026-09-01"
