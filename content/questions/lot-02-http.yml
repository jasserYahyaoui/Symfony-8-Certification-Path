    reviewed_at: '2026-09-11'
    tags:
      - caching
      - validation
    choices:
      - id: CHO-x4rahnpn6y0r
        text: 'false: the method returns early unless the request method is cacheable'
        correct: true
      - id: CHO-1ps2249j2tzv
        text: true, because the ETag matches what the client holds
        correct: false
        explanation: 'The ETag comparison is never reached: the method checks the request method first.'
      - id: CHO-wk333467tvpf
        text: true, and the response status becomes 304 with an empty body
        correct: false
        explanation: That is the outcome on a cacheable method such as GET, not on a POST.
      - id: CHO-ge8rz1jk4jsk
        text: It throws, because response validation is undefined for methods that are unsafe
        correct: false
        explanation: No exception is raised; the method simply reports that the response is not unmodified.
    explanation: isNotModified() begins with a guard on Request::isMethodCacheable(). Validation is only
      meaningful for GET, HEAD and QUERY, so on a POST the method returns false before comparing anything.
