    scoring_policy: all-or-nothing
    shuffle_choices: true
    negative_wording: false
    estimated_time_seconds: 75
    classification: OFFICIAL
    pool: LEARNING
    verification_status: VERIFIED
    reviewers: [tech-lead]
    reviewed_at: "2026-09-01"
    tags: [caching, negotiation]
    choices:
      - id: CHO-9qgrr3eb299q
        text: "Vary: Accept-Language"
        correct: true
      - id: CHO-erq2nb40dejp
        text: "Content-Language: fr"
        correct: false
        explanation: >-
          Content-Language documents the language served, but a cache does not use it to key stored entries.
      - id: CHO-576qsd64x3n4
        text: "Cache-Control: private"
        correct: false
        explanation: >-
          That would disable shared caching entirely — it hides the bug rather than fixing the negotiation.
      - id: CHO-5j3krn26vkm6
        text: "A shorter max-age"
        correct: false
        explanation: >-
          A shorter lifetime reduces how long the wrong language is served; it does not stop it being served.
    explanation: >-
      Vary declares which request headers change the representation, so the shared cache keys entries by them. Negotiating without Vary is the classic cache bug — and it has no symptom locally, where no shared cache exists.
