    question: One URI serves French HTML to one client and English JSON to another. A shared cache sits
      in front. Why must the response name, in Vary, the request fields used to choose?
    scoring_policy: all-or-nothing
    shuffle_choices: true
    negative_wording: false
    estimated_time_seconds: 75
    classification: OFFICIAL
    pool: LEARNING
    verification_status: VERIFIED
    reviewers:
      - tech-lead
    reviewed_at: '2026-09-16'
    tags:
      - rfc9110
      - vary
    choices:
      - id: CHO-pgjrzas4as8t
        text: A cache stores representations, not resources
        correct: true
      - id: CHO-v9f4h076rqxs
        text: Without Vary a resource may not hold several representations
        correct: false
        explanation: A resource may always have several; Vary changes how a cache reuses them, not whether
          they may exist.
      - id: CHO-93g0rnd1567d
        text: Vary is the field by which the server picks the representation
        correct: false
        explanation: The server picks from the request's own fields. Vary reports, afterwards, which ones
          it used.
      - id: CHO-j0xh0ees11me
        text: The resource itself changes each time a representation changes
        correct: false
        explanation: The resource is the identified thing and does not change because one of its forms
          differs.
    explanation: This is the whole payoff of the resource/representation distinction. The URI identifies
      one resource, but what a cache holds is one concrete representation. Without Vary the cache has
      no way to know that the stored copy was chosen for a French reader, and it will hand that copy to
      the English one.
    official_sources:
      - url: https://raw.githubusercontent.com/httpwg/httpwg.github.io/master/specs/rfc9110.html
        readable_url: https://github.com/httpwg/httpwg.github.io/blob/master/specs/rfc9110.html
        branch: master
        symbol_or_lines: section 3.1 Resources, section 3.2 Representations, section 12.5.5 Vary
        verified_at: '2026-09-16'
