    question: >-
      Behind a load balancer, getClientIp() returns the balancer's address instead of the visitor's. Why is that the default?
    scoring_policy: all-or-nothing
    shuffle_choices: true
    negative_wording: false
    estimated_time_seconds: 85
    classification: OFFICIAL
    pool: HOLDOUT
    verification_status: VERIFIED
    reviewers: [tech-lead]
    reviewed_at: "2026-09-01"
    tags: [request, security]
    choices:
      - id: CHO-tf0n2txz0psb
        text: "Trusted proxies have not been configured, so Symfony ignores X-Forwarded-For"
        correct: true
      - id: CHO-tp0g585arhec
        text: "getClientIp() never reads forwarded headers"
        correct: false
        explanation: >-
          It does read them — but only once the proxies are declared trusted.
      - id: CHO-7zat3zjzp1qy
        text: "The balancer must be configured to send X-Real-IP instead"
        correct: false
        explanation: >-
          Symfony understands the standard forwarded headers; the missing piece is the trust declaration, not the header name.
      - id: CHO-t67cned43f64
        text: "getClientIps() must be used for proxied requests"
        correct: false
        explanation: >-
          getClientIps() returns the whole chain but is governed by the same trust configuration.
    explanation: >-
      Any client can forge X-Forwarded-For, so Symfony ignores it until setTrustedProxies() or the trusted_proxies configuration declares which hops may be believed. Returning the proxy address is the safe default.
