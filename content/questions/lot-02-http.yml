    reviewed_at: '2026-09-01'
    tags:
      - cookies
    choices:
      - id: CHO-r4z9x05zskf4
        text: The Secure attribute
        correct: true
      - id: CHO-ds2qbdsjfr0r
        text: The HttpOnly attribute
        correct: false
        explanation: HttpOnly hides the cookie from JavaScript; it has no bearing on whether the cookie
          is accepted.
      - id: CHO-73cfnrwhma0s
        text: An explicit Domain attribute
        correct: false
        explanation: Domain defaults to the current host; omitting it does not cause rejection.
      - id: CHO-416w1w6gag82
        text: A future Expires value
        correct: false
        explanation: Without Expires the cookie is a session cookie, which is still stored for the session.
    explanation: SameSite=none requires Secure. Without it browsers reject the cookie outright — not a
      warning, no cookie at all.
