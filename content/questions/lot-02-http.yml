    reviewed_at: "2026-09-01"
    tags: [methods]
    choices:
      - id: CHO-sd8z7r96jd7m
        text: "GET, HEAD and QUERY"
        correct: true
      - id: CHO-882qyj958snp
        text: "GET, HEAD, OPTIONS and TRACE"
        correct: false
        explanation: >-
          Those are the SAFE methods. Safe and cacheable are independent properties: OPTIONS and TRACE are safe but not cacheable.
      - id: CHO-gdjz7daepj12
        text: "Every idempotent method"
        correct: false
        explanation: >-
