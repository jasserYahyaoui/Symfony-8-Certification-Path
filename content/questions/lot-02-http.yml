    choices:
      - id: CHO-c7wn40vx64tw
        text: "600 seconds"
        correct: true
      - id: CHO-j90hg99mvhj7
        text: "60 seconds"
        correct: false
        explanation: >-
          max-age applies to private caches; s-maxage overrides it for shared caches such as a CDN.
      - id: CHO-1exwna1bpr47
        text: "The lower of the two, 60 seconds"
        correct: false
        explanation: >-
