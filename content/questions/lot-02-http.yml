    reviewed_at: '2026-09-01'
    tags:
      - methods
    choices:
      - id: CHO-j6x436jej9k5
        text: PUT
        correct: true
      - id: CHO-5m4aehqtvv48
        text: DELETE
        correct: true
      - id: CHO-hnc53r7rgx61
        text: POST
        correct: false
        explanation: 'POST is neither safe nor idempotent: two identical POSTs create two resources.'
      - id: CHO-jjg1dygvetjy
        text: GET
        correct: false
        explanation: GET is safe, and every safe method is idempotent — so it fails the 'not safe' half.
    explanation: Safe means read-only; idempotent means replaying has the same effect as one call. PUT
      replaces with the same value and DELETE removes what is already gone, so both are idempotent while
      still modifying state.
