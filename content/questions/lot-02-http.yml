    question: Which document specifies the chunked transfer coding?
    scoring_policy: all-or-nothing
    shuffle_choices: true
    negative_wording: false
    estimated_time_seconds: 45
    classification: OFFICIAL
    pool: LEARNING
    verification_status: VERIFIED
    reviewers:
      - tech-lead
    reviewed_at: '2026-09-16'
    tags:
      - rfc9110
    choices:
      - id: CHO-p46de72r8451
        text: RFC 9112, with the rest of HTTP/1.1 framing
        correct: true
      - id: CHO-bc9422sam6fw
        text: RFC 9110, beside the message abstraction it defines
        correct: false
        explanation: 9110 specifies no framing SYNTAX. Section 6.1, Framing and Completeness, leaves the
          mechanism itself to each major version, which is what makes the semantics portable.
      - id: CHO-pyhfv136n8js
        text: RFC 9111, since chunking changes what a cache may store
        correct: false
        explanation: 9111 is about caching rules. How the bytes were framed on arrival is not its subject.
      - id: CHO-0xe3h5p280ta
        text: RFC 9110, among the rules governing representation data
        correct: false
        explanation: Representation data is what the content means; chunking is how one version delimits
          it.
    explanation: Chunking exists only because HTTP/1.1 needs a way to delimit a body of unknown length.
      HTTP/2 and HTTP/3 frame messages themselves and have no equivalent, which is exactly why the coding
      lives in the HTTP/1.1 document rather than in the semantics one.
