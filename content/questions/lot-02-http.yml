    question: RFC 9110 defines a message as control data, header fields, content and trailers. Where is
      the HTTP/1.1 request line specified?
    scoring_policy: all-or-nothing
    shuffle_choices: true
    negative_wording: false
    estimated_time_seconds: 60
    classification: OFFICIAL
    pool: LEARNING
    verification_status: VERIFIED
    reviewers:
      - tech-lead
    reviewed_at: '2026-09-16'
    tags:
      - rfc9110
    choices:
      - id: CHO-j259jqym8tmk
        text: In RFC 9112, as one framing of the control data
        correct: true
      - id: CHO-01x0apfja8v7
        text: In RFC 9110, as the first element of the message abstraction
        correct: false
        explanation: The abstraction names control data, not a line. A line is what one particular version
          uses to carry it.
      - id: CHO-7capkj6j5j3q
        text: In RFC 9110, beside the method definitions it already carries
        correct: false
        explanation: 9110 defines what the methods mean, never how a version writes them on the wire.
      - id: CHO-869t5r16v4wb
        text: Identically in 9112, 9113 and 9114, the line being shared
        correct: false
        explanation: HTTP/2 and HTTP/3 carry the same control data in binary frames and pseudo-header fields,
          with no request line at all.
    explanation: The abstraction exists so that one set of semantics can survive three transports. Control
      data is the abstract slot; the request line is HTTP/1.1's way of filling it, and that is why it
      belongs to 9112.
    official_sources:
      - url: https://raw.githubusercontent.com/httpwg/httpwg.github.io/master/specs/rfc9110.html
        readable_url: https://github.com/httpwg/httpwg.github.io/blob/master/specs/rfc9110.html
        branch: master
        symbol_or_lines: section 6 Message Abstraction, and section 6.2 Control Data
        verified_at: '2026-09-16'
