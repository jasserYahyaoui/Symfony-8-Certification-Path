    correct: true
  - id: CHO-5m3pr8d35x3a
    text: The locale only; the domain is declared in the configuration
    correct: false
    explanation: The domain is part of the file name, not of the configuration.
  - id: CHO-18y6pepb3ve3
    text: The bundle name and the locale
