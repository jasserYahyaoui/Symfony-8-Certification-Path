  type: mcq
  answer_mode: single
  required_answer_count: 1
  question: The locale is es_AR and a key is missing from messages.es_AR.yaml. What does Symfony try before the
    configured fallback?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 65
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-02'
  tags:
  - fallback
  choices:
  - id: CHO-fd14677rv6j7
    text: The parent locale, then the language alone
    correct: true
  - id: CHO-3hk6xg3d67tp
    text: The language alone, and nothing else
    correct: false
    explanation: A parent locale is tried first, where one is defined.
  - id: CHO-vfhct3h9bk9c
    text: The default locale immediately
    correct: false
    explanation: The default locale is only reached through the fallbacks option, at the end.
  - id: CHO-zb76szsqk8jc
    text: Every locale that has a catalogue, in alphabetical order
    correct: false
    explanation: The search follows a defined chain, not the list of available catalogues.
  explanation: es_AR, then es_419 (defined automatically for some locales only), then es, then the fallbacks option,
    which defaults to default_locale.
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/translation.rst
    branch: '8.0'
    symbol_or_lines: translation-fallback
    verified_at: '2026-09-02'
