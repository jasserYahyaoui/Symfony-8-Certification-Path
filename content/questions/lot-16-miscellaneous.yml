  question: A catalogue writes Hello {name}! and the page shows the braces literally. What is missing?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 55
  classification: OFFICIAL
  pool: VALIDATION
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-02'
  tags:
  - icu
  choices:
  - id: CHO-qqtffs70b9gr
    text: The +intl-icu suffix in the file name, which is what routes the catalogue through the ICU formatter
    correct: true
  - id: CHO-6f0mpdq4fg0b
    text: A configuration key enabling ICU support
    correct: false
    explanation: There is no such key; the file name is the trigger.
  - id: CHO-m549b2mrmp1h
    text: The intl PHP extension, without which braces are ignored
    correct: false
    explanation: A missing extension would not silently print the braces; the catalogue was simply not treated as
      ICU.
  - id: CHO-21562k4xh93n
    text: Percent signs around the placeholder
    correct: false
    explanation: That is the classic syntax, which would mean rewriting the message rather than fixing the catalogue.
  explanation: messages+intl-icu.en.yaml is processed by MessageFormatter; without the suffix the message is treated
    as a plain string.
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/reference/formats/message_format.rst
    branch: '8.0'
    symbol_or_lines: using-the-icu-message-format
    verified_at: '2026-09-02'
