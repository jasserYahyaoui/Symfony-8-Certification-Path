  question: 'A Serializer is built with ObjectNormalizer, DateTimeNormalizer, BackedEnumNormalizer and JsonEncoder.
    For which value does the normalization step return an array?'
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 50
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-10-13'
  tags:
  - process
  - architecture
  choices:
  - id: CHO-bhd1zdsc4se4
    text: An object with public properties
    correct: true
  - id: CHO-6132d7xzrbbz
    text: A DateTimeImmutable instance
    correct: false
    explanation: DateTimeNormalizer returns an RFC 3339 string, which the encoder writes as a JSON string.
  - id: CHO-s007zctbbbaw
    text: A case of a string-backed enum
    correct: false
    explanation: BackedEnumNormalizer returns the case's backing value, here a string.
  - id: CHO-0c4xamsdd5pw
    text: The integer 42 on its own
    correct: false
    explanation: The Serializer returns null and scalars unchanged; JSON encodes 42 as 42.
  explanation: 'Normalizing then encoding are two responsibilities, but the normalized form is not always an array: normalize()
    may return array, string, int, float, bool, ArrayObject or null. Executed with Serializer 8.0.15.'
  official_sources:
