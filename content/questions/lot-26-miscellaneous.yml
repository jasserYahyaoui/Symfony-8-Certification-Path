  required_answer_count: 1
  question: Between an object and the produced format, which intermediate representation does the data always pass
    through, in both directions?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 50
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-02'
  tags:
  - process
  - architecture
  choices:
  - id: CHO-bhd1zdsc4se4
    text: An array
    correct: true
  - id: CHO-6132d7xzrbbz
    text: A string in the target format, refined in a second pass
    correct: false
    explanation: The format is produced only at the last step.
  - id: CHO-s007zctbbbaw
    text: A stream the encoder consumes lazily
    correct: false
    explanation: Streaming is not what the two-step split is about.
  - id: CHO-0c4xamsdd5pw
    text: None; the object is written straight to the format
    correct: false
    explanation: The documented process has two distinct responsibilities.
  explanation: 'Data is always converted to an array first: normalizers handle object to array, encoders handle array
    to format.'
  official_sources:
