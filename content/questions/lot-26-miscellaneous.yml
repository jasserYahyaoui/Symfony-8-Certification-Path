  choices:
  - id: CHO-5k7cx3dmx76g
    text: A sorted list of normalizers, one encoder
    correct: true
  - id: CHO-tf1z40p7m3sw
    text: One normalizer and one encoder
    correct: false
    explanation: Normalizers are consulted as an ordered list until one handles the value.
  - id: CHO-1s09bh159c55
    text: One normalizer and a list of encoders
