  question: Two objects reference each other. What happens by default, and after how many passes over the same object?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 55
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-02'
  tags:
  - circular
  - defaults
  choices:
  - id: CHO-v5sfa7b0mjya
    text: An exception is raised, once the same object has been serialized one time
    correct: true
  - id: CHO-w3z62phvpz5t
    text: An exception is raised immediately, before any pass
    correct: false
    explanation: A threshold governs it, and it is not zero.
  - id: CHO-8agn5azbzb4v
    text: The nested object is silently replaced by its identifier
    correct: false
    explanation: That is opt-in behaviour, not the default.
  - id: CHO-erqbpj6pgxnn
    text: Serialization continues until memory is exhausted
    correct: false
    explanation: The component guards against the infinite loop.
  explanation: A CircularReferenceException is thrown, and circular_reference_limit — the number of times the same
    object is serialized before being treated as circular — defaults to 1.
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/serializer.rst
