  choices:
  - id: CHO-yhrtaw5m0g09
    text: Public properties and get/has/is/can methods; ignore it
    correct: true
  - id: CHO-jrr2t2cd3y33
    text: Every property, whatever its visibility; give it a different name
    correct: false
    explanation: Private and protected properties are not read directly, and a new name changes the key, not
      its presence.
  - id: CHO-cxpang3bha6h
    text: Only properties with a getter; remove the getter
    correct: false
    explanation: Public properties are taken as well, so removing a getter is not enough for them.
  - id: CHO-tss481g27vp5
    text: Everything, with no way to exclude a member
    correct: false
    explanation: An attribute exists precisely for that.
  explanation: The default reach is wide on purpose, which is why an object with a computed accessor
    exposes more than expected. The ignore attribute removes one member; groups are the tool when whole
    sets have to differ per context. Executed on Serializer 8.0.15, a public property and the get, is,
    has and can methods were output, while protected and private properties without an accessor were
    not. Version 1 said that properties are taken without qualification and offered making the property
    private as a wrong answer, which works when no accessor exposes it.
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/serializer.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/serializer.rst
