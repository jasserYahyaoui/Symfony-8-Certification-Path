    text: 'An object of the date''s getters: timezone, offset, timestamp, microsecond'
    correct: true
  - id: CHO-tzthc0n1ywrq
    text: The string "2026-01-02T03:04:05+00:00", produced by DateTimeNormalizer
    correct: false
    explanation: That is the output when DateTimeNormalizer is listed before ObjectNormalizer.
  - id: CHO-wt7yvhxcyrvb
    text: A LogicException, because two normalizers both support the date
    correct: false
