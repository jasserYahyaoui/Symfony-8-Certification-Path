  choices:
  - id: CHO-j166pkf4f84w
    text: An Order whose qty is the int 7
    correct: true
  - id: CHO-jpf8gt9z5fw5
    text: 'A NotNormalizableValueException: string given for an int'
    correct: false
    explanation: That is what happens with a type extractor, as the framework service has; without one, PHP coerces the
      string.
  - id: CHO-rkjxr8cdhhts
    text: An Order whose qty keeps its default value
    correct: false
    explanation: The key is present, so the property is written.
  - id: CHO-zanres64yv0k
    text: A TypeError thrown by PHP and not caught by Symfony
    correct: false
    explanation: '"7" is a numeric string, which PHP coerces to int; a non-numeric string is turned into a NotNormalizableValueException.'
  explanation: Type checks during denormalization come from the property type extractor. Without it, assignment follows
    PHP coercion, so "7" becomes 7, while the framework service, which receives property_info, rejects the same input. Executed
    with Serializer 8.0.15.
