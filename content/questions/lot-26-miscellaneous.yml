  question: A class has four properties. Three carry a group annotation, one carries none. The output is produced
    while asking for one of those groups, and the unannotated property is absent. Is that a defect?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 65
  classification: OFFICIAL
  pool: VALIDATION
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-02'
  tags:
  - groups
  - selection
  choices:
  - id: CHO-vbq0s1bjrk17
    text: No; once a group is requested, a property in no group is left out
    correct: true
  - id: CHO-6rm8pta228d8
    text: Yes; an unannotated property is treated as belonging to every group
    correct: false
    explanation: 'The opposite holds: it belongs to none.'
  - id: CHO-52qv5j4n671y
    text: Yes; the property was excluded because it had no accessor method
    correct: false
    explanation: Absence of a group, not of an accessor, explains it.
  - id: CHO-2dw3g9g5ypnw
    text: No, but only because the property held a null value at that moment
    correct: false
    explanation: The value plays no part in this exclusion.
  explanation: Groups exclude in one place and keep in another; a property with no group declared does not appear
    once a group is requested.
