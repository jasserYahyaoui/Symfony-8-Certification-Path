  question: Two different timeouts can be set on a process. What does the second one measure?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 45
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-12'
  tags:
  - process
  - timeouts
  choices:
  - id: CHO-p5m26tyfjjr2
    text: The time since the last output
    correct: true
  - id: CHO-e9z3aw1646tj
    text: The time spent waiting to start
    correct: false
    explanation: Neither timeout covers the launch itself.
  - id: CHO-rt0kstkr8k54
    text: The time allowed for the output buffer to drain
    correct: false
    explanation: Buffer draining is not what either timeout watches.
  - id: CHO-9t0as0rpxmc0
    text: The time between two signals sent to the process
    correct: false
    explanation: Signals are unrelated to both timeouts.
  explanation: One bounds the total runtime, the other the silence. A process is timed out when either
    is exceeded, which is how a long but chatty job is distinguished from a hung one. Disabling output
    collection makes the idle one unavailable — it has nothing to watch.
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/components/process.rst
    repository: symfony/symfony-docs
    branch: '8.0'
    symbol_or_lines: the idle timeout only considers the time since the last output
    verified_at: '2026-09-12'
