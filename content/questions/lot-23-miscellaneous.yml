  question: A command is defined as a plain string rather than as a list of arguments. What does the developer take
    on by doing so?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 55
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-02'
  tags:
  - arguments
  - shell
  choices:
  - id: CHO-9vfz1x9hpgvw
    text: Escaping and portability across operating systems
    correct: true
  - id: CHO-cjj44vft3ja1
    text: Nothing; the two forms are handled identically
    correct: false
    explanation: The list form is the one that handles escaping for you.
  - id: CHO-933kmbrndqge
    text: Only the choice of which shell interprets the command
    correct: false
    explanation: The shell is not selected by the developer here.
  - id: CHO-xwrx9922vtxg
    text: Responsibility for reading the output, which the list form does automatically
    correct: false
    explanation: Output retrieval is the same in both forms.
  explanation: The array of arguments is the recommended form because it saves the developer from escaping; a string
    is for shell features, and then escaping and portability become the developer's responsibility.
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/components/process.rst
    branch: '8.0'
    symbol_or_lines: using-features-from-the-os-shell
    verified_at: '2026-09-02'
