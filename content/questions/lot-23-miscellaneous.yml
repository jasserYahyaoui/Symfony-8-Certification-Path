  question: A process can be launched blocking or non-blocking. What does the blocking form give that
    the other does not?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 45
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-12'
  tags:
  - process
  - execution
  choices:
  - id: CHO-gxr8rc1d3n0p
    text: The command has finished when it returns
    correct: true
  - id: CHO-bjgq7svx993s
    text: It raises an exception when the command fails
    correct: false
    explanation: Neither form throws on a non-zero exit by itself; the result has to be checked.
  - id: CHO-t160g0t3y649
    text: It captures the output, which the other discards
    correct: false
    explanation: Both collect output unless collection is disabled.
  - id: CHO-2gd7k5t0d20q
    text: It applies the timeout, which the other ignores
    correct: false
    explanation: A timeout can be set on either; what differs is who watches it.
  explanation: The blocking call returns only once the command has exited, so the exit status and the
    whole output are immediately readable. The non-blocking one returns at once, which is why anything
    time-based then needs an explicit check from the caller.
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/components/process.rst
    repository: symfony/symfony-docs
    branch: '8.0'
    symbol_or_lines: run() executes after the command finishes; asynchronous processes
    verified_at: '2026-09-12'
