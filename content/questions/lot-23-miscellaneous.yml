  language: en
  difficulty: hard
  cognitive_level: UNDERSTAND
  exam_skill: DIAGNOSE
  type: mcq
  answer_mode: single
  required_answer_count: 1
  question: A long-running external program is started without blocking, and a time limit was configured on it. The
    program overruns that limit and nothing interrupts it. Why?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 65
  classification: OFFICIAL
  pool: VALIDATION
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-02'
  tags:
  - timeout
  - async
  choices:
  - id: CHO-2avn0t7aef3x
    text: On a process started without blocking, the limit is not watched for you; the caller has to check it periodically
    correct: true
  - id: CHO-2nms5z067wxw
    text: The limit only applies to the error output, not to the total runtime
    correct: false
    explanation: The limit configured here bounds the total runtime.
  - id: CHO-j70tacm8jg5d
    text: The limit was silently replaced by the operating system's own maximum
    correct: false
    explanation: No such substitution takes place.
  - id: CHO-23bn90r42j3r
    text: A limit cannot be set at all on a program started without blocking
    correct: false
    explanation: It can be set; it simply is not enforced without a check.
  explanation: The documentation states that for long running commands it is the caller's responsibility to perform
    the timeout check regularly.
  official_sources:
