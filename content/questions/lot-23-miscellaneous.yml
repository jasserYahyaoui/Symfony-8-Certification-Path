  question: Output collection is switched off on a process to save memory. Which configuration call also becomes unavailable
    as a result?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 55
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-02'
  tags:
  - output
  - timeout
  choices:
  - id: CHO-h3vze7nt7ry2
    text: The one that limits how long the process may go without producing anything
    correct: true
  - id: CHO-1896yvn4g4mh
    text: The one that limits total runtime
    correct: false
    explanation: The total runtime limit stays available.
  - id: CHO-8fdcp6ezesxq
    text: The one that sets environment variables for the process
    correct: false
    explanation: Environment variables are unaffected.
  - id: CHO-085v7j5v2kzk
    text: The one that stops the process
    correct: false
    explanation: Stopping the process remains available.
  explanation: Disabling output makes the output getters and the idle timeout setter unavailable, because the idle
    timeout is measured from the output the process produces.
