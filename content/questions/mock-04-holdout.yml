    text: '`isOk()` false, since it is true only for exactly 200, and `isSuccessful()` true, since it covers 200 to 299'
    correct: true
  - id: CHO-0d0zperf67fg
    text: 'Both true: `isOk()` covers the whole 2xx class, of which 204 is a member'
    correct: false
    explanation: '`isOk()` compares the status to 200 exactly. The class-wide predicate is `isSuccessful()`.'
  - id: CHO-mjstka7pkck0
