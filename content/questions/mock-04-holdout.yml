  question: A controller has established that the client's cached copy is still valid. Which Response method answers correctly,
    and what does `expire()` do?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 65
  classification: OFFICIAL
  pool: HOLDOUT
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-03'
  tags:
  - http-caching
  - response
  choices:
  - id: CHO-mbt6eqm7a12f
    text: '`setNotModified()`, which forces a proper 304 response with no content; `expire()` does the opposite job and
      marks the response stale'
    correct: true
  - id: CHO-vth4xnr39pmb
    text: '`expire()`, which sends the 304, while `setNotModified()` strips the validation headers'
    correct: false
    explanation: 'The two roles are reversed: `expire()` marks the response stale, and `setNotModified()` is what produces
      the 304.'
  - id: CHO-72ecwdp2qkms
    text: '`setNotModified()`, which sends a 304 but keeps the body so an intermediary can compare it'
    correct: false
    explanation: A 304 carries no content — that is what "with no content" means in the documentation. An intermediary needs
      no body to serve its own copy.
  - id: CHO-fc435zajy2zn
    text: 'Either one: both set `max-age` to 0 and leave the decision to the proxy'
    correct: false
    explanation: They are distinct methods with opposite intents, and neither is defined as setting `max-age` to 0.
  explanation: '`$response->setNotModified()` forces a proper 304 with no content, which is the whole point of validation:
    the client keeps the copy it already has. `$response->expire()` is the counterpart that marks a response stale.'
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/http_cache.rst
    repository: symfony/symfony-docs
    branch: '8.0'
    symbol_or_lines: More Response Methods (lines 289-299)
    verified_at: '2026-09-03'
