  reviewed_at: '2026-09-03'
  tags:
  - var-dumper
  - console
  choices:
  - id: CHO-q8f9fk7824gc
    text: '`server:dump` — the dumped data is no longer displayed in the output and is sent to that server instead'
    correct: true
  - id: CHO-pc64cfwe6dzn
    text: '`server:dump` — but the dumps still appear inline as well; the server only keeps a copy'
    correct: false
    explanation: Once the server is listening, the data is not displayed in the output at all; it is sent to the server,
      which prints it to its own console or to an HTML file.
  - id: CHO-xex5jd9196ce
    text: '`debug:dump` — it repeats the dumps in a separate section at the end of the output'
    correct: false
