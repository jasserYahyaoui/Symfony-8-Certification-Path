  required_answer_count: 1
  question: A route is declared in YAML. How is its `controller` value written for an ordinary action, and for a class whose
    action is `__invoke()`?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 45
  classification: OFFICIAL
  pool: HOLDOUT
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-03'
  tags:
  - routing
  - conventions
  choices:
  - id: CHO-b80cvnn9p9hy
    text: '`App\Controller\BlogController::list` for the method, and `App\Controller\BlogController` alone for the invokable
      class'
    correct: true
  - id: CHO-hdqgm4qppsdd
    text: '`App\Controller\BlogController::list` for the method, and `App\Controller\BlogController::__invoke` for the invokable
      class, which must be written out'
    correct: false
    explanation: The `::method_name` part is what can be skipped for an invokable class; naming `__invoke` explicitly is
      not the documented form.
  - id: CHO-zxp66ky32s49
    text: '`App\Controller\BlogController:list` with a single colon in both cases, the class alone being ambiguous'
    correct: false
    explanation: The format is `controller_class::method_name`, with a double colon. The class alone is unambiguous precisely
      because `__invoke()` is the only action it can have.
  - id: CHO-m53r2v3xkmf5
    text: '`blog.controller:list`, using the service id, since a controller is always registered as a service'
    correct: false
    explanation: The documented value is the class name, with the method after `::`. Being a service does not change the
      notation.
  explanation: The `controller` value has the format `controller_class::method_name`; when the action is implemented as
    the `__invoke()` method of the class, the `::method_name` part is skipped. In PHP configuration the same pair reads
    `[BlogController::class, 'list']` and `BlogController::class`. `_controller` is the special route parameter that carries
    it.
