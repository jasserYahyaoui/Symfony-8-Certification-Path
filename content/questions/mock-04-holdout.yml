    repository: symfony/symfony-docs
    branch: '8.0'
    symbol_or_lines: tip on HttpExceptionInterface (lines 108-113)
    verified_at: '2026-09-03'
  - url: https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/HttpKernel/Exception/HttpExceptionInterface.php
