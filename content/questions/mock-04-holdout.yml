  question: A domain exception has to produce a 429 response carrying a `Retry-After` header. Which two statements about
    implementing `HttpExceptionInterface` are correct? (Choose 2)
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 80
  classification: OFFICIAL
  pool: HOLDOUT
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-03'
  tags:
  - error-handling
  - http-status
  choices:
  - id: CHO-xpyzpadwjyzy
    text: '`getStatusCode()` is what supplies the 429; without the interface the status code defaults to 500'
    correct: true
  - id: CHO-m5tejcnnw69r
    text: '`getHeaders()` belongs to the same interface, and that is where `Retry-After` is declared'
    correct: true
  - id: CHO-ypgv41aaxvhd
    text: The interface only carries the status code, so the header has to be added by a `kernel.response` listener
    correct: false
    explanation: '`getHeaders()` is a required method of the interface, so the exception itself can carry the header and
      no listener is needed.'
  - id: CHO-z3vz77zedmqe
    text: The status is read from the exception's own numeric code, so `throw new DomainException('slow down', 429)` is
      enough
    correct: false
    explanation: The exception code is not used as the HTTP status. Without HttpExceptionInterface the status code defaults
      to 500.
  - id: CHO-cpmgg4xxvznh
    text: Without the interface the status would default to 404, an unhandled exception being treated as a missing resource
    correct: false
    explanation: The documented default is 500. 404 is produced only when something explicitly says so, such as `createNotFoundException()`.
  explanation: 'HttpExceptionInterface declares exactly two methods: `getStatusCode(): int` and `getHeaders(): array`. Implementing
    it is what customises the status code of an exception — otherwise the error page falls back to 500 — and the same interface
    is the documented place for the response headers the error must carry.'
  official_sources:
