  question: A controller returns an array rather than a `Response`. Which kernel event is dispatched, and what happens if
    nothing acts on it?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 80
  classification: OFFICIAL
  pool: HOLDOUT
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-03'
  tags:
  - kernel-events
  - http-kernel
  choices:
  - id: CHO-zf1xepxd3fz6
    text: '`kernel.view` (ViewEvent), dispatched only because the return value is not a `Response`; a listener is expected
      to turn `getControllerResult()` into a response with `setResponse()`, and if none does, an exception is thrown'
    correct: true
  - id: CHO-mn6wg4a3d4dx
    text: '`kernel.view` is dispatched for every controller, and its listeners simply ignore the ones that already returned
      a `Response`'
    correct: false
    explanation: The kernel dispatches it only when the controller did not return a Response. A controller that returns
      one skips the stage entirely.
  - id: CHO-rhgwg9hx4ttj
    text: '`kernel.response` (ResponseEvent), which converts the returned value into a `Response` before the listeners see
      it'
    correct: false
    explanation: '`kernel.response` is dispatched with a Response that already exists; nothing there converts a controller
      return value.'
  - id: CHO-n4jn4wc4qges
    text: '`kernel.controller_arguments` (ControllerArgumentsEvent), the returned value being treated as a new set of arguments'
    correct: false
    explanation: That event is dispatched before the controller runs, to resolve the arguments it will be called with.
  explanation: Either the controller or one of the `kernel.view` listeners must always produce a Response — at that stage,
    if no listener sets one, an exception is thrown. Setting a response on the event also stops propagation, so lower-priority
