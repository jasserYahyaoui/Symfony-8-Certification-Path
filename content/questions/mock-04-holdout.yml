  question: A session must expire after a fixed period of inactivity, decided by the server. What does Symfony offer, and
    why is the cookie lifetime not the answer?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 75
  classification: OFFICIAL
  pool: HOLDOUT
  verification_status: VERIFIED
