    text: '`#[Attribute]` with no argument forbids every target until at least one is specified'
    correct: false
    explanation: With no argument the attribute is allowed on any target, which is what `Attribute::TARGET_ALL` names.
  - id: CHO-y4428gypsr9m
    text: '`IS_REPEATABLE` is implied as soon as the attribute declares more than one target'
    correct: false
    explanation: Targets and repeatability are independent flags in the same bitmask.
  explanation: 'Both the targets and the repeatability of an attribute are declared in one bitmask on the attribute class
    itself. Neither is enforced while the code is compiled: the attribute is inert metadata until reflection reads it, and
    it is `ReflectionAttribute::newInstance()` — the call that runs the constructor — that raises the error for a disallowed
    target.'
