  type: mcq
  answer_mode: multiple
  required_answer_count: 2
  question: 'A resource is served in French or in English according to `Accept-Language`. Which two statements about `Vary:
    accept-language` on the response are correct? (Choose 2)'
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 80
  classification: OFFICIAL
  pool: HOLDOUT
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-03'
  tags:
  - content-negotiation
  - caching
  choices:
  - id: CHO-d3kd0b8na0hj
    text: 'It expands the cache key: a stored response must not satisfy a later request unless that request carries the
      same value for the listed field, or the origin server revalidates it'
    correct: true
  - id: CHO-vj9f0mp3xww6
    text: It tells the user agent that the response was negotiated, so supplying other values in the listed fields may yield
      a different representation
    correct: true
  - id: CHO-fptw1aphdet9
    text: '`Vary: *` is the safer default and is what a proxy generates when it cannot tell which fields mattered'
    correct: false
    explanation: A proxy must not generate `*`. It signals that aspects possibly outside the message took part, so a cache
      cannot decide anything without asking the origin server.
  - id: CHO-q4qdtz84w1cq
    text: It lists the response header fields that differ from the default representation of the resource
    correct: false
    explanation: The field names it lists are request header fields — the ones that took part in selecting this response.
  - id: CHO-qgads12kynaq
    text: It replaces `Content-Language` and `Content-Type`, which become unnecessary once the response varies
    correct: false
    explanation: Those announce which representation was chosen; Vary says which request fields influenced the choice. They
      answer different questions.
  explanation: 'Vary names the selecting header fields — request fields, aside from the method and target URI, that influenced
    the choice of content. An origin server should send it on a cacheable negotiated response, and may elide it when the
    caching cost outweighs the variance. Its list has exactly the two documented purposes above: one addressed to caches,
    one to user agents.'
  official_sources:
  - url: https://raw.githubusercontent.com/httpwg/httpwg.github.io/master/specs/rfc9110.html
    repository: httpwg/httpwg.github.io
