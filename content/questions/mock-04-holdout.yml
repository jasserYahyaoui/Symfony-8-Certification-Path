  reviewed_at: '2026-09-03'
  tags:
  - php
  - closures
  choices:
  - id: CHO-kjhta9b1a569
    text: The current class is bound automatically, so `$this` is available; a static closure is not bound, using `$this`
      in one raises "Using $this when not in object context", and an object cannot be bound to it later either
    correct: true
  - id: CHO-swh5y867h5kc
    text: '`$this` has to be imported with `use ($this)`, and `static` merely stops that import being allowed'
    correct: false
    explanation: The binding is automatic in a class context; `$this` is not a variable that `use` imports.
  - id: CHO-h8fh1dwahfsq
    text: '`$this` is bound automatically, and `static` only prevents variables being captured by reference'
    correct: false
    explanation: What `static` prevents is the binding of the current class, not the capture mode of ordinary variables.
  - id: CHO-93va9fq6260n
    text: '`$this` is never bound automatically — `bindTo()` is always needed — and `static` is what turns the automatic
      binding on'
    correct: false
    explanation: 'That reverses both halves: the binding is automatic, and `static` is what suppresses it.'
  explanation: 'An anonymous function declared inside a class carries the object with it, which is convenient until it is
    not — a callback stored and invoked elsewhere then keeps that object alive and can reach its private state. `static
    function () {}` is the way to say the closure is a plain function: the class is not bound, and `bindTo()` on it warns
    and fails rather than binding.'
