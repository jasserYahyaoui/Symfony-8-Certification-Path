  question: A configuration expression is executed on every request. What does `ExpressionLanguage::compile()` return, and
    how does its work differ from `evaluate()`?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 70
  classification: OFFICIAL
  pool: HOLDOUT
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-03'
  tags:
  - expression-language
  - performance
  choices:
  - id: CHO-6f78sk3eev3d
    text: It returns the expression converted to PHP code as a string; both methods tokenize and parse first, but only `evaluate()`
      then walks the parsed nodes, which is the larger overhead
    correct: true
  - id: CHO-7wvp0v81p2xx
    text: It returns the value of the expression, already cached as PHP code, so `evaluate()` is only needed when the values
      change
    correct: false
    explanation: '`compile()` never produces the value. It produces PHP code that the application can cache and run itself.'
  - id: CHO-m6rn70gk2ehg
    text: It skips tokenizing and parsing altogether, which is why it costs less than `evaluate()`
    correct: false
    explanation: Both methods tokenize and parse — that shared step is `parse()`. `compile()` is cheaper because it stops
      at the string conversion of the parsed expression, not because it skips parsing.
  - id: CHO-sz424jdh1qfb
    text: 'The two are equivalent: `compile()` merely returns the same result as a string rather than as a typed value'
    correct: false
    explanation: They return different things — PHP code versus an evaluated value — and their internal work differs after
      the shared parse step.
  explanation: '`parse()` does the tokenizing and parsing for both methods and returns a ParsedExpression. `compile()` then
    just returns the string conversion of that object, while `evaluate()` has to loop through its nodes and evaluate them
    dynamically — the documentation states the overhead is even bigger for `evaluate()`.'
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/components/expression_language.rst
    repository: symfony/symfony-docs
    branch: '8.0'
    symbol_or_lines: The Workflow (lines 176-190)
    verified_at: '2026-09-03'
