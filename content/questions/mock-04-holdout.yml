- id: QST-3e36y0qzcek6
  version: 1
  official_topic: Controllers
  official_item: OIT-e41m74xaqhy7
  domain: symfony
  subtopic: session-expiry
  language: en
  difficulty: medium
  cognitive_level: APPLY
  exam_skill: DIAGNOSE
  type: mcq
  answer_mode: single
  required_answer_count: 1
  question: A session must expire after a fixed period of inactivity, decided by the server. What does Symfony offer, and
    why is the cookie lifetime not the answer?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 75
  classification: OFFICIAL
  pool: HOLDOUT
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-03'
  tags:
  - session
  - security
  choices:
  - id: CHO-vcxh1vpbwap3
    text: '`$session->getMetadataBag()->getLastUsed()` returns a server-side timestamp that the application compares on
      access before calling `$session->invalidate()`; the cookie lifetime is unsuitable because the client can manipulate
      it'
    correct: true
  - id: CHO-qbe4jpwx29r2
    text: Setting `cookie_lifetime` to the idle period, which is exactly what it is for
    correct: false
    explanation: The cookie lives on the client and can be manipulated there, so it cannot enforce a server-side idle timeout.
  - id: CHO-rm7yabs9bwsw
    text: '`$session->getMetadataBag()->getCreated()`, since the idle period is counted from the moment the session was
      opened'
    correct: false
    explanation: '`getCreated()` gives the creation time; an idle timeout is measured from the last use, which is `getLastUsed()`.'
  - id: CHO-fmnq7nhh2me5
    text: 'Nothing: idle expiry has to be stored in the session data by the application and checked by hand'
    correct: false
    explanation: The metadata bag already records creation, last use and lifetime, so no bookkeeping of that kind is needed.
  explanation: Two documented approaches exist and both act on the server. Garbage collection with `gc_maxlifetime` destroys
    idle sessions in the background, while an explicit check reads `getMetadataBag()->getLastUsed()` — a Unix timestamp
    relative to the server — on access and calls `invalidate()` when the idle period has passed, which is the option that
    lets the expiry be shown to the user. `cookie_lifetime` is set high in both cases, because it is client-side and can
    be manipulated.
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/session.rst
    repository: symfony/symfony-docs
    branch: '8.0'
    symbol_or_lines: session expiry and the metadata bag (lines 408-445)
    verified_at: '2026-09-03'
