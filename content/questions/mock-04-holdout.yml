  question: A console command's real output is being mixed with `dump()` output. Which command collects the dumps elsewhere,
    and what then happens to the dumped data?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 40
