  question: An action must read a field named `page` whether the client submits a form or posts a JSON body. What does `$request->getPayload()`
    return?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 75
  classification: OFFICIAL
  pool: HOLDOUT
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-03'
  tags:
  - request
  - http-foundation
  choices:
  - id: CHO-10fxhhx9tewy
    text: A clone of the `request` bag when that bag holds anything, and otherwise an InputBag built by decoding the raw
      body as JSON — so both shapes are read the same way and writing to the result leaves the request untouched
    correct: true
  - id: CHO-kkxv988vejzs
    text: The form fields and the decoded JSON body merged into one bag, the JSON winning on a conflict
    correct: false
    explanation: Nothing is merged. A non-empty `request` bag is returned on its own, and the raw body is not decoded at
      all in that case.
  - id: CHO-ja3q10e2jz8d
    text: The `request` bag itself, so a value written into it is visible to everything else handling the request
    correct: false
    explanation: The bag is cloned when it is non-empty, precisely so that reading the payload cannot alter the request.
  - id: CHO-akt5vrqzc4q8
    text: The decoded JSON body only, so a form-encoded POST yields an empty bag
    correct: false
    explanation: A form-encoded POST fills the `request` bag, and that bag is exactly what `getPayload()` hands back.
  explanation: '`getPayload()` is the single accessor for the request body: `$request->query` stays for GET variables, and
    the payload covers a form-encoded POST (a clone of the `request` bag) and a JSON body (decoded into an InputBag) alike.
    An empty body yields an empty bag, while a body that is not valid JSON, or that decodes to something other than an array,
    raises a JsonException.'
