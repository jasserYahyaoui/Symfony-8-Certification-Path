  explanation: Mixing real output with debug output is exactly the problem the dump server solves. `php bin/console server:dump`
    listens (by default on tcp://0.0.0.0:9912) and, while it runs, `dump()` sends its data there rather than to the application
    output; `--format=html` writes it to a file instead.
