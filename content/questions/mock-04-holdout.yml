- id: QST-bdbr853q6be6
  version: 1
  official_topic: HTTP
  official_item: OIT-7801mj6w73ky
  domain: http
  subtopic: resource-representation
  language: en
  difficulty: medium
  cognitive_level: UNDERSTAND
  exam_skill: DISTINGUISH
  type: mcq
  answer_mode: single
  required_answer_count: 1
  question: In the terms of RFC 9110, what separates a resource from a representation?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 60
  classification: OFFICIAL
  pool: HOLDOUT
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-03'
  tags:
  - rfc9110
  - semantics
  choices:
  - id: CHO-4ekevt1cq4ht
    text: A resource is the target of a request, identified by a URI and unrestricted in nature; a representation is information
      reflecting a past, current or desired state of it, made of metadata and a data stream the protocol can transfer
    correct: true
  - id: CHO-pckrwwv64f4d
    text: A resource is the file stored on the server; a representation is that same file after a content encoding has been
      applied
    correct: false
    explanation: HTTP does not limit the nature of a resource — it may be a temporal function such as "the current weather"
      with no stored file at all.
  - id: CHO-n6nx0z9ga8dx
    text: 'They name the same thing at different layers: "resource" in the request and "representation" in the response'
    correct: false
    explanation: 'The distinction is substantive: one resource can have several representations, which is what content negotiation
      selects between.'
  - id: CHO-dzzkfts0230k
    text: A representation is the URI identifying the thing; the resource is the sequence of bytes returned
    correct: false
    explanation: 'That reverses both: the URI identifies the resource, and the bytes returned are the representation data.'
  explanation: 'The separation is what lets HTTP hide implementation behind a uniform interface: communication is defined
    in terms of a transferable representation of resource state rather than of the resource itself, so a URI can identify
    anything at all. It is also what makes several representations of one resource possible, and therefore what content
    negotiation and Vary operate on.'
  official_sources:
