  - id: CHO-hetr49pj414s
    text: 'A request is handled by the first firewall whose pattern matches, and `security: false` means no authentication
      is attempted for those paths — which is why the entry has to come before the pattern-less firewall that matches everything'
    correct: true
  - id: CHO-fzg0rr7fbxbq
