    verified_at: '2026-09-03'
- id: QST-mvevfm9amzpg
  version: 1
  official_topic: Miscellaneous
  official_item: OIT-fr58jzaj6jtb
  domain: symfony
  subtopic: normalizers
  language: en
  difficulty: medium
  cognitive_level: UNDERSTAND
  exam_skill: DISTINGUISH
  type: mcq
  answer_mode: multiple
  required_answer_count: 2
  question: A class keeps its state in private properties and declares no getters. Which two statements are correct? (Choose
    2)
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 85
  classification: OFFICIAL
  pool: HOLDOUT
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-03'
  tags:
  - serializer
  - normalizers
  choices:
  - id: CHO-673rj76bgqwb
    text: '`ObjectNormalizer` cannot read them: it goes through the PropertyAccess component, which needs a directly accessible
      property or a getter, hasser, isser, canner, adder or remover'
    correct: true
  - id: CHO-mhnf004jdpap
    text: '`PropertyNormalizer` can read them, using PHP reflection over public as well as private and protected properties,
      including those declared by parent classes'
    correct: true
  - id: CHO-mm7tm35c9awp
    text: '`GetSetMethodNormalizer` can read them, because it falls back to reflection when no getter exists'
    correct: false
    explanation: It reads a class by calling public methods prefixed with `get`, `has`, `is` or `can`. There is no reflection
      fallback.
  - id: CHO-kwqy7pmjc9d5
    text: '`PropertyNormalizer` always exposes every visibility and offers no way to narrow it'
    correct: false
    explanation: The `PropertyNormalizer::NORMALIZE_VISIBILITY` context option restricts it to any combination of the public,
      protected and private constants.
  - id: CHO-3rjvyv06rjy6
    text: Adding `#[Ignore]` to the private properties makes them visible to `ObjectNormalizer`
    correct: false
    explanation: '`#[Ignore]` excludes a property from serialization. It never exposes one.'
  explanation: 'ObjectNormalizer is the powerful default, but its reach is PropertyAccess: a property it can read or write
    directly, or an accessor method. Private state with no accessors is invisible to it. PropertyNormalizer is the documented
    alternative for that case, reading public, private and protected properties by reflection — with NORMALIZE_VISIBILITY
    available when that is too much.'
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/serializer.rst
    repository: symfony/symfony-docs
    branch: '8.0'
    symbol_or_lines: ObjectNormalizer (lines 1432-1445) and PropertyNormalizer (lines 1511-1540)
    verified_at: '2026-09-03'

