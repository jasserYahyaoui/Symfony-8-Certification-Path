  question: A service type-hints `TagAwareCacheInterface` and the application declares no cache pool of its own. What gets
    injected, and where are tags attached to an item?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 70
  classification: OFFICIAL
  pool: HOLDOUT
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-03'
  tags:
  - cache
  - invalidation
  choices:
  - id: CHO-yxxwaqmfh4k2
    text: '`cache.app.taggable`, a tag-aware pool based on `cache.app`; tags are attached with `$item->tag()` inside the
      callback passed to `get()`'
    correct: true
  - id: CHO-p7se1t534bvv
    text: 'Nothing: autowiring fails until a pool declaring `tags: true` exists'
    correct: false
    explanation: A tag-aware pool over `cache.app` is autowired for that type-hint, so cache tags can be used without defining
      any custom pool.
  - id: CHO-n6h6etfxnphg
    text: '`cache.app` itself, with the tags passed as a third argument to `get()`'
    correct: false
    explanation: '`get()` takes no tag argument; tagging happens on the item inside the callback. And `cache.app` alone
      is not tag-aware.'
  - id: CHO-e4rwdwn24566
    text: '`cache.system.taggable`, because the tag metadata belongs with the system cache'
    correct: false
    explanation: The autowired taggable pool is based on `cache.app`. `cache.system` holds framework-internal data and is
      not what this type-hint resolves to.
  explanation: Type-hinting TagAwareCacheInterface autowires `cache.app.taggable`, so no pool declaration is needed. Tags
    are declared on the item inside the `get()` callback with `$item->tag([...])`, and `invalidateTags([...])` on the pool
    removes every item carrying one of those tags.
  official_sources:
