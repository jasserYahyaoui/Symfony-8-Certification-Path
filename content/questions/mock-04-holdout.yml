  - testing
  choices:
  - id: CHO-d0spxhxec956
    text: Every traversal method returns a new Crawler instance, which is what makes `filter(...)->last()->ancestors()->first()`
      work as a chain
    correct: true
  - id: CHO-2yrvwh1bvckq
    text: '`reduce($callback)` keeps only the nodes for which the callback returns `true`'
    correct: true
  - id: CHO-71c7wpwr4f94
    text: '`filterXpath()` needs the CSS Selector component, while `filter()` works on its own'
    correct: false
    explanation: 'It is the other way round: `filter()` takes a CSS selector, which the CSS Selector component translates;
      `filterXpath()` takes an XPath expression directly.'
  - id: CHO-h1n7q7y0hke9
    text: '`ancestors()` returns the direct parent only, a grandparent requiring a second call'
    correct: false
    explanation: It returns every ancestor up to the `<html>` element.
  - id: CHO-f5be8ddvfjtc
    text: '`count($crawler)` returns the number of documents traversed rather than the number of nodes held'
    correct: false
    explanation: It returns the number of nodes currently stored in the Crawler.
  explanation: A Crawler is a selection of nodes, and every traversal method hands back a new selection rather than modifying
    the current one — so a chain narrows the selection step by step and any intermediate Crawler stays usable. `reduce()`
    is the general filter when a CSS selector cannot express the condition, and `count($crawler)` says how many nodes are
    left.
