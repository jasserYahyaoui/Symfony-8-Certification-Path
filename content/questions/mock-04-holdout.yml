  question: A listener calls `$event->stopPropagation()`. Which listeners no longer run, and how can the dispatching code
    find out?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 40
  classification: OFFICIAL
  pool: HOLDOUT
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-03'
  tags:
  - event-dispatcher
  - listeners
  choices:
  - id: CHO-7pzpm7qv74h4
    text: Those that have not been called yet for that event; the caller checks `$event->isPropagationStopped()` after `dispatch()`
    correct: true
  - id: CHO-cgnkfpaphyha
    text: All listeners of that event, including the ones already executed, whose effects are rolled back
    correct: false
    explanation: Nothing is rolled back. Only the listeners not yet notified are skipped.
  - id: CHO-mex10ykefqrd
    text: Only listeners registered by other bundles; the ones in the application code still run
    correct: false
    explanation: The dispatcher does not care where a listener was registered. What decides is whether it has been called
      yet.
  - id: CHO-gjxqwwqs2g0w
    text: 'None: the call only marks the event, and the dispatcher notifies every listener regardless'
    correct: false
    explanation: The dispatcher does stop notifying further listeners — that is the purpose of the call.
  explanation: '`stopPropagation()` tells the dispatcher not to notify any further listener, so listeners already called
    are unaffected and those still pending are skipped. `isPropagationStopped()` returns a boolean and lets the code that
    dispatched the event see that it happened.'
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/components/event_dispatcher.rst
    repository: symfony/symfony-docs
    branch: '8.0'
