  type: mcq
  answer_mode: single
  required_answer_count: 1
  question: In which order do a command's lifecycle methods run, and what makes `interact()` the last chance to ask for
    a missing required argument?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 65
  classification: OFFICIAL
  pool: HOLDOUT
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-03'
  tags:
  - console
  - lifecycle
  choices:
  - id: CHO-2c2bpcttjtds
    text: '`initialize()`, then `interact()`, then `__invoke()` or `execute()`; `interact()` is called before the input
      is validated, so a value it obtains still counts as supplied'
    correct: true
  - id: CHO-s6kmvw3tjmx9
    text: '`interact()`, then `initialize()`, then `execute()`; asking first is what lets `initialize()` prepare variables
      from the answers'
    correct: false
    explanation: '`initialize()` runs first, precisely so the variables it prepares are available to the other two.'
  - id: CHO-sbh36txqr718
    text: '`initialize()`, then `interact()`, then `execute()`; `interact()` runs after validation, so a missing required
      argument has already been reported'
    correct: false
    explanation: 'The order is right but the reason is not: validation happens after `interact()`, which is why the value
      it collects is accepted.'
  - id: CHO-wgwkmzt35atv
    text: '`initialize()`, then `execute()`, then `interact()`, the last being meant for a confirmation once the work is
      done'
    correct: false
    explanation: '`interact()` is for collecting missing input before the command runs, not for confirming afterwards.'
  explanation: 'Both optional methods surround the required one: `initialize()` prepares state, `interact()` fills in what
    the invocation left out, and `__invoke()` (or `execute()`) does the work and returns the exit status. `interact()` is
    skipped entirely when the command runs with `--no-interaction`, which is why a command must still behave sensibly when
    nothing was asked.'
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/console.rst
    repository: symfony/symfony-docs
    branch: '8.0'
