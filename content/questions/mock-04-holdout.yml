  question: 'A development configuration sets `framework.profiler.collect: false` together with `collect_parameter: ''profile''`.
    What is the effect?'
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 70
  classification: OFFICIAL
  pool: HOLDOUT
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-03'
  tags:
  - profiler
  - configuration
  choices:
  - id: CHO-0jmvydfhy7m4
    text: Nothing is collected by default; collection happens for a request that carries `profile` as a query parameter,
      as a form field or as a request attribute
    correct: true
  - id: CHO-kmr4btk6kk42
    text: Everything is still collected, but only the requests carrying `profile` appear in the profiler list
    correct: false
    explanation: '`collect: false` means the data is not gathered at all — that is where the performance saving comes from,
      not from filtering a list.'
  - id: CHO-nb5dhtvpff7x
    text: The profiler is disabled outright, and `collect_parameter` only renames the profile token used in the toolbar
      URL
    correct: false
