  question: When is the callable passed as the second argument of the cache get() method executed?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 55
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-02'
  tags:
  - get
  choices:
  - id: CHO-ydsmsv5r3b50
    text: Only when the key is missing, to produce and store the value
    correct: true
  - id: CHO-bm6j4s2gv7jc
    text: On every call, so the value can be refreshed
    correct: false
    explanation: On a hit the stored value is returned and the callable is never invoked.
  - id: CHO-610cr7vsrext
    text: Once at warmup, then never again
    correct: false
    explanation: Nothing ties it to warmup; it runs on demand.
  - id: CHO-t7c0mn2hscgr
    text: Only when the pool is explicitly cleared first
    correct: false
    explanation: Clearing is not required; a plain miss is enough.
  explanation: get() both reads and writes, which is why the contracts define no set() method.
