  question: In the cache component, what is the difference between an adapter and a pool?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 45
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-10-02'
  tags:
  - cache
  - concepts
  choices:
  - id: CHO-mn566aq7qqmm
    text: The adapter implements storage, the pool holds items
    correct: true
  - id: CHO-00mx3y8xz6aq
    text: The adapter is the interface, the pool its implementation
    correct: false
    explanation: Both are concrete; neither is the other's interface.
  - id: CHO-w4ar0ct0b7sy
    text: The adapter is per request, the pool persists between them
    correct: false
    explanation: Lifetime is not what separates them.
  - id: CHO-44440r4xmfyb
    text: The pool implements storage, the adapter names it
    correct: false
    explanation: It is the other way round. Version 1 offered "two names for the same object" here, which is
      defensible in code, where new FilesystemAdapter() returns the very object used as a pool.
  explanation: 'Four names, four jobs: an item is one key and value, a pool is a repository of items
    through which every operation goes, an adapter implements the actual storage, and a provider is
    the connection some adapters need. Framework pools do not collide on a shared backend because each gets
    its own namespace.'
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/cache.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/cache.rst
    repository: symfony/symfony-docs
    branch: '8.0'
    symbol_or_lines: Cache Pools, Adapters and Items; Provider
    verified_at: '2026-09-14'
