  question: What distinguishes the cache.system pool from cache.app?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 55
  classification: OFFICIAL
  pool: VALIDATION
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-02'
  tags:
  - pools
  choices:
  - id: CHO-6s08s6889n59
    text: cache.system holds entries derivable from source code and regenerated at warmup; cache.app holds general
      application data
    correct: true
  - id: CHO-60g2xeqd50gp
    text: cache.system is simply a faster backend for the same kind of data
    correct: false
    explanation: The distinction is what the data is, not how quickly it is stored.
  - id: CHO-wtk49kd8b48m
    text: cache.system is read-only and cache.app writable
    correct: false
    explanation: Both are written; the difference is when their contents may legitimately change.
  - id: CHO-6mb3m1nsfpk9
    text: cache.system is shared between servers and cache.app is per-server
    correct: false
    explanation: Sharing depends on the adapter chosen, not on which of the two pools it is.
  explanation: cache.system's contents must change only when the source code does, so it can be rebuilt on deployment;
    cache.app needs no flush on deployment.
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/cache.rst
    branch: '8.0'
