  question: '$pool and $reader are two FilesystemAdapter instances with the same namespace and directory. What does the
    code print?


    ```php

    $item = $pool->getItem(''report'');

    $item->set(''ready'');

    $pool->saveDeferred($item);

    var_dump($reader->getItem(''report'')->isHit());

    var_dump($pool->getItem(''report'')->isHit());

    var_dump($reader->getItem(''report'')->isHit());

    ```'
