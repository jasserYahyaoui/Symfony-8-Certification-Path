  question: With the default beta, when can the callable passed as the second argument of the cache get() method
    run?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 55
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-10-13'
  tags:
  - get
  choices:
  - id: CHO-ydsmsv5r3b50
    text: On a miss, or on a hit elected for early recomputation
    correct: true
  - id: CHO-bm6j4s2gv7jc
    text: On every call, so that the stored value is always refreshed
    correct: false
    explanation: A hit that is not elected for early recomputation is served without the callable.
  - id: CHO-610cr7vsrext
    text: Only when the key is missing, never while it is still stored
    correct: false
    explanation: Probabilistic early expiration can elect a stored item with an expiry before it expires, and
      beta=INF forces the callable on a stored key.
  - id: CHO-t7c0mn2hscgr
    text: Only after the pool has been explicitly cleared with clear()
    correct: false
    explanation: Clearing is not required; a plain miss is enough.
  explanation: 'get() both reads and writes, which is why the contracts define no set(). It recomputes when the item
    is not a hit or beta is INF, and may elect an item that has an expiry for early recomputation; executed with Cache
    8.0.15, beta=INF runs the callable on a present key and isHit() is true inside it.'
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Contracts/Cache/CacheTrait.php
    readable_url: https://github.com/symfony/symfony/blob/8.0/src/Symfony/Contracts/Cache/CacheTrait.php
    branch: '8.0'
    symbol_or_lines: 'doGet(): $recompute = !$item->isHit() || \INF === $beta, then probabilistic early expiration'
    verified_at: '2026-10-13'
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/cache.rst
