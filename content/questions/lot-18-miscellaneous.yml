  choices:
  - id: CHO-v2fgx9e1ezng
    text: It disables early recomputation
    correct: true
  - id: CHO-c98b08x83jny
    text: It disables caching entirely for that key
    correct: false
    explanation: The value is still cached; only the early-recompute behaviour changes.
  - id: CHO-1ars4hrzq1b9
    text: It forces an immediate recomputation
    correct: false
    explanation: That is what INF does.
  - id: CHO-zrakjkdhny9r
    text: It removes the locking protection as well
    correct: false
    explanation: Locking is a separate mechanism and stays in place.
  explanation: 'Beta controls probabilistic early expiration: 1.0 by default, higher recomputes sooner, 0 disables
    it and INF forces an immediate recompute.'
