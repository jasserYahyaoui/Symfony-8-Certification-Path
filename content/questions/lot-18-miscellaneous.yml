  question: What does passing a beta of 0 to the cache get() method do?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 65
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-02'
  tags:
  - beta
  choices:
  - id: CHO-v2fgx9e1ezng
    text: It disables early recomputation, so the value is recomputed only once it has actually expired
    correct: true
  - id: CHO-c98b08x83jny
    text: It disables caching entirely for that key
    correct: false
    explanation: The value is still cached; only the early-recompute behaviour changes.
  - id: CHO-1ars4hrzq1b9
    text: It forces an immediate recomputation
    correct: false
    explanation: That is what INF does.
  - id: CHO-zrakjkdhny9r
    text: It removes the locking protection as well
    correct: false
    explanation: Locking is a separate mechanism and stays in place.
  explanation: 'Beta controls probabilistic early expiration: 1.0 by default, higher recomputes sooner, 0 disables
    it and INF forces an immediate recompute.'
  official_sources:
