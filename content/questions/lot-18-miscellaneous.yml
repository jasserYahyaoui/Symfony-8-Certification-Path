  choices:
  - id: CHO-hxt0wpg0zse8
    text: false, true, true
    correct: true
  - id: CHO-5ehn5046xxq4
    text: false, true, false — the item stays deferred until commit()
    correct: false
    explanation: getItem() on the deferring pool commits the deferred key, so the reader then finds it.
  - id: CHO-b1s2mvm7t922
    text: true, true, true — saveDeferred() writes at once like save()
    correct: false
    explanation: That is ArrayAdapter's behaviour; FilesystemAdapter defers until a commit.
  - id: CHO-egmn21db1dm6
    text: false, false, false — nothing is stored without commit()
    correct: false
    explanation: The deferring pool sees its own item, and reading it commits it.
