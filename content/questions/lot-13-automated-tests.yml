  question: What distinguishes a unit test from an integration test in a Symfony application?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 50
  classification: OFFICIAL
  pool: VALIDATION
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-02'
  tags:
  - scope
  choices:
  - id: CHO-9tb392n16t3w
    text: A unit test needs neither the kernel nor the service container
    correct: true
  - id: CHO-kk98dwbmsqh2
    text: A unit test covers a single method, an integration test a whole class
    correct: false
    explanation: Both may cover one method; what differs is whether the framework is started.
  - id: CHO-z1288p2kd3gv
    text: A unit test uses PHPUnit, an integration test uses another runner
    correct: false
    explanation: Both run under PHPUnit; only the base class differs.
  - id: CHO-584c1fd93fc1
    text: A unit test runs in the dev environment, an integration test in test
    correct: false
    explanation: A unit test boots no environment at all.
  explanation: Writing a unit test in Symfony is writing an ordinary PHPUnit test; booting the kernel is what makes
    a test an integration test.
  official_sources:
