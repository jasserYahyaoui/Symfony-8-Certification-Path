  question: A test logs a user in, then makes a second request, and the user is no longer authenticated. Why?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 70
  classification: OFFICIAL
  pool: VALIDATION
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-02'
  tags:
  - reboot
  choices:
  - id: CHO-0vpf6z95kx6h
    text: The client reboots the kernel between requests, which rebuilds the container and clears the security token
    correct: true
  - id: CHO-2y67r2kap1p6
    text: The login is only valid for the request in which it was performed, by design
    correct: false
    explanation: The login would survive; it is the container being rebuilt that discards it.
  - id: CHO-w0tcjzdgjgnr
    text: Session cookies are not kept by the test client
    correct: false
    explanation: The client keeps a cookie jar across requests.
  - id: CHO-rt0vxrkw5zsj
    text: A second request requires a new client instance
    correct: false
    explanation: The same client handles several requests; the kernel is what restarts.
  explanation: Requests are isolated by rebooting the kernel. disableReboot() resets it instead, but reset() on
    kernel.reset services still clears the token, which a compiler pass in the test environment can prevent.
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/testing.rst
    branch: '8.0'
    symbol_or_lines: testing-multiple-requests-in-one-test
    verified_at: '2026-09-02'
