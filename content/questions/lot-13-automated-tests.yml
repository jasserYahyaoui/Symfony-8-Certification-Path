  question: A test requests a URL that answers with a redirect, then asserts on the target page's content. It fails.
    What is missing?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 55
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-02'
  tags:
  - redirect
  choices:
  - id: CHO-1c05gmhwgqg1
    text: The client does not follow redirects by default; the test must follow it
    correct: true
  - id: CHO-xm79hej8v6t9
    text: The redirect status must be 302 for the client to follow it
    correct: false
    explanation: No status makes the client follow automatically; the behaviour is off by default.
  - id: CHO-g12nf74h9wjt
    text: The crawler must be rebuilt from the response by hand
    correct: false
