  domain: symfony
  subtopic: profiler
  language: en
  difficulty: medium
  cognitive_level: KNOW
  exam_skill: RECOGNIZE
  type: mcq
  answer_mode: single
  required_answer_count: 1
  question: What is the default profiler configuration in the test environment?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 45
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-02'
  tags:
  - config
  choices:
  - id: CHO-spybe1jrz0zx
    text: Enabled, with data collection turned off
    correct: true
  - id: CHO-c7wks647phmv
    text: Disabled entirely
    correct: false
    explanation: It stays enabled so that a test can switch collection on; disabling it would make enableProfiler()
      useless.
  - id: CHO-mcy36dt5qsrm
    text: Enabled, collecting on every request
    correct: false
    explanation: Collecting everywhere would slow the suite down significantly.
  - id: CHO-zmxytfj22m4t
    text: Enabled only for requests that fail
    correct: false
    explanation: Collection is not conditioned on the outcome.
