  question: A test calls enableProfiler(), makes two requests, and finds no profile for the second. Why?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 55
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-02'
  tags:
  - collect
  choices:
  - id: CHO-cm88snh5yp3z
    text: The call enables collection for the next request only and has to be repeated
    correct: true
  - id: CHO-8vsvvn6hte5n
    text: The profiler is disabled after the first profile is read
    correct: false
    explanation: Reading a profile does not disable anything.
  - id: CHO-sz6hr0bt3m42
    text: Only the first request of a test can be profiled at all
    correct: false
