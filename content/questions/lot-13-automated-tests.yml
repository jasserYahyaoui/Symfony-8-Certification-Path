  - tech-lead
  reviewed_at: '2026-09-02'
  tags:
  - webtestcase
  choices:
  - id: CHO-yb1t444w39fz
    text: WebTestCase, which adds a test client on top of KernelTestCase
    correct: true
  - id: CHO-bj0c2vph3430
    text: KernelTestCase, which adds a test client
    correct: false
    explanation: KernelTestCase boots the kernel but provides no client.
  - id: CHO-p0ktn60475g4
    text: TestCase, with the client injected by an attribute
    correct: false
    explanation: No attribute provides a client; it comes from the base class.
