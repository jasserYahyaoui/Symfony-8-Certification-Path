  question: A developer sets a variable in .env.local and the value does not reach the test suite. Why?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 65
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-02'
  tags:
  - env
  choices:
  - id: CHO-drvc6khm4e6k
    text: That file is deliberately excluded in the test environment
    correct: true
  - id: CHO-4dm5ya8b261x
    text: Files ending in .local are never read by the framework
    correct: false
    explanation: .env.test.local is read; only .env.local is skipped in tests.
  - id: CHO-vxvvd67kb2q0
    text: The variable must also be declared in .env to be readable
    correct: false
    explanation: Declaring it elsewhere would not change which files the test environment reads.
  - id: CHO-5d8n0c7rsw58
    text: Test files are only read when the kernel runs in debug mode
    correct: false
    explanation: The set of files read does not depend on debug mode.
  explanation: The test environment reads .env, then .env.test, then .env.test.local — never .env.local, so a developer's
    machine cannot alter test results.
