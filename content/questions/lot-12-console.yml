  question: A command class comes from a third-party library and carries no attribute. It never appears in the listing.
    What makes it available?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 50
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-01'
  tags:
  - autoconfiguration
  choices:
  - id: CHO-08cvad7x1raa
    text: Registering it as a service tagged console.command
    correct: true
  - id: CHO-pbsydxfpegwk
    text: Placing a copy of the class in src/Command/
    correct: false
    explanation: Location is irrelevant; discovery works through the service tag, which autoconfiguration adds only
      when the attribute is present.
  - id: CHO-mv1x96wfdynq
    text: Calling it once so the application caches its name
    correct: false
    explanation: A command cannot be called before it is registered.
  - id: CHO-vtfxbtxvfat5
    text: Declaring it in the bundle's routing configuration
    correct: false
    explanation: Routing concerns HTTP requests and has no bearing on the console.
  explanation: '#[AsCommand] is an autoconfiguration marker for the console.command tag; without it the tag is added
    by hand.'
