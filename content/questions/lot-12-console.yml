  question: A command throws. Which console events fire, and in which order?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 45
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-11'
  tags:
  - console-events
  - order
  choices:
  - id: CHO-6jtp11p0jkhf
    text: COMMAND, then ERROR, then TERMINATE
    correct: true
  - id: CHO-55d13t983169
    text: COMMAND, then TERMINATE, then ERROR
    correct: false
    explanation: Termination is last; it reports the outcome the error event may have changed.
  - id: CHO-5dbhge5jt7t1
    text: ERROR, then TERMINATE, without COMMAND
    correct: false
    explanation: The command event has already fired before the command could throw.
  - id: CHO-pvdms9mz119d
    text: COMMAND, then ERROR, the process ending there
    correct: false
    explanation: Termination is dispatched in every case, which is what makes it usable for timing.
  explanation: COMMAND fires before execution, ERROR only when something is thrown, and TERMINATE always.
    A listener that must see every run, successful or not, belongs on TERMINATE.
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Console/ConsoleEvents.php
    repository: symfony/symfony
    branch: '8.0'
