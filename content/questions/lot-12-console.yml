  question: Which situation does Command::INVALID describe?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 45
  classification: OFFICIAL
  pool: VALIDATION
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-01'
  tags:
  - exit-code
  choices:
  - id: CHO-rprntwk18r9y
    text: The command was used incorrectly, for example with an absurd argument
    correct: true
  - id: CHO-xrrkddrjrn81
    text: The command ran and its processing failed
    correct: false
    explanation: That is FAILURE; INVALID is about usage rather than outcome.
  - id: CHO-x88mkqkr0rv2
    text: The command is not registered in the application
    correct: false
    explanation: An unknown command is resolved by the Application before any command code runs.
  - id: CHO-496cgpjtk68p
    text: The command was interrupted before it completed
    correct: false
    explanation: Interruption is signalled separately, not through this constant.
  explanation: INVALID (2) separates misuse from a genuine processing failure (1).
