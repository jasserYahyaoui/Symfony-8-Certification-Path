  choices:
  - id: CHO-m7mvctcfmnsk
    text: Set the exit code on the event to zero, which also stops the error from being propagated
    correct: true
  - id: CHO-9gttr660x2y8
    text: Replace the error with null on the event, which resets the exit code to zero as a side effect
    correct: false
    explanation: The setter expects a Throwable; the outcome is decided by the exit code.
  - id: CHO-fre1wkwam2dm
    text: Stop the propagation of the event, which leaves the exit code at zero because no other listener runs
    correct: false
