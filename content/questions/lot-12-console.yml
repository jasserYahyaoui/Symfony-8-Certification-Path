  question: A command sets a property in its constructor after calling parent::__construct(), and configure() reads
    that property. The value is missing. Why?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 70
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-01'
  tags:
  - configure
  - constructor
  choices:
  - id: CHO-kg8qg70p7b7r
    text: configure() runs at the end of the parent constructor, before the property is set
    correct: true
  - id: CHO-6be606n91hdf
    text: configure() runs before the constructor entirely
    correct: false
    explanation: It is invoked from within the constructor, not before it.
  - id: CHO-pktzzdj7vwk6
    text: Properties read in configure() must be static
    correct: false
    explanation: There is no such restriction; the problem is ordering, not visibility.
  - id: CHO-48ht2x47mt1g
    text: The parent constructor resets declared properties
    correct: false
    explanation: It does not touch the subclass properties; it simply calls configure() while they are still unset.
  explanation: Because configure() is called at the end of Command's constructor, properties it depends on must
    be assigned before parent::__construct().
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/console.rst
    branch: '8.0'
    symbol_or_lines: legacy-syntax-to-define-commands
    verified_at: '2026-09-01'
