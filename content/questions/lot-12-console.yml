  question: A listener on the error event calls setExitCode(3). Besides the process exit status, what
    else does that call change?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 45
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-11'
  tags:
  - console-events
  - exit-code
  choices:
  - id: CHO-vvk4kw7xnnme
    text: The thrown error's own code becomes 3
    correct: true
  - id: CHO-h44pfw21mebd
    text: Nothing else; the exit status is stored beside the error
    correct: false
    explanation: The event writes the value onto the error, which is why the two can never disagree.
  - id: CHO-frycj5v0be93
    text: The error is replaced by a new one carrying that code
    correct: false
    explanation: The same object is kept; only its code is overwritten.
  - id: CHO-cs5avz770dec
    text: The termination event stops being dispatched
    correct: false
    explanation: Termination is dispatched whatever the error listener does.
  explanation: The event assigns the code onto the error object by reflection, so a handler further
    down that reads the exception code sees 3 as well. Without the call, the exit status falls back
    to the error's own non-zero code, or to 1.
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Console/Event/ConsoleErrorEvent.php
    repository: symfony/symfony
    branch: '8.0'
