  reviewed_at: '2026-09-01'
  tags:
  - command
  - exit-code
  choices:
  - id: CHO-mxw65mdqqpz5
    text: The integer 0, for which Command::SUCCESS is the readable name
    correct: true
  - id: CHO-0vt8kqy6ym95
    text: Nothing; returning null is treated as success
    correct: false
    explanation: The method is typed to return an integer, so returning nothing is an error.
  - id: CHO-n5520ztmrt2q
    text: A boolean true
    correct: false
    explanation: The return value is the process exit code, which is an integer.
  - id: CHO-p9jmnvtpr1f2
    text: The output written to the console
    correct: false
    explanation: Output and exit code are separate; only the integer is read by the caller.
  explanation: The returned integer becomes the process exit status. SUCCESS is 0, FAILURE 1, INVALID 2.
