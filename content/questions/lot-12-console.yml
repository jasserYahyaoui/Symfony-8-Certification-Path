  - id: CHO-rprntwk18r9y
    text: The command was used incorrectly
    correct: true
  - id: CHO-xrrkddrjrn81
    text: The command ran and its processing failed
    correct: false
    explanation: That is FAILURE; INVALID is about usage rather than outcome.
  - id: CHO-x88mkqkr0rv2
    text: The command is not registered in the application
    correct: false
    explanation: An unknown command is resolved by the Application before any command code runs.
