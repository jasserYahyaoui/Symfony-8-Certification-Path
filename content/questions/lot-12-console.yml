  question: A command asks for a missing value inside interact(). Run from cron, it uses an empty value instead
    of asking. Why?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 55
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-01'
  tags:
  - interact
  - non-interactive
  choices:
  - id: CHO-wbwt1hqy4ff4
    text: interact() is not called when the input is not interactive
    correct: true
  - id: CHO-jnx52zbrdzb8
    text: cron strips the standard input before the command starts
    correct: false
    explanation: The behaviour comes from Symfony's own interactivity check, not from cron's plumbing.
  - id: CHO-qkewtcznac4j
    text: interact() runs but its return value is discarded
    correct: false
    explanation: interact() returns void by design; the value is set on the input object, and the method simply
      did not run.
  - id: CHO-kddrq48g37te
    text: The value was set but overwritten by initialize()
    correct: false
    explanation: initialize() runs before interact(), so it cannot overwrite a later assignment.
  explanation: interact() is skipped whenever the input is not interactive, so any value obtained there needs a
    fallback.
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/console.rst
    branch: '8.0'
    symbol_or_lines: command-lifecycle
    verified_at: '2026-09-01'
