  question: 'A command declares #[Option] int $limit with no default value. It fails as soon as it is run, before
    doing anything. Why?'
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 55
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-01'
  tags:
  - option
  - default
  choices:
  - id: CHO-7kzjt8r347fb
    text: An option must declare a default value, so the definition itself is rejected
    correct: true
  - id: CHO-wgppx8jrjygc
    text: int is not an allowed type for an option
    correct: false
    explanation: int is allowed; the missing default is what breaks the definition.
  - id: CHO-ye29xa3ev2kv
    text: The option name could not be derived from the parameter
    correct: false
    explanation: The name is derived from the parameter automatically; nothing was ambiguous.
  - id: CHO-hvf3wx85bzsj
    text: Options must be declared before arguments in the signature
    correct: false
    explanation: No ordering constraint applies between options and arguments.
  explanation: Options are optional by nature, so they must always carry a value; the attribute enforces it at definition
    time.
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Console/Attribute/Option.php
    branch: '8.0'
    symbol_or_lines: Option::tryFrom
    verified_at: '2026-09-01'
