  choices:
  - id: CHO-er18n0dz81wx
    text: 'A plain class carrying #[AsCommand] with an __invoke() method returning an int'
    correct: true
  - id: CHO-9sfe8zg5nrm0
    text: A class extending Command with a protected execute() method
    correct: false
    explanation: That syntax still works, but the documentation calls it the legacy form and recommends the invokable
      one.
  - id: CHO-wd1n4yvn4ywv
    text: A class implementing CommandInterface
    correct: false
    explanation: No such contract is required of an invokable command.
  - id: CHO-2jb38fnpahj3
    text: A callable registered in services.yaml under a console key
    correct: false
    explanation: Registration happens through the console.command tag, not a dedicated configuration key.
  explanation: 'An invokable command extends nothing; #[AsCommand] plus __invoke() is the recommended form.'
