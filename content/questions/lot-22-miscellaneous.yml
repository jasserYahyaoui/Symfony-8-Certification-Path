  question: Two delivery routes are declared under a single application, and one message must take the second one.
    What makes that happen, and what becomes of the instruction afterwards?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 65
  classification: OFFICIAL
  pool: VALIDATION
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-02'
  tags:
  - transports
  - headers
  choices:
  - id: CHO-v8mx546wa8qm
    text: A dedicated header names the route; the component strips that header from the message it finally sends
    correct: true
  - id: CHO-nxa13hrgyw45
    text: A dedicated header names the route, and it stays in the delivered message as a delivery record
    correct: false
    explanation: The component removes it, so it never reaches the recipient.
  - id: CHO-jen44zyqphdz
    text: The route is chosen by the order of declaration alone and cannot be overridden per message
    correct: false
    explanation: Declaration order only sets the default.
  - id: CHO-2prjtavw33rs
    text: A second mail service must be injected, one per declared route
    correct: false
    explanation: One service handles all declared routes.
  explanation: The first declared transport is the default; an X-Transport header selects another and Mailer removes
    it from the final email.
