  question: The MIME component offers a high-level and a low-level API. When is the low-level one justified?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 45
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-12'
  tags:
  - mime
  - api
  choices:
  - id: CHO-5gs47w40720f
    text: When every part must be controlled by hand
    correct: true
  - id: CHO-k1967eg2bahy
    text: When the message has attachments
    correct: false
    explanation: Attachments are ordinary high-level features.
  - id: CHO-3gh8n9678ejg
    text: When the message must be sent without a transport
    correct: false
    explanation: Building and sending are separate; neither API sends.
  - id: CHO-48tfy2x4nns6
    text: When the body is HTML rather than plain text
    correct: false
    explanation: Both bodies are high-level features, and the component arranges the parts.
  explanation: The high-level class covers the common features with chainable calls and builds the part
    structure for you. The low-level one gives absolute control, at the price of assembling that structure
    yourself — which means knowing which container each part belongs in.
