  question: A send call returns without error. What has actually been established?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 45
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-12'
  tags:
  - mailer
  - delivery
  choices:
  - id: CHO-nmcmqr6m516p
    text: A transport accepted the message
    correct: true
  - id: CHO-ervds56eyff4
    text: The recipient has received the message
    correct: false
    explanation: Acceptance is a handover; what happens afterwards is outside the call.
  - id: CHO-mb2jk3bvdtvp
    text: The message passed the recipient's spam filtering
    correct: false
    explanation: Filtering happens far downstream and is never reported back to the call.
  - id: CHO-3wnf81ex7dsb
    text: The message was queued for a later retry
    correct: false
    explanation: Queueing is a separate concern and does not follow from a successful return.
  explanation: Acceptance by a transport and delivery to a mailbox are different events, and only the
    first is observable here. A bounce arrives later, out of band, which is why the debug information
    on the returned object matters when something goes wrong.
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/mailer.rst
    repository: symfony/symfony-docs
    branch: '8.0'
    symbol_or_lines: TransportInterface::send() and the SentMessage object
    verified_at: '2026-09-12'
