  reviewed_at: '2026-09-12'
  tags:
  - mailer
  - transports
  choices:
  - id: CHO-brpvea409yry
    text: The one that defers to php.ini
    correct: true
  - id: CHO-ssjfzee6cna4
    text: The SMTP one, because credentials travel in the DSN
    correct: false
    explanation: SMTP is the ordinary choice and nothing warns against it.
  - id: CHO-xbp79nk9pdz5
    text: The local binary one, because it is slower than SMTP
    correct: false
    explanation: That transport is in fact the recommended fallback when the discouraged one is tempting.
  - id: CHO-eyw9n7czmdcv
    text: None of them; the warning concerns third-party providers
    correct: false
    explanation: The warning is about a built-in transport, not about providers.
  explanation: Its configuration lives outside the application, so error reporting can be absent and
    blind-copy headers may not be stripped. The documentation says to prefer the transport that names
    the binary directly, whose behaviour the application controls.
