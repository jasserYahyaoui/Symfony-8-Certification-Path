  question: A file named report.pdf is inspected by the component's type-detection utility, which reports it as a
    plain-text type. Is that a bug?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 55
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-02'
  tags:
  - mime-types
  - guessing
  choices:
  - id: CHO-ec2qa0yns5wv
    text: No; detection inspects the file's contents rather than its name, so a mislabelled file is reported for what
      it really is
    correct: true
  - id: CHO-r6hwa9xczscf
    text: Yes; the extension is authoritative and should have been used
    correct: false
    explanation: The utility deliberately does not read the name.
  - id: CHO-4spvr7sb0t3g
    text: Yes; a missing optional PHP extension makes detection return wrong answers
    correct: false
    explanation: That extension affects performance, not correctness.
  - id: CHO-f5m00ywre9fe
    text: No, but only because the file was unreadable and a default was returned
    correct: false
    explanation: A concrete type was reported, which means the contents were inspected.
  explanation: 'Guessing is not based on the file name: the utility inspects part of the file contents, so a wrongly
    named file is reported by its real type.'
