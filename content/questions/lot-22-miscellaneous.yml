  question: A message carries a plain-text and an HTML rendering of the same content. Inside the container that holds
    those two alternatives, which one is added last?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 55
  classification: OFFICIAL
  pool: VALIDATION
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-02'
  tags:
  - multipart
  - structure
  choices:
  - id: CHO-7emqabxwgaqp
    text: The preferred one
    correct: true
  - id: CHO-hh3dc037kt62
    text: The plain-text one, as the safest fallback
    correct: false
    explanation: Position encodes preference, not safety; the fallback goes first.
  - id: CHO-e7jas6xazn9r
    text: Whichever was set first on the message object, since order is not significant here
    correct: false
    explanation: Order is significant in this container.
  - id: CHO-21gbj8fvn2af
    text: Neither; the client decides from the content types alone and order is ignored
    correct: false
    explanation: The standard uses position to express which alternative is preferred.
  explanation: In a multipart/alternative container the parts are variants of the same content and the preferred format
    must be added last.
  official_sources:
