  question: An application has the Messenger component installed and no mail-specific routing was configured. How
    are emails delivered?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 45
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-02'
  tags:
  - async
  - messenger-boundary
  choices:
  - id: CHO-p3cveetryv3j
    text: Asynchronously, because that is the default once Messenger is present
    correct: true
  - id: CHO-1g8h0pxfn77n
    text: Synchronously, until a mail message class is explicitly routed to a transport
    correct: false
    explanation: The default applies without any routing being declared.
  - id: CHO-wnbgxfzhdpcw
    text: Synchronously, because Messenger only affects classes the developer wrote
    correct: false
    explanation: The mail message dispatched by the component is routed like any other.
  - id: CHO-fk38hb3y8xrh
    text: It depends on the mail transport protocol chosen in the DSN
    correct: false
    explanation: The DSN selects how the message leaves, not whether sending is deferred.
  explanation: The documentation states that when the Messenger component is installed, all emails are sent asynchronously
    by default.
