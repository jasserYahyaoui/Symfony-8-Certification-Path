  domain: symfony
  subtopic: sending
  language: en
  difficulty: medium
  cognitive_level: UNDERSTAND
  exam_skill: DIAGNOSE
  type: mcq
  answer_mode: single
  required_answer_count: 1
  question: A developer wants the identifier of a message just handed to the mail service, but the call returns nothing
    at all. What explains it?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 60
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-02'
  tags:
  - sending
  - debugging
  choices:
  - id: CHO-jfm4r69xm3r6
    text: The interface they type-hinted may defer delivery, so it has nothing to return; the transport-level interface
      returns a result object and always delivers synchronously
    correct: true
  - id: CHO-qj62e9pv66c5
    text: The message was rejected by the server, so no result could be produced
    correct: false
    explanation: A refusal raises an exception rather than returning nothing.
  - id: CHO-fhea5wpyv8ag
    text: Results are only returned once the message has actually reached the recipient
    correct: false
    explanation: Delivery to the recipient is outside the application's reach either way.
  - id: CHO-066b3ce5xsjq
    text: The identifier has to be set on the message before sending
    correct: false
    explanation: The value in question is produced by sending, not supplied to it.
  explanation: The mailer-level send method returns nothing because delivery can be deferred; the transport-level
    one returns a SentMessage and always sends synchronously.
  official_sources:
