  question: During the handling of a request that raises no exception, which order is correct?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 45
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-01'
  tags:
  - kernel
  - events
  choices:
  - id: CHO-seqhshfphf4r
    text: kernel.request, kernel.controller, kernel.controller_arguments, kernel.response
    correct: true
  - id: CHO-cmaqtqwpgvsb
    text: kernel.request, kernel.controller_arguments, kernel.controller, kernel.response
    correct: false
    explanation: The controller is resolved first; only then are its arguments prepared.
  - id: CHO-zhrv4thpk1gg
    text: kernel.controller, kernel.request, kernel.response, kernel.terminate
    correct: false
    explanation: kernel.request is always the first event dispatched.
  - id: CHO-xpwry8fks6bf
    text: kernel.request, kernel.response, kernel.controller, kernel.terminate
    correct: false
    explanation: The response cannot exist before the controller has run.
  explanation: kernel.request runs before the controller is even known; the arguments can only be resolved once
    the controller is.
  official_sources: &id002
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/reference/events.rst
    branch: '8.0'
    symbol_or_lines: section Kernel Events
    verified_at: '2026-09-01'
