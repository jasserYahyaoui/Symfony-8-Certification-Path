    text: public/
    correct: true
  - id: CHO-p37w6jshvt33
    text: src/
    correct: false
    explanation: src/ holds application code and must never be reachable over HTTP.
  - id: CHO-7nrc74ttrp5j
    text: var/
    correct: false
