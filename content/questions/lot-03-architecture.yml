  question: You must move the cache directory out of `var/`. How is that done?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 60
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-01'
  tags:
  - structure
  - kernel
  choices:
  - id: CHO-89w2myntqqjs
    text: By overriding getCacheDir() in the Kernel class
    correct: true
  - id: CHO-h0n1vwvpps3v
    text: By setting extra.cache-dir in composer.json
    correct: false
    explanation: composer.json's extra key moves directories Composer must know about, and the cache is not one
      of them.
  - id: CHO-xjqrnem8sjj6
    text: By setting framework.cache.directory in config/packages/
    correct: false
    explanation: That option configures cache pools, not the kernel's build directory.
  - id: CHO-r3cawwhppabg
    text: By defining the KERNEL_CACHE_DIR environment variable
    correct: false
    explanation: No such variable is read by the kernel.
  explanation: 'Cache and log directories are the two exceptions: they are moved in PHP, on the Kernel, because
    only the kernel needs to know. The other directories move through composer.json''s extra key.'
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/configuration/override_dir_structure.rst
    branch: '8.0'
    symbol_or_lines: sections Cache, Log and Source directories
    verified_at: '2026-09-01'
