  question: You must send a slow notification email without delaying the response. Which kernel event should the
    listener subscribe to?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 45
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-01'
  tags:
  - kernel
  - terminate
  choices:
  - id: CHO-78wxa58r74qv
    text: kernel.terminate
    correct: true
  - id: CHO-9b5r7rnn9aw7
    text: kernel.response
    correct: false
    explanation: It runs before the response is sent, so the user waits for the listener.
  - id: CHO-b36673kszrax
    text: kernel.finish_request
    correct: false
    explanation: It also runs before the response leaves the server; it exists to restore global state.
  - id: CHO-s6pngwnqgnp8
    text: kernel.view
