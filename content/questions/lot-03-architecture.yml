  question: A service must read the request currently being handled. What should be injected into it?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 45
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-01'
  tags:
  - httpfoundation
  - requeststack
  choices:
  - id: CHO-h2rtnwe92g4b
    text: RequestStack
    correct: true
  - id: CHO-3mwce6xf1cea
    text: The Request object itself
    correct: false
    explanation: A service is built once while the request changes on every call, so the request cannot be injected
      safely.
  - id: CHO-mb2zvskep8r4
    text: The Kernel
    correct: false
    explanation: The kernel orchestrates handling but is not the way a service reaches the current request.
  - id: CHO-sn6x9eqg56a1
    text: The container, to fetch the request service
    correct: false
    explanation: There is no request service to fetch, and fetching from the container is discouraged.
  explanation: 'RequestStack is injected instead: getCurrentRequest() returns the request being handled, and getMainRequest()
    / getParentRequest() distinguish it from an enclosing one.'
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/HttpFoundation/RequestStack.php
    branch: '8.0'
    symbol_or_lines: getCurrentRequest, getMainRequest, getParentRequest
    verified_at: '2026-09-01'
