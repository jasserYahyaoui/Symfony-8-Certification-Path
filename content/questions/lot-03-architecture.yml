  question: A kernel.exception listener calls `$event->setResponse(new Response('No content', 204))` and nothing
    else. What status code does the client receive?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 75
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-01'
  tags:
  - exception
  - status
  choices:
  - id: CHO-a11aazjw2fh3
    text: '500'
    correct: true
  - id: CHO-fq0wn0w3188k
    text: '204'
    correct: false
    explanation: 204 is neither a client error, a server error nor a redirect, so the kernel does not keep it.
  - id: CHO-181e0ccptmnc
    text: '200'
    correct: false
    explanation: The kernel never rewrites the status to 200; the fallback is 500.
  - id: CHO-3rpxmpqpr8v3
    text: '400'
    correct: false
    explanation: 400 would require the original exception to carry that status.
  explanation: The kernel keeps the response's own code only when it is 4xx, 5xx or 3xx. A 204 falls through to
    the next rules, and with no HttpExceptionInterface on the exception the fallback is 500. allowCustomResponseCode()
    must be called first to impose it.
  official_sources: &id003
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/reference/events.rst
    branch: '8.0'
    symbol_or_lines: section kernel.exception
    verified_at: '2026-09-01'
