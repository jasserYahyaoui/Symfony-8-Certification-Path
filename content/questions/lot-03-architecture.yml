  choices:
  - id: CHO-3bsy8qk8qr3a
    text: It can be installed and used in a PHP project that has no Symfony framework
    correct: true
  - id: CHO-f6radkg9mrf8
    text: It requires FrameworkBundle to be enabled
    correct: false
    explanation: The component predates and underpins the framework; it has no bundle dependency.
  - id: CHO-cg775wra3rrj
    text: It is a bridge between Symfony and an external HTTP library
    correct: false
