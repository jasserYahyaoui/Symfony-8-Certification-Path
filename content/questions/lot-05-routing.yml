  type: mcq
  answer_mode: single
  required_answer_count: 1
  question: Routes /blog/{page} and /blog/{slug} are declared in that order, with no requirements. Which one handles
    /blog/my-first-post?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 60
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-01'
  tags:
  - requirements
  choices:
  - id: CHO-c755fe37tmqb
    text: /blog/{page}, because it is declared first
    correct: true
  - id: CHO-yffyxnttdt08
    text: /blog/{slug}, because the value is not numeric
    correct: false
    explanation: Nothing makes {page} numeric without a requirement; both routes match equally.
  - id: CHO-cp843hxc63rj
    text: Neither — Symfony reports an ambiguous route
    correct: false
    explanation: Ambiguity is resolved by declaration order, not reported.
  - id: CHO-nsgnk18wf7pk
    text: Both, and the second overwrites the first
    correct: false
    explanation: Matching stops at the first route that matches.
  explanation: 'Route parameters accept any value, so both routes match and the first declared wins. Adding requirements:
    [''page'' => ''[0-9]+''] is what separates them.'
  official_sources: *id001
- id: QST-nzk49a60g2w7
  version: 1
