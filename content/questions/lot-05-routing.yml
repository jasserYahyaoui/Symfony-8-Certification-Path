  question: 'A route declares schemes: [''https'']. What happens to an incoming HTTP request for that path?'
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 45
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-01'
  tags:
  - schemes
  choices:
  - id: CHO-5rag8phs78cz
    text: It is automatically redirected to the same URL over HTTPS
    correct: true
  - id: CHO-ekse3pjmtw9p
    text: It returns 404, because the route does not match
    correct: false
    explanation: The scheme requirement triggers a redirect rather than a matching failure.
  - id: CHO-8pw4qkt62p4m
    text: It is matched normally; schemes only affects generation
    correct: false
    explanation: The requirement is enforced for incoming requests too.
  - id: CHO-9245evwmakff
    text: It returns 400 Bad Request
    correct: false
    explanation: No error is produced; the request is redirected.
  explanation: 'The option works in both directions: generation always uses HTTPS — which is why path() may return
    an absolute URL when the current scheme differs — and incoming HTTP requests are redirected.'
  official_sources: *id001
