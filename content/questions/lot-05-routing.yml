        correct: true
      - id: CHO-y7b21kzxe5pd
        text: 'None: getLocale() returns null until something sets it'
        correct: false
        explanation: The framework guarantees a locale is always present on the request.
      - id: CHO-7mg7h7nz7jzp
        text: The first language of the Accept-Language header
