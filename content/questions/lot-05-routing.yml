  tags:
  - redirect
  - trailing-slash
  choices:
  - id: CHO-d8m9h058pmbm
    text: Redirects to /foo with a 301
    correct: true
  - id: CHO-3vrkxf5r785a
    text: Redirects to /foo with a 302
    correct: false
    explanation: The trailing-slash redirect is permanent, not temporary.
  - id: CHO-9ktqebvg753n
    text: Matches the route and returns 200
    correct: false
