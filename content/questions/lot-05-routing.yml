  choices:
  - id: CHO-aqr0f4fjbssh
    text: No — page stays required because a non-optional segment follows it
    correct: true
  - id: CHO-5w1n1rvg6qrr
    text: Yes — the default makes page optional wherever it appears
    correct: false
    explanation: The default only makes a parameter omissible if nothing required follows it.
  - id: CHO-xnzx4marz0b1
