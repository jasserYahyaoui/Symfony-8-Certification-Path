  - forms
  choices:
  - id: CHO-5wa02vvfze88
    text: A hidden _method field, with framework.http_method_override enabled
    correct: true
  - id: CHO-b26xnfm1c35m
    text: Adding PUT to the form's method attribute
    correct: false
    explanation: HTML forms support only GET and POST.
  - id: CHO-rpxzcagfh7wt
