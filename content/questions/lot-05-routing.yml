  question: A route carries a condition expression. Is that condition evaluated when generating a URL for the route?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 60
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-01'
  tags:
  - condition
  choices:
  - id: CHO-gh7ryyn9712r
    text: No — conditions are ignored during generation
    correct: true
  - id: CHO-xap7988msdaw
    text: Yes, and generation fails if it evaluates to false
    correct: false
    explanation: The generator has no request to evaluate against.
  - id: CHO-zz778hqvv9r0
    text: Yes, but only for ABSOLUTE_URL references
    correct: false
    explanation: The reference type does not change this.
  - id: CHO-8ppr25jm4fzk
    text: Only when the expression uses the params variable
    correct: false
    explanation: No variable makes conditions apply to generation.
