    reviewed_at: '2026-09-01'
    tags:
      - defaults
      - optional
    choices:
      - id: CHO-aqr0f4fjbssh
        text: No — a non-optional segment follows page
        correct: true
      - id: CHO-5w1n1rvg6qrr
        text: Yes — the default makes page optional wherever it appears
        correct: false
        explanation: The default only makes a parameter omissible if nothing required follows it.
      - id: CHO-xnzx4marz0b1
        text: Yes, but only for GET requests
        correct: false
        explanation: The HTTP method has no bearing on this rule.
      - id: CHO-q2sraw1tk7a1
        text: No — the path is invalid and the container fails to compile
        correct: false
        explanation: The path is valid; only the matching behaviour is constrained.
    explanation: Everything after an optional parameter must itself be optional. The documentation gives
      this exact path as the counter-example.
