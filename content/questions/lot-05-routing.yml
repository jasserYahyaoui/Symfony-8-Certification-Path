    question: Which route path inlines a requirement restricting {page} to digits?
    scoring_policy: all-or-nothing
    shuffle_choices: true
    negative_wording: false
    estimated_time_seconds: 45
    classification: OFFICIAL
    pool: LEARNING
    verification_status: VERIFIED
    reviewers:
      - tech-lead
    reviewed_at: '2026-09-01'
    tags:
      - requirements
      - inline
    choices:
      - id: CHO-3reqz0a1yy50
        text: /blog/{page<[0-9]+>}
        correct: true
      - id: CHO-9gr1wzwm6nnx
        text: /blog/{page:[0-9]+}
        correct: false
        explanation: The colon form is not Symfony's syntax.
      - id: CHO-24wg96d4y0wt
        text: /blog/{page?[0-9]+}
        correct: false
        explanation: The question mark introduces a default value, not a requirement.
      - id: CHO-bqz86rns5dr5
        text: /blog/{page=[0-9]+}
        correct: false
        explanation: No such syntax exists in Symfony routing.
    explanation: 'Angle brackets carry the requirement and a question mark carries the default, so both
      can be inlined at once: /blog/{page<[0-9]+>?1}. The Requirement enum offers ready-made constants
      such as Requirement::DIGITS.'
    official_sources: *id001
