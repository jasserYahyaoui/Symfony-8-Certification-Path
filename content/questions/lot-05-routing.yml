  choices:
  - id: CHO-hdydqxf1mgsa
    text: A set of configuration variables
    correct: true
  - id: CHO-25a8qvzrt60x
    text: A controller instance
    correct: false
    explanation: The component never instantiates anything; _controller is just one of the variables it produces.
  - id: CHO-x6avgrqsme8z
    text: A Response object
    correct: false
    explanation: Producing a response is the kernel's job, further down the chain.
  - id: CHO-dvsm9hdm2gyw
