  tags:
  - locale
  choices:
  - id: CHO-4hwrx9wzgyvm
    text: It is set to fr automatically
    correct: true
  - id: CHO-hjpyfsp9sezc
    text: It stays at default_locale until a listener changes it
    correct: false
    explanation: The reserved _locale parameter sets it during matching.
  - id: CHO-jyznqq9xey0t
    text: It is set only if a LocaleListener is registered manually
    correct: false
