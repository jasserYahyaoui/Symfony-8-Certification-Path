  tags:
  - defaults
  - attributes
  choices:
  - id: CHO-f8fc0pqq6an2
    text: As the default value of the controller argument
    correct: true
  - id: CHO-rsk8na7yavpk
    text: In a defaults option on the attribute
    correct: false
    explanation: That option exists for YAML and PHP config; with attributes the controller signature carries it.
  - id: CHO-90trjgrmcb5n
    text: In the requirements option
