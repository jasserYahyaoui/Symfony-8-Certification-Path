  question: 'A worker is started with two transports: messenger:consume high low. How are they read?'
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 55
  classification: OFFICIAL
  pool: VALIDATION
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-01'
  tags:
  - workers
  choices:
  - id: CHO-fq6mmf6x26wz
    text: low is only read when high is empty
    correct: true
  - id: CHO-mrn05zf8w4nk
    text: Both are read in turn, one message each
    correct: false
    explanation: The order given is a priority order, not a round robin.
  - id: CHO-x8vqhdjj9y5c
    text: Only high is read; the second argument is ignored
    correct: false
    explanation: Both are consumed; the second simply has lower priority.
  - id: CHO-11eqydtmj2h7
    text: They are read in parallel by two threads
    correct: false
    explanation: A worker is a single process handling one message at a time.
  explanation: 'Listing transports in order is how priority is expressed: the worker only falls through
    to the next when the previous is empty.'
  official_sources:
