  reviewed_at: '2026-09-01'
  tags:
  - messages
  choices:
  - id: CHO-xwf5517gcssh
    text: It is serialized at dispatch, so the worker would read a stale copy
    correct: true
  - id: CHO-j8t7t5m0fjbn
    text: Objects cannot be serialized by any transport
    correct: false
    explanation: They can; the problem is that the copy no longer reflects the current state.
  - id: CHO-3rrpmtsnd0dy
    text: Transports reject objects with private properties
    correct: false
