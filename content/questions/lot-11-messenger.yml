  question: How does the delay between retries evolve with the default strategy shape?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 55
  classification: OFFICIAL
  pool: VALIDATION
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-01'
  tags:
  - retries
  choices:
  - id: CHO-ksdqzgpnqvfz
    text: It grows, multiplied on each attempt and capped by max_delay
    correct: true
  - id: CHO-zb5z1cz3mthr
    text: It stays constant at the configured delay
    correct: false
    explanation: A multiplier is applied on each subsequent retry.
  - id: CHO-45t700q043hp
    text: It shrinks, to recover faster
    correct: false
