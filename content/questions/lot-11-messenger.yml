  question: Retries are exhausted and no failure_transport is configured. What becomes of the message?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 55
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-01'
  tags:
  - failures
  choices:
  - id: CHO-1sxtygmt1qjn
    text: It is discarded
    correct: true
  - id: CHO-tptpzxm60kvk
    text: It stays in the original transport indefinitely
    correct: false
    explanation: It is removed once the retries are exhausted.
  - id: CHO-va021s9jegan
    text: It is retried forever with the maximum delay
    correct: false
    explanation: The retry count is finite.
  - id: CHO-6psfs640245g
