  question: A controller dispatches a message routed to an async transport, then immediately reads the
    result. Nothing is there. Why?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 55
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-01'
  tags:
  - bus
  - async
  choices:
  - id: CHO-tqv6yb4m53ry
    text: Dispatching only hands the message to the bus; nothing has run yet
    correct: true
  - id: CHO-y72btkv2s2db
    text: The handler threw an exception that was swallowed
    correct: false
    explanation: No handler has been called at that point, so none could have thrown.
  - id: CHO-krdwjdj8gxrz
    text: The result must be read from the message object, not the envelope
    correct: false
    explanation: The message is unchanged either way; the absence of a result is due to timing.
  - id: CHO-71c9hf5vjz9x
    text: The bus is misconfigured, since dispatch is always synchronous
    correct: false
    explanation: Asynchronous dispatch is the normal case once a message is routed.
  explanation: With an async transport, dispatch() returns before anything is handled. A result is only
    readable on the returned envelope when handling was synchronous.
  official_sources:
