  - tech-lead
  reviewed_at: '2026-09-01'
  tags:
  - events
  choices:
  - id: CHO-yfq1v2f1wtrd
    text: It runs on every loop iteration, including when the queue is empty
    correct: true
  - id: CHO-efe2gpwhv80t
    text: It runs once per consumed message
    correct: false
    explanation: That would be WorkerMessageReceivedEvent or WorkerMessageHandledEvent.
  - id: CHO-ttb8nwcpj6f4
    text: It runs once when the worker starts
