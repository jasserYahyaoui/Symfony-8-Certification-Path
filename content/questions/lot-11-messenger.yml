  question: A custom middleware is added and messages stop reaching their handlers. What is the most likely
    cause?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 55
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-01'
  tags:
  - middleware
  choices:
  - id: CHO-m6nx3x8gngf7
    text: It does not call $stack->next()->handle()
    correct: true
  - id: CHO-5y2dntnr9d07
    text: It returns the envelope instead of the message
    correct: false
    explanation: Returning an envelope is exactly what the interface requires.
  - id: CHO-zacnj1bqgt4b
    text: It was registered after HandleMessageMiddleware
    correct: false
    explanation: Ordering could make it ineffective, but it would not stop handlers from running.
