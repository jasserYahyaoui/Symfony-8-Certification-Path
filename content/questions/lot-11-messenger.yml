  tags:
  - workers
  choices:
  - id: CHO-h9cazs2vbrs6
    text: A long-lived PHP process accumulates memory and stale state; stopping and restarting is the
      designed way to run it
    correct: true
  - id: CHO-vrz3pm21r34e
    text: They speed up message processing
    correct: false
