  question: A functional test must assert that a message was dispatched, without running a worker. Which
    transport fits?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 50
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-01'
  tags:
  - transports
  - testing
  choices:
  - id: CHO-6ppxega69zjd
    text: in-memory://
    correct: true
  - id: CHO-pjgnj1brfygw
    text: sync://
    correct: false
    explanation: It handles the message immediately, so nothing is left to assert about queuing.
  - id: CHO-phc7xax9yssp
    text: An asynchronous transport backed by a queue server
    correct: false
    explanation: That stores the message and still needs a worker to consume it, so the test would assert
      nothing.
  - id: CHO-am1vta26rv13
    text: A null transport that discards everything
    correct: false
    explanation: Discarding leaves nothing to assert.
  explanation: in-memory:// keeps the messages without handling them, which is exactly what a test needs
    in order to inspect what was sent.
