  question: A handler is given a message whose referenced record will never exist. What should it do,
    and why?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 55
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-01'
  tags:
  - retries
  choices:
  - id: CHO-frgnvk5h9egm
    text: Throw the exception that marks the failure as unrecoverable, so no retry is attempted
    correct: true
  - id: CHO-v2pp3vhh0as5
    text: Throw the exception that forces a retry, so the message is not lost
    correct: false
    explanation: Forcing retries on a permanently invalid message only delays the inevitable and fills
      the logs.
  - id: CHO-n2rnd5rbj3fh
    text: Return normally, so the message is acknowledged and removed
    correct: false
    explanation: Returning normally reports success, which hides a real problem instead of routing it
      to the failure transport.
  - id: CHO-cxmrk7a3wdz7
    text: Throw any ordinary exception and let the strategy exhaust its attempts
    correct: false
    explanation: That works, but wastes every retry on a failure that cannot succeed.
  explanation: The retry strategy exists for transient failures. A permanently invalid message should
    skip retries and go straight to the failure path, which is what the unrecoverable exception expresses.
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/messenger.rst
