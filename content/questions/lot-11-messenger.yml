  question: New code is deployed but messages are still handled by the previous version. What was skipped?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 55
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-01'
  tags:
  - workers
  - deploy
  choices:
  - id: CHO-gthszgs7m8p0
    text: Restarting the workers, e.g. with messenger:stop-workers
    correct: true
  - id: CHO-efgq12mytn6w
    text: Clearing the container cache
    correct: false
    explanation: A cleared cache does not reach a process that already loaded the old code.
  - id: CHO-4fqca1e26ccg
    text: Re-routing the messages to the new transport
    correct: false
    explanation: Routing is unrelated to which code a running worker executes.
  - id: CHO-2xtjxbt11csp
    text: Running messenger:failed:retry
    correct: false
    explanation: That replays failed messages; it does not reload a worker.
  explanation: A worker loads its code once, at startup. messenger:stop-workers asks each worker to stop
    after the current message so the supervisor restarts it with the new code.
