  question: A callback constraint is declared with a bare method name, as a plain string.
    Where does the validator look that method up?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 45
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-11'
  tags:
  - callback
  - external
  choices:
  - id: CHO-zegxr6e88rgj
    text: On the validated object's own class
    correct: true
  - id: CHO-cxc9en7h16ac
    text: On any class of the application, by scanning
    correct: false
    explanation: Nothing scans for a matching name; resolution is not a search.
  - id: CHO-y5q1rtke60cp
    text: On the constraint class itself
    correct: false
    explanation: The constraint holds the configuration, it does not host the check.
  - id: CHO-e8118e8qkbbq
    text: On a service registered under that name
    correct: false
    explanation: A callback is not resolved through the container.
  explanation: A bare name only ever names a method of the validated class, which is why a
    static method living somewhere else cannot be reached that way and has to be declared in
    the callable form PHP itself accepts.
