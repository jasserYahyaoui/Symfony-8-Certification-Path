  question: Author holds an Address whose properties carry constraints. Validating the Author reports
    nothing about the invalid Address. What is missing?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 55
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-01'
  tags:
  - cascade
  - valid
  choices:
  - id: CHO-bbhtnce91gx1
    text: '#[Assert\Valid] on the Author::$address property'
    correct: true
  - id: CHO-0m0rk49kg7mx
    text: '#[Assert\NotNull] on the Author::$address property'
    correct: false
    explanation: That only checks the property is set; it does not descend into the object.
  - id: CHO-9gbp37ryz9kx
    text: A validation group shared by both classes
    correct: false
    explanation: Groups select which constraints run, they do not enable cascading.
  - id: CHO-1cq9b2f8s88x
    text: Address must implement a validation interface
    correct: false
    explanation: No interface is required; the cascade is requested by a constraint on the holding property.
  explanation: Validation does not descend into embedded objects by itself. The Valid constraint requests
    the cascade; without it the nested object is skipped silently.
