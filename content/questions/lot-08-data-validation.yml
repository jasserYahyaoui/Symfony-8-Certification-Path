  choices:
  - id: CHO-6pja0yaart6h
    text: One reports at once, the other returns a builder
    correct: true
  - id: CHO-pvnxy8n6xmv0
    text: One reports on a property, the other on the class
    correct: false
    explanation: Either can be aimed at a property; that is what the path setting is for.
  - id: CHO-cxqfv56ae7ky
    text: One is for custom constraints, the other for built-in ones
    correct: false
    explanation: Both are available to any validator holding the context.
  - id: CHO-qdeng54vnx6w
    text: One translates the message, the other does not
    correct: false
    explanation: Translation applies to both, and can be disabled on the builder.
