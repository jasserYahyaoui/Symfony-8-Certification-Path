  question: A rule states that the end date must not precede the start date. Which validation scope can
    express it?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 50
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-01'
  tags:
  - scopes
  - class
  choices:
  - id: CHO-9dbzepz18q1t
    text: The class scope
    correct: true
  - id: CHO-3pcbfy01xbgt
    text: A property constraint on the end date
    correct: false
    explanation: A property constraint receives only that property's value and cannot read the start date.
  - id: CHO-t1v31zry4cdx
    text: A getter constraint on getStartDate()
    correct: false
    explanation: It would receive the start date only; the comparison still needs both values.
  - id: CHO-qn4n0v4kgb1c
    text: Two property constraints, one on each date
    correct: false
    explanation: Neither of them can see the other value, so the comparison cannot be expressed.
  explanation: Only the class scope receives the whole object, which is what a rule crossing two properties
    needs.
  official_sources:
