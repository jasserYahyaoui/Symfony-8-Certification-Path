  - id: CHO-ksfp8e1yy56s
    text: The validated object, because a static method has no $this
    correct: true
  - id: CHO-4v5jsr6mxe03
    text: The execution context, exactly as in the instance form
    correct: false
    explanation: The instance form starts with the context; the static form cannot, because it would then
      have no access to the object at all.
