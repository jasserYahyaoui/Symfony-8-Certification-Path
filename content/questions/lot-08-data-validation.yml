  choices:
  - id: CHO-5keq9z9xbna8
    text: NotNull
    correct: true
  - id: CHO-mk8vmxhpjft7
    text: NotBlank
    correct: false
    explanation: NotBlank rejects falsy values, so it would reject an integer zero as well.
  - id: CHO-w26e87thy8wn
    text: Positive
    correct: false
