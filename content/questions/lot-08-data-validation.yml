  question: A child class redeclares a constraint on a property that its parent already constrains. Which
    constraints apply?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 55
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-01'
  tags:
  - inheritance
  - merge
  choices:
  - id: CHO-6sgxn9sbky3y
    text: Both, merged
    correct: true
  - id: CHO-vyyn7a43c2xw
    text: Only the child's, which overrides the parent's
    correct: false
    explanation: Symfony always merges the parent constraints; redeclaring does not replace.
  - id: CHO-yptcfmhvvqp9
    text: Only the parent's, because it was declared first
    correct: false
    explanation: The child's constraints are applied too.
  - id: CHO-1y60jh4fpfbq
    text: Neither, because the duplicate declaration is an error
    correct: false
    explanation: Duplicate constraints on a property are legal and simply accumulate.
  explanation: Constraints defined on parent properties always apply to the child, even when the child
    overrides them. The only documented workaround is to place them in different validation groups.
  official_sources:
