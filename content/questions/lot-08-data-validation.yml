  question: A controller writes if ($validator->validate($user)) { /* invalid */ }. The branch is taken
    even when the object is perfectly valid. Why?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 50
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-01'
  tags:
  - validator
  - violations
  choices:
  - id: CHO-t70jx1p5jkm0
    text: An empty violation list is still truthy
    correct: true
  - id: CHO-cbaqk5nsdxx5
    text: validate() returns true when the object is valid
    correct: false
    explanation: It never returns a boolean; it always returns a ConstraintViolationListInterface.
  - id: CHO-mn3qbzzrmwa0
    text: validate() returns the object itself when it is valid
    correct: false
    explanation: The return type is a violation list, not the validated value.
  - id: CHO-rrh07tq1kebs
    text: The constraints were not loaded, so nothing was checked
    correct: false
    explanation: Unloaded metadata would still produce an empty list, and the branch would behave the
      same way; the cause is the truthiness test.
  explanation: validate() always returns a ConstraintViolationListInterface. An empty list is a non-null
    object, hence truthy. The test must be on count().
