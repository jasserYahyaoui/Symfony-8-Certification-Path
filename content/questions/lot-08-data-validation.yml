  reviewed_at: '2026-09-01'
  tags:
  - validator
  - api
  choices:
  - id: CHO-rdzvzpe99274
    text: $validator->validatePropertyValue(User::class, 'email', $candidate)
    correct: true
  - id: CHO-zbh7ty5jenrz
    text: $validator->validateProperty($user, 'email')
    correct: false
    explanation: This validates the value the object currently holds, so it needs a populated instance.
  - id: CHO-sy158azmqxdg
    text: $validator->validate($candidate)
    correct: false
    explanation: With no constraints passed, this validates the string against nothing and always succeeds.
  - id: CHO-tmg3d37r3r1w
    text: $validator->validate($candidate, User::class)
    correct: false
    explanation: The second argument takes constraints, not a class name.
  explanation: validatePropertyValue() tests a candidate value against the constraints declared for that
    property, and accepts a class name instead of an instance.
