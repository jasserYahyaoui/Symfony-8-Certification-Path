  - priority
  choices:
  - id: CHO-as0qk972n2xx
    text: The one with priority 10
    correct: true
  - id: CHO-79hqgn4hezv9
    text: The one with priority 0, since lower means earlier
    correct: false
    explanation: Passes are sorted in descending priority, as event listeners are.
  - id: CHO-9g0jyze3s576
