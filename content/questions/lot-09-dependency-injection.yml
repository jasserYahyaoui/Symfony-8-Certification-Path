  question: Bar decorates Foo with decoration_priority 5, Baz decorates Foo with decoration_priority 1.
    Which decorator ends up wrapping Foo directly?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 60
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-01'
  tags:
  - decoration
  - priority
  choices:
  - id: CHO-033nkbta5egz
    text: Bar, because a higher priority is applied earlier
    correct: true
  - id: CHO-ryvmerjm3d6k
    text: Baz, because the lowest priority is closest to the target
    correct: false
    explanation: Priority is applied in descending order, so the lower value ends up on the outside.
  - id: CHO-pm2ywnrj0bag
    text: Whichever is declared first in services.yaml
    correct: false
    explanation: Declaration order only breaks ties between equal priorities.
  - id: CHO-k9bvtahejjtc
    text: 'Neither: two decorators on one service are applied side by side'
    correct: false
    explanation: Decorators stack; they do not run in parallel.
  explanation: A higher priority is applied earlier, so it wraps the target first and ends up innermost.
    The lower priority becomes the outer layer, and therefore the one called first at runtime.
