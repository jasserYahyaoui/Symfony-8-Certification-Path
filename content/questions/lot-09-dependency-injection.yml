    reviewed_at: '2026-09-01'
    tags:
      - env-processors
    choices:
      - id: CHO-k4zzxcxjctcn
        text: 'Right to left: the one nearest the variable runs first'
        correct: true
      - id: CHO-we3d6pbb4xgk
        text: Left to right, like a pipeline
        correct: false
        explanation: 'The syntax reads like a pipeline but nests like a function call: the innermost is
          evaluated first.'
      - id: CHO-d0saqwyqpb3y
        text: In the order they are declared in the bundle configuration
        correct: false
