  reviewed_at: '2026-09-01'
  tags:
  - bundles
  choices:
  - id: CHO-jqvn5bfkp375
    text: From the bundles installed in the application, FrameworkBundle first
    correct: true
  - id: CHO-vd6vs7atb21n
    text: From a built-in list hard-coded in the Kernel
    correct: false
    explanation: The Kernel registers bundles; the bundles register the services.
  - id: CHO-nsf9sqyrcd86
    text: From autowiring, which instantiates vendor classes on demand
