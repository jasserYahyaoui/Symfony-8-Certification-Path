    question: What makes an interface usable as a type-hint for autowiring?
    scoring_policy: all-or-nothing
    shuffle_choices: true
    negative_wording: false
    estimated_time_seconds: 50
    classification: OFFICIAL
    pool: LEARNING
    verification_status: VERIFIED
    reviewers:
      - tech-lead
    reviewed_at: '2026-09-01'
    tags:
      - alias
      - autowiring
    choices:
      - id: CHO-gsmyvxvk3wbn
        text: An alias from the interface to an implementation
        correct: true
      - id: CHO-qwatexxwzkpt
        text: Marking the implementation public
        correct: false
        explanation: Visibility governs retrieval from outside, not type resolution.
      - id: CHO-zgkbamphc5zg
        text: Tagging the implementation
        correct: false
        explanation: Tags are read by passes and iterators; they do not resolve a type-hint.
      - id: CHO-yqxn81zaeedz
        text: Nothing — interfaces are autowired by scanning implementations at runtime
        correct: false
        explanation: Autowiring is resolved at compile time and needs a single designated service.
    explanation: No service is named after an interface, so an alias designates the implementation. Symfony
      creates it automatically when exactly one implementation exists.
