  question: How is a literal percent sign written in a container configuration value?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 45
  classification: OFFICIAL
  pool: VALIDATION
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-01'
  tags:
  - parameters
  choices:
  - id: CHO-b1ftaqq8yt3x
    text: 'By doubling it: %%'
    correct: true
  - id: CHO-c1v0rzez04e8
    text: 'By escaping it with a backslash: \%'
    correct: false
    explanation: Backslash escaping is not used for percent signs in container values.
  - id: CHO-bmddzw5x3x81
    text: By quoting the whole value
    correct: false
    explanation: Quoting is a YAML concern and does not stop parameter resolution.
  - id: CHO-2gaybryx51dn
    text: By using %percent%
    correct: false
    explanation: No such built-in parameter exists.
  explanation: A single percent starts a parameter reference. Doubling it produces a literal one; forgetting
    that makes the container look for a parameter that does not exist.
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/DependencyInjection/EnvVarProcessor.php
    branch: '8.0'
    symbol_or_lines: EnvVarProcessor::getProvidedTypes
    verified_at: '2026-09-01'
