  question: Two environment-variable processors are chained on the same variable. In which order do they
    apply?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 50
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-01'
  tags:
  - env-processors
  choices:
  - id: CHO-k4zzxcxjctcn
    text: 'Right to left: the one nearest the variable name runs first'
    correct: true
  - id: CHO-we3d6pbb4xgk
    text: Left to right, like a pipeline
    correct: false
    explanation: 'The syntax reads like a pipeline but nests like a function call: the innermost is evaluated
      first.'
  - id: CHO-d0saqwyqpb3y
    text: In the order they are declared in the bundle configuration
    correct: false
    explanation: Processors are not declared anywhere; they are named inline in the expression.
  - id: CHO-tgjfee13tgqf
    text: The order is undefined, so only one processor may be used
    correct: false
    explanation: Chaining is supported and its order is deterministic.
  explanation: Chained processors nest like function calls. The one written closest to the variable name
    is applied first, and each feeds the next outwards.
  official_sources:
