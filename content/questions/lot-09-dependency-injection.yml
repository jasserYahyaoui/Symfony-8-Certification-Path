    question: A class receives the whole service container in its constructor and calls get() when it
      needs something. What is that pattern called?
    scoring_policy: all-or-nothing
    shuffle_choices: true
    negative_wording: false
    estimated_time_seconds: 50
    classification: OFFICIAL
    pool: LEARNING
    verification_status: VERIFIED
    reviewers:
      - tech-lead
    reviewed_at: '2026-09-01'
    tags:
      - injection
      - service-location
    choices:
      - id: CHO-bttfzfvx0mh2
        text: Service location, not dependency injection
        correct: true
      - id: CHO-2n5nve9ftmq6
        text: Constructor injection, since the container arrives through the constructor
        correct: false
        explanation: 'What is injected matters more than how: the class can still ask for anything, so
          its real dependencies are invisible.'
      - id: CHO-nnzpar28bxp7
        text: Setter injection
        correct: false
        explanation: No setter is involved, and the objection would be the same.
      - id: CHO-cfrtp4m5x1ja
        text: Autowiring
        correct: false
        explanation: Autowiring is how the container fills an argument by type; it says nothing about
          what that argument is.
    explanation: 'Receiving the container is service location: the dependencies leave the signature and
      can no longer be checked at compile time. Injection names what the class needs.'
    official_sources:
      - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/service_container.rst
        branch: '8.0'
        symbol_or_lines: service container
        verified_at: '2026-09-01'
