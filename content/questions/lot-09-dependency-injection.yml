  - id: CHO-rn44byemk4g6
    text: Through the .inner service, injected automatically when autowiring
    correct: true
  - id: CHO-96215pxgm4ad
    text: Through parent::, since the decorator extends the original
    correct: false
    explanation: Decoration is composition, not inheritance; the decorator need only share the interface.
  - id: CHO-z1ahaah0nbys
