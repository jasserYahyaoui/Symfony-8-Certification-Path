  - tech-lead
  reviewed_at: '2026-09-01'
  tags:
  - autowiring
  - alias
  choices:
  - id: CHO-36f018a0783y
    text: The automatic interface alias only exists while there is exactly one implementation
    correct: true
  - id: CHO-wqcxcea0jxe3
    text: Two classes cannot implement the same interface in a Symfony application
    correct: false
    explanation: They can; the container simply no longer knows which to inject.
  - id: CHO-j0emb3nw7cdv
    text: The new class must be excluded from discovery
    correct: false
    explanation: Excluding it hides a real service instead of expressing a choice.
  - id: CHO-z1fjr6tcrpw7
    text: Interfaces are never autowirable and it worked by accident
    correct: false
    explanation: An alias makes an interface autowirable, and Symfony creates it when the implementation
      is unique.
  explanation: With one implementation Symfony aliases the interface to it. A second implementation removes
    that certainty, so the alias disappears and the choice must be declared.
