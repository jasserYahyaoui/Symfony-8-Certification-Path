  question: $container->get('App\\Service\\Archiver') throws, yet the class is in src/ and is injected
    successfully elsewhere. Why?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 55
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-01'
  tags:
  - visibility
  choices:
  - id: CHO-cvcqsq7k3ft2
    text: The service is private, which is the default
    correct: true
  - id: CHO-q9f0f1m7n58j
    text: The service was never registered, because src/ is not scanned
    correct: false
    explanation: It is injected elsewhere, so it exists; discovery worked.
  - id: CHO-ar8vd8bjf58m
    text: get() only accepts short ids, not fully-qualified class names
    correct: false
    explanation: The FQCN is exactly the id convention.
  - id: CHO-7bzcqy94b7n0
    text: The container was not compiled
    correct: false
    explanation: An uncompiled container would fail for every service, not this one.
  explanation: Private is the default. A private service is injectable but not retrievable from outside
    the container; that is what makes it removable and its uses traceable.
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/service_container/alias_private.rst
    branch: '8.0'
    symbol_or_lines: public and private services
    verified_at: '2026-09-01'
