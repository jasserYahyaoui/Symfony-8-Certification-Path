  question: Why is a service locator not considered the same thing as injecting the container?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 55
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-01'
  tags:
  - locator
  choices:
  - id: CHO-3wj53c0jkqrp
    text: It exposes only the services the class declared, so dependencies stay checkable
    correct: true
  - id: CHO-wv6z77641hpw
    text: It is read-only, whereas the container can be modified
    correct: false
    explanation: Neither is modified at runtime; the difference is scope.
  - id: CHO-59v7f031tzb3
    text: It returns new instances each time
    correct: false
    explanation: It returns the same shared instances the container holds.
  - id: CHO-4612b9f7h73v
