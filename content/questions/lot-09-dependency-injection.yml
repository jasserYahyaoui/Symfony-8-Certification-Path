  reviewed_at: '2026-09-01'
  tags:
  - injection
  choices:
  - id: CHO-430hxe7t0nn2
    text: Constructor injection
    correct: true
  - id: CHO-1wvasvyd770p
    text: 'Setter injection with #[Required]'
    correct: false
    explanation: That form exists for optional dependencies or to break a circular reference.
  - id: CHO-4j1tt4e0hnpx
    text: Public property assignment
    correct: false
    explanation: It breaks encapsulation and is discouraged.
  - id: CHO-2nvxwgyqbnzq
    text: Fetching it from the container inside the method
    correct: false
    explanation: That is service location, not injection.
  explanation: 'A mandatory collaborator belongs in the constructor: the object cannot exist in an invalid
    state. Setters cover the optional case.'
