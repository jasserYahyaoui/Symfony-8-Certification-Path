  question: What distinguishes dd() from dump()?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 40
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-02'
  tags:
  - dump
  choices:
  - id: CHO-9qcygg5xc6ba
    text: dd() stops execution after dumping; dump() returns the value it was given
    correct: true
  - id: CHO-tfr873891j66
    text: dd() dumps to the console, dump() to the browser
    correct: false
    explanation: The destination depends on the context and the bundle, not on which function is used.
  - id: CHO-hb08ezns2mdn
    text: dd() works in production, dump() does not
    correct: false
    explanation: Both come from the same development-only package.
  - id: CHO-4wrwmrx941zt
    text: dd() dumps several variables, dump() only one
    correct: false
    explanation: Both accept several arguments.
  explanation: dd() is "dump and die"; dump() returns its argument, so it can be inserted into a chain of calls.
  official_sources:
