  question: In a Symfony application with DebugBundle installed, where does dump() output go?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 55
  classification: OFFICIAL
  pool: VALIDATION
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-02'
  tags:
  - debug-bundle
  choices:
  - id: CHO-reb8m7nsbybj
    text: To the web debug toolbar, so the response is not corrupted
    correct: true
  - id: CHO-td7p7wtz916j
    text: To the response body, immediately where it was called
    correct: false
    explanation: That is what the bundle avoids; printing there could break headers or the view.
  - id: CHO-gnzvw4r9482d
    text: To the application log only
    correct: false
    explanation: Dumps are not routed to the logger.
  - id: CHO-bxvmpkcfnzar
    text: Nowhere, unless the dump server is running
    correct: false
    explanation: The dump server is an alternative destination, not a requirement.
  explanation: The bundle redirects dumps to the toolbar; they fall back to the regular output when the toolbar
    cannot be rendered, such as after dd() or a fatal error.
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/components/var_dumper.rst
