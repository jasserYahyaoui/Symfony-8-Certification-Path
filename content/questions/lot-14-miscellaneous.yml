  question: A developer customises the production error page and cannot see it while working locally. Why, and what
    shows it?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 55
  classification: OFFICIAL
  pool: VALIDATION
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-02'
  tags:
  - dev
  choices:
  - id: CHO-vfxef92a6v3d
    text: The dev environment shows the detailed exception page instead; the framework's /_error routes preview
      the real one
    correct: true
  - id: CHO-ga7cys5c6nhe
    text: The template must be cleared from the cache before it appears
    correct: false
    explanation: Caching is not the obstacle; the environment is.
  - id: CHO-r2yhea2xce59
    text: Custom error pages only apply once the application is deployed
    correct: false
    explanation: They apply wherever the generic page is shown; dev simply shows a different page.
  - id: CHO-c64m30t1sd2t
    text: The template has to be registered in the configuration first
    correct: false
    explanation: Overriding by location is enough; no registration step exists.
  explanation: The dev environment deliberately shows the exception page with its trace, so the customised page
    is previewed through the routes FrameworkBundle loads under when@dev.
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/controller/error_pages.rst
    branch: '8.0'
    symbol_or_lines: testing-error-pages
    verified_at: '2026-09-02'
