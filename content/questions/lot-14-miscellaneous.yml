  question: 'An exception class implements HttpExceptionInterface and its getStatusCode() returns 409. framework.exceptions
    also maps that class to status_code: 423. A controller throws it. What status does the error page carry?'
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 55
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-10-17'
  tags:
  - exception
  choices:
  - id: CHO-7z4ayt9g2bmc
    text: '423: the framework.exceptions mapping is applied first'
    correct: true
  - id: CHO-8x0b0ctmff1z
    text: '409: an exception that states its own status always keeps it'
    correct: false
    explanation: The configured status_code is applied before the exception is asked for its own.
  - id: CHO-6678cw2chyde
    text: '500: the two sources conflict, so the generic status is used'
    correct: false
    explanation: 'There is no conflict to resolve: the sources are read in a fixed order.'
  - id: CHO-m2jn9vwxdqa9
    text: 409 in the dev environment, and 423 in prod
    correct: false
    explanation: The environment changes how the page looks, not which status it carries.
  explanation: 'ErrorListener reads framework.exceptions first, and its status_code wins even over HttpExceptionInterface;
    then #[WithHttpStatus], ignored when the interface is implemented; then getStatusCode(); then 400 for a RequestExceptionInterface;
    otherwise 500. Executed on HttpKernel 8.0.15 with ErrorListener and ErrorController: 423.'
  official_sources:
