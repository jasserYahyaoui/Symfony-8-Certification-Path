  question: Which .env file is deliberately ignored in the test environment?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 50
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-02'
  tags:
  - test
  choices:
  - id: CHO-qpr57ycem8m1
    text: .env.local
    correct: true
  - id: CHO-vs9xcghp43jv
    text: .env.test.local
    correct: false
    explanation: That one is read; it is the machine-specific override for the test environment.
  - id: CHO-911kzjsd0vms
    text: .env.test
    correct: false
    explanation: That is the committed test-environment file and is read.
  - id: CHO-p5b9bs1k33cf
    text: .env
    correct: false
    explanation: The base file is always read.
  explanation: .env.local is skipped in tests so that the suite produces the same result on every machine.
