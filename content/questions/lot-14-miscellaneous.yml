  question: What is the practical difference between a container parameter and an environment variable reference?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 65
  classification: OFFICIAL
  pool: VALIDATION
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-10-02'
  tags:
  - parameters
  choices:
  - id: CHO-e11k51x0h4yh
    text: The parameter at compile time, the variable at runtime
    correct: true
  - id: CHO-dwz08nyh25za
    text: The parameter can hold an array, the environment variable cannot
    correct: false
    explanation: An environment variable can carry structured data through a processor; that is not the defining
      difference.
  - id: CHO-0s5xf8033czm
    text: The parameter is public, the environment variable private
    correct: false
    explanation: Visibility applies to services, not to either of these.
  - id: CHO-jta0wpy1gxev
    text: Only the variable can differ per environment
    correct: false
    explanation: Both can. Executed on DependencyInjection 8.0.15, a parameter overridden under when@prod read
      prod-value in prod and base in dev; a variable differs through a .env.<env> file.
  explanation: Because the environment variable is read at runtime, the same compiled container can be deployed
    to machines that give it different values. Version 1 offered "the parameter is typed, the environment
    variable is not" as a distractor; that is partly true, since an environment variable is a string until a
    processor converts it, so the choice was replaced.
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/configuration.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/configuration.rst
    branch: '8.0'
    symbol_or_lines: configuration-parameters
    verified_at: '2026-09-02'
