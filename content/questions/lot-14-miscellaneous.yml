  question: What is the practical difference between a container parameter and an environment variable reference?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 65
  classification: OFFICIAL
  pool: VALIDATION
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-02'
  tags:
  - parameters
  choices:
  - id: CHO-e11k51x0h4yh
    text: The parameter is resolved when the container is compiled; the environment variable is read at runtime
    correct: true
  - id: CHO-dwz08nyh25za
    text: The parameter can hold an array, the environment variable cannot
    correct: false
    explanation: An environment variable can carry structured data through a processor; that is not the defining
      difference.
  - id: CHO-0s5xf8033czm
    text: The parameter is public, the environment variable private
    correct: false
    explanation: Visibility applies to services, not to either of these.
  - id: CHO-qkgh9x1pvx7f
    text: The parameter is typed, the environment variable is not
    correct: false
    explanation: Parameters are not typed either; processors are what type an environment variable.
  explanation: Because the environment variable is read at runtime, the same compiled container can be deployed
    to machines that give it different values.
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/configuration.rst
    branch: '8.0'
    symbol_or_lines: configuration-parameters
    verified_at: '2026-09-02'
