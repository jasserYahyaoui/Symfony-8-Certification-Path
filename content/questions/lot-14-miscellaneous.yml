  choices:
  - id: CHO-tjy7zvqjw83m
    text: The real environment variable
    correct: true
  - id: CHO-8x0fxe35q2pj
    text: .env, because it is parsed later in the boot sequence
    correct: false
    explanation: Parsing order is not what decides; existing variables are left untouched by design.
  - id: CHO-rg3ste2dgk4r
    text: Whichever was defined last alphabetically
    correct: false
    explanation: No such rule exists.
  - id: CHO-y3p47frzg6x7
    text: 'Neither: the conflict raises an error at boot'
    correct: false
    explanation: Nothing is raised; the two coexist and one simply wins.
  explanation: The .env files supply defaults; a variable already present in the environment is not overwritten,
    unless Dotenv is called with overrideExistingVars set to true.
