  question: APP_ENV is prod. APP_GREETING is set in .env, in .env.local and in .env.prod, and nowhere else. Which
    value does the application read?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 50
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-10-17'
  tags:
  - env
  - dotenv
  choices:
  - id: CHO-0jrskgc6n32f
    text: The one in .env.prod, loaded after .env.local
    correct: true
  - id: CHO-nvhzyywx1jhq
    text: The one in .env.local, because a .local file always wins
    correct: false
    explanation: .env.local only beats .env; .env.<env> and .env.<env>.local are loaded after it.
  - id: CHO-yv5tn9nynee3
    text: The one in .env, because the first definition is kept
    correct: false
    explanation: Among .env files the last one loaded wins; only a real environment variable is kept.
  - id: CHO-5nz750y20d1c
    text: 'None: a variable defined in two .env files is an error'
    correct: false
    explanation: Redefining a variable in a later file is the point of the cascade.
  explanation: 'Dotenv::loadEnv() reads .env, then .env.local (skipped in test), then .env.<env>, then .env.<env>.local,
    each overriding the previous. Executed with the 8.0 Dotenv: APP_GREETING comes from .env.prod.'
