  question: How does the Twig error renderer choose its template?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 50
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-02'
  tags:
  - templates
  choices:
  - id: CHO-xtt4mgw9aag8
    text: It looks for one named after the status code, then falls back to a generic one
    correct: true
  - id: CHO-82vrpkfvy5h0
    text: It always uses a single generic template
    correct: false
    explanation: A per-status template is tried first.
  - id: CHO-b5xx2kg4wx8f
    text: It picks the template named after the exception class
    correct: false
    explanation: The class name plays no part in the lookup.
  - id: CHO-36w0nh2n0ax7
    text: It requires a template for every status code that can occur
    correct: false
    explanation: The generic fallback exists precisely so that is unnecessary.
  explanation: error404.html.twig first, then error.html.twig; both live in templates/bundles/TwigBundle/Exception/.
  official_sources:
