  question: A URL returns 404 and the route looks correct in the configuration file. Which command explains it?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 55
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-02'
  tags:
  - router
  choices:
  - id: CHO-6pwndq8fcaew
    text: router:match with the URL, which reports the routes tried and why each failed
    correct: true
  - id: CHO-k344tmqxebaa
    text: debug:container, which lists the services
    correct: false
    explanation: Services are not what resolves a URL.
  - id: CHO-psthme4d7e6j
    text: debug:config framework, which shows merged configuration
    correct: false
    explanation: That shows configuration, not the outcome of matching one URL.
  - id: CHO-0v68f8hx68yc
    text: cache:clear, which rebuilds the routing cache
    correct: false
    explanation: That may hide the symptom but explains nothing.
  explanation: Reading the file shows what was written; router:match shows what the router actually does with a
    given path.
