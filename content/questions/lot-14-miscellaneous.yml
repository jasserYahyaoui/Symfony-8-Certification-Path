  question: The ExpressionLanguage component offers two ways to work with an expression. What separates
    them?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 45
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-12'
  tags:
  - expression-language
  - modes
  choices:
  - id: CHO-kfh7v0khb9y5
    text: One evaluates directly, the other compiles to PHP
    correct: true
  - id: CHO-pkj6jzz2xm1t
    text: One returns a boolean, the other any value
    correct: false
    explanation: Both return whatever the expression yields; a boolean is merely the common case.
  - id: CHO-1rb2ygd32s62
    text: One runs in the container, the other at request time
    correct: false
    explanation: Where it runs is the caller's business, not a mode of the component.
  - id: CHO-42yfvezb9hbn
    text: One accepts variables, the other only literals
    correct: false
    explanation: Both accept variables passed alongside the expression.
  explanation: Evaluating runs the expression as it stands. Compiling turns it into PHP that can be
    cached and run later — which is the whole reason the second mode exists, since an expression re-evaluated
    on every request would be parsed every time.
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/components/expression_language.rst
    readable_url: https://github.com/symfony/symfony-docs/blob/8.0/components/expression_language.rst
    repository: symfony/symfony-docs
    branch: '8.0'
