  question: A controller throws a plain RuntimeException meaning "not found". What status does the error page carry?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 55
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-02'
  tags:
  - exception
  choices:
  - id: CHO-ksyjv1htjx66
    text: 500, because the exception does not implement HttpExceptionInterface
    correct: true
  - id: CHO-rzqsnaj97qpe
    text: 404, because the message says the resource is missing
    correct: false
    explanation: The message is never inspected to derive a status.
  - id: CHO-a9p9rn2zx0p2
    text: 400, the default for an unhandled application exception
    correct: false
    explanation: The default is 500, not 400.
  - id: CHO-4rvqx5jhvywa
    text: 'No status: the response is empty'
    correct: false
    explanation: A response is always produced, with a status.
  explanation: Only an exception implementing HttpExceptionInterface supplies its own status through getStatusCode();
    everything else is 500.
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/controller/error_pages.rst
    branch: '8.0'
    symbol_or_lines: how-to-customize-error-pages
    verified_at: '2026-09-02'
