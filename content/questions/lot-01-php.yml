  question: A backed enum is built from unvalidated user input. Which call avoids an uncaught error on
    an unknown value?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 60
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-01'
  tags:
  - enums
  choices:
  - id: CHO-xf2pn4ya26ws
    text: Status::tryFrom($input) ?? Status::Draft
    correct: true
  - id: CHO-e95bxhpzgx60
    text: Status::from($input)
    correct: false
    explanation: from() throws a \ValueError when no case matches, which is exactly the uncaught error
      to avoid.
  - id: CHO-37q8nj6peby6
    text: new Status($input)
    correct: false
    explanation: Enums cannot be instantiated with new; they have no constructor.
  - id: CHO-gc50m3r51en9
    text: Status::cases()[$input]
    correct: false
    explanation: cases() is a list of case objects; indexing it by an arbitrary input is unrelated to
      the backing value and may not exist.
  explanation: tryFrom() returns null instead of throwing, so it composes with ?? for a safe default.
    from() throws \ValueError.
