  choices:
  - id: CHO-hy1mh0eqhysw
    text: The property can be read from anywhere
    correct: true
  - id: CHO-8ym0ht9fzkxj
    text: The property can only be written from inside the declaring class
    correct: true
  - id: CHO-xzxeax9zt2xs
    text: The property can only be written once
    correct: false
    explanation: That is `readonly`. Asymmetric visibility restricts WHO may write, not HOW MANY times.
  - id: CHO-d5t7nrj6kxvh
    text: The property is implicitly readonly outside the class
    correct: false
    explanation: It is not writable at all outside the class, which is a different guarantee from readonly.
  explanation: Asymmetric visibility gives read and write separate scopes. `public private(set)` means
    readable everywhere, writable only by the declaring class — and writable as often as that class likes,
    unlike readonly.
