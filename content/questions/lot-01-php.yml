  choices:
  - id: CHO-dswb0bybfx64
    text: The Throwable block, because the first matching catch wins
    correct: true
  - id: CHO-y7wjz0z7qnbn
    text: The TypeError block, because PHP picks the most specific type
    correct: false
    explanation: PHP does not search for the closest type; it takes the first branch that matches.
  - id: CHO-rcyx0bg74zh8
    text: A fatal error, because the TypeError branch is unreachable
    correct: false
    explanation: PHP does not reject the unreachable branch, which is what makes the mistake silent.
  - id: CHO-0z4aghxkbnh9
    text: Both, in declaration order
    correct: false
    explanation: Exactly one catch block handles a thrown value.
  explanation: 'catch blocks are tested in order and the first matching type wins, so a broad type
    placed first shadows every narrower one after it. PHP raises no error for the shadowed branch:
    the bug is silent, and only the ordering reveals it.'
