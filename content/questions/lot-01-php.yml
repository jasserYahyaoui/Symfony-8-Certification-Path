    symbol_or_lines: 'Asymmetric Property Visibility — "As of PHP 8.4, object properties may also have their visibility set asymmetrically, with a different scope for reading (get) and writing (set) ... provided it is not more permissive than the default visibility"; example "public private(set) string $title"'
