  reviewed_at: '2026-09-01'
  tags:
  - exceptions
  choices:
  - id: CHO-cn4cmfb583n4
    text: '2'
    correct: true
  - id: CHO-3bxhy2ww5dnp
    text: '1'
    correct: false
    explanation: The try's return value is computed, but the finally's own return replaces it before the
      function exits.
  - id: CHO-b9pcp494qwm1
    text: 1, and the finally return is ignored
    correct: false
    explanation: A return inside finally is not ignored; it overrides.
  - id: CHO-1rhc1qv9g6qs
    text: 'A fatal error: return is not allowed in finally'
    correct: false
    explanation: It is allowed, which is precisely why it is a trap.
  explanation: finally always runs, and a return inside it overrides a return from the try block. This
    is why returning from finally is discouraged.
