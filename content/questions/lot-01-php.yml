  question: Code wrapped in `try { ... } catch (Exception $e) { ... }` still crashes on a TypeError. Why?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 60
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-01'
  tags:
  - exceptions
  choices:
  - id: CHO-wpnw9td31enq
    text: TypeError extends Error, not Exception
    correct: true
  - id: CHO-bqjyw5wd2exv
    text: TypeError cannot be caught in PHP
    correct: false
    explanation: 'It can: since PHP 7 most engine errors are catchable Throwables.'
  - id: CHO-5rv4fd9yjz48
    text: The catch block must be declared before the try block
    correct: false
    explanation: catch always follows try; ordering between blocks is not the issue.
  - id: CHO-mayqdwym4b01
    text: TypeError is only catchable inside a finally block
    correct: false
    explanation: finally does not catch anything; it always runs regardless.
  explanation: Error and Exception are sibling branches under the Throwable interface. catch (Exception)
    never sees an Error; catch (Throwable) sees both.
  official_sources:
