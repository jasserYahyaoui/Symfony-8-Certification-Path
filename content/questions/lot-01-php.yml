  question: 'A parent class declares `public static function create(): self { return new self(); }`. A
    child class extends it without overriding. What does `Child::create()` return?'
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 70
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-01'
  tags:
  - oop
  - late-static-binding
  choices:
  - id: CHO-f84qyarv4a5d
    text: An instance of the parent class
    correct: true
  - id: CHO-tewen10qah85
    text: An instance of the child class
    correct: false
    explanation: That would require `new static()`. `self` does not follow late static binding.
  - id: CHO-fsa54vffnmnc
    text: A fatal error, because self is not allowed in a static method
    correct: false
    explanation: '`self` is valid there; it simply resolves to the declaring class.'
  - id: CHO-xtb2c9pjhxd5
    text: An instance of the child class only if the child redeclares create()
    correct: false
    explanation: Redeclaring would change which code runs, but the existing parent code returns the parent
      regardless.
  explanation: '`self` resolves to the class where the code is written; `static` resolves to the class
    actually called. This is why factories use `new static()`.'
  official_sources:
  - url: https://raw.githubusercontent.com/php/doc-en/master/language/oop5/late-static-bindings.xml
    repository: php/doc-en
    branch: master
    verified_at: '2026-09-01'
