    Exception or Error: the engine walks to the root of the inheritance chain and accepts the class only
    if that root is Exception or Error. Extending Exception is the normal application-level approach;
    Error is the separate engine-error hierarchy, not the usual base for domain or application exceptions.'
  official_sources:
