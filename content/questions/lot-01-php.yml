  tags:
  - interfaces
  choices:
  - id: CHO-zwydyc9j4j6n
    text: A constant
    correct: true
  - id: CHO-fccx0pmhjbxf
    text: A private method
    correct: false
    explanation: Interface methods are implicitly public; a private one could not be implemented.
  - id: CHO-tnp4e5xgtad8
    text: A property holding state
    correct: false
    explanation: Interfaces declare no state. PHP 8.4 hooks allow abstract property declarations, but
      still no stored value.
