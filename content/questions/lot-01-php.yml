  choices:
  - id: CHO-kb3ve5739w4b
    text: getAttributes() was never followed by newInstance()
    correct: true
  - id: CHO-nj8faby1vgnb
    text: Attribute constructors are never executed by PHP
    correct: false
    explanation: They are executed — but only when newInstance() is called.
  - id: CHO-8pwnb8cj495p
    text: 'The attribute is missing the #[Attribute] marker'
