  question: Given `$f = 3; $g = function (int $n) use ($f) { return $n * $f; }; $f = 10;` — what does
    $g(5) return?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 65
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-01'
  tags:
  - closures
  choices:
  - id: CHO-w51h7s9pv1sa
    text: '15'
    correct: true
  - id: CHO-07h0r5t3j0rd
    text: '50'
    correct: false
    explanation: 'That would require capture by reference: `use (&$f)`.'
  - id: CHO-zhbzpper1ckw
    text: A TypeError, because $f changed type
    correct: false
    explanation: $f stays an int throughout; nothing about the type changes.
  - id: CHO-nra02mkqvn0f
    text: null, because $f is out of scope inside the closure
    correct: false
    explanation: '`use` brings it into scope; without `use` it would be undefined, not null.'
  explanation: '`use` captures by value at the moment the closure is DEFINED. Reassigning $f afterwards
    has no effect. `use (&$f)` would capture by reference and yield 50.'
  official_sources:
