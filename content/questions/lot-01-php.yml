    text: By implementing Stringable and Throwable together
    correct: false
    explanation: Throwable already extends Stringable, and implementing Throwable directly remains forbidden.
  - id: CHO-38y7p6bw7yb7
    text: By extending any class and adding a getMessage() method
    correct: false
    explanation: Matching the shape is not enough; only the real hierarchy can be thrown.
  explanation: PHP classes cannot implement Throwable directly. A custom throwable must extend Exception
    or Error, optionally also implementing an application marker interface.
