  answer_mode: single
  required_answer_count: 1
  question: Why does the documentation warn against changing application state in a GET handler?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 55
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-02'
  tags:
  - methods
  choices:
  - id: CHO-3gbgvt9r6bgt
    text: Because a cached response means later requests may never reach the server
    correct: true
  - id: CHO-dcs5cqrw8f5w
    text: Because GET requests cannot carry a body
    correct: false
    explanation: Body support is unrelated to the caching consequence being described.
  - id: CHO-mdmp6kpsf154
    text: Because the router rejects state changes on GET
    correct: false
    explanation: Nothing in the framework prevents it; the risk is behavioural.
  - id: CHO-qeswr1rg6rdd
    text: Because GET responses are always stored by the browser
    correct: false
    explanation: Storage depends on the headers, and the warning is about the effect when storage does happen.
  explanation: HTTP caching applies to safe methods, so a GET that mutates state may simply stop being executed
    once its response is cached.
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/http_cache.rst
    branch: '8.0'
    symbol_or_lines: safe-methods-only-caching-get-or-head-requests
    verified_at: '2026-09-02'
- id: QST-478vmvbdbme2
