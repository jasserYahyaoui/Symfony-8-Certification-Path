  required_answer_count: 1
  question: 'A controller action carries #[Cache(maxage: 3600)] and also calls $response->setMaxAge(60). Which value
    reaches the client?'
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 55
  classification: OFFICIAL
  pool: VALIDATION
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-02'
  tags:
  - attribute
  choices:
  - id: CHO-tf2sqzmbzyg6
    text: 60, because headers set in the controller take precedence over the attribute
    correct: true
  - id: CHO-z6szn12hxkwb
    text: 3600, because the attribute is evaluated after the controller returns
    correct: false
    explanation: The documented precedence is the other way round.
  - id: CHO-yy4rkj0w09q2
    text: Whichever is smaller, as a safety rule
    correct: false
    explanation: No such arbitration exists.
  - id: CHO-cp7nvaba2z3w
    text: 'Neither: the conflicting settings cancel each other out'
    correct: false
    explanation: Nothing is cancelled; one source simply wins.
  explanation: The attribute sets a default policy that code in the controller is allowed to contradict.
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/http_cache.rst
    branch: '8.0'
    symbol_or_lines: expiration-caching
    verified_at: '2026-09-02'
