  question: How is Symfony's own gateway cache turned on?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 50
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-02'
  tags:
  - reverse-proxy
  choices:
  - id: CHO-77s628jp48qe
    text: By setting framework.http_cache to true, typically under when@prod
    correct: true
  - id: CHO-0vt96wbt3r85
    text: By registering an HttpCache class in public/index.php by hand
    correct: false
    explanation: No manual wiring is needed; the option is enough.
  - id: CHO-j5nmzbyrtyfz
    text: By installing a separate reverse-proxy package
    correct: false
    explanation: The proxy ships with the framework.
  - id: CHO-9h8nhe5ht54c
    text: By adding an attribute to every controller that should be cached
    correct: false
    explanation: An attribute declares a policy; it does not install a proxy.
  explanation: The kernel then acts as a reverse proxy, storing responses and serving them back. It is written in
    PHP, so it is slower than Varnish, but the application is unchanged if you switch.
