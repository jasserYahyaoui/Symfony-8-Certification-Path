  question: A service uses ClockAwareTrait. What supplies its clock, and how does the service read the time?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 55
  classification: OFFICIAL
  pool: VALIDATION
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-02'
  tags:
  - clock-aware
  choices:
  - id: CHO-b23wqzbdyr8n
    text: Autoconfiguration calls the trait's setter, and the service calls $this->now()
    correct: true
  - id: CHO-9qfzvjqk7hwj
    text: The trait instantiates a system clock on first use, read through $this->clock
    correct: false
    explanation: The trait does not build its own clock; the container provides it, which is what makes it replaceable
      in a test.
  - id: CHO-50cbgrqxjk63
    text: The clock must be passed to the constructor, then read through $this->now()
    correct: false
    explanation: Using the trait is the alternative to a constructor argument.
  - id: CHO-etv2amt7pa0m
    text: A static accessor is used, so no injection happens at all
    correct: false
    explanation: A global accessor exists in the component, but it is not what this trait relies on.
  explanation: Because the container supplies the clock, a test can substitute a mocked one without changing the
    service.
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/components/clock.rst
    branch: '8.0'
    symbol_or_lines: clock_use-inside-a-service
    verified_at: '2026-09-02'
