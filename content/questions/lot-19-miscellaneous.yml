  type: mcq
  answer_mode: single
  required_answer_count: 1
  question: A test builds a clock fixed at 15:20, asserts a token is valid, then asserts it has expired five minutes
    later without touching the clock. The second assertion fails. Why?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 55
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-02'
  tags:
  - mock-clock
  choices:
  - id: CHO-yy4taqqh7m0f
    text: 'The clock never advanced: it stays at 15:20 until the test moves it explicitly'
    correct: true
  - id: CHO-v8f061eavt3z
    text: The assertions ran too quickly for the clock to change
    correct: false
    explanation: Real elapsed time is irrelevant here; this clock is not driven by it at all.
  - id: CHO-d5drp5ysrxvf
    text: Expiry checks need the token's own timestamp, not the clock
    correct: false
    explanation: Comparing against the clock is the intended design; the problem is that the clock did not move.
  - id: CHO-xnz9cs91rsvg
    text: A frozen clock rejects comparisons with future dates
    correct: false
    explanation: Comparisons work normally; only the value returned stayed the same.
  explanation: A mocked clock is fixed at the time it was built. Advancing it is an explicit call, which is precisely
    what makes the test deterministic.
  official_sources:
