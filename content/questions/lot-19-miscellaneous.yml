  question: Which clock implementation should measure how long an operation took?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 55
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-02'
  tags:
  - monotonic
  choices:
  - id: CHO-eayr46y6a2tw
    text: MonotonicClock, which increases steadily and ignores system clock adjustments
    correct: true
  - id: CHO-xzh066kqf1f5
    text: NativeClock, since it reports the real system time
    correct: false
    explanation: The system time can be adjusted mid-measurement, which corrupts a duration.
  - id: CHO-vkanh34jypt1
    text: MockClock, since it can be moved forward by a known amount
    correct: false
    explanation: Moving it yourself would produce the duration you already assumed, measuring nothing.
  - id: CHO-0rvfmknj1f8g
    text: Any of them, because all three return the same kind of value
    correct: false
    explanation: They return comparable values but differ in exactly the property a measurement needs.
  explanation: It relies on hrtime() for a high-resolution monotonic reading, which is what a stopwatch requires.
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/components/clock.rst
    branch: '8.0'
    symbol_or_lines: monotonic-clock
    verified_at: '2026-09-02'
