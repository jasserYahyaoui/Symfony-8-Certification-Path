  question: An endpoint answers with JSON, so no toolbar is injected. How is that request's profile
    reached?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 45
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-12'
  tags:
  - profiler
  - api
  choices:
  - id: CHO-1t9jbyqwdmwm
    text: Through the link in a response header, or the profiler index
    correct: true
  - id: CHO-23zp158e105w
    text: 'It cannot be: no toolbar means no profile was stored'
    correct: false
    explanation: The profile is collected whatever the content type; only the injection is skipped.
  - id: CHO-gaq33gcbaer7
    text: By requesting the same URL again with an HTML accept header
    correct: false
    explanation: That would profile a second, different request.
  - id: CHO-hw7wkwmjjcja
    text: By enabling a separate setting for non-HTML responses
    correct: false
    explanation: No such switch exists; collection was never conditional on the content type.
  explanation: The response carries a debug token and a link header pointing at that profile, and the
    profiler index lists every stored profile. The same token can be used from code to load the profile
    — which is how a test asserts on what a request did.
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/profiler.rst
    repository: symfony/symfony-docs
    branch: '8.0'
    symbol_or_lines: the toolbar is only injected into HTML responses; X-Debug-Token-Link and /_profiler
    verified_at: '2026-09-12'
