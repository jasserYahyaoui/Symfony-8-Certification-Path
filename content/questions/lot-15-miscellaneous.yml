  question: What does composer dump-env prod produce, and why?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 55
  classification: OFFICIAL
  pool: VALIDATION
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-02'
  tags:
  - dump-env
  choices:
  - id: CHO-7q6hv9808tqg
    text: A .env.local.php that overrides the other configuration files, so the .env files need not be parsed on
      every request
    correct: true
  - id: CHO-d6mhmqe5mzxr
    text: A .env.prod file committed to the repository
    correct: false
    explanation: The generated file is machine-specific and takes precedence; it is not the committed environment
      file.
  - id: CHO-v1749b28b60e
    text: A list of the environment variables the application is missing
    correct: false
    explanation: It dumps resolved values rather than reporting gaps.
  - id: CHO-fmrxjcx0shxc
    text: An encrypted vault of the production secrets
    correct: false
    explanation: Encryption of secrets is a separate mechanism.
  explanation: It resolves all .env files once into an optimised PHP file; --empty generates the same structure
    without values for setups relying only on real environment variables.
  official_sources:
