  question: A custom data collector performs its measurements inside collect() and the numbers are always empty.
    Why?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 65
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-02'
  tags:
  - collect
  choices:
  - id: CHO-4pnssyc5herm
    text: collect() picks up data already stored
    correct: true
  - id: CHO-w51q3cqe4fwc
    text: collect() runs before the controller, so nothing has happened yet
    correct: false
    explanation: It runs on kernel.response, after the controller; the problem is what the method is for.
  - id: CHO-194qzdzzg5hj
    text: The collector must be tagged manually for collect() to run
    correct: false
    explanation: With autoconfigure the tag is added, and the method was clearly reached.
  - id: CHO-d370xqx7722y
    text: Measurements must be returned rather than stored in $this->data
    correct: false
    explanation: $this->data is the documented place to store them.
  explanation: 'The documentation warns that collect() is not there to gather data: a service collects during the
    request and the collector picks it up on kernel.response.'
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/profiler.rst
    branch: '8.0'
    symbol_or_lines: creating-a-data-collector
