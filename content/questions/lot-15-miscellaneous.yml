  - tech-lead
  reviewed_at: '2026-09-02'
  tags:
  - late-collect
  choices:
  - id: CHO-w80wjr5cajy8
    text: LateDataCollectorInterface, whose lateCollect() runs during kernel.terminate
    correct: true
  - id: CHO-v6t7thnt5bqe
    text: DataCollectorInterface, by calling collect() a second time
    correct: false
    explanation: collect() is called only once.
  - id: CHO-rm04jr6tpjjw
    text: An event subscriber on kernel.response with a negative priority
    correct: false
    explanation: That still runs before the response is sent, which is the case being excluded.
  - id: CHO-v8c0yk7y5krv
    text: A reset() implementation that reads the data before clearing it
    correct: false
    explanation: reset() clears state between requests; it collects nothing.
  explanation: lateCollect() is invoked just before the profiler serialises its data, during kernel.terminate.
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/profiler.rst
    branch: '8.0'
