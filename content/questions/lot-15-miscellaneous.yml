  question: A deployment script runs php bin/console cache:clear with no environment variables and the site still
    serves stale behaviour. What was wrong?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 55
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-02'
  tags:
  - cache
  choices:
  - id: CHO-t0czznen5fkz
    text: The command cleared the cache of the current environment, not the production one
    correct: true
  - id: CHO-ra99fk0gteek
    text: cache:clear only removes the template cache
    correct: false
    explanation: It clears the whole application cache for the environment it runs in.
  - id: CHO-m7n9nx7js6se
    text: The cache must be deleted from disk instead
    correct: false
    explanation: The command is the supported way; the environment was the problem.
  - id: CHO-64jbfbk27kn6
    text: Clearing requires the profiler to be installed
    correct: false
    explanation: The two are unrelated.
  explanation: The documented invocation is APP_ENV=prod APP_DEBUG=0 php bin/console cache:clear, because the cache
    is per environment.
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/deployment.rst
    branch: '8.0'
    symbol_or_lines: d-clear-your-symfony-cache
    verified_at: '2026-09-02'
