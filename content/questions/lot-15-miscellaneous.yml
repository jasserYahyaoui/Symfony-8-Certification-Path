  question: Which four steps does the documentation list as the typical Symfony deployment?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 45
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-12'
  tags:
  - deployment
  - steps
  choices:
  - id: CHO-4v2xa04vg4b6
    text: Upload, install dependencies, migrate, clear the cache
    correct: true
  - id: CHO-hw4w73hx4tyj
    text: Clear the cache, upload, migrate, install dependencies
    correct: false
    explanation: Clearing a cache before the new code is there would clear the old one.
  - id: CHO-t5pd3g3j07cj
    text: Upload, clear the cache, install dependencies, migrate
    correct: false
    explanation: Dependencies have to be present before the cache is built against them.
  - id: CHO-fjst9qw014ed
    text: Install dependencies, upload, clear the cache, migrate
    correct: false
    explanation: Migrations belong before the cache step, not after it.
  explanation: 'The order is what makes it safe: the code arrives, its dependencies follow, the data
    structures catch up, and only then is the cache rebuilt against all three. Tagging a release, linting
    and running tests are listed separately, as optional additions.'
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/deployment.rst
    repository: symfony/symfony-docs
    branch: '8.0'
    symbol_or_lines: the typical steps taken while deploying a Symfony application
    verified_at: '2026-09-12'
