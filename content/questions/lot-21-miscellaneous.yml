  choices:
  - id: CHO-a3b2dsdf3gba
    text: The component throws instead of returning false, and a directory is one of the cases it rejects
    correct: true
  - id: CHO-0zw4fpx09e2r
    text: The component cannot read files at all and only reports metadata
    correct: false
    explanation: Reading file contents is exactly what the method is for.
  - id: CHO-c4j61csc1wgx
    text: The directory lacked read permission, which is the real cause
    correct: false
    explanation: Permission is a separate failure case; passing a directory is rejected on its own.
  - id: CHO-b2gv6sbra50f
    text: PHP's own function was called with the wrong arguments
    correct: false
    explanation: The contrast described is between two working calls, not a mistake in one of them.
  explanation: The component's read method throws when the path is unreadable and when a directory is passed, so
    a failure cannot pass unnoticed.
