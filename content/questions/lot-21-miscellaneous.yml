  question: One search object is configured with a common location, then used for two searches with different name
    patterns. The second search returns too few results. What explains it?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 65
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-02'
  tags:
  - stateful
  choices:
  - id: CHO-9jztjvp63xwm
    text: The criteria accumulated on the shared object, so the second search demanded both patterns
    correct: true
  - id: CHO-vyegmcpva9vz
    text: The first search consumed the iterator, leaving nothing for the second
    correct: false
    explanation: Re-iterating is possible; the narrowing comes from the criteria, not from exhaustion.
  - id: CHO-zmnd18bt50we
    text: The location was reset after the first search and had to be given again
    correct: false
    explanation: The location persisted; that is why the object was reused in the first place.
  - id: CHO-apyb8vtjs3zz
    text: Results are cached from the first search and replayed
    correct: false
    explanation: No caching occurs between searches.
  explanation: The object is stateful and every call changes it, so a shared configuration has to be cloned before
    each distinct search.
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/components/finder.rst
    branch: '8.0'
    symbol_or_lines: usage
    verified_at: '2026-09-02'
