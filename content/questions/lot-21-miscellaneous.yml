  - tech-lead
  reviewed_at: '2026-09-02'
  tags:
  - iterator
  choices:
  - id: CHO-atm2cekw4f5w
    text: A separate iterator exists per location, so keys can collide unless the conversion is told to discard
      them
    correct: true
  - id: CHO-p34tck9fzxxb
    text: Only the first location is searched unless they are passed as one array
    correct: false
    explanation: Every location is searched either way; the loss happens during conversion.
  - id: CHO-npg7zg54vz2x
    text: Duplicate files across locations are removed automatically
    correct: false
    explanation: No de-duplication by content or name is performed.
  - id: CHO-h1cygwnhesa5
    text: The result must be sorted before it can be converted
    correct: false
    explanation: Sorting is unrelated to the loss of entries.
  explanation: Passing false as the second argument of the conversion discards the keys, which is what prevents
    entries from overwriting one another.
