  required_answer_count: 1
  question: Which guarantee does the component's atomic write give a process reading the same file concurrently?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 55
  classification: OFFICIAL
  pool: VALIDATION
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-02'
  tags:
  - atomic
  choices:
  - id: CHO-hgane5m1701a
    text: It sees either the complete previous contents or the complete new ones, never a partial file
    correct: true
  - id: CHO-8fej3sc0q3gw
    text: It is blocked until the write finishes
    correct: false
    explanation: No lock is placed on readers; the guarantee comes from writing elsewhere then moving.
  - id: CHO-754ggq6hkn0n
    text: It always sees the new contents immediately
    correct: false
    explanation: A reader that opened before the move still sees the old file, which is precisely the point.
  - id: CHO-nq3pfq1bh24m
    text: It receives an error while the write is in progress
    correct: false
    explanation: Readers are never interrupted.
  explanation: A temporary file is written first and moved into place when finished, so no reader can observe a
    half-written file. The append method makes no such guarantee.
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/components/filesystem.rst
    branch: '8.0'
    symbol_or_lines: dumpfile
    verified_at: '2026-09-02'
