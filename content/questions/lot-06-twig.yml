  reviewed_at: '2026-09-11'
  tags:
  - debug
  - console
  choices:
  - id: CHO-qr78smnbhnn0
    text: It parses the template without running it
    correct: true
  - id: CHO-5dr5rv4e2p6f
    text: It skips templates that use strict_variables
    correct: false
    explanation: The option is global to the environment; the linter does not read it per template.
  - id: CHO-agwve5cewh6s
    text: It only reads the first template of each directory
    correct: false
    explanation: It walks every template it is given.
  - id: CHO-2wy0zff19yw6
    text: It reports undefined variables as deprecations, which are hidden by default
    correct: false
    explanation: Deprecations are shown with --show-deprecations, and an undefined variable is not one.
  explanation: Linting is a syntax check. Whether a name resolves depends on the data passed at render
    time, which no static pass can know. The other command of the pair, debug:twig, inventories what
    exists rather than checking a template.
