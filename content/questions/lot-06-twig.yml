  question: 'A variable holds the integer 0. Which of ?: and ?? returns the fallback for it?'
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 45
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-11'
  tags:
  - syntax
  - operators
  choices:
  - id: CHO-79sbtjaev9d7
    text: '?: only'
    correct: true
  - id: CHO-8p6df3v6wa1b
    text: ?? only
    correct: false
    explanation: Null-coalescing returns the fallback for an undefined or null value; 0 is neither.
  - id: CHO-t9fnyj2q8vbn
    text: Both of them
    correct: false
    explanation: They differ precisely on a defined but falsy value such as 0, an empty string or an
      empty array.
  - id: CHO-7bewzg5fqxh5
    text: Neither of them
    correct: false
    explanation: The ternary shortcut does fall back here, because it reads the value as a boolean.
  explanation: '{{ value ?: "x" }} is {{ value ? value : "x" }}, so any falsy value takes the fallback.
    {{ value ?? "x" }} falls back only when the value is undefined or null.'
  official_sources:
  - url: https://raw.githubusercontent.com/twigphp/Twig/v3.22.0/doc/templates.rst
    repository: twigphp/Twig
    branch: v3.22.0
    symbol_or_lines: the ternary operator and the null-coalescing operator
    verified_at: '2026-09-11'
