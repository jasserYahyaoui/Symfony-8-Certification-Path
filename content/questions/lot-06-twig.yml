  question: A double-quoted string must print the interpolation markers literally. What makes Twig leave
    them alone?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 45
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-11'
  tags:
  - interpolation
  - escaping
  choices:
  - id: CHO-ynrdspwp60cq
    text: A backslash before the marker
    correct: true
  - id: CHO-88z32khtes1c
    text: Doubling the hash sign
    correct: false
    explanation: Doubling is how a percent sign is escaped in a translated message, not here.
  - id: CHO-r2qb30s3qesd
    text: Switching the string to single quotes
    correct: false
    explanation: That works, but it changes the string type; the question asks how to keep the double-quoted
      form.
  - id: CHO-2st9p51e7q1k
    text: Wrapping the string in the raw filter
    correct: false
    explanation: raw controls output escaping, long after the string has been parsed.
  explanation: Interpolation is resolved when the string is parsed, so the escape has to be in the source.
    Single quotes are the other way out, at the cost of interpolation everywhere in that string.
  official_sources:
  - url: https://raw.githubusercontent.com/twigphp/Twig/v3.22.0/doc/templates.rst
    repository: twigphp/Twig
    branch: v3.22.0
