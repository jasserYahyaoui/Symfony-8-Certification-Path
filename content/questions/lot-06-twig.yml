  question: For {{ foo.bar }}, which access does Twig try FIRST?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 60
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-01'
  tags:
  - syntax
  - resolution
  choices:
  - id: CHO-6e4cyz93wmrf
    text: $foo['bar']
    correct: true
  - id: CHO-zqx7aqm88p3r
    text: $foo->bar
    correct: false
    explanation: The public property is tried second, after the array access.
  - id: CHO-epcfdct0bs5a
    text: $foo->getBar()
    correct: false
    explanation: The getter comes fourth in the order.
  - id: CHO-cjr0d789jagw
    text: $foo->bar()
    correct: false
    explanation: The public method comes third.
  explanation: The engine tries the array element first, then the public property, then a class
    constant of the same name, then bar(), getBar(), isBar() and hasBar(), and finally null — or a
    RuntimeError under strict_variables. An object implementing ArrayAccess therefore sees the array
    access win. The Symfony 8.0 page lists the same order without the class-constant step; the Twig
    v3.22.0 engine performs it.
  official_sources: *id001
