  choices:
  - id: CHO-qy7tpps7e005
    text: By calling {{ parent() }} inside the block
    correct: true
  - id: CHO-1by6hw3ykvbz
    text: By adding the append keyword to the block tag
    correct: false
    explanation: Twig has no append keyword for blocks.
  - id: CHO-vbp77xfpchyk
    text: By declaring the block twice
    correct: false
    explanation: A duplicate block name is an error, not an append.
  - id: CHO-bzd7g8wj0w8q
    text: By using {% use %} on the parent
    correct: false
    explanation: use imports blocks horizontally; it does not append to one.
  explanation: 'Inheritance is single: a template extends exactly one parent, and {% extends %} must be its first
    tag. {% use %} is the separate horizontal-reuse mechanism.'
