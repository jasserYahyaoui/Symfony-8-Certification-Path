  reviewed_at: '2026-09-11'
  tags:
  - translation
  - domain
  choices:
  - id: CHO-3ed3fpf3hsbe
    text: The default domain, messages
    correct: true
  - id: CHO-ty1qs2h68xdt
    text: The domain set by the tag, inherited with the context
    correct: false
    explanation: It is explicitly scoped to the current template to avoid side effects.
  - id: CHO-ctsk6336wdsq
    text: No domain; every message there raises an error until one is set
    correct: false
    explanation: A missing domain falls back to messages, it does not fail.
