  - id: CHO-jvb0grhqpx3d
    text: html_attr
    correct: true
  - id: CHO-gb2fg08ktq4q
    text: html
    correct: false
    explanation: html covers the HTML body and attribute values inside quotes; an unquoted attribute needs more.
