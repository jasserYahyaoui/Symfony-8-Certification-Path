    text: '{% embed %}'
    correct: true
  - id: CHO-wsk573kg466y
    text: '{% include %}'
    correct: false
    explanation: include inserts the rendered template as-is; it cannot override its blocks.
  - id: CHO-r16qyakp09yz
    text: '{% extends %}'
    correct: false
