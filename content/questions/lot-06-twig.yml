  question: A template already extends a layout and now needs the blocks defined in a second, shared
    template. What does the horizontal-reuse tag give it that a second extends could not?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 45
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-11'
  tags:
  - inheritance
  - horizontal-reuse
  choices:
  - id: CHO-76sfh1kn5m5r
    text: It imports those blocks without a second parent
    correct: true
  - id: CHO-pn8andymfxcd
    text: It extends two parents at once, merging their output in order
    correct: false
    explanation: Twig has no multiple inheritance; that is the limitation horizontal reuse works around.
  - id: CHO-k8meh6kcdfrb
    text: It renders the second template immediately, in place
    correct: false
    explanation: The imported blocks are not output automatically; that is what an include does.
  - id: CHO-vamz7aj0m8bb
    text: It replaces the layout for the blocks it defines, keeping it for the others
    correct: false
    explanation: There is no per-block parent; the extends target is unchanged.
  explanation: '{% use %} imports blocks the way an import brings in macros. The imported blocks are
    not printed on their own, and the template still extends exactly one parent.'
  official_sources:
  - url: https://raw.githubusercontent.com/twigphp/Twig/v3.22.0/doc/tags/use.rst
    repository: twigphp/Twig
    branch: v3.22.0
    symbol_or_lines: horizontal reuse, the use statement
    verified_at: '2026-09-11'
