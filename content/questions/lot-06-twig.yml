  question: A child template extends a parent and writes a paragraph outside any block. What is rendered?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 60
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-01'
  tags:
  - inheritance
  choices:
  - id: CHO-t80q6p186yg2
    text: Nothing — a child renders only its blocks
    correct: true
  - id: CHO-9sqz15havj6g
    text: The paragraph, before the parent's output
    correct: false
    explanation: Content outside a block in a child is discarded, not repositioned.
  - id: CHO-qdxterbbd0kc
    text: The paragraph, after the parent's output
    correct: false
    explanation: It is not appended either.
