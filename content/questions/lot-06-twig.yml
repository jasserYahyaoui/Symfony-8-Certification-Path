  question: An enum needs to return a user-facing label that is translated later, in whatever locale
    the template runs under. Why return a translatable object rather than the translation key as a string?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 45
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-11'
  tags:
  - translation
  - translatable
  choices:
  - id: CHO-7a9ztg0k548e
    text: It carries its parameters and its domain with it
    correct: true
  - id: CHO-ydv56zzejyk0
    text: It translates immediately, using the default locale
    correct: false
    explanation: Translating at creation time is the problem a translatable object avoids.
  - id: CHO-sw21eevfk469
    text: It makes the translator service injectable into the enum
    correct: false
    explanation: An enum cannot receive services, which is part of why the object exists.
  - id: CHO-evrm47wsx6je
    text: It bypasses escaping, so markup in the label survives
    correct: false
    explanation: Escaping is unchanged; a translated string is escaped like any other.
  explanation: A plain key cannot carry parameters or a domain, and the extractor does not see it. The
    translatable object fixes both, and the trans filter accepts it like a string.
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/translation.rst
    repository: symfony/symfony-docs
    branch: '8.0'
    symbol_or_lines: Translatable Objects, the t() shortcut
    verified_at: '2026-09-11'
