  tags:
  - authorization
  - voters
  choices:
  - id: CHO-6bzkrea71n8d
    text: Only the author of an article may edit it
    correct: true
  - id: CHO-nq2ajw017vs9
    text: Only administrators may open the back office
    correct: false
    explanation: That is exactly what a role expresses.
  - id: CHO-xe763a4h87sw
    text: Only fully authenticated users may see the page
    correct: false
