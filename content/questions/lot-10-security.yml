  question: A firewall with no pattern is declared first in security.yaml. What happens?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 55
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-01'
  tags:
  - configuration
  - firewalls
  choices:
  - id: CHO-c2rgeva7thed
    text: It matches every request, so the later firewalls are never used
    correct: true
  - id: CHO-zv96xpd5ytqt
    text: Firewalls without a pattern are skipped
    correct: false
    explanation: A missing pattern means it matches everything.
  - id: CHO-0bxn5qsn4j4c
    text: The container refuses to compile
    correct: false
