  exam_skill: DIAGNOSE
  type: mcq
  answer_mode: single
  required_answer_count: 1
  question: A voter's supports() returns false for an attribute. What has it done?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 55
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-01'
  tags:
  - voters
  choices:
  - id: CHO-j90r0ar4ryhz
    text: Abstained — it takes no part in the decision
    correct: true
  - id: CHO-hc67emqr4xb9
    text: Denied access for that attribute
    correct: false
    explanation: Returning false from supports() is not a denial; it means the voter has nothing to say.
  - id: CHO-6x63fvwps0g6
    text: Granted access, leaving the decision to others
    correct: false
    explanation: An abstention is neither a grant nor a denial.
  - id: CHO-8npqzt5er7t0
    text: Caused an error, since every voter must vote
    correct: false
    explanation: Abstaining is the normal case for a voter outside its domain.
  explanation: 'Abstention is what lets independent voters coexist: each speaks only about the attributes
    and subjects it understands.'
