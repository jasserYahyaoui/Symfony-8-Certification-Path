    tags:
      - authorization
    choices:
      - id: CHO-ye5ecte7202a
        text: A redirect to the login page, via the entry point
        correct: true
      - id: CHO-mf3a9rr9av4v
        text: A 403 response
        correct: false
        explanation: 403 is what a known user gets; an anonymous one is sent to authenticate first.
      - id: CHO-999ehv890tye
        text: A 401 response with a WWW-Authenticate header
        correct: false
        explanation: That is the HTTP-Basic behaviour, not the general case.
      - id: CHO-923p90rerv70
        text: A 404, to avoid disclosing the page's existence
        correct: false
        explanation: Symfony does not hide protected pages behind 404 by default.
    explanation: 'The exception is the same in both cases. What differs is whether the user is known:
      a known user is refused with 403, an anonymous one is sent to the entry point.'
