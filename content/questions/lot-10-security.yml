  question: 'An API firewall is declared stateless: true. What is the consequence for each request?'
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 55
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-01'
  tags:
  - authentication
  - stateless
  choices:
  - id: CHO-28nv916928jp
    text: The token is not stored in the session, so every request authenticates again
    correct: true
  - id: CHO-e6ns1gn8k073
    text: The token is cached in memory between requests
    correct: false
    explanation: Nothing survives the request; each one starts from the credentials it carries.
  - id: CHO-dssznsgx2hgg
    text: Authorization is skipped for that firewall
    correct: false
    explanation: Authorization is unaffected by statelessness.
  - id: CHO-vchqsa4pn2ec
    text: Only the first request of a session is authenticated
    correct: false
    explanation: That describes the stateful behaviour, not the stateless one.
  explanation: Stateless means the token is never persisted, which is what an API using per-request credentials
    needs.
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/security.rst
    branch: '8.0'
    symbol_or_lines: security
    verified_at: '2026-09-01'
