  question: Under the unanimous strategy, three voters abstain and none denies. What is the decision?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 60
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-01'
  tags:
  - voters
  - strategies
  choices:
  - id: CHO-zedk6kxvfa7k
    text: Granted, because unanimous means no voter denies
    correct: true
  - id: CHO-dpj226b56pv7
    text: Denied, because no voter granted
    correct: false
    explanation: unanimous does not require a grant; it requires the absence of a denial.
  - id: CHO-84a451h01yjj
    text: Denied, because abstentions count as denials
    correct: false
    explanation: An abstention is neither a grant nor a denial.
  - id: CHO-xmj4zkqg8802
    text: Undefined, so allow_if_equal_granted_denied applies
    correct: false
    explanation: That option belongs to the consensus strategy.
  explanation: unanimous is often misread as 'all must grant'. It grants unless someone denies, so abstentions
    do not block it.
