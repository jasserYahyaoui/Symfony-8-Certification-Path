  question: $this->getUser() returns null. What does that establish?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 50
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-01'
  tags:
  - authentication
  choices:
  - id: CHO-ysbhw57mwenc
    text: The request is not authenticated
    correct: true
  - id: CHO-sfshr13af9ps
    text: The user is authenticated but lacks the required role
    correct: false
    explanation: That is an authorization outcome, reported by isGranted().
  - id: CHO-yjr7xtvv2gvh
    text: The session expired and must be restarted manually
    correct: false
    explanation: An expired session is one cause among several; the fact established is only the absence
      of authentication.
  - id: CHO-0a1bxfjy02p9
    text: The firewall is misconfigured
    correct: false
    explanation: An anonymous request on a correctly configured firewall also returns null.
  explanation: getUser() answers the authentication question. Whether a known user may do something is
    a separate question answered by isGranted().
