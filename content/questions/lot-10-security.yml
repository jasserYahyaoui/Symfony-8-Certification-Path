    reviewed_at: '2026-09-11'
    tags:
      - security
      - badges
    choices:
      - id: CHO-0eck5tmq5p87
        text: The badge only makes the request eligible; remember_me must be configured
        correct: true
      - id: CHO-mkqnjc1xb7d5
        text: The badge was not resolved, so it was silently dropped
        correct: false
        explanation: An unresolved badge fails the authentication outright rather than being ignored.
      - id: CHO-ytt22sff8rbt
        text: RememberMeBadge only works with SelfValidatingPassport
        correct: false
