  question: 'Two voters respond: one grants, one denies. What does the DEFAULT strategy decide?'
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 60
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-01'
  tags:
  - voters
  - strategies
  choices:
  - id: CHO-nn9m7z11q0xz
    text: Access granted
    correct: true
  - id: CHO-5g12x3cn9jth
    text: Access denied
    correct: false
    explanation: That is the unanimous strategy, which is not the default.
  - id: CHO-c9s9h8h3amsb
    text: A tie, resolved by allow_if_all_abstain
    correct: false
    explanation: That option only applies when every voter abstains.
  - id: CHO-48gxkvpk05jq
