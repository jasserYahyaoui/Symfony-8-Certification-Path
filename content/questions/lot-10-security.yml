  question: A user row is deleted from the database while that user has an active session. What happens
    on their next request?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 55
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-01'
  tags:
  - providers
  choices:
  - id: CHO-cphc1k9tbg4y
    text: Refreshing the user fails and the session is invalidated
    correct: true
  - id: CHO-kkc4kascce58
    text: Nothing, because the user object is kept in the session
    correct: false
    explanation: The user is reloaded on every request rather than trusted from the session.
  - id: CHO-r51kvhcek5m0
