  - tech-lead
  reviewed_at: '2026-09-01'
  tags:
  - voters
  - strategies
  choices:
  - id: CHO-bhpx9rxbs9m2
    text: Access is denied, because allow_if_all_abstain defaults to false
    correct: true
  - id: CHO-536grhd97wgd
    text: Access is granted, since nobody objected
    correct: false
    explanation: The default is deliberately restrictive.
  - id: CHO-y9fv14mvc06a
    text: An exception is thrown for the unknown attribute
    correct: false
    explanation: No voter is required to understand an attribute.
