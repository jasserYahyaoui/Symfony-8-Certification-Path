  question: An anonymous visitor hits a page protected by denyAccessUnlessGranted(). What does the visitor
    get?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 55
  classification: OFFICIAL
  pool: LEARNING
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-01'
  tags:
  - authorization
  choices:
  - id: CHO-ye5ecte7202a
    text: A redirect to the login page, driven by the firewall entry point
    correct: true
  - id: CHO-mf3a9rr9av4v
    text: A 403 response
    correct: false
    explanation: 403 is what a known user gets; an anonymous one is sent to authenticate first.
  - id: CHO-999ehv890tye
    text: A 401 response with a WWW-Authenticate header
    correct: false
    explanation: That is the HTTP-Basic behaviour, not the general case.
  - id: CHO-923p90rerv70
    text: A 404, to avoid disclosing the page's existence
    correct: false
    explanation: Symfony does not hide protected pages behind 404 by default.
  explanation: 'The exception is the same in both cases. What differs is whether the user is known: a
    known user is refused with 403, an anonymous one is sent to the entry point.'
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/security.rst
    branch: '8.0'
    symbol_or_lines: security
    verified_at: '2026-09-01'
