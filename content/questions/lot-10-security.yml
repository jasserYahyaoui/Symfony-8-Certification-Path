    choices:
      - id: CHO-dh063mamzkmt
        text: supports()
        correct: true
      - id: CHO-y2ypgk46jstj
        text: voteOnAttribute()
        correct: false
        explanation: That one runs only on what supports() accepted, and returns the decision itself.
      - id: CHO-s85sgsg2ydyz
        text: vote()
        correct: false
        explanation: vote() is the interface method the base class implements; a subclass does not override
          it.
      - id: CHO-czw2tzjcsqk1
        text: canVote()
        correct: false
        explanation: No such method exists on the base class.
    explanation: supports() filters, voteOnAttribute() decides. Returning false from supports() is an
      abstention, not a denial — which is what lets independent voters coexist, each speaking only about
      its own domain.
