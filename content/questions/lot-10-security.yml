  question: Where does the rest of the application read the currently authenticated user from?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 45
  classification: OFFICIAL
  pool: VALIDATION
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-09-01'
  tags:
  - authentication
  choices:
  - id: CHO-a1cz1c0a2zmc
    text: The TokenStorage, which holds the token for the current request
    correct: true
  - id: CHO-c6fw377b5ygv
    text: The session, read directly
    correct: false
    explanation: The session may persist the token, but the application reads the storage.
  - id: CHO-24a294vmt8gp
    text: The user provider, queried on demand
    correct: false
    explanation: The provider loads and refreshes the user; it is not where the current one is read.
  - id: CHO-p1rjky61tvjm
    text: The firewall configuration
    correct: false
    explanation: Configuration declares how to authenticate, not who is authenticated.
  explanation: TokenStorage is the memory of the current request. Security::getUser() and the controller
    shortcut both read it.
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony-docs/8.0/security.rst
    branch: '8.0'
    symbol_or_lines: security
    verified_at: '2026-09-01'
