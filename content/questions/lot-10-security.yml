    question: How is the attribute ROLE_ADMIN evaluated by isGranted()?
    scoring_policy: all-or-nothing
    shuffle_choices: true
    negative_wording: false
    estimated_time_seconds: 55
    classification: OFFICIAL
    pool: VALIDATION
    verification_status: VERIFIED
    reviewers:
      - tech-lead
    reviewed_at: '2026-09-01'
    tags:
      - authorization
    choices:
      - id: CHO-sp0mm3ht34xb
        text: By a voter, like any other attribute
        correct: true
      - id: CHO-dyb5gx5z89jp
        text: By a direct string comparison against the user's roles, bypassing voters
        correct: false
        explanation: No attribute bypasses the voter mechanism; a role is checked by a voter too.
      - id: CHO-rsy2mfvqkce1
        text: By the firewall, before the controller runs
        correct: false
        explanation: The firewall authenticates; isGranted() is an authorization call made later.
      - id: CHO-4vz6te97d728
        text: By access_control, which owns all role checks
        correct: false
        explanation: access_control protects URLs; isGranted() works anywhere and still goes through voters.
    explanation: The access decision manager knows nothing about roles specifically. Roles are just attributes
      that a role voter happens to understand.
