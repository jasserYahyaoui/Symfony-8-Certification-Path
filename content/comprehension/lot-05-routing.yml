  choices:
  - id: CHO-fzjbpqdr7c6m
    text: |-
      ```yaml
      blog_show:
          path: /blog/{slug}
          controller: App\Controller\BlogController::show
          methods: GET
      ```
    correct: true
  - id: CHO-h33wb1at7haw
    text: |-
      ```yaml
      blog_show:
          route: /blog/{slug}
          action: App\Controller\BlogController::show
          methods: GET
      ```
    correct: false
    explanation: The keys are path and controller; route and action are not accepted.
  - id: CHO-nam3h88qf9dj
    text: |-
      ```yaml
      /blog/{slug}:
          name: blog_show
          controller: App\Controller\BlogController::show
      ```
    correct: false
    explanation: The top-level key is the route name, not the path.
  - id: CHO-fpmmbcy73g0q
    text: |-
      ```yaml
      blog_show:
          path: /blog/{slug}
          methods: GET
      ```
    correct: false
    explanation: Without controller the route has no _controller to run.
  explanation: In YAML the top-level key is the route name; path, controller and methods are the keys
    mirroring the attribute arguments.
