  question: Route `post_new` (/post/new) is loaded after route `post_show` (/post/{id}), with no requirement
    on id. Which one handles /post/new?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 50
  classification: OFFICIAL
  pool: COMPREHENSION
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-10-09'
  tags:
  - configuration
  - route-order
  choices:
  - id: CHO-zxdhhz6qka75
    text: post_show, with id set to "new"
    correct: true
  - id: CHO-tspd0gw3sbc3
    text: post_new, because a static path is preferred
    correct: false
    explanation: Symfony does not rank static paths first; order decides.
  - id: CHO-sxk4rqc9d4ej
    text: 'Neither: two candidates raise an exception'
    correct: false
    explanation: Several candidates are normal; the first one wins.
  - id: CHO-ypwaqste5mfm
    text: post_new, because it was declared last
    correct: false
    explanation: The first matching route wins, not the last.
  explanation: Routes are evaluated in order and the first match wins. A requirement on id, or a higher
    priority on post_new, fixes it.
