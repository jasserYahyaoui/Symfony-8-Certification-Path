  - priority
  choices:
  - id: CHO-nk6qgafw9nhz
    text: Only the 200 one
    correct: true
  - id: CHO-kgt83c59g6j4
    text: Both run, and the 100 one overwrites
    correct: false
    explanation: The chain stops at the first resolver producing a value.
  - id: CHO-sazwn8efgpk9
    text: Both values are passed, as an array
    correct: false
