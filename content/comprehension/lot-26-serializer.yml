  question: |-
    Which keys does ObjectNormalizer output for this class?

    ```php
    class P
    {
        public string $name = 'n';
        protected $hid = 'h';
        private $sec = 's';
        public function getSec() { return $this->sec; }
        public function fetchThing() { return 't'; }
        public function isActive() { return true; }
    }
    ```
  code_language: php
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 55
  classification: OFFICIAL
  pool: COMPREHENSION
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-10-09'
  tags:
  - serializer
  choices:
  - id: CHO-hh4j3zas58x0
    text: name, sec, active
    correct: true
  - id: CHO-x8pzs6xt380n
    text: name, hid, sec, thing, active
    correct: false
    explanation: Protected without accessor and fetch* are skipped.
  - id: CHO-004s1a5pfcnf
    text: name only
    correct: false
    explanation: get and is accessors count.
  - id: CHO-vn00zcaeabwr
    text: name, sec, thing, active
    correct: false
    explanation: fetch is not a recognized prefix.
  explanation: 'Executed with Serializer 8.0: public properties plus get/has/is/can methods. #[Ignore]
    excludes a member everywhere.'
