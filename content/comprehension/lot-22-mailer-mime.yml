  reviewed_at: '2026-10-09'
  tags:
  - mailer
  choices:
  - id: CHO-ac3f78xgg4q1
    text: 'No: success only means the transport accepted it'
    correct: true
  - id: CHO-8tj3yqgek63q
    text: 'Yes: send() guarantees delivery'
    correct: false
    explanation: Delivery happens beyond the application.
  - id: CHO-pyk6j8r79sx5
    text: 'Yes: a FailedMessageEvent should have fired'
    correct: false
    explanation: That fires on transport errors only.
