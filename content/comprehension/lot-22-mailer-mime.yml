  question: A send returns without exception, yet the recipient never gets the email. Is that a Symfony
    bug?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 45
  classification: OFFICIAL
  pool: COMPREHENSION
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-10-09'
  tags:
  - mailer
  choices:
  - id: CHO-ac3f78xgg4q1
    text: 'No: success only means the transport accepted it'
    correct: true
  - id: CHO-8tj3yqgek63q
    text: 'Yes: send() guarantees delivery'
    correct: false
    explanation: Delivery happens beyond the application.
  - id: CHO-pyk6j8r79sx5
    text: 'Yes: a FailedMessageEvent should have fired'
    correct: false
    explanation: That fires on transport errors only.
  - id: CHO-zj5he0ar4j9c
    text: 'No: send() always defers'
    correct: false
    explanation: Not without Messenger routing.
  explanation: A transport failure raises TransportExceptionInterface; what the provider does later is
    invisible.
