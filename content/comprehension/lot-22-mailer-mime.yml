  choices:
  - id: CHO-3epgsqn8srjp
    text: '`$transport->send($email)`'
    correct: true
  - id: CHO-w9n28vhrh9s9
    text: '`$mailer->send($email)`'
    correct: false
    explanation: MailerInterface::send() returns nothing, since it may defer.
  - id: CHO-c9rtghbfe2jd
    text: '`$mailer->send($email)->getDebug()`'
    correct: false
    explanation: There is nothing to call it on.
  - id: CHO-33e8d5vkbbkh
    text: '`$email->send()`'
    correct: false
    explanation: Email has no send().
  explanation: TransportInterface::send() always sends synchronously and returns a SentMessage, or null
    if a listener rejected it.
