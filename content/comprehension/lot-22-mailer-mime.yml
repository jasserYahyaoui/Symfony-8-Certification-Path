  question: Messenger is installed, but SendEmailMessage is routed nowhere. When does `$mailer->send($email)`
    deliver?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 55
  classification: OFFICIAL
  pool: COMPREHENSION
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-10-09'
  tags:
  - mailer
  - messenger
  choices:
  - id: CHO-fmqjgyznm8yw
    text: During the call
    correct: true
  - id: CHO-tewy079cz3s3
    text: Later, from a worker
    correct: false
    explanation: Only if the message is routed to an async transport.
  - id: CHO-mzhsgn61mw28
    text: 'Never: async needs a worker'
    correct: false
    explanation: Unrouted messages are handled synchronously.
  - id: CHO-vp7a4shafe1s
    text: At kernel.terminate
    correct: false
    explanation: Not tied to that event.
  explanation: send() dispatches a SendEmailMessage; delivery is deferred only when that message is routed.
