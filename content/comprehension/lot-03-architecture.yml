  question: During a sub-request made from the main request, what do getCurrentRequest(), getMainRequest()
    and getParentRequest() of the RequestStack return?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 70
  classification: OFFICIAL
  pool: COMPREHENSION
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-10-09'
  tags:
  - request-stack
  choices:
  - id: CHO-stb8gm0a8rp0
    text: The sub-request, the main request, the main request
    correct: true
  - id: CHO-2wed6hxcsxjq
    text: The main request, the main request, null
    correct: false
    explanation: 'The current request is the last one pushed: the sub-request.'
  - id: CHO-9cwbsptf4k6y
    text: The sub-request, the sub-request, the main request
    correct: false
    explanation: The main request is the first one pushed, never the sub-request.
  - id: CHO-88a8wg14g7fw
    text: The sub-request, the main request, null
    correct: false
    explanation: Here a request sits below the current one, so the parent is not null.
  explanation: current = last pushed, main = first pushed, parent = the one before the current. On the
    main request alone, getParentRequest() returns null.
  official_sources:
  - url: https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/HttpFoundation/RequestStack.php
    repository: symfony/symfony
    branch: '8.0'
    symbol_or_lines: getCurrentRequest(), getMainRequest(), getParentRequest()
    verified_at: '2026-10-09'
