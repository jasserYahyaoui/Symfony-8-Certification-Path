  question: A unit test needs a GET request to /blog without any web server or superglobal. Which call
    builds it?
  code_language: php
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 45
  classification: OFFICIAL
  pool: COMPREHENSION
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-10-09'
  tags:
  - http-foundation
  - testing
  choices:
  - id: CHO-kkjtfbn66334
    text: '`Request::create(''/blog'')`'
    correct: true
  - id: CHO-9cy5r53ntvmw
    text: '`Request::createFromGlobals()`'
    correct: false
    explanation: That reads $_GET, $_POST and $_SERVER, which is exactly what the test wants to avoid.
  - id: CHO-26d4vf2av6g8
    text: '`$_SERVER[''REQUEST_URI''] = ''/blog''`'
    correct: false
    explanation: Writing a superglobal is the global state HttpFoundation exists to replace.
  - id: CHO-qfqz7y477yyq
    text: '`new RequestStack(''/blog'')`'
    correct: false
    explanation: RequestStack holds requests; it does not build one.
  explanation: HttpFoundation turns the request and response into objects; an object can be built in a
    test, which superglobals and header() calls cannot.
  official_sources:
