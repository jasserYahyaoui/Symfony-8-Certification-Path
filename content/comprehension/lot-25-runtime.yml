  - tech-lead
  reviewed_at: '2026-10-09'
  tags:
  - runtime
  choices:
  - id: CHO-8ch7b9c2xxac
    text: It ends silently; the app never runs
    correct: true
  - id: CHO-6ngdfawwnt6b
    text: The app runs normally
    correct: false
    explanation: autoload_runtime.php stops when the autoloader is already loaded.
  - id: CHO-r5f97en5xg72
    text: 'A fatal error: class already declared'
    correct: false
    explanation: Nothing is declared twice.
  - id: CHO-42j01xyps4mz
    text: The app runs twice
    correct: false
    explanation: It does not run at all.
  explanation: The first require_once of autoload_runtime.php returns true and the file interrupts itself,
    silently.
