  question: |-
    Why does this entry closure fail with an InvalidArgumentException?

    ```php
    return function (array $ctx): Kernel {
        return new Kernel($ctx['APP_ENV'], (bool) $ctx['APP_DEBUG']);
    };
    ```
  code_language: php
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 55
  classification: OFFICIAL
  pool: COMPREHENSION
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-10-09'
  tags:
  - runtime
  choices:
  - id: CHO-75k39fk2sqyw
    text: The array parameter must be named $context
    correct: true
  - id: CHO-jp5ycscn9y4a
    text: The return type must be HttpKernelInterface
    correct: false
    explanation: Kernel is fine.
  - id: CHO-mmapahmpp44g
    text: APP_DEBUG must be cast to int
    correct: false
    explanation: Unrelated to the error.
  - id: CHO-w71hq8k946pf
    text: Closures cannot take arrays
    correct: false
    explanation: They can.
  explanation: For array arguments, both the type and the name ($context, $argv, $request) are used for
