    ```php
    $a = 0;
    $b = 0;

    $byRef = function () use (&$a) { $a++; };
    $arrow = fn () => $b++;

    $byRef();
    $arrow();

    echo $a, $b;
    ```
  code_language: php
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
