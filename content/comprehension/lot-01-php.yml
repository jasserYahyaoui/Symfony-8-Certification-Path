  - capture
  choices:
  - id: CHO-4vcq092b3zev
    text: '10'
    correct: true
  - id: CHO-0qyand43h009
    text: '11'
    correct: false
    explanation: 'An arrow function captures by value: it increments its own copy of $b.'
  - id: CHO-8jqczf3nra6e
    text: '00'
    correct: false
    explanation: use (&$a) captures the variable by reference, so $a really becomes 1.
  - id: CHO-ftnxdc0sznjy
