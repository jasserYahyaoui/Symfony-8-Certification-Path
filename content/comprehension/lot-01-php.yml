  question: |-
    What happens on the last line?

    ```php
    #[Attribute]
    final class Route
    {
        public function __construct(public readonly string $path) {}
    }

    #[Route('/home')]
    final class Home {}

    $route = (new ReflectionClass(Home::class))
        ->getAttributes()[0]
        ->newInstance();

    $route->path = '/other';
    ```
  code_language: php
