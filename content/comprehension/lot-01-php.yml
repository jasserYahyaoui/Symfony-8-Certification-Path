  choices:
  - id: CHO-nw1m63x36206
    text: 'An Error: cannot modify readonly property Route::$path'
    correct: true
  - id: CHO-595gqmxzs40t
    text: The path becomes /other
    correct: false
    explanation: The promoted property is readonly and was initialised by the constructor.
  - id: CHO-sf234zsf3235
    text: An Error, because getAttributes() returns no Route object
    correct: false
    explanation: newInstance() did return a Route; the failure is the write.
  - id: CHO-q88bxrwfeq8b
    text: 'Nothing: the write is ignored silently'
    correct: false
    explanation: Writing a readonly property raises an Error, never silence.
  explanation: newInstance() constructs the attribute, which initialises its promoted readonly property.
    Any later write raises an Error.
