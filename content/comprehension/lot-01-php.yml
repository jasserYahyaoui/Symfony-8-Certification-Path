  question: A counter must be readable by any code, while only the class's own methods may change it,
    as many times as they need. Which declaration fits?
  code_language: php
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 60
  classification: OFFICIAL
  pool: COMPREHENSION
  verification_status: VERIFIED
  reviewers:
