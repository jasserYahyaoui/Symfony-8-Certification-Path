  reviewed_at: '2026-10-09'
  tags:
  - readonly
  - asymmetric-visibility
  choices:
  - id: CHO-65ssg7e5kkkq
    text: '`public private(set) int $count = 0;`'
    correct: true
  - id: CHO-4ak4mv7xrqse
    text: '`public readonly int $count;`'
    correct: false
    explanation: A readonly property can be written once; a second increment raises an Error.
  - id: CHO-xgfbhneempne
    text: '`private int $count = 0;`'
    correct: false
    explanation: Outside code could no longer read it.
  - id: CHO-hvyjw63p2z7p
    text: '`public int $count = 0;`'
    correct: false
    explanation: Any code could then write it, not only the class.
