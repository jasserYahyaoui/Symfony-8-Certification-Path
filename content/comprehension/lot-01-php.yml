  reviewed_at: '2026-10-09'
  tags:
  - self
  - static
  - late-static-binding
  choices:
  - id: CHO-4k29n60zmf3z
    text: AB
    correct: true
  - id: CHO-c8tvd4ttder1
    text: BB
    correct: false
    explanation: 'self:: is resolved to the class where the method is written, A, not to the object''s
      class.'
  - id: CHO-qrq3dpehh3rj
    text: AA
    correct: false
    explanation: 'static:: follows the class actually used, B, so it reads B''s constant.'
  - id: CHO-gqyt32j6ftzy
    text: BA
    correct: false
    explanation: 'The order is self then static: A from self::, B from static::.'
  explanation: 'self:: refers to the class where the code is written; static:: is late static binding
    and refers to the class the call was made on.'
