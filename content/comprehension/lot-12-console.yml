  question: 'In a Symfony application, command A sets its description in #[AsCommand], command B in configure()
    with setDescription(). Which of the two commands does `bin/console list` have to construct to display
    its line?'
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 90
  classification: OFFICIAL
  pool: COMPREHENSION
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-10-09'
  tags:
  - synthesis
  - lazy
  - description
  choices:
  - id: CHO-ahgayk8feez4
    text: Only B
    correct: true
  - id: CHO-edy60gsrh5sn
    text: Only A
    correct: false
    explanation: A's description was read from the attribute when the container was compiled.
  - id: CHO-pypg3cswd7cj
    text: Both, since the listing always constructs every command
    correct: false
    explanation: 'Commands are lazy: a name and description known in advance avoid constructing the class.'
  - id: CHO-f342jrpcxdj6
    text: Neither, since descriptions are always read from the source file
    correct: false
    explanation: A description set in configure() only exists once the object is built, because configure()
      runs in the constructor.
  explanation: The attribute's description is copied onto the console.command tag at compile time, so
    the command stays lazy. A description set in configure() only exists once the constructor, which calls
    configure(), has run.
