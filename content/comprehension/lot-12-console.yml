  question: 'With the default services.yaml, a developer adds a class to src/Command/ with an __invoke():
    int method. It has no #[AsCommand] attribute and does not extend Command. What does bin/console list
    show?'
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 70
  classification: OFFICIAL
  pool: COMPREHENSION
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-10-09'
  tags:
  - autoconfiguration
  - registration
  choices:
  - id: CHO-dgjm5rtc5pkn
    text: 'Nothing new: the class is a service, but not a command'
    correct: true
  - id: CHO-8nq4066t30qx
    text: The command, named after its class
    correct: false
    explanation: 'No name is derived from the class: without the attribute or the Command parent, no console
      tag is added.'
  - id: CHO-3g73j3bk5eex
    text: An error, because the class is loaded but cannot be configured
    correct: false
    explanation: The service is valid; it is simply not tagged as a command, so the listing ignores it.
