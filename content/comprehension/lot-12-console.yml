  question: An invokable command needs the value of its `name` argument and the output. Which __invoke()
    signature works?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 75
  classification: OFFICIAL
  pool: COMPREHENSION
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-10-09'
  tags:
  - invokable
  - argument
  choices:
  - id: CHO-gxbpdemz7mb9
    text: '`public function __invoke(#[Argument] string $name, OutputInterface $output): int`'
    correct: true
  - id: CHO-kvam8cmntx7m
    text: '`public function __invoke(string $name, OutputInterface $output): int`'
    correct: false
    explanation: 'Without #[Argument] the parameter declares no argument; running the command fails with
      "Unsupported type".'
  - id: CHO-x2662tsaeka8
    text: '`public function __invoke(InputInterface $input, OutputInterface $output): void`'
    correct: false
    explanation: The method must return an integer; returning nothing raises a TypeError when the command
      runs.
  - id: CHO-3xzftc1a0g7m
    text: '`protected function execute(string $name): int`'
    correct: false
    explanation: execute() belongs to the Command class and receives the input and output objects, not
      argument values.
  explanation: Arguments and options are declared with attributes on __invoke() parameters; the output
    and input objects are injected by type. The method returns the exit code as an int.
  official_sources:
