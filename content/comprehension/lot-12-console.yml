  choices:
  - id: CHO-r8ry5pvw6kqe
    text: The definition is refused with a LogicException as soon as the command is added
    correct: true
  - id: CHO-ss49tj31ydek
    text: 'It works: the last value typed becomes the mode, the others the files'
