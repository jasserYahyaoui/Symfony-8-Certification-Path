  - id: CHO-8qvsaq8zrgxj
    text: 'No: #[Ask] on the parameter, or an #[Interact] method, covers it'
    correct: true
  - id: CHO-013xvfyr9vsk
    text: 'Yes: only Command::interact() can ask a question before execution'
    correct: false
    explanation: 'Symfony 8.0 provides #[Ask] and #[Interact] for invokable commands that extend nothing.'
  - id: CHO-mgrwkmfkh7gh
