  - standalone
  choices:
  - id: CHO-tsfhhce5zkq6
    text: 'Only the symfony/console package: an Application object registers the commands and runs them
      on its own'
    correct: true
  - id: CHO-f49x1g1r5hzh
    text: FrameworkBundle, because the commands only run through the bin/console script it provides
    correct: false
    explanation: bin/console is how a Symfony application exposes its commands; the component itself is
      standalone and installs alone.
  - id: CHO-vq51pabxdmzc
    text: A kernel instance, which the Application constructor requires
    correct: false
    explanation: The component's Application takes only an optional name and version. The kernel-aware
      Application belongs to FrameworkBundle.
  - id: CHO-s5g2dts5mfe9
    text: The Runtime component, which parses the command-line arguments
    correct: false
    explanation: Argument parsing is part of the Console component itself, through ArgvInput.
  explanation: 'The Console component is independent: `composer require symfony/console`, then `new Application()`,
    `addCommand()` and `run()`. In a Symfony application, bin/console is simply the entry point FrameworkBundle
    wires to it.'
  official_sources:
