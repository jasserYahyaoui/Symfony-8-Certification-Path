  question: A class extending Command overrides configure(), initialize(), interact() and execute(). It
    is run once from an interactive terminal. In which order are the four methods called?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 75
  classification: OFFICIAL
  pool: COMPREHENSION
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-10-09'
  tags:
  - lifecycle
  - configure
  - interact
  choices:
  - id: CHO-zmwbc0wnqsfd
    text: configure() while the object is built, then initialize(), interact(), execute()
    correct: true
  - id: CHO-hn0n6h04e0rw
    text: initialize(), configure(), interact(), execute(), all at run time
    correct: false
    explanation: 'configure() is not part of the run: Command calls it at the end of its constructor.'
  - id: CHO-ey3t6n0j3r2e
    text: configure(), interact(), initialize(), execute()
    correct: false
    explanation: initialize() comes first at run time; it prepares the command before any question is
      asked.
  - id: CHO-g8xkhzvxs3q9
    text: interact(), initialize(), configure(), execute()
    correct: false
    explanation: configure() has already run when the object was constructed, and interact() follows initialize().
  explanation: configure() runs inside the Command constructor. At run time the documented lifecycle is
    initialize(), then interact() when the input is interactive, then the execution method.
  official_sources:
