  question: An import command stops early in two different runs. In the first, the remote API it reads
    from is down. In the second, the user passed --batch-size=-5. Which constants should the two runs
    return?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 70
  classification: OFFICIAL
  pool: COMPREHENSION
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-10-09'
  tags:
  - exit-code
  choices:
  - id: CHO-2d75behxwvpf
    text: FAILURE for the outage, INVALID for the negative batch size
    correct: true
  - id: CHO-tg7km8st28dq
    text: INVALID for the outage, FAILURE for the negative batch size
    correct: false
    explanation: 'It is the other way round: INVALID signals incorrect usage, such as an invalid option
      value.'
  - id: CHO-8xzmj09mfzw4
    text: FAILURE for both, since neither run imported anything
    correct: false
    explanation: FAILURE fits the outage, but a bad option value is incorrect usage, which INVALID exists
      to signal.
  - id: CHO-42dcj8eyyheg
    text: SUCCESS for the negative batch size, since nothing was broken
    correct: false
    explanation: The run did not do its work; returning SUCCESS would hide the problem from any script
      reading the exit code.
  explanation: SUCCESS is 0, FAILURE 1 for an error during execution, INVALID 2 for incorrect command
    usage, such as invalid options or missing arguments.
