  choices:
  - id: CHO-pkvqtqkp7vjd
    text: Pass it through `OutputFormatter::escape($name)` before concatenating
    correct: true
  - id: CHO-n49hb4xgjjkz
    text: Call write() instead of writeln()
    correct: false
