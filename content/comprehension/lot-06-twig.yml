  - overriding
  choices:
  - id: CHO-myybf5qcyh5c
    text: '`{% extends ''@!AcmeBlog/user/profile.html.twig'' %}`'
    correct: true
  - id: CHO-r2hdb3gqnyme
    text: '`{% extends ''@AcmeBlog/user/profile.html.twig'' %}`'
    correct: false
