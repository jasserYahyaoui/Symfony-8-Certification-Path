  question: An exception class carries `#[WithHttpStatus(404)]` and implements no interface. Which status
    reaches the client when it escapes an action?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 55
  classification: OFFICIAL
  pool: COMPREHENSION
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-10-09'
  tags:
  - error-handling
  choices:
  - id: CHO-egs11j2hw2em
    text: '404'
    correct: true
  - id: CHO-b746bbzrpcnm
    text: '500: only HttpExceptionInterface sets a status'
    correct: false
    explanation: The attribute is read by ErrorListener.
  - id: CHO-v66aqg4gv2zv
    text: 500 in prod, 404 in dev
    correct: false
    explanation: The status is the same in both.
  - id: CHO-mjckn4fhz51e
    text: The status written in the message
    correct: false
    explanation: The message is never read.
  explanation: 'Order in ErrorListener: framework.exceptions config, #[WithHttpStatus], HttpExceptionInterface,
    400 for RequestExceptionInterface, else 500.'
