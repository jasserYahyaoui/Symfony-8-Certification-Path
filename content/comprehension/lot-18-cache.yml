  question: |-
    Is the value stored here?

    ```php
    $cache->get('s', function (ItemInterface $item, bool &$save) {
        $save = false;
        return 1;
    });
    ```
  code_language: php
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 55
  classification: OFFICIAL
  pool: COMPREHENSION
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-10-09'
  tags:
  - cache
  choices:
  - id: CHO-ax4r5t08rfz1
    text: 'No: the next get() recomputes'
    correct: true
  - id: CHO-2z763egtf9wd
    text: 'Yes: the returned value is always stored'
    correct: false
    explanation: $save, by reference, prevents it.
  - id: CHO-ftqavnz3c8vt
    text: Yes, but expired at once
    correct: false
    explanation: It is not stored at all.
  - id: CHO-vjp1rpyv2wqe
    text: 'A TypeError: the callback takes one argument'
    correct: false
    explanation: The second parameter is supported.
  explanation: Executed with Cache 8.0.15. A beta of INF forces recomputation; 0 disables early expiration.
