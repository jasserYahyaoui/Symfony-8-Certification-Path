  question: |-
    What does $n hold after these two calls on an empty ArrayAdapter with no default lifetime?

    ```php
    $cache->get('k', function () use (&$n) { $n++; return 'v'; });
    $cache->get('k', function () use (&$n) { $n++; return 'w'; });
    ```
  code_language: php
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 50
  classification: OFFICIAL
  pool: COMPREHENSION
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-10-13'
  tags:
  - cache
  choices:
  - id: CHO-dwfggd8h30tj
    text: 1, and both calls return "v"
    correct: true
  - id: CHO-zppnamdagbyz
    text: 2, and the second call returns "w"
    correct: false
    explanation: The item has no expiry, so it cannot be elected for early recomputation, and the default beta
      does not force one; the second call is a plain hit.
  - id: CHO-9xwbttnjnf67
    text: '0: get() never runs callbacks'
    correct: false
    explanation: It runs on the first miss.
  - id: CHO-pa3x1m0ff1s2
    text: 1, but the second call returns "w"
    correct: false
    explanation: The stored value is returned.
  explanation: Executed with Cache 8.0.15. get() reads and writes, so the contracts need no set().
