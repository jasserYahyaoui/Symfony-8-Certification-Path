  question: RFC 7234, the old caching specification, is missing from the list of RFCs that RFC 9110 obsoletes.
    Which document obsoletes it?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 50
  classification: OFFICIAL
  pool: COMPREHENSION
  verification_status: VERIFIED
  reviewers:
