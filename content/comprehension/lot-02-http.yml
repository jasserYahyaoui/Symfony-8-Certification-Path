    correct: false
    explanation: '303 asks for a GET elsewhere: the POST would not be repeated.'
  explanation: 307 and 308 preserve the method and content; 301 and 302 may not; 303 always leads to a
    GET. 308 is the permanent one of the method-preserving pair.
