    text: RFC 9113
    correct: true
  - id: CHO-e6c9pby2bg3h
    text: RFC 9110
    correct: false
    explanation: 9110 is the version-independent semantics, shared by every HTTP version.
  - id: CHO-7x1z59bgqgdd
    text: RFC 9112
    correct: false
