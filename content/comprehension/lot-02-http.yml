  question: A PUT replaces the article at /article/42 with a JSON document. In RFC 9110 terms, what does
    the request content carry?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 60
  classification: OFFICIAL
  pool: COMPREHENSION
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-10-09'
  tags:
  - rfc
  - representation
  choices:
  - id: CHO-pg39f9z5c8j2
    text: A representation of the resource
    correct: true
  - id: CHO-qe76skerwv8p
    text: The resource itself
    correct: false
    explanation: The resource is what /article/42 identifies; a message only ever carries representations
      of it.
  - id: CHO-ppdgkdhtcf2v
    text: A copy of the file the server keeps at /article/42
    correct: false
    explanation: A resource is not a file; how the server stores it is not part of HTTP.
  - id: CHO-yrjhq0p9h6s1
    text: A media type
    correct: false
    explanation: The media type labels the representation; it is not what the content carries.
  explanation: PUT asks that the state of the target resource be created or replaced with the state defined
    by the enclosed representation.
  official_sources:
  - url: https://raw.githubusercontent.com/httpwg/httpwg.github.io/master/specs/rfc9110.html
    branch: master
    symbol_or_lines: Section 9.3.4 PUT; Section 3.2 Representations
    verified_at: '2026-10-09'
