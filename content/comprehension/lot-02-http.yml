  choices:
  - id: CHO-2xrmec8n6r54
    text: 415 for A, 406 for B
    correct: true
  - id: CHO-fvnc9qzhhmp9
    text: 406 for A, 415 for B
    correct: false
    explanation: 'It is the other way round: 415 is about the content received, 406 about the representation
