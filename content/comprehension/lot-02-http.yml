  choices:
  - id: CHO-0y8m0524vstm
    text: It cannot reuse it without asking the origin server
    correct: true
  - id: CHO-b744vp5zn46y
    text: It may reuse it for any request to the same URI
    correct: false
    explanation: That is what an empty Vary would allow; * says anything may have mattered.
  - id: CHO-vasqzhg6kzx9
    text: It must reuse it for every request, whatever their fields
    correct: false
    explanation: '* forbids matching on fields, it does not force reuse.'
