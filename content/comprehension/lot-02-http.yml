  question: A client receives status 299, which it has never heard of. How must it treat the response?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 50
  classification: OFFICIAL
  pool: COMPREHENSION
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-10-09'
  tags:
  - status-codes
  choices:
  - id: CHO-hmb5e7tm37a7
    text: Like a 200, the x00 of its class
    correct: true
  - id: CHO-ct9v1bd40mb7
    text: As an error, since the code is not registered
    correct: false
    explanation: The first digit still says success; the class decides.
  - id: CHO-xyygzja6h6ez
    text: As a 500, the generic failure
    correct: false
    explanation: 'Nothing points to a server error: 2xx means success.'
  - id: CHO-87pv5s57zrtj
    text: By retrying the request until a known code arrives
    correct: false
    explanation: The response is valid; retrying is not what the RFC asks.
  explanation: 'The first digit is the class: 1xx information, 2xx success, 3xx redirection, 4xx client
    error, 5xx server error. An unrecognised code is equivalent to the x00 of its class.'
  official_sources:
  - url: https://raw.githubusercontent.com/httpwg/httpwg.github.io/master/specs/rfc9110.html
    branch: master
    symbol_or_lines: 'Section 15: treat an unrecognized status code as being equivalent to the x00 status
      code'
    verified_at: '2026-10-09'
