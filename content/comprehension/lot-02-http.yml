  reviewed_at: '2026-10-09'
  tags:
  - http-client
  - lazy
  choices:
  - id: CHO-781kqt132e6d
    text: On first read, e.g. getStatusCode()
    correct: true
  - id: CHO-63qqng0e1j65
    text: Inside request(), which throws before returning
    correct: false
    explanation: request() returns at once; the network outcome is only waited for on first access.
  - id: CHO-fvzyy758crse
    text: 'Never: the response simply reports status 0'
    correct: false
    explanation: A TransportException is thrown on access.
  - id: CHO-n7c03079apc8
