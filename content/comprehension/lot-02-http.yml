  - redirect
  choices:
  - id: CHO-yqrw4k7fn86n
    text: 308 Permanent Redirect
    correct: true
  - id: CHO-p3vjse0hm66z
    text: 301 Moved Permanently
    correct: false
    explanation: After a 301 a user agent may, for historical reasons, turn the POST into a GET.
  - id: CHO-87ebzdsfxpdq
    text: 307 Temporary Redirect
    correct: false
    explanation: 307 keeps the method, but announces a temporary move.
