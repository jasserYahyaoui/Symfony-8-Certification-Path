  question: What does the Vary field of a response list?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 45
  classification: OFFICIAL
  pool: COMPREHENSION
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-10-09'
  tags:
  - rfc
  - vary
  choices:
  - id: CHO-hmdp9h2y7x12
    text: The request fields used to select the representation
    correct: true
  - id: CHO-ktqwqv34ngq9
    text: The response fields that may change between two requests
    correct: false
    explanation: Vary names request fields, those the selection depended on.
  - id: CHO-f0rk0nyvv5nr
    text: The methods allowed on the resource
    correct: false
    explanation: That is the Allow field.
  - id: CHO-p5a8stfb5tzf
    text: The representations available for the resource
    correct: false
    explanation: Vary says what the choice depended on, not what the alternatives are.
  explanation: A resource can have several representations; Vary tells caches which request fields led
    to the one sent, so they do not reuse it for a request that would select another.
  official_sources:
  - url: https://raw.githubusercontent.com/httpwg/httpwg.github.io/master/specs/rfc9110.html
    branch: master
    symbol_or_lines: Section 12.5.5 Vary
    verified_at: '2026-10-09'
