  question: An API endpoint receiving POST requests moves to a new URI for good. Clients must repeat the
    same POST, with its body, at the new address. Which status?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 60
  classification: OFFICIAL
  pool: COMPREHENSION
  verification_status: VERIFIED
  reviewers:
