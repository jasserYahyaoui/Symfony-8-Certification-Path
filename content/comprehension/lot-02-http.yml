    text: 'Meaning: RFC 9110; status line: RFC 9112'
    correct: true
  - id: CHO-beggany7kddp
    text: Both in RFC 9110
    correct: false
    explanation: RFC 9110 defines no wire syntax; the status line is HTTP/1.1 framing.
  - id: CHO-bc5q6wkyvnk2
