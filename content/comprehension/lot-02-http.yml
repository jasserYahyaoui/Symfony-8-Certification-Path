  reviewed_at: '2026-10-09'
  tags:
  - rfc
  - obsoletes
  choices:
  - id: CHO-j6pv5ftnsfqw
    text: RFC 9111
    correct: true
  - id: CHO-wjm8012zt8bs
    text: RFC 9112
    correct: false
    explanation: 9112 took over HTTP/1.1 framing, the non-semantic part of 7230.
  - id: CHO-g7aqxm6kmsfy
    text: RFC 9110, under a different heading
