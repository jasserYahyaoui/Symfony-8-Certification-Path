  question: Sending the same PUT twice leaves the resource exactly as sending it once. Why is PUT still
    not a safe method?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 60
  classification: OFFICIAL
  pool: COMPREHENSION
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-10-09'
  tags:
  - methods
  - put
  choices:
  - id: CHO-7pc9x2qtm8ha
    text: PUT asks for a change of state; safe means read-only
    correct: true
  - id: CHO-f0h3mvwnmv4t
    text: Because PUT can fail with 409 Conflict
    correct: false
    explanation: Possible failures play no part in whether a method is safe.
  - id: CHO-9xn93xr1ktjm
    text: Because PUT carries a request body, unlike the safe methods
    correct: false
    explanation: QUERY carries a body and is safe; the body is not the criterion.
  - id: CHO-fq1hepbp5vjp
    text: Because a PUT response cannot be cached
    correct: false
    explanation: Cacheability is a third, separate property.
  explanation: 'Idempotent: repeating the request has the same effect as making it once. Safe: no change
    of state is requested at all. Every safe method is idempotent; PUT and DELETE are only idempotent.'
  official_sources:
  - url: https://raw.githubusercontent.com/httpwg/httpwg.github.io/master/specs/rfc9110.html
    branch: master
    symbol_or_lines: Section 9.2.1 Safe Methods; Section 9.2.2 Idempotent Methods
    verified_at: '2026-10-09'
