  question: Why does RFC 9110 describe methods and status codes but no HTTP/2 frame?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 60
  classification: OFFICIAL
  pool: COMPREHENSION
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-10-09'
  tags:
  - rfc
  - semantics
  choices:
  - id: CHO-4646fbee7gek
    text: It defines meaning only; each version defines its own framing
    correct: true
  - id: CHO-g2ay9bc3y1yk
    text: Because HTTP/2 frames are an optional extension of HTTP/1.1
    correct: false
    explanation: HTTP/2 has its own specification, RFC 9113, and is not an extension of 1.1.
  - id: CHO-w7hxbz3996mm
    text: Because RFC 9110 only applies to HTTP/1.1
    correct: false
    explanation: Its semantics apply to every version, which is why it contains no framing.
  - id: CHO-wwq8kc95tg3j
    text: Because frames are a TLS concept
    correct: false
    explanation: Frames belong to HTTP/2 itself, as specified in RFC 9113.
  explanation: RFC 9110 is the semantics common to HTTP/1.1, HTTP/2 and HTTP/3; each version defines its
    own way of encoding the same messages.
  official_sources:
  - url: https://raw.githubusercontent.com/httpwg/httpwg.github.io/master/specs/rfc9110.html
    branch: master
    symbol_or_lines: 'Section 1: HTTP semantics, independent of the version of HTTP used'
    verified_at: '2026-10-09'
