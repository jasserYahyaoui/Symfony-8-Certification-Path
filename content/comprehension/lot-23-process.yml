  question: |-
    The command exits with code 3. What do the two calls do?

    ```php
    (new Process(['sh', '-c', 'exit 3']))->run();
    (new Process(['sh', '-c', 'exit 3']))->mustRun();
    ```
  code_language: php
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 45
  classification: OFFICIAL
  pool: COMPREHENSION
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-10-09'
  tags:
  - process
  choices:
  - id: CHO-bctzk0b11kjw
    text: run() returns 3; mustRun() throws ProcessFailedException
    correct: true
  - id: CHO-82rehr8qc6fp
    text: Both throw
    correct: false
    explanation: run() only returns the exit code.
  - id: CHO-9qjw1bnmy64e
    text: Both return 3
    correct: false
    explanation: mustRun() throws on failure.
  - id: CHO-teajkknctggr
    text: Both return immediately, before the end
    correct: false
    explanation: That is start().
  explanation: Executed with Process 8.0. start() returns at once and leaves checking to you.
