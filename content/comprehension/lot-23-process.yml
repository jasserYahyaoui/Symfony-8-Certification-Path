    fits?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 45
  classification: OFFICIAL
  pool: COMPREHENSION
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-10-09'
  tags:
  - process
  - timeout
  choices:
  - id: CHO-djmd1czxcrqx
    text: setIdleTimeout(300), with a large or null total timeout
    correct: true
  - id: CHO-1hqzc0j8meym
    text: setTimeout(300)
    correct: false
    explanation: That caps the total duration.
  - id: CHO-wxcyr6czt71h
    text: setTimeout(null) alone
    correct: false
    explanation: Nothing would catch a stall.
  - id: CHO-v6d1dv1z36mv
    text: stop(300)
    correct: false
    explanation: stop() ends the process now, waiting up to 300 s.
  explanation: The idle timeout counts from the last output; both limits apply together.
