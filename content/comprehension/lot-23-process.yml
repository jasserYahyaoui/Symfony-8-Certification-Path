  question: '`sleep 3` is started with start() and a 1-second timeout. At 1.5 s, the code only calls isRunning().
    What does it get?'
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 55
  classification: OFFICIAL
  pool: COMPREHENSION
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-10-09'
  tags:
  - process
  - timeout
  choices:
  - id: CHO-fkrvzh2mn8kr
    text: 'true: nobody checked the timeout'
    correct: true
  - id: CHO-1a9whj9sqqk0
    text: 'false: the process was killed at 1 s'
    correct: false
    explanation: An async process is not watched for you.
  - id: CHO-y5807fkp6273
    text: A ProcessTimedOutException
    correct: false
    explanation: isRunning() does not check the timeout; checkTimeout() or wait() do.
  - id: CHO-1qnrbsvt56y4
    text: 'null'
    correct: false
    explanation: It returns a bool.
  explanation: 'Executed with Process 8.0: checkTimeout() then throws. The default timeout is 60 seconds.'
