  question: A POST endpoint answers with `max-age=60`. What does Symfony's reverse proxy do on the next
    identical POST?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 45
  classification: OFFICIAL
  pool: COMPREHENSION
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-10-09'
  tags:
  - http-cache
  choices:
  - id: CHO-qcne16dd3rpk
    text: Passes it to the application again
    correct: true
  - id: CHO-95r7m1nztyzp
    text: Serves the stored response
    correct: false
    explanation: POST is not a cacheable method here.
  - id: CHO-sx1xtx47m4c0
    text: Returns 304
    correct: false
    explanation: Nothing is stored.
  - id: CHO-gnn9a1z66ss4
    text: Rejects it with 405
    correct: false
    explanation: It forwards the request.
  explanation: Only safe methods are cached; invalidation is outside the HTTP specification.
