  question: Which attribute declares a shared cache lifetime of 600 seconds on an action?
  code_language: php
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 45
  classification: OFFICIAL
  pool: COMPREHENSION
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-10-09'
  tags:
  - http-cache
  - attributes
  choices:
  - id: CHO-7fnts5ghbnh2
    text: '`#[Cache(public: true, smaxage: 600)]`'
    correct: true
  - id: CHO-wgt75jhfjr37
    text: '`#[Cache(public: true, s_maxage: 600)]`'
    correct: false
    explanation: 'The attribute uses camelCase: smaxage.'
  - id: CHO-zvks2rq0pwtn
    text: '`#[HttpCache(shared: 600)]`'
    correct: false
    explanation: No such attribute.
  - id: CHO-kes5swmadq1w
    text: '`#[Cache(sharedMaxAge: 600)]`'
    correct: false
    explanation: The argument is smaxage.
  explanation: 'setCache() uses snake_case keys (s_maxage); #[Cache] uses camelCase. Headers set in the
    controller win over the attribute.'
  official_sources:
