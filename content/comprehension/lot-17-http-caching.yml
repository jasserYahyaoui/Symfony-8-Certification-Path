  question: /account is cached as `public, max-age=60` behind the reverse proxy. Alice loads it, then
    Bob does, without cookies. What does Bob see?
  scoring_policy: all-or-nothing
  shuffle_choices: true
  negative_wording: false
  estimated_time_seconds: 55
  classification: OFFICIAL
  pool: COMPREHENSION
  verification_status: VERIFIED
  reviewers:
  - tech-lead
  reviewed_at: '2026-10-09'
  tags:
  - http-cache
  choices:
  - id: CHO-472gnf9kyadg
    text: Alice's page
    correct: true
  - id: CHO-eq675g4dezxh
    text: 'His own page: the route parameters differ'
    correct: false
    explanation: The cache key is the URI; nothing differs.
  - id: CHO-wah899tzp29n
    text: 'An error: personal pages cannot be public'
    correct: false
    explanation: Nothing checks that.
  - id: CHO-afw487j5pbpx
    text: A 304
    correct: false
    explanation: The full cached response is served.
  explanation: The key is the URI unless a variation is declared; such pages must be private.
