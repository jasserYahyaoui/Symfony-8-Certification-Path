<h1>Practice Mode</h1>
<p>
  Entraînement libre, sans chronomètre. La réponse et l'explication n'apparaissent
  qu'après validation. Les questions du pool <em>holdout</em> sont absentes de ce
  mode : elles ne figurent pas dans les données chargées par cette page.
</p>

<section aria-labelledby="filters-heading">
  <h2 id="filters-heading">Filtres</h2>
  <div class="filters">
    <p class="field">
      <label for="filter-topic">Sujet officiel</label>
      <select id="filter-topic"><option value="">Tous</option></select>
    </p>
    <p class="field">
      <label for="filter-difficulty">Difficulté</label>
      <select id="filter-difficulty"><option value="">Toutes</option></select>
    </p>
    <p class="field">
      <label for="filter-language">Langue</label>
      <select id="filter-language">
        <option value="">Toutes</option>
        <option value="fr">Français</option>
        <option value="en">English</option>
      </select>
    </p>
    <p class="field">
      <label for="filter-weak">
        <input type="checkbox" id="filter-weak"> Rejouer mes points faibles uniquement
      </label>
    </p>
  </div>
</section>

<section aria-labelledby="quiz-heading">
  <h2 id="quiz-heading">Question</h2>
  <div id="practice-app" data-mode="practice" data-payload="data/practice.json">
    <p role="status" id="practice-status">Chargement…</p>
  </div>
</section>
