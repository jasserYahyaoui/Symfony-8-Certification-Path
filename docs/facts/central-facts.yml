# Central facts: claims a remediation corrected, each tied to an executed check
# and to the content that states it.
#
# - behavior_check: a key returned by a file under tools/behavior/checks/.
#   `php tools/behavior/run.php` executes it against Symfony 8.0 / PHP 8.4.
# - content: canonical ids that teach the fact. CentralFactsTest asserts each
#   one still exists.
# - forbidden: PCRE patterns for the corrected claim. CentralFactsTest fails if
#   any canonical file (content/**, the matrix) matches one again. A HOLDOUT
#   match is reported without its id.
#
# A pattern catches a wording, not an idea: it guards against the old sentence
# coming back, not against every way of being wrong.
schema_version: 1
facts:
  serializer.normalized-form-not-always-array:
    finding: F1
    official_item: OIT-fr58jzaj6jtb
    statement: >-
      Normalizing then encoding are two responsibilities, but the normalized form is not always an
      array: NormalizerInterface::normalize() may return array, string, int, float, bool, ArrayObject
      or null. ObjectNormalizer turns an ordinary object into an array; DateTimeNormalizer returns an
      RFC 3339 string; BackedEnumNormalizer returns the backing value; scalars pass through unchanged.
    sources:
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Serializer/Normalizer/NormalizerInterface.php
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Serializer/Serializer.php
    behavior_check: serializer.normalized-form-not-always-array
    content: [CRS-3z96cp2s1dka, FLC-50daktpqmkv9, QST-xeygxgdd5586]
    forbidden:
      - '/passe(nt)? toujours par un tableau/iu'
      - '/tout passe par un tableau/iu'
      - '/tableau (toujours au milieu|intermédiaire)/iu'
      - '/always (be )?(converted to|goes through|pass(es)? through|go through) an array/iu'
      - '/always converted to an array/iu'
  serializer.decode-follows-format:
    finding: F1
    official_item: OIT-fr58jzaj6jtb
    statement: >-
      On deserialize(), the decoder returns what the format holds: a JSON object decodes to an array,
      a JSON string to a string, which BackedEnumNormalizer turns into an enum case.
    sources:
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Serializer/Encoder/JsonDecode.php
    behavior_check: serializer.decode-follows-format
    content: [QST-et0jfkbyacjy]
    forbidden:
      - "/Data always goes through an array/iu"
  cache.callback-runs-on-hit-with-beta-inf:
    finding: F2
    official_item: OIT-78k7kbfpgfxt
    statement: >-
      The get() callback is not reserved to a miss. It runs when the item is not a hit or beta is INF,
      and probabilistic early expiration may elect an item that has an expiry before it expires. With
      beta=INF on a stored key, the callback runs, isHit() is true inside it, and its value is saved.
    sources:
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Contracts/Cache/CacheTrait.php
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Cache/Adapter/ArrayAdapter.php
    behavior_check: cache.callback-runs-on-hit-with-beta-inf
    content: [CRS-p6yhxmpxrzbs, FLC-5ph49r9vszd1, QST-ch9mc2vedk60]
    forbidden:
      - "/(exécuté|appelé) (seulement|uniquement) en cas de manque/iu"
      - "/ne s'exécute qu'en cas de manque/iu"
      - "/callback runs only on a miss/iu"
      - "/callable is never invoked/iu"
  cache.beta-zero-serves-hit:
    finding: F2
    official_item: OIT-78k7kbfpgfxt
    statement: >-
      beta=0 disables early expiration, not caching: a stored item is served without the callback.
      An item without an expiry is never elected for early recomputation.
    sources:
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Contracts/Cache/CacheTrait.php
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Cache/Adapter/ArrayAdapter.php
    behavior_check: cache.beta-zero-serves-hit
    content: [QST-4312r4ah4gn2]
    forbidden: []
  cache.save-false-not-stored:
    finding: F2
    official_item: OIT-78k7kbfpgfxt
    statement: Setting the by-reference $save to false returns the callback value without storing it.
    sources:
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Contracts/Cache/CacheTrait.php
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Cache/Adapter/ArrayAdapter.php
    behavior_check: cache.save-false-not-stored
    content: [CRS-p6yhxmpxrzbs]
    forbidden: []
  cache.pools-isolated-by-namespace:
    finding: F2
    official_item: OIT-78k7kbfpgfxt
    statement: >-
      Framework pools do not collide on a shared backend because each gets a namespace hashed from the
      pool name, the adapter class and a seed. Two adapters built with the same namespace and storage
      share their keys.
    sources:
      - https://raw.githubusercontent.com/symfony/symfony-docs/8.0/cache.rst
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Cache/DependencyInjection/CachePoolPass.php
    behavior_check: cache.pools-isolated-by-namespace
    content: [CRS-p6yhxmpxrzbs, QST-1rc72pvqjry1, QST-w6g2sgj7apm1]
    forbidden:
      - "/ne se heurtent jamais/iu"
      - "/keys (of|from) (two|different) pools never collide/iu"
  http-kernel.response-controller-skips-view:
    finding: F3
    official_item: OIT-7sewqvmw6468
    statement: >-
      A controller returning a Response gives request → controller → controller_arguments → response →
      finish_request, then terminate when terminate() is called; kernel.view is not dispatched.
      handle() never dispatches kernel.terminate itself.
    sources:
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/HttpKernel/HttpKernel.php
    behavior_check: http-kernel.response-controller-skips-view
    content: [FLC-jjsdae8j3b56, CRS-mpwjc4g3vmj7]
    forbidden:
      - "/request → controller → controller_arguments → view → response/u"
  http-kernel.view-only-for-non-response:
    finding: F3
    official_item: OIT-7sewqvmw6468
    statement: kernel.view is dispatched only when the controller result is not a Response.
    sources:
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/HttpKernel/HttpKernel.php
    behavior_check: http-kernel.view-only-for-non-response
    content: [FLC-jjsdae8j3b56, CRS-mpwjc4g3vmj7]
    forbidden: []
  http-kernel.unconverted-view-throws:
    finding: F3
    official_item: OIT-7sewqvmw6468
    statement: >-
      When the controller returns no Response and no kernel.view listener sets one, handle() throws
      ControllerDoesNotReturnResponseException.
    sources:
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/HttpKernel/HttpKernel.php
    behavior_check: http-kernel.unconverted-view-throws
    content: [CRS-mpwjc4g3vmj7]
    forbidden: []
  http-kernel.request-short-circuit:
    finding: F3
    official_item: OIT-7sewqvmw6468
    statement: A response set on kernel.request skips controller resolution, the call and kernel.view.
    sources:
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/HttpKernel/HttpKernel.php
    behavior_check: http-kernel.request-short-circuit
    content: [CRS-mpwjc4g3vmj7]
    forbidden: []
  serializer.first-supporting-normalizer-wins:
    finding: P1.5
    official_item: OIT-fr58jzaj6jtb
    statement: >-
      The Serializer gives a value to the first normalizer, in order, that accepts it. ObjectNormalizer
      listed before a specialised normalizer takes its objects, dates included. The framework registers
      ObjectNormalizer at priority -1000, after autoconfigured normalizers (priority 0).
    sources:
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Serializer/Serializer.php
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Bundle/FrameworkBundle/Resources/config/serializer.php
    behavior_check: serializer.first-supporting-normalizer-wins
    content: [CRS-3z96cp2s1dka, FLC-7pd9j9cfpxer, QST-1wg4b6eb9q3t, QST-t4t79qkyy0gh]
    forbidden:
      - "/le normaliseur le plus spécifique (est choisi|l'emporte)/iu"
      - "/most specific normalizer (is chosen|wins)/iu"
  serializer.denormalize-types-need-extractor:
    finding: P1.5
    official_item: OIT-fr58jzaj6jtb
    statement: >-
      Type checks during denormalization come from a property type extractor. Without one, PHP coercion
      applies ("7" becomes 7 for an int); with one, NotNormalizableValueException. With
      COLLECT_DENORMALIZATION_ERRORS, the errors are thrown together in a PartialDenormalizationException.
    sources:
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Serializer/Normalizer/AbstractObjectNormalizer.php
    behavior_check: serializer.denormalize-types-need-extractor
    content: [CRS-3z96cp2s1dka, FLC-qqh239qh9bmb, QST-6w2q3s8tttm3, QST-fd1dm5jy2pyh]
    forbidden: []
  serializer.object-to-populate:
    finding: P1.5
    official_item: OIT-fr58jzaj6jtb
    statement: OBJECT_TO_POPULATE fills and returns the given object; keys absent from the input leave their property untouched.
    sources:
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Serializer/Normalizer/AbstractNormalizer.php
    behavior_check: serializer.object-to-populate
    content: [CRS-3z96cp2s1dka, QST-9ydm1brz691j]
    forbidden: []
  serializer.context-options:
    finding: P1.5
    official_item: OIT-fr58jzaj6jtb
    statement: skip_null_values omits null properties; datetime_format sets the date format, for one call.
    sources:
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Serializer/Normalizer/AbstractObjectNormalizer.php
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Serializer/Normalizer/DateTimeNormalizer.php
    behavior_check: serializer.context-options
    content: [CRS-3z96cp2s1dka, FLC-d5w66y32a3ka, QST-hjv0ngsgvqxr]
    forbidden: []
  cache.psr6-save-and-null:
    finding: P1.4
    official_item: OIT-78k7kbfpgfxt
    statement: >-
      PSR-6 stores nothing until save(); a miss is isHit() false with get() null, and a saved null is
      isHit() true with get() null, so only isHit() tells them apart. deleteItem() removes the item.
    sources:
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Cache/Traits/AbstractAdapterTrait.php
    behavior_check: cache.psr6-save-and-null
    content: [CRS-p6yhxmpxrzbs, FLC-zh5xzmekgemg, QST-gfe8kk8nxsgf, QST-1mz08p0dyk3c]
    forbidden:
      - "/get\\(\\) (returns|rend) null[^.]{0,40}(means|signifie)[^.]{0,20}(missing|absent)/iu"
  cache.psr6-deferred-commit:
    finding: P1.4
    official_item: OIT-78k7kbfpgfxt
    statement: >-
      With FilesystemAdapter, an item passed to saveDeferred() is invisible to another pool until commit(),
      and a getItem() of that key on the deferring pool commits it. ArrayAdapter's saveDeferred() calls save().
    sources:
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Cache/Traits/AbstractAdapterTrait.php
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Cache/Adapter/ArrayAdapter.php
    behavior_check: cache.psr6-deferred-commit
    content: [CRS-p6yhxmpxrzbs, FLC-qcvd0xvack55, QST-eakh06qrdwz5]
    forbidden: []
  cache.psr16-default-and-has:
    finding: P1.4
    official_item: OIT-78k7kbfpgfxt
    statement: PSR-16 get() returns the default on a miss; has() tells a stored null apart from a miss.
    sources:
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Cache/Psr16Cache.php
    behavior_check: cache.psr16-default-and-has
    content: [CRS-p6yhxmpxrzbs, QST-gfe8kk8nxsgf, QST-3va6n5ybkba5]
    forbidden: []
  cache.psr-bridges:
    finding: P1.4
    official_item: OIT-78k7kbfpgfxt
    statement: >-
      Psr16Cache turns a PSR-6 pool into a PSR-16 cache; Psr16Adapter turns a PSR-16 cache into a PSR-6
      pool that also implements the Cache Contracts. Adapters do not implement PSR-16 themselves.
    sources:
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Cache/Psr16Cache.php
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Cache/Adapter/Psr16Adapter.php
    behavior_check: cache.psr-bridges
    content: [CRS-p6yhxmpxrzbs, QST-3va6n5ybkba5]
    forbidden: []
  validator.null-passes-value-constraints:
    finding: P1.3
    official_item: OIT-9x3strrjdng7
    statement: >-
      A value constraint ignores null: Length, Email, Regex, Choice, Positive, Count, Url and Type report nothing on it.
      Only NotNull and NotBlank refuse null.
    sources:
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Validator/Constraints/LengthValidator.php
    behavior_check: validator.null-passes-value-constraints
    content: [CRS-569y6hb7fwj5, FLC-t2dp9na2nv8d, QST-n7y4xagppx56]
    forbidden: []
  validator.empty-string-split:
    finding: P1.3
    official_item: OIT-9x3strrjdng7
    statement: >-
      The empty string is not null. Email, Regex and Url return at once on it; Length measures a length of 0, and Choice
      and Positive report it.
    sources:
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Validator/Constraints/EmailValidator.php
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Validator/Constraints/LengthValidator.php
    behavior_check: validator.empty-string-split
    content: [CRS-569y6hb7fwj5, FLC-t2dp9na2nv8d, QST-axp7pjs0gkx9, QST-n7y4xagppx56]
    forbidden:
      - "/\\bEmail\\b[^.\\n]{0,40}\\b(refuse|rejette|rejects)\\b[^.\\n]{0,20}(la string vide|the empty string)/u"
  validator.options-array-refused:
    finding: P1.3
    official_item: OIT-9x3strrjdng7
    statement: >-
      Symfony 8.0 configures constraints by named arguments. The first parameter of Choice is still $options, so
      Choice(['a', 'b']) throws an InvalidArgumentException; choices: must be named.
    sources:
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Validator/Constraints/Choice.php
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Validator/CHANGELOG.md
    behavior_check: validator.options-array-refused
    content: [CRS-569y6hb7fwj5, FLC-84x56c7s0fpd, QST-f1bervatv72c]
    forbidden: []
  validator.url-requires-tld-by-default:
    finding: P1.3
    official_item: OIT-9x3strrjdng7
    statement: In 8.0 requireTld defaults to true, so new Url() refuses http://localhost.
    sources:
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Validator/CHANGELOG.md
    behavior_check: validator.url-requires-tld-by-default
    content: [CRS-569y6hb7fwj5, QST-tjerswa74bd5]
    forbidden: []
  validator.collection-missing-and-extra:
    finding: P1.3
    official_item: OIT-9x3strrjdng7
    statement: >-
      Collection reports a missing key and an unexpected key at [key], unless allowMissingFields or allowExtraFields.
      Required requires the key, not a non-null value.
    sources:
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Validator/Constraints/CollectionValidator.php
    behavior_check: validator.collection-missing-and-extra
    content: [CRS-569y6hb7fwj5]
    forbidden: []
  validator.list-sequentially-compound:
    finding: P1.3
    official_item: OIT-9x3strrjdng7
    statement: A list of constraints runs them all, Sequentially stops at the first violation, and Compound runs all of its own.
    sources:
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Validator/Constraints/SequentiallyValidator.php
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Validator/Constraints/Compound.php
    behavior_check: validator.list-sequentially-compound
    content: [CRS-569y6hb7fwj5]
    forbidden: []
  validator.custom-constraint-defaults:
    finding: P1.3
    official_item: OIT-0wnxbapegqhv
    statement: >-
      A custom constraint is validated by its class name followed by Validator, targets a property by default and is in
      the Default group. Put on a class without overriding getTargets(), it throws a ConstraintDefinitionException.
    sources:
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Validator/Constraint.php
    behavior_check: validator.custom-constraint-defaults
    content: [CRS-d235sja3h7y2, FLC-5n69katpvnnd, QST-v6s83rdh77nq]
    forbidden: []
  validator.custom-validator-sees-null:
    finding: P1.3
    official_item: OIT-0wnxbapegqhv
    statement: A custom validator is called with null too; returning early on it is the validator's own job.
    sources:
      - https://raw.githubusercontent.com/symfony/symfony-docs/8.0/validation/custom_constraint.rst
    behavior_check: validator.custom-validator-sees-null
    content: [CRS-d235sja3h7y2, FLC-5n69katpvnnd, QST-v6s83rdh77nq]
    forbidden: []
  validator.unexpected-value-vs-type:
    finding: P1.3
    official_item: OIT-0wnxbapegqhv
    statement: >-
      An UnexpectedValueException thrown by a validator becomes the violation "This value should be of type ...";
      an UnexpectedTypeException propagates.
    sources:
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Validator/Validator/RecursiveContextualValidator.php
    behavior_check: validator.unexpected-value-vs-type
    content: [CRS-d235sja3h7y2, QST-ed52tkyz4n4h]
    forbidden: []
  console.setcode-closure-typed-and-int:
    finding: deep-audit-8.0
    official_item: OIT-kbg00jqxxwhq
    statement: >-
      Console 8.0 accepts any closure in setCode(), then fails at run(): an untyped parameter raises a
      LogicException, and a typed closure that does not return an int raises a TypeError. Both returned 0
      on 7.4. A declared return type is not required.
    sources:
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Console/CHANGELOG.md
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Console/Command/InvokableCommand.php
    behavior_check: console.setcode-closure-typed-and-int
    content: [FLC-an8ypmrag2p3]
    forbidden: []
  config.required-node-has-no-default:
    finding: deep-audit-8.0
    official_item: OIT-qj4xfkhwdrx7
    statement: >-
      Config 8.0 refuses a node that is both required and defaulted: isRequired() then defaultValue(), the
      reverse order, and isRequired() then defaultNull() each throw an InvalidDefinitionException when the tree
      is built. isRequired() alone builds.
    sources:
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Config/Definition/Builder/NodeDefinition.php
    behavior_check: config.required-node-has-no-default
    content: [CRS-exs5dvtqa1as, FLC-7hbhn5dg15te, QST-kzd5923s8gg9, QST-31ajknw5d0qs]
    forbidden: []
  translation.translatable-not-stringable:
    finding: deep-audit-8.0
    official_item: OIT-sd08j04k60m0
    statement: >-
      TranslatableMessage has no __toString() in 8.0: Twig printing it without |trans throws a RuntimeError,
      where 7.4 printed the raw key. {{ message|trans }} translates it.
    sources:
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Translation/CHANGELOG.md
    behavior_check: translation.translatable-not-stringable
    content: [CRS-q18xc1k4yvb9, FLC-p6q3ewt9qsj7, QST-zpp1r9fbs8vb]
    forbidden: []
  form.collection-extra-entries-refused:
    finding: P1.2
    official_item: OIT-5xvjqa4203xe
    statement: >-
      Without allow_add a CollectionType drops an extra submitted entry, and the Validator extension makes the
      form invalid with "This form should not contain extra fields."; allow_add keeps it.
    sources:
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Form/Extension/Core/EventListener/ResizeFormListener.php
    behavior_check: form.collection-extra-entries-refused
    content: [CRS-f9pen0bdyrr9, FLC-6gjygtq4ba5b, QST-gtk4r5hqgvhx]
    forbidden: []
  form.collection-delete-needs-allow-delete:
    finding: P1.2
    official_item: OIT-5xvjqa4203xe
    statement: >-
      Without allow_delete a missing entry becomes null; allow_delete removes it; an empty string is removed only
      with delete_empty.
    sources:
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Form/Extension/Core/EventListener/ResizeFormListener.php
    behavior_check: form.collection-delete-needs-allow-delete
    content: [CRS-f9pen0bdyrr9, FLC-6gjygtq4ba5b, QST-gtk4r5hqgvhx]
    forbidden: []
  form.collection-prototype:
    finding: P1.2
    official_item: OIT-5xvjqa4203xe
    statement: >-
      A CollectionType view carries vars.prototype only with allow_add; its name is __name__, which prototype_name
      changes.
    sources:
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Form/Extension/Core/Type/CollectionType.php
    behavior_check: form.collection-prototype
    content: [CRS-f9pen0bdyrr9, QST-cs5ykmwy2vwm]
    forbidden: []
  form.by-reference-object-collection:
    finding: P1.2
    official_item: OIT-5xvjqa4203xe
    statement: >-
      For an object collection, by_reference true (the default) modifies it in place and calls no setter, adder or
      remover; by_reference false calls the remover and adder when they exist, otherwise the setter with a new
      instance.
    sources:
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Form/Extension/Core/DataAccessor/PropertyPathAccessor.php
    behavior_check: form.by-reference-object-collection
    content: [CRS-f9pen0bdyrr9, FLC-z1pt1g2zqn6z, QST-v3wvgyq5thee]
    forbidden:
      - "/by_reference[^.\\n]{0,40}(true|par défaut|by default)[^.\\n]{0,40}(appelle|calls) (addTag|l'adder|the adder)/iu"
  form.property-path-and-inherit-data:
    finding: P1.2
    official_item: OIT-fhpttc4c5x0k
    statement: >-
      property_path gives a field another path (name, profile.bio); a type with inherit_data works on its parent's
      data, and its getData() returns the parent object.
    sources:
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Form/Form.php
    behavior_check: form.property-path-and-inherit-data
    content: [CRS-8msvfwe13mpb, FLC-r6v26rr7gf9q, QST-3zbbzc4cy9ms, QST-yxjnqrztscg0]
    forbidden: []
  php.array-merge-vs-union:
    finding: P1.1
    official_item: OIT-46ry8d7dypmb
    statement: >-
      array_merge renumbers integer keys and lets a later string key win; the + operator keeps the left-hand element
      for a key present on both sides, so ['a'] + ['b'] is ['a'].
    sources:
      - https://raw.githubusercontent.com/php/doc-en/master/reference/array/functions/array-merge.xml
      - https://raw.githubusercontent.com/php/doc-en/master/language/operators/array.xml
    behavior_check: php.array-merge-vs-union
    content: [CRS-722pscs6e2m0, FLC-6yegfjgbqn5g, QST-8g91k8rjcn8g]
    forbidden: []
  php.array-functions-and-keys:
    finding: P1.1
    official_item: OIT-46ry8d7dypmb
    statement: >-
      array_filter preserves keys and leaves gaps; array_map preserves keys only when given exactly one array; sort()
      sorts in place and returns true.
    sources:
      - https://raw.githubusercontent.com/php/doc-en/master/reference/array/functions/array-filter.xml
      - https://raw.githubusercontent.com/php/doc-en/master/reference/array/functions/array-map.xml
    behavior_check: php.array-functions-and-keys
    content: [CRS-722pscs6e2m0, QST-cvv4q26x2q2s]
    forbidden: []
  php.string-number-comparison:
    finding: P1.1
    official_item: OIT-46ry8d7dypmb
    statement: >-
      Since PHP 8.0 a number and a non-numeric string compare as strings (0 == 'a' is false); two numeric strings
      still compare as numbers ('10' == '1e1' is true); in_array() uses == unless its strict argument is true.
    sources:
      - https://raw.githubusercontent.com/php/doc-en/master/language/operators/comparison.xml
    behavior_check: php.string-number-comparison
    content: [CRS-722pscs6e2m0, QST-f2m90kz2ya28]
    forbidden: []
  php.php84-array-find-any-all:
    finding: P1.1
    official_item: OIT-46ry8d7dypmb
    statement: >-
      PHP 8.4 adds array_find (first accepted value, or null), array_find_key, array_any (false on an empty array) and
      array_all (true on an empty array); the callback receives the value, then the key.
    sources:
      - https://raw.githubusercontent.com/php/php-src/PHP-8.4/UPGRADING
      - https://raw.githubusercontent.com/php/doc-en/master/reference/array/functions/array-find.xml
    behavior_check: php.php84-array-find-any-all
    content: [CRS-722pscs6e2m0, FLC-c63atm9r74mk, QST-g3y2dqj5820q]
    forbidden: []
  php.json-decode-defaults:
    finding: P1.1
    official_item: OIT-46ry8d7dypmb
    statement: >-
      json_decode returns a stdClass for a JSON object unless its second argument is true, and null on invalid input
      unless JSON_THROW_ON_ERROR makes it throw a JsonException; json_validate (PHP 8.3) returns a bool.
    sources:
      - https://raw.githubusercontent.com/php/doc-en/master/reference/json/functions/json-decode.xml
    behavior_check: php.json-decode-defaults
    content: [CRS-722pscs6e2m0, QST-xna2m697k5m7]
    forbidden: []
  http-client.unchecked-status-throws-on-destruct:
    finding: P2.7
    official_item: OIT-9kh5cqz5qtrb
    statement: >-
      A response whose status nobody read throws the 3xx-5xx exception from its destructor; an unassigned request is
      therefore synchronous. getStatusCode(), getHeaders(false) and cancel() opt out; getInfo('http_code') does not.
    sources:
      - https://raw.githubusercontent.com/symfony/symfony-docs/8.0/http_client.rst
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/HttpClient/Response/TransportResponseTrait.php
    behavior_check: http-client.unchecked-status-throws-on-destruct
    content: [CRS-ez2qmqfk902e, FLC-r4e8c0b07twy, QST-gm49kwkdxbtm, QST-pj447r0ttj70]
    forbidden: []
  http-client.retry-count-and-last-response:
    finding: P2.7
    official_item: OIT-9kh5cqz5qtrb
    statement: >-
      RetryableHttpClient retries 3 times by default (max_retries), so at most four requests; once exhausted it returns
      the last response as it is, whose getContent() then throws.
    sources:
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/HttpClient/RetryableHttpClient.php
    behavior_check: http-client.retry-count-and-last-response
    content: [CRS-ez2qmqfk902e, QST-122kweqkmvkb]
    forbidden: []
  http-client.retry-by-status-and-method:
    finding: P2.7
    official_item: OIT-9kh5cqz5qtrb
    statement: >-
      The default strategy retries 423, 425, 429, 502 and 503 for every method; 500, 504, 507, 510 and transport errors
      for idempotent methods only; a failed DNS resolution for every method; never a 404.
    sources:
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/HttpClient/Retry/GenericRetryStrategy.php
      - https://raw.githubusercontent.com/symfony/symfony-docs/8.0/http_client.rst
    behavior_check: http-client.retry-by-status-and-method
    content: [CRS-ez2qmqfk902e, FLC-s6byhm4fp6at, QST-57h88pmcmram]
    forbidden: []
  http-client.retry-delay-and-retry-after:
    finding: P2.7
    official_item: OIT-9kh5cqz5qtrb
    statement: >-
      The default delay is 1 s, multiplied by 2 at each retry, with 10 % jitter; a Retry-After header replaces it.
    sources:
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/HttpClient/Retry/GenericRetryStrategy.php
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/HttpClient/RetryableHttpClient.php
    behavior_check: http-client.retry-delay-and-retry-after
    content: [CRS-ez2qmqfk902e, FLC-s6byhm4fp6at]
    forbidden: []
  http-client.stream-error-chunk:
    finding: P2.7
    official_item: OIT-9kh5cqz5qtrb
    statement: >-
      In stream(), a response's transport error is thrown by its chunk's methods; uncaught it ends the loop for every
      response, caught inside the loop it lets the others finish. getError() alone does not handle it.
    sources:
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/HttpClient/Chunk/ErrorChunk.php
      - https://raw.githubusercontent.com/symfony/symfony-docs/8.0/http_client.rst
    behavior_check: http-client.stream-error-chunk
    content: [CRS-ez2qmqfk902e, FLC-64jn4rvgq2j7, QST-xmc2fdjxha1y]
    forbidden: []
  http-client.stream-status-at-first-chunk:
    finding: P2.7
    official_item: OIT-9kh5cqz5qtrb
    statement: >-
      In stream(), a status left unread at the first chunk is checked by the stream itself: a 404 throws a
      ClientException as the loop resumes.
    sources:
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/HttpClient/Response/TransportResponseTrait.php
    behavior_check: http-client.stream-status-at-first-chunk
    content: [CRS-ez2qmqfk902e, QST-49wat9m2ymsx]
    forbidden: []
  http-client.stream-timeout-chunk:
    finding: P2.7
    official_item: OIT-9kh5cqz5qtrb
    statement: >-
      A timeout given to stream() yields a chunk whose isTimeout() is true and ends that stream; isLast() on it throws a
      TimeoutException; a new stream() resumes the response.
    sources:
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/HttpClient/Chunk/ErrorChunk.php
      - https://raw.githubusercontent.com/symfony/symfony-docs/8.0/http_client.rst
    behavior_check: http-client.stream-timeout-chunk
    content: [CRS-ez2qmqfk902e]
    forbidden: []
  console.signal-exits-zero-by-default:
    finding: P2.7
    official_item: OIT-cqs3m73y3rpy
    statement: >-
      With a dispatcher, the Application handles SIGINT, SIGQUIT, SIGTERM, SIGUSR1, SIGUSR2 and SIGALRM: console.signal,
      then console.terminate carrying the signal, then exit with code 0 unless a listener changes it; abortExit() lets
      the command carry on. Without a dispatcher or a signalable command, PHP dies of the signal.
    sources:
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Console/Application.php
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Console/Event/ConsoleSignalEvent.php
    behavior_check: console.signal-exits-zero-by-default
    content: [CRS-y0zc67f3e5zk, FLC-hwy7pnrsb9c9, QST-97at0qx0zavd]
    forbidden: []
  console.signalable-command-return:
    finding: P2.7
    official_item: OIT-cqs3m73y3rpy
    statement: >-
      handleSignal() of a SignalableCommandInterface command receives the exit code so far; an integer exits with it,
      false lets the command carry on, with or without a dispatcher.
    sources:
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Console/Command/SignalableCommandInterface.php
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Console/Application.php
    behavior_check: console.signalable-command-return
    content: [CRS-y0zc67f3e5zk, QST-73js5jkzw6a4]
    forbidden: []
  console.alarm-event:
    finding: P2.7
    official_item: OIT-cqs3m73y3rpy
    statement: >-
      setAlarmInterval() makes each SIGALRM dispatch console.signal, then ConsoleAlarmEvent under its class name, which
      has no ConsoleEvents constant; without abortExit() the first alarm ends the command with code 0.
    sources:
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Console/Application.php
      - https://raw.githubusercontent.com/symfony/symfony-docs/8.0/components/console/events.rst
    behavior_check: console.alarm-event
    content: [CRS-y0zc67f3e5zk, FLC-0rh1nh0y9dgg, FLC-hk7rkbxfq90j, QST-wjwkdfb6r539, QST-47xzn33srh7c]
    forbidden:
      - "/Quatre events, pas cinq/u"
  console.command-tester-dispatches-nothing:
    finding: P2.7
    official_item: OIT-65sswf0qhw6c
    statement: >-
      CommandTester runs the command alone, so no console event is dispatched even when the Application has a
      dispatcher; ApplicationTester runs the Application and dispatches them.
    sources:
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Console/Tester/CommandTester.php
    behavior_check: console.command-tester-dispatches-nothing
    content: [CRS-0ab7kpexq9w9, FLC-p35kr4nxr717, QST-r56h5h07dq42]
    forbidden: []
  console.interact-before-validation:
    finding: P2.7
    official_item: OIT-65sswf0qhw6c
    statement: >-
      Command::run() calls initialize(), interact() only when the input is interactive, then validates the input, then
      execute(): interact() can fill a missing required argument; non-interactive, the input fails with "Not enough
      arguments".
    sources:
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Console/Command/Command.php
    behavior_check: console.interact-before-validation
    content: [CRS-0ab7kpexq9w9, QST-grtv1rxf2d0x]
    forbidden: []
  console.tester-stderr-separately:
    finding: P2.7
    official_item: OIT-65sswf0qhw6c
    statement: >-
      With capture_stderr_separately, what getErrorStyle() writes and the prompt of a question go to getErrorOutput()
      instead of getDisplay().
    sources:
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Console/Helper/QuestionHelper.php
    behavior_check: console.tester-stderr-separately
    content: [CRS-0ab7kpexq9w9]
    forbidden: []
  profiler.collector-lifecycle:
    finding: P2.7
    official_item: OIT-d1qsxrtv25kk
    statement: >-
      AbstractDataCollector::getName() defaults to the class name and getTemplate() to null; Profiler::collect() calls
      collect() and stores a clone in the profile; saveProfile() calls lateCollect() on it, then writes; a loaded profile
      returns an unserialized copy with both values; an unknown name throws InvalidArgumentException.
    sources:
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Bundle/FrameworkBundle/DataCollector/AbstractDataCollector.php
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/HttpKernel/Profiler/Profiler.php
    behavior_check: profiler.collector-lifecycle
    content: [CRS-x8j99kkmpsng, FLC-k3g0ne1da089, QST-9w82jjm5746x, QST-rsk9b4q3fds1, QST-wjsnwrw10q5d]
    forbidden: []
  profiler.serialized-reset-disabled:
    finding: P2.7
    official_item: OIT-d1qsxrtv25kk
    statement: >-
      A Closure in a collector's data makes saveProfile() throw "Serialization of 'Closure' is not allowed"; reset()
      empties the data; a disabled profiler's collect() returns null.
    sources:
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/HttpKernel/Profiler/Profiler.php
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/HttpKernel/DataCollector/DataCollector.php
    behavior_check: profiler.serialized-reset-disabled
    content: [CRS-x8j99kkmpsng, FLC-f1nsnkc89qad, QST-7b6xtj7h9tyf]
    forbidden: []
  profiler.collector-in-functional-test:
    finding: P2.7
    official_item: OIT-d1qsxrtv25kk
    statement: >-
      With profiler collect false, an autoconfigured collector is read back with $client->getProfile()->getCollector()
      under its getName() only for the request that follows enableProfiler().
    sources:
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Bundle/FrameworkBundle/KernelBrowser.php
    behavior_check: profiler.collector-in-functional-test
    content: [CRS-x8j99kkmpsng, CRS-0x4v9jaz4cnq]
    forbidden: []
  translation.icu-plural-categories:
    finding: P2.7
    official_item: OIT-sd08j04k60m0
    statement: >-
      ICU plural categories follow the locale formatting the message: in French 0 and 1.5 are "one" ("0 fichier"), in
      English 0 is "other"; an =0 branch wins over the category.
    sources:
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Translation/Formatter/IntlFormatter.php
      - https://raw.githubusercontent.com/symfony/symfony-docs/8.0/reference/formats/message_format.rst
    behavior_check: translation.icu-plural-categories
    content: [CRS-q18xc1k4yvb9, FLC-j7bectmryksk, QST-8b6sd8kbc1qx]
    forbidden: []
  translation.icu-nested-select-plural:
    finding: P2.7
    official_item: OIT-sd08j04k60m0
    statement: >-
      ICU select and plural nest; # is the number of the innermost plural; selectordinal gives 1st, 2nd, 3rd, 11th, 21st.
    sources:
      - https://raw.githubusercontent.com/symfony/symfony-docs/8.0/reference/formats/message_format.rst
    behavior_check: translation.icu-nested-select-plural
    content: [CRS-q18xc1k4yvb9]
    forbidden: []
  translation.icu-other-required:
    finding: P2.7
    official_item: OIT-sd08j04k60m0
    statement: >-
      A select or plural without an other branch makes trans() throw InvalidArgumentException (U_DEFAULT_KEYWORD_MISSING),
      for every value, matched or not.
    sources:
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Translation/Formatter/IntlFormatter.php
    behavior_check: translation.icu-other-required
    content: [CRS-q18xc1k4yvb9, QST-tfve3bphv48m]
    forbidden: []
  translation.icu-parameter-keys:
    finding: P2.7
    official_item: OIT-sd08j04k60m0
    statement: >-
      For an ICU message, a parameter key name or %name% fills {name} (Symfony trims the percent signs); %name% written
      in an ICU message stays text; a missing parameter leaves {name}.
    sources:
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Translation/Formatter/IntlFormatter.php
    behavior_check: translation.icu-parameter-keys
    content: [CRS-q18xc1k4yvb9]
    forbidden: []
  translation.several-catalogues:
    finding: P2.7
    official_item: OIT-3dd7821h069b
    statement: >-
      For a key in both messages and messages+intl-icu the ICU version wins; between two resources of one domain and
      locale the last loaded wins key by key; a message found in a fallback locale is formatted with that locale's rules.
    sources:
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Translation/MessageCatalogue.php
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Translation/Translator.php
    behavior_check: translation.several-catalogues
    content: [CRS-v1808qnchx6g, FLC-xy5sg8rfzbff, QST-50q8da3a6j72, QST-c2ajcg5w4bqk]
    forbidden: []
  filesystem.portable-paths:
    finding: P2.7
    official_item: OIT-tjn6kyvyc2h9
    statement: >-
      Path reads a backslash and a drive letter as separator and root only when DIRECTORY_SEPARATOR is a backslash: on
      Linux isAbsolutePath('c:\Windows') is false (the documentation's true is the Windows result) and
      canonicalize('a\b/../c') is c; paths written with / canonicalize and join the same everywhere.
    sources:
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Filesystem/Path.php
      - https://raw.githubusercontent.com/symfony/symfony-docs/8.0/components/filesystem.rst
    behavior_check: filesystem.portable-paths
    content: [CRS-h9nryezt8wnb, FLC-500k6pc92xev, QST-04dzxpcr5n14, QST-r1re7fzqmc4z]
    forbidden: []
  filesystem.tempnam-and-cleanup:
    finding: P2.7
    official_item: OIT-tjn6kyvyc2h9
    statement: >-
      tempnam($dir, $prefix, $suffix) creates an empty file with a unique name keeping prefix and suffix; remove() deletes
      a whole tree.
    sources:
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Filesystem/Filesystem.php
    behavior_check: filesystem.tempnam-and-cleanup
    content: [CRS-h9nryezt8wnb]
    forbidden: []
  finder.sort-for-a-deterministic-order:
    finding: P2.7
    official_item: OIT-a1anzcv85my3
    statement: >-
      Without a sort the Finder returns the filesystem order; sortByName() compares strings (f10 before f2),
      sortByName(true) uses natural order (f2 before f10), reverseSorting() inverts.
    sources:
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Finder/Iterator/SortableIterator.php
    behavior_check: finder.sort-for-a-deterministic-order
    content: [CRS-jwhqec35jczn, FLC-myk6e5gjj7qs, QST-fjbhttc65mgv, QST-c2aqc3snwd4y]
    forbidden: []
  runtime.entry-script-runs-twice:
    finding: P2.7
    official_item: OIT-r3qcmsehzex1
    statement: >-
      The front controller returns a closure; autoload_runtime.php includes it again, so lines above the require_once
      run twice; order: script returns, runtime constructed, closure called, application run.
    sources:
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Runtime/Internal/autoload_runtime.template
    behavior_check: runtime.entry-script-runs-twice
    content: [CRS-pm5kj5kh3gt2]
    forbidden: []
  runtime.return-value-checked:
    finding: P2.7
    official_item: OIT-r3qcmsehzex1
    statement: >-
      A front controller returning something other than a callable object, or a closure returning no object, ends in a
      TypeError.
    sources:
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Runtime/Internal/autoload_runtime.template
    behavior_check: runtime.return-value-checked
    content: [CRS-pm5kj5kh3gt2]
    forbidden: []
  runtime.autoload-first-disables-it:
    finding: P2.7
    official_item: OIT-r3qcmsehzex1
    statement: >-
      With vendor/autoload.php loaded before autoload_runtime.php, the latter returns at once: the script runs to its
      end and no application runs, exit code 0.
    sources:
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Runtime/Internal/autoload_runtime.template
    behavior_check: runtime.autoload-first-disables-it
    content: [CRS-pm5kj5kh3gt2]
    forbidden: []
  runtime.argument-type-and-name:
    finding: P2.7
    official_item: OIT-r3qcmsehzex1
    statement: >-
      GenericRuntime resolves the closure's arguments by type and name: array $context is given, array $ctx is refused
      with "Cannot resolve argument".
    sources:
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Runtime/GenericRuntime.php
    behavior_check: runtime.argument-type-and-name
    content: [CRS-pm5kj5kh3gt2]
    forbidden: []
