# Central facts: claims a remediation corrected, each tied to an executed check
# and to the content that states it.
#
# - behavior_check: a key returned by a file under tools/behavior/checks/.
#   `php tools/behavior/run.php` executes it against Symfony 8.0 / PHP 8.4.
# - content: canonical ids that teach the fact. CentralFactsTest asserts each
#   one still exists.
# - forbidden: PCRE patterns for the corrected claim. CentralFactsTest fails if
#   any canonical file (content/**, the matrix) matches one again. A HOLDOUT
#   match is reported without its id.
#
# A pattern catches a wording, not an idea: it guards against the old sentence
# coming back, not against every way of being wrong.
schema_version: 1
facts:
  serializer.normalized-form-not-always-array:
    finding: F1
    official_item: OIT-fr58jzaj6jtb
    statement: >-
      Normalizing then encoding are two responsibilities, but the normalized form is not always an
      array: NormalizerInterface::normalize() may return array, string, int, float, bool, ArrayObject
      or null. ObjectNormalizer turns an ordinary object into an array; DateTimeNormalizer returns an
      RFC 3339 string; BackedEnumNormalizer returns the backing value; scalars pass through unchanged.
    sources:
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Serializer/Normalizer/NormalizerInterface.php
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Serializer/Serializer.php
    behavior_check: serializer.normalized-form-not-always-array
    content: [CRS-3z96cp2s1dka, FLC-50daktpqmkv9, QST-xeygxgdd5586]
    forbidden:
      - '/passe(nt)? toujours par un tableau/iu'
      - '/tout passe par un tableau/iu'
      - '/tableau (toujours au milieu|intermédiaire)/iu'
      - '/always (be )?(converted to|goes through|pass(es)? through|go through) an array/iu'
      - '/always converted to an array/iu'
  serializer.decode-follows-format:
    finding: F1
    official_item: OIT-fr58jzaj6jtb
    statement: >-
      On deserialize(), the decoder returns what the format holds: a JSON object decodes to an array,
      a JSON string to a string, which BackedEnumNormalizer turns into an enum case.
    sources:
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Serializer/Encoder/JsonDecode.php
    behavior_check: serializer.decode-follows-format
    content: [QST-et0jfkbyacjy]
    forbidden:
      - "/Data always goes through an array/iu"
  cache.callback-runs-on-hit-with-beta-inf:
    finding: F2
    official_item: OIT-78k7kbfpgfxt
    statement: >-
      The get() callback is not reserved to a miss. It runs when the item is not a hit or beta is INF,
      and probabilistic early expiration may elect an item that has an expiry before it expires. With
      beta=INF on a stored key, the callback runs, isHit() is true inside it, and its value is saved.
    sources:
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Contracts/Cache/CacheTrait.php
    behavior_check: cache.callback-runs-on-hit-with-beta-inf
    content: [CRS-p6yhxmpxrzbs, FLC-5ph49r9vszd1, QST-ch9mc2vedk60]
    forbidden:
      - "/(exécuté|appelé) (seulement|uniquement) en cas de manque/iu"
      - "/ne s'exécute qu'en cas de manque/iu"
      - "/callback runs only on a miss/iu"
      - "/callable is never invoked/iu"
  cache.beta-zero-serves-hit:
    finding: F2
    official_item: OIT-78k7kbfpgfxt
    statement: >-
      beta=0 disables early expiration, not caching: a stored item is served without the callback.
      An item without an expiry is never elected for early recomputation.
    sources:
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Contracts/Cache/CacheTrait.php
    behavior_check: cache.beta-zero-serves-hit
    content: [QST-4312r4ah4gn2]
    forbidden: []
  cache.save-false-not-stored:
    finding: F2
    official_item: OIT-78k7kbfpgfxt
    statement: Setting the by-reference $save to false returns the callback value without storing it.
    sources:
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Contracts/Cache/CacheTrait.php
    behavior_check: cache.save-false-not-stored
    content: [CRS-p6yhxmpxrzbs]
    forbidden: []
  cache.pools-isolated-by-namespace:
    finding: F2
    official_item: OIT-78k7kbfpgfxt
    statement: >-
      Framework pools do not collide on a shared backend because each gets a namespace hashed from the
      pool name, the adapter class and a seed. Two adapters built with the same namespace and storage
      share their keys.
    sources:
      - https://raw.githubusercontent.com/symfony/symfony-docs/8.0/cache.rst
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/Cache/DependencyInjection/CachePoolPass.php
    behavior_check: cache.pools-isolated-by-namespace
    content: [CRS-p6yhxmpxrzbs, QST-1rc72pvqjry1, QST-w6g2sgj7apm1]
    forbidden:
      - "/ne se heurtent jamais/iu"
      - "/keys (of|from) (two|different) pools never collide/iu"
  http-kernel.response-controller-skips-view:
    finding: F3
    official_item: OIT-7sewqvmw6468
    statement: >-
      A controller returning a Response gives request → controller → controller_arguments → response →
      finish_request, then terminate when terminate() is called; kernel.view is not dispatched.
      handle() never dispatches kernel.terminate itself.
    sources:
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/HttpKernel/HttpKernel.php
    behavior_check: http-kernel.response-controller-skips-view
    content: [FLC-jjsdae8j3b56, CRS-mpwjc4g3vmj7]
    forbidden:
      - "/request → controller → controller_arguments → view → response/u"
  http-kernel.view-only-for-non-response:
    finding: F3
    official_item: OIT-7sewqvmw6468
    statement: kernel.view is dispatched only when the controller result is not a Response.
    sources:
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/HttpKernel/HttpKernel.php
    behavior_check: http-kernel.view-only-for-non-response
    content: [FLC-jjsdae8j3b56, CRS-mpwjc4g3vmj7]
    forbidden: []
  http-kernel.unconverted-view-throws:
    finding: F3
    official_item: OIT-7sewqvmw6468
    statement: >-
      When the controller returns no Response and no kernel.view listener sets one, handle() throws
      ControllerDoesNotReturnResponseException.
    sources:
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/HttpKernel/HttpKernel.php
    behavior_check: http-kernel.unconverted-view-throws
    content: [CRS-mpwjc4g3vmj7]
    forbidden: []
  http-kernel.request-short-circuit:
    finding: F3
    official_item: OIT-7sewqvmw6468
    statement: A response set on kernel.request skips controller resolution, the call and kernel.view.
    sources:
      - https://raw.githubusercontent.com/symfony/symfony/8.0/src/Symfony/Component/HttpKernel/HttpKernel.php
    behavior_check: http-kernel.request-short-circuit
    content: [CRS-mpwjc4g3vmj7]
    forbidden: []
