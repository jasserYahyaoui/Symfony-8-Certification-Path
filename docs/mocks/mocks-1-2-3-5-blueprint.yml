- id: mock-5
  name: Mock 5 — Weakness-based
  purpose: Generated from demonstrated weak outcomes in this learner's local data. Never the same selection
    for two learners.
  eligible_filter:
    pool_in:
    - VALIDATION
    - LEARNING
    excludes: HOLDOUT
  eligible_questions: 469
  weakness_evidence:
  - questions answered incorrectly, most recent first
  - official topics with the lowest success ratio
  - atomic official items answered incorrectly at least once
  - learning outcomes attached to those items
  - 'exam skill answered worst: DISTINGUISH, APPLY or DIAGNOSE'
  - performance on English questions specifically
  - 'questions whose answer took markedly longer than their estimated time — NOT_IMPLEMENTED:
    a stored attempt carries no per-question elapsed time, so this cannot be computed from the
    history that exists. Recorded rather than shipped as an always-empty signal; implementing it
    means recording elapsed time per answer first, which only helps attempts made after that change.'
  - 'recency: a success long ago counts for less than a recent failure'
  selection_method: 'Rank atomic items by a weakness score built from the evidence above, then take one
    unseen-in-this-sitting question per item, strongest weakness first, until the count is reached. No
    topic quota: the point is the learner''s weakness, not coverage.'
  question_count: variable, 10 minimum and 40 maximum
  question_count_rule: 'Bounded by the evidence, not by a target: at most one question per weak atomic
    item, so a learner with few recorded failures gets a short mock. Below 10 eligible weak items the
    fallback applies. The 40 ceiling mirrors Mock 1, the shortest fixed mock, so a weakness sitting never
    outgrows a full one.'
  duration_minutes: 'computed at generation: ceil(sum of estimated_time_seconds * 1.15 / 60)'
  fallback:
    name: INSUFFICIENT_EVIDENCE_FALLBACK
    trigger: fewer than 10 atomic items carry a recorded failure
    behaviour: Does not run and does not pretend to be weakness-based. It says so, and proposes completing
      Practice Mode, Exam Mode or another mock first so that evidence exists.
    forbidden: Never invent a weakness profile, and never pad the selection with questions the learner
      has not failed.
  scoring_policy: all-or-nothing, INTERNAL_TRAINING_FORMAT
  label: INTERNAL_TRAINING_FORMAT
reporting_after_every_mock:
- score under the declared internal policy
- total time
- unanswered questions
- incorrect questions
- weak official topics
- weak atomic official items
- learning outcomes to revise
- targeted next actions
- readiness evidence demonstrated, and what it does not establish
