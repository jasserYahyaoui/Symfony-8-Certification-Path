# Mocks 1, 2, 3 and 5 — internal blueprint (Master Plan §10).
#
# §10 defines the ROLE of each mock. It fixes a question count and a duration
# for Mock 4 only. Everything numeric below is this project's decision, derived
# from the measured bank and labelled INTERNAL_TRAINING_FORMAT; the topic
# spreads are TRAINING_DISTRIBUTION. None of it is official, and none of it is
# derived from Mock 4.
#
# Mocks 1, 2, 3 and 5 are implemented from this file and deployed. Every
# derived figure below is recomputed from the bank whenever the bank changes,
# and MocksBlueprintTest re-derives each one rather than trusting it.

schema_version: 1
source: SYMFONY-8-CERTIFICATION-MASTER-PLAN-V2.md — §10, recorded in docs/policy/mock-blueprint-policy.md
status: IMPLEMENTED — mocks 1, 2, 3 and 5 are built from this file and deployed
format_label: INTERNAL_TRAINING_FORMAT
distribution_label: TRAINING_DISTRIBUTION
not_official: §10 fixes a question count and a duration for Mock 4 only. Every count, duration and topic
  spread below is this project's decision, derived from the measured bank, and is never an official constraint.
  §10 defines the role of each mock and nothing else.
count_rule: count = min(floor(eligible * 2/3), floor(3600 / (mean_estimated_seconds * 1.15))). The first
  cap leaves at least a third of the eligible questions unused so two consecutive sittings differ; the
  second keeps a sitting under an hour, which is what distinguishes these from the 90-minute Mock 4. duration
  = ceil(count * mean_estimated_seconds * 1.15 / 60), the 15% being the margin over estimated reading
  time. No number is chosen for being round.
cross_mock_rules:
  holdout_use: NEVER. HOLDOUT is Mock 4's entirely (ADR-0005 Option A), so none of these mocks is unseen.
  duplicate_prevention: One question per atomic official item per sitting, and no question twice in a
    sitting.
  topic_coverage: Every official topic present at least once in every sitting.
  answers_revealed: after submission only
  mastery: never inferred from a single correct answer
  persistence: localStorage, as Practice, Exam and Mock 4 already do; no account and no network call.
