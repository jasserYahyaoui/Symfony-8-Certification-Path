# Mock 4 blueprint (Master Plan §10). Generated as Lot 27 Mock 4 Unit A.
#
# TRAINING_DISTRIBUTION. The exam publishes no topic weighting and this file
# infers none: slots follow each topic's share of the 163 atomic official
# items. Never present it as the official distribution (§7.4, §10).
#
# Unit B has written the 48 questions this blueprint asks for, one per free
# atomic item, so the mock's 75 questions all exist. The figures below stay as
# Unit A derived them: they are the specification the 48 were written against,
# not a running tally. `eligible_unused_items` in particular counts what was
# free when the blueprint was drawn.

schema_version: 1
mock: Mock 4 — official-format simulation
status: FILLED — the 48 questions exist (Unit B); Mock 4 itself is not implemented yet (Unit C)
distribution_label: TRAINING_DISTRIBUTION
official_constraints:
  questions: 75
  minutes: 90
  language: en
  symfony: '8.0'
  answers_revealed: after submission only
derivation: 'Slots are proportional to each topic''s share of the 163 atomic official items, allocated
  by largest remainder, then lifted so no topic falls below the minimum. The exam publishes no topic weighting
  and none is inferred: this is a TRAINING_DISTRIBUTION and must never be presented as official (§7.4,
  §10).'
rules:
  minimum_per_topic: 2
  max_questions_per_atomic_item: 1
  miscellaneous_required: true
  pool: HOLDOUT
  unique_ids: true
  language: en
difficulty_target:
  easy: 5
  medium: 40
  hard: 30
  derivation: Mirrors the corpus shape (easy 6.0%, medium 53.2%, hard 40.7% over 496 questions), because
    that shape is itself an outcome of writing each item to its own need rather than to a curve. The existing
    27 are all hard, so the 48 new ones supply 5 easy, 40 medium and 3 hard.
answer_mode_target:
  multiple_minimum: 8
  derivation: The corpus holds 9 multiple-answer questions in 496 (1.8%) and the existing 27 hold none,
    so a mock drawn only from them would never exercise multi-select. 8 is the minimum that makes the
    mechanic appear more than once in a sitting. Not an official ratio.
