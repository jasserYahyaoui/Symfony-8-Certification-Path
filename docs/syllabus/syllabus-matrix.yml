    chapter: null
    classification: OFFICIAL
    content_level: MINIMAL
    content_level_justification: >-
      Vu comme item d'architecture, le composant se réduit à trois faits : il remplace les
      superglobales par des objets fabricables, il est autonome et c'est le framework qui en dépend,
      et il fournit RequestStack. Le modèle des sacs et la contrainte de InputBag::get() sont déjà
      traités par l'item HTTP request du lot 02, et l'usage de Request et Response dans un contrôleur
      appartient au lot 04 ; les reprendre ici serait de la duplication.
    learning_outcomes:
      - id: OUT-m2fxjk4j2mc1
