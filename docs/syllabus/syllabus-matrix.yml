    official_item: "Runtime"
    official_wording: "Runtime"
    learning_domain: symfony
    lot: lot-25
    chapter: null
    classification: OFFICIAL
    content_level: STANDARD
    content_level_justification: >-
      Le raisonnement porte sur une inversion : le fichier d'entrée retourne une fonction au lieu
      d'exécuter l'application, et le runtime réexécute ce script, ce qui interdit tout effet de bord.
      S'y ajoute une résolution d'arguments sensible au nom autant qu'au type. Le nombre de runtimes
      disponibles n'est pas de la complexité, et écrire son propre runtime est hors périmètre utile.
    learning_outcomes:
      - Expliquer pourquoi le fichier d'entrée retourne une fonction plutôt que d'exécuter l'application
      - Connaître la séquence d'amorçage et savoir que le script d'entrée y est réexécuté
      - En déduire l'interdiction de tout effet de bord dans ce script
      - Savoir que la résolution des arguments dépend du type et du nom de la variable
      - Sélectionner un runtime par variable d'environnement ou par la configuration de Composer
    required_assessment_modes:
      - "QUESTION"
      - "FLASHCARD"
    minimum_evidence: >-
      Niveau STANDARD : 2 questions uniques minimum couvrant la distinction ET l'application, réussies
      dont au moins une en mode examen.
