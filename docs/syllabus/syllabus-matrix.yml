  - id: OIT-vt0p9cacpkpd
    official_topic_order: 1
    official_topic: "PHP"
    official_item_order: 4
    official_item: "Interfaces"
    official_wording: "Interfaces"
    learning_domain: php
    lot: lot-01
    chapter: null
    classification: OFFICIAL
    content_level: STANDARD
    content_level_justification: >-
      Concept important exigeant distinction et application : deux règles de PHP 8.4 déplacent l'item hors de la simple reconnaissance. Une constante d'interface est surchargeable depuis 8.1, sauf si elle est déclarée final, et l'ancienne règle contraire reste la réponse instinctive ; et depuis 8.4 une interface déclare des propriétés en précisant get, set ou les deux, ce qui demande de décider quel membre de classe satisfait la déclaration — une propriété readonly n'y suffit pas. La comparaison avec les classes abstraites appartient toujours à l'item Abstract classes, qui en est le propriétaire.
    learning_outcomes:
      - id: OUT-6tzwvmfwj408
        outcome: "Identifier ce qu'une interface peut déclarer et ce qu'elle ne peut pas"
      - id: OUT-5vqwe44nsee5
        outcome: "Énoncer les règles d'implémentation et d'extension multiples"
      - id: OUT-7vt306wrfkb7
        outcome: "Décider si une constante d'interface peut être surchargée par la classe qui l'implémente"
      - id: OUT-ynfsf3qdn2mj
        outcome: "Choisir le membre de classe qui satisfait une propriété d'interface déclarée get et set"
    required_assessment_modes:
      - "QUESTION"
      - "EXAM"
    minimum_evidence: >-
      Niveau STANDARD : 2 questions uniques minimum couvrant la distinction ET l'application, réussies sur 2 sessions distinctes, dont une en mode examen.
