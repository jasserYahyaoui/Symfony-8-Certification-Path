  - id: OIT-s3jh7wg5km19
    official_topic_order: 10
    official_topic: "Security"
    official_item_order: 11
    official_item: "Authenticators, Passports and Badges"
    official_wording: "Authenticators, Passports and Badges"
    learning_domain: symfony
    lot: lot-10
    chapter: null
    classification: OFFICIAL
    content_level: DEEP
    content_level_justification: >-
      Concept structurel et frequemment confondu : trois abstractions distinctes (authenticator, passport, badge) dont les roles sont regulierement intervertis, un contrat d'interface a cinq methodes, un choix binaire Passport/SelfValidatingPassport impose par la signature du constructeur, et des badges dont l'effet depend de la configuration du firewall. La capacite DIAGNOSE est requise : reconnaitre la definition ne suffit pas a corriger un flux d'authentification defaillant.
    learning_outcomes:
