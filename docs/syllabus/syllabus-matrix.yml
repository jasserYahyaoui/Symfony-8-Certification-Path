  - id: OIT-7801mj6w73ky
    official_topic_order: 2
    official_topic: "HTTP"
    official_item_order: 1
    official_item: "HTTP Specification (RFC 9110)"
    official_wording: "HTTP Specification (RFC 9110)"
    learning_domain: http
    lot: lot-02
    chapter: null
    classification: OFFICIAL
    content_level: MINIMAL
    content_level_justification: >-
      Item factuel et de reconnaissance : il s'agit de situer RFC 9110 dans la famille 911x et de fixer le vocabulaire ressource / représentation. Un tableau et quatre définitions suffisent ; les mécanismes eux-mêmes appartiennent aux items dédiés.
    learning_outcomes:
      - "Situer RFC 9110 parmi 9111, 9112, 9113 et 9114"
      - "Énoncer que la sémantique est indépendante de la version de transport"
      - "Distinguer ressource et représentation"
