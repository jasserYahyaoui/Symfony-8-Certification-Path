# on 2026-08-31 (§3.1). `official_wording` is the exact syllabus text; changing
# it is a syllabus refresh, not a content edit, and CI rule SYL-002 enforces
# that once docs/syllabus/wording.lock.yml exists.
#
# INCOMPLETE. The supplied text began mid-item ("resolvers"), so the topics
# preceding Routing are absent. `syllabus_complete: false` makes the coverage
# engine refuse to publish a percentage: a figure computed against a partial
# denominator would overstate readiness precisely because it would look right.
#
# official_topic_order starts at 5, leaving 1-4 free for the missing head so
# that completing the import does not renumber what is already here.
#
# Pedagogical fields (content_level, learning_outcomes, minimum_evidence) are
# absent by design: these items are NOT_STARTED and have not been researched.
# Rule PED-001 requires them from SPECIFIED onward. See
# docs/policy/matrix-field-guide.md.

