    official_topic_order: 5
    official_topic: "Routing"
    official_item_order: 2
    official_item: "Configuration (YAML and PHP attributes)"
    official_wording: "Configuration (YAML and PHP attributes)"
    learning_domain: symfony
    lot: lot-05
    chapter: null
    classification: OFFICIAL
    content_level: STANDARD
    content_level_justification: >-
      Concept important exigeant une distinction et une application : les deux formats sont equivalents en capacite mais divergent sur la maitrise de l'ordre d'evaluation, source d'erreur reelle. Une comparaison et un exemple cible sont necessaires ; un traitement DEEP ne serait pas justifie car le flux interne du routeur n'est pas examinable ici.
    learning_outcomes:
