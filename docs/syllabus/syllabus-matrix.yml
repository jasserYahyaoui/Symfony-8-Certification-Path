#
# `official_wording` is the exact syllabus text. Line wraps introduced by the
# PDF layout are rejoined; f-ligature glyphs (fi, fl, ffi) produced by the PDF
# fonts are normalised back to plain letters. Nothing else is altered: no item
# is reworded, merged, split, renamed or reordered.
#
# COMPLETE. All 14 enumerated official topics and all 163 atomic items are
# present, so `syllabus_complete: true` and the coverage engine may publish a
# percentage.
#
# Note on the topic count: the exam page advertises "15 topics" while
# enumerating 14 topic headings. The most likely reading is that "Components:",
# nested under Miscellaneous, is counted as a topic of its own. Coverage is
# computed from ITEMS, not topics, so this does not affect any figure; it is
# recorded in official-syllabus.md rather than silently resolved.
#
# `lot` is a DELIVERY grouping (Master Plan §14), not a syllabus dimension.
# Topics 1-13 map one-to-one onto lots 01-13; the Miscellaneous topic is split
# across lots 14-26. See docs/adr/0004-lot-numbering.md.

