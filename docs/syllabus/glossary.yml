      Une énumération *backed* porte une valeur scalaire ; une énumération pure
      n'en a pas.
    see: Enums
  - en: Late static binding
    fr: résolution statique tardive
    topic: PHP
    note: >-
      `self` désigne la classe où le code est écrit, `static` celle qui a
      réellement appelé. C'est l'erreur silencieuse classique.
    see: Object Oriented Programming
