  # ---------------- PHP ----------------
  - en: Attribute
    fr: attribut
    topic: PHP
    note: >-
      En PHP 8, un *attribute* est la syntaxe `#[...]`. Le mot anglais
      *annotation* désigne l'ancien mécanisme en commentaire, retiré : les deux
      ne sont pas synonymes à l'examen.
