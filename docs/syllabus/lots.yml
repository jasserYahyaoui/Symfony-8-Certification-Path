# Delivery lots and their display names (Master Plan §14).
#
# The single canonical source for how a lot is NAMED. It carries no scope: the
# denominator is `syllabus-matrix.yml`, whose `lot` field assigns each atomic
# official item to one of these ids.
#
# `display_name` is what a learner sees in the navigation, rendered as
# "NN — Display Name". The number is the **recommended revision order** and
# nothing else: it is not an exam weighting, not a difficulty, and not an
# official priority. The official syllabus publishes no order.
#
# `lot` and `official_topic` are different dimensions (ADR-0004). They coincide
# for topics 1–13; Miscellaneous is one official topic spread over lots 14–26,
# which is why several display names here have no topic of the same name.
#
# The word "Lot" stays in reports and governance pages, where a lot really is a
# unit of delivery. It is not shown to a learner.

