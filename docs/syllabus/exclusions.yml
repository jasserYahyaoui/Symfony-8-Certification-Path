# Official and policy exclusions.
#
# Source: the official syllabus section "The following is a list of the topics
# not included in the exam", imported verbatim on 2026-08-31, cross-checked
# against Master Plan §1.5 "Prohibited expansion". The two agree; where the
# official list is broader, the official list governs.
# An excluded term may appear only in a clearly labelled explanation of an
# exclusion or comparison, and must never be required to earn points. The
# CI rule SCOPE-001 enforces this: a scored question containing one of the
# `match_terms` below fails unless it carries the `exclusion-note` tag.
#
# `match_terms` are matched case-insensitively as substrings against question
# prompts, choices and explanations.

schema_version: 1

excluded_topics:
  - id: EXC-UX
    label: Symfony UX
    reason: "Master Plan §1.5 — not part of the examinable scope."
    match_terms: ["symfony ux", "stimulus", "turbo"]

  - id: EXC-AI
    label: Symfony AI
    reason: "Master Plan §1.5."
    match_terms: ["symfony ai"]

  - id: EXC-DOCTRINE
    label: Doctrine and databases
    reason: "Master Plan §1.5 — Doctrine and database topics are excluded."
    match_terms: ["doctrine", "entitymanager", "dbal"]

  - id: EXC-MONOLOG
    label: Monolog
    reason: "Master Plan §1.5."
    match_terms: ["monolog"]

  - id: EXC-ASSETS
    label: AssetMapper and Webpack Encore
    reason: "Master Plan §1.5."
    match_terms: ["assetmapper", "asset mapper", "webpack encore", "encore"]

  - id: EXC-POLYFILL
    label: PHP Polyfills
    reason: "Master Plan §1.5."
    match_terms: ["polyfill"]

  - id: EXC-PHPUNIT-BRIDGE
    label: PHPUnit Bridge
    reason: "Master Plan §1.5 and §14 Lot 13 — explicitly excluded."
    match_terms: ["phpunit bridge", "phpunit-bridge"]

  - id: EXC-ESI
    label: ESI
    reason: "Master Plan §1.5 and §14 Lot 17 — explicitly excluded."
    match_terms: ["esi", "edge side include"]

  - id: EXC-INTL-ICU
    label: ICU data access utilities from the Intl component
    reason: "Master Plan §1.5 and §14 Lot 16 — ICU data access utilities excluded."
    match_terms: ["icu data", "intl data"]

  - id: EXC-THIRD-PARTY-BRIDGES
    label: Bridges to third-party services
    reason: "Master Plan §1.5; also §14 Lots 11, 22 and 26."
    match_terms: ["third-party bridge", "amazon ses", "sendgrid", "mailgun", "amqp", "rabbitmq"]

  - id: EXC-THIRD-PARTY-BUNDLES
    label: Third-party bundles and projects
    reason: "Official syllabus: \"Third-party bundles and projects\"."
    match_terms: ["easyadmin", "api platform", "api-platform", "sonata"]

  - id: EXC-UNNAMED-COMPONENTS
    label: Symfony components not explicitly named in the syllabus
    reason: >-
      Official syllabus: "Any Symfony component not explicitly mentioned in the
      above list (e.g. String, Uid, TypeInfo, Lock, etc.)". This is an
      allow-list, not a deny-list. Only the examples the syllabus itself names
      are matched here; the general rule is enforced by review, see
      review_only_exclusions below.
    match_terms: ["typeinfo", "symfony\\string", "uid component", "lock component"]

# Scope boundaries that cannot be reduced to a keyword match. These are
# enforced by human review during the Pedagogical Gate (§17), not by CI.
review_only_exclusions:
  - id: EXC-POST-8.0
    label: Features introduced after Symfony 8.0
    reason: "Master Plan §1.5 and §10 — the exam covers Symfony 8.0 only."
    enforcement: "CI rule VER-001 catches source URLs; behavioural claims need human review."

  - id: EXC-POST-TWIG-3.22
    label: Twig features introduced after 3.22
    reason: >-
      Official syllabus: "Twig syntax up to 3.22 version". This settles the
      examinable Twig version, notwithstanding that Symfony 8.0 allows
      ^3.21|^4.0 and the Twig 3.x branch has reached 3.29.
    enforcement: "Human review of Lot 6 content against the Twig 3.22 changelog."

  - id: EXC-UNLISTED-COMPONENTS
    label: Symfony components not explicitly named in the official syllabus
    reason: >-
      Official syllabus: "Any Symfony component not explicitly mentioned in the
      above list". An allow-list: a component is out of scope unless the
      syllabus names it.
    enforcement: >-
      Enforceable now that the import is complete: the set of named components
      is closed, so anything outside `named_components` is out of scope. Still
      applied by review rather than by substring matching, because a component
      name can appear legitimately inside an exclusion note or a comparison.
    named_components:
      - HttpFoundation
      - HttpKernel
      - FrameworkBundle
      - HttpClient
      - Routing
      - TwigBundle
      - Form
      - OptionsResolver
      - Validator
      - DependencyInjection
      - Security Core
      - CSRF
      - PasswordHasher
      - Messenger
      - Console
      - CssSelector
      - DomCrawler
      - WebProfiler bundle
      - DotEnv
      - ExpressionLanguage
      - Cache
      - Clock
      - EventDispatcher
      - Filesystem
      - Finder
      - Event
      - Mailer
      - Mime
      - Process
      - PropertyAccess
      - Runtime
      - Serializer

  - id: EXC-POST-8.0
    label: Features introduced after Symfony 8.0
    reason: "Master Plan §1.5 and §10 — the exam covers Symfony 8.0 only."
    enforcement: "CI rule VER-001 catches source URLs; behavioural claims need human review."

  - id: EXC-POST-TWIG-3.22
