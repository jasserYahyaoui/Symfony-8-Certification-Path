# One entry per paragraph of a course's « Pièges d'examen » section, keyed by
# the course and the SHA-1 of the paragraph (whitespace collapsed): a reworded
# pitfall is unreviewed again. `excerpt` is for the reader and is not checked.
#
# - COVERED, card: the card's question and answer rehearse the trap. A card of
#   another item counts — the trap is what is judged.
# - GAP: no card yet. Reported; CI allows none (--max-gaps 0).
# - NO_CARD, reason: no card is warranted, and why.
#
# First review, 2026-10-24: all 788 pitfalls read against every card of their
# item, and against cards of other items where the trap belongs elsewhere.
# 63 GAPs were found; 62 got a card (`added`), each fact executed on PHP 8.4.19
# or Symfony 8.0.15 or read in the cited source, and one was found unreachable
# in 8.0 (NO_CARD). See README.md in this directory.

