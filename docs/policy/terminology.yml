# Terminology: Symfony, PHP and HTTP terms stay in English in French prose.
#
# Owner decision, 2026-10-14 (verbatim): « utilise le jargon symfony toujours et
# les mots techniques dans toute la doc et ne les traduisent pas en fr. Par exp
# j'attend compiler pass, ou service container ». Asked to settle the edges, the
# owner chose « Request / Response » for requête / réponse, and « tout en
# anglais » for the generic words (argument, option, attribut, valeur par
# défaut). Master Plan §5 already says technical terms remain in English.
#
# One list drives two things:
#   - tools/terminology/apply.py rewrites the French prose (courses, French
#     flashcards, the French fields of the matrix, the « what's new » pages);
#   - tests/Integration/TerminologyTest.php fails when a listed French form is
#     back in that prose, outside code.
#
# Fields:
#   fr       French forms, singular first then plural, lower case.
#   en, en_plural   The English term; capitalised when it is a class name.
#   gender   m | f — the gender French prose gives the English term. Where it
#            differs from the French word's, determiners are rewritten and the
#            sentence is listed for review: an adjective after the noun may
#            still need its agreement fixed by hand.
#   fr_gender   gender of the French word (defaults to gender).
#   elide    true when the English term takes l' / d' (vowel sound).
#   keep     regexes of contexts where the French word is ordinary French, not
#            the technical term; matched against the 40 characters around it.
#   needs_determiner   only replace after a determiner (the word is also an
#            adjective or a verb form).
#
# Not listed on purpose, because the French word is ordinary prose as often as
# a term and no context rule separates the two reliably: entrée, modèle, vue,
# rappel (« Rappel : » is a heading), surcharge, accès, lot (this project's own
# unit), journal. They are handled by hand where they mean the term, or left.
schema_version: 1
