  - id: CVR-h3rq2rq9yzke
    date: '2026-10-13'
    pull_request: 394
    commit: 'fdf4035'
    kind: CORRECTION
    finding: F3
    official_items: [OIT-7sewqvmw6468]
    facts: [http-kernel.response-controller-skips-view, http-kernel.view-only-for-non-response, http-kernel.unconverted-view-throws, http-kernel.request-short-circuit]
    title: "HttpKernel : kernel.view n'est pas une étape de chaque request"
    was: >-
      « request → controller → controller_arguments → view → response → finish_request → terminate. »
      (flashcard et points clés, sans condition sur view ni sur terminate)
    now: >-
      `kernel.view` n'est dispatché que si le controller ne rend pas une `Response` ; si aucun listener ne la
      produit, `ControllerDoesNotReturnResponseException`. Une `Response` posée sur `kernel.request` saute
      controller et view. `kernel.terminate` suit l'appel séparé à `terminate()`.
    courses:
      - id: CRS-mpwjc4g3vmj7
        sections: ["Points clés"]
    flashcards: [FLC-jjsdae8j3b56]
    questions: []

