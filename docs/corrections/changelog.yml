    commit: '69d3b7c'
    kind: CORRECTION
    finding: ADR-0012
    official_items: [OIT-h2n7d7dbr56p]
    facts: []
    title: "Factories : le container n'appelle pas le constructor, la factory peut le faire"
    was: >-
      « Avec une factory, le constructor du service n'est pas appelé du tout » — dans la page, deux
      flashcards, trois explications de questions et une question de compréhension qui demandait si
      `Cls::__construct()` est appelé, réponse « No ».
    now: >-
      Le container n'appelle pas le constructor lui-même : il appelle la factory avec `arguments`. Une
      factory qui fait `new self(…)` appelle le constructor, avec les valeurs qu'elle choisit. Exécuté :
      `create('fabien')` est appelé, puis `__construct('factory:fabien')`. La question de compréhension est
      réécrite (« quel appel fait le container ? ») et passe en version 2.
    courses:
      - id: CRS-1bkg7pkf78c7
        sections: ["Les arguments vont à la factory", "Pièges d'examen"]
    flashcards: [FLC-j8n3qsftrmm5, FLC-znaqp8qejrk9, FLC-qbmadhqw0wqp]
