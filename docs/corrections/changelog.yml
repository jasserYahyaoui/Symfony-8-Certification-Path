# Journal des corrections pédagogiques (remédiation P3.3).
#
# One entry per correction or extension of what the site teaches, linking the
# courses, flashcards and questions that carry it. It is published as the page
# « Journal des corrections », so a learner who studied before a date knows what
# to read again — and why their earlier answers to a question no longer count
# once its version has moved.
#
# - kind: CORRECTION — something taught was false or misleading;
#         SCOPE      — an unsourced restriction on what is examinable was lifted;
#         EXTENSION  — content added; nothing taught before was false.
# - was: the former wording, quoted as it stood (CORRECTION and SCOPE only). It
#        is a quotation, so the terminology tool leaves it alone.
# - commit / pull_request / date: the squash commit on master that shipped it.
# - courses[].sections: headings as they stand TODAY, so the page can link to
#        them; CorrectionsChangelogTest fails if one no longer exists.
# - questions: never a HOLDOUT question — the page would publish it.
# - reversioned: the listed questions whose version this commit raised — a
#        learner's answers to the earlier version stop counting. derive.py
#        --check holds it equal to what the commit did.
#
# The id lists are not written from memory: `python3 tools/corrections/derive.py
# <commit>` reports what each commit changed, and `derive.py --check` (run in
# CI) fails if an entry names an id its commit did not change, a question whose
# correct answer changed without a new version, or a date or pull request that
# does not match the commit.
schema_version: 1
