    facts: [http-foundation.language-tail-dropped]
    title: "Language detection : ce qui suit la région est supprimé, pas conservé"
    was: >-
      « La grammaire reconnue est `2 ou 3 lettres` pour la langue, puis **4 lettres** optionnelles pour
      l'écriture, puis **2 lettres** optionnelles pour la région. Une valeur qui n'entre pas dans ce moule —
      ou le `*` … — ressort en minuscules, inchangée. »
    now: >-
      Après la langue, l'écriture et la région, le reste est **supprimé** : `de-DE-1996` donne `de_DE`,
      `es-419` donne `es`, `zh-Hant-TW-x-private` donne `zh_Hant_TW`, et le préfixe `i-` est retiré
      (`i-cherokee` donne `cherokee`). Seule une valeur dont le début n'entre pas dans le moule — `x-klingon`,
      `*` — ressort inchangée. Exécuté avec HttpFoundation 8.0.15.
    courses:
