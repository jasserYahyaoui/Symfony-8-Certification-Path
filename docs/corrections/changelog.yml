      questions et une Fiche express. La Console dispatche des events autour de chaque command — **avant** (`COMMAND`), **en
      cas d''erreur** (`ERROR`), **après** (`TERMINATE`), **à un signal** (`SIGNAL`) — mais seulement si l''`Application` a
      un dispatcher. `TERMINATE` est toujours atteint, et l''exit code final est celui qu''il porte.'
