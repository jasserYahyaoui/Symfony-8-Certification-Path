    title: 'Input and Output objects : le libellé de `SymfonyStyle::ask()` reste dans `getDisplay()`'
    was: « Avec `capture_stderr_separately`, ce qu'écrit `getErrorStyle()`, et le libellé d'une question, passent dans `getErrorOutput()`
