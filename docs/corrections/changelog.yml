  - id: CVR-0g4ba0b7hkkh
    date: '2026-10-13'
    pull_request: 394
    commit: 'fdf4035'
    kind: CORRECTION
    finding: F2
    official_items: [OIT-78k7kbfpgfxt]
    facts: [cache.callback-runs-on-hit-with-beta-inf, cache.beta-zero-serves-hit, cache.save-false-not-stored, cache.pools-isolated-by-namespace]
    title: "Cache : le callback de get() ne s'exécute pas qu'en cas de miss"
    was: >-
      « Le second argument est un appelable exécuté seulement en cas de manque. En cas de succès, il n'est
      pas appelé du tout » ; « Les clés de deux pools ne se heurtent jamais. » La page affirmait aussi qu'avec
      INF le rappel tourne sur une clé présente : elle se contredisait.
    now: >-
      Le callback s'exécute quand l'item n'est pas un hit **ou** quand `beta` vaut `INF` ; le recalcul anticipé
      probabiliste peut aussi l'élire avant l'expiration. `beta = 0` désactive ce recalcul, pas le cache.
      `$save = false` rend la valeur sans la stocker. Deux pools ne partagent pas leurs keys grâce au
      namespace, qui les préfixe ; même namespace et même directory, ils se partagent une key.
    courses:
      - id: CRS-p6yhxmpxrzbs
        sections: ["Quatre mots", "L'API qui surprend", "La ruée sur le cache", "Pièges d'examen", "Points clés"]
    flashcards: [FLC-5ph49r9vszd1]
