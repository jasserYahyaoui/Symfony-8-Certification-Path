    official_items: [OIT-fr58jzaj6jtb]
    facts: [serializer.normalized-form-not-always-array, serializer.decode-follows-format]
    title: "Serializer : la forme normalisée n'est pas toujours un array"
    was: >-
      « Les données passent toujours par un tableau, dans les deux sens. » — et la flashcard « Que
      traverse toujours une donnée entre l'objet et le format ? — Un tableau. »
    now: >-
      `normalize()` peut rendre un array, une string, un scalaire, un `ArrayObject` ou `null` :
      `ObjectNormalizer` donne un array pour un object ordinaire, `DateTimeNormalizer` une string RFC 3339,
      `BackedEnumNormalizer` la valeur de l'enum. Au décodage, le format décide : un object JSON devient un
      array, une string JSON une string.
    courses:
