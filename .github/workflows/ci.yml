name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Technical gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # tools/corrections/derive.py reads the commits the corrections
          # journal cites, and the push's own range.
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          # Symfony 8.0 requires PHP >= 8.4 (symfony/symfony@8.0 composer.json).
          php-version: '8.4'
          # pcntl and posix: tools/behavior executes console signal handling, and
          # its checks fail rather than skip without them.
          extensions: json, mbstring, iconv, pcntl, posix
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Lint PHP sources
        run: find src bin tests -type f \( -name '*.php' -o -name 'cert' \) -print0 | xargs -0 -n1 php -l

      - name: Lint YAML
        run: vendor/bin/yaml-lint docs/syllabus docs/corrections content --parse-tags

      # A workflow whose YAML parses can still carry a `run:` script that the
      # shell refuses. That is not hypothetical: on 2026-09-23 a merge conflict
      # resolution in pages.yml swallowed the `fi` closing an `if`, the YAML
      # stayed valid, CI stayed green, the site deployed — and the production
      # smoke test died with `syntax error: unexpected end of file` without
      # checking a single page. The deployment was live and unverified, which is
      # the one state this project refuses to be in.
      #
      # `bash -n` parses without executing, so this costs milliseconds and
      # catches the whole class before merge rather than after deploy.
      - name: Workflow shell scripts parse
        run: |
          set -o pipefail
          python3 - <<'PY'
          import glob, io, os, yaml

          os.makedirs('/tmp/wf', exist_ok=True)
          n = 0
          for path in sorted(glob.glob('.github/workflows/*.yml')):
              doc = yaml.safe_load(io.open(path, encoding='utf-8'))
              for job_name, job in (doc.get('jobs') or {}).items():
                  for i, step in enumerate(job.get('steps') or []):
                      if 'run' not in step:
                          continue
                      safe = '%s_%s_%d' % (os.path.basename(path), job_name, i)
                      safe = ''.join(c if c.isalnum() else '_' for c in safe)
                      io.open('/tmp/wf/%s.sh' % safe, 'w', encoding='utf-8').write(step['run'])
                      n += 1
          print('extracted %d run steps' % n)
          PY
          fail=0
          for f in /tmp/wf/*.sh; do
            if ! bash -n "$f" 2>/tmp/wf-err; then
              echo "::error::Workflow shell script does not parse: $f"
              cat /tmp/wf-err
              fail=1
            fi
          done
          exit $fail

      # Master Plan §12. CI fails on mandatory-rule violations, and §12 also
      # states: "Never weaken tests merely to obtain a green build."
      - name: Content rules
        run: php bin/cert validate

      - name: Unit and integration tests
        run: vendor/bin/phpunit

      # The claims the course teaches, executed against the exam versions.
      # tools/behavior pins Symfony 8.0.*; the generator above runs 7.4, which
      # is not what the exam asks about. CentralFactsTest (in the suite above)
      # checks that the content still states each fact and not its correction's
      # predecessor; this step checks that Symfony 8.0 still behaves that way.
      - name: Taught behaviour holds on Symfony 8.0
        run: |
          composer install --working-dir=tools/behavior --prefer-dist --no-interaction --no-progress
          php tools/behavior/run.php

      # Owner decision of 2026-10-14: Symfony, PHP and HTTP terms stay in
      # English in French prose (listener, compiler pass, service container).
      # docs/policy/terminology.yml lists them; --check fails if a listed French
      # form is back, and running the script without --check is the fix.
      - name: Technical terms stay in English
        run: python3 tools/terminology/apply.py --check

      - name: Revision plan is deterministic and up to date
        run: |
          set -o pipefail
          python3 tools/revision/build_roadmap.py \
            --start 2026-10-01 --exam 2026-12-29 \
            --max-new 4 --weekday 160 --weekend 220
          python3 tools/revision/render_calendar.py
          git diff --exit-code docs/revision/plan.json docs/revision/study-calendar.md

      - name: Coverage report is up to date
        run: |
          php bin/cert coverage
          git diff --exit-code docs/syllabus/coverage-report.md

      - name: Readiness dashboard is not stale
        run: |
          php bin/cert readiness
          git diff --exit-code docs/progress/certification-readiness.md

      # The fourteen audit scripts existed since Lot 27 and none of them ran on
      # a push: they were one-shot investigations, re-run by hand or not at all.
      # The concrete uncovered risk is this project's own history — five checks
      # were found to be vacuous, and the proof that guards against a sixth was
      # itself never re-run. AUD-02 is the other one that matters on every
      # push: a 7.x reference leaking into an 8.0 corpus is an exam-correctness
      # defect no rule catches.
      #
      # Measured runtimes on 2026-09-09, total ~75 s. Two are deliberately NOT
      # here. prove_audits_fail.py takes about five minutes and mutates
      # canonical files, which belongs in a release check. AUD-01 reads the
      # owner-supplied syllabus PDF from an absolute path outside the
      # repository; wiring it here is what proved it cannot run in a clean
      # checkout at all — see docs/audit/post-traps/README.md, F-4.
      - name: Content audits
        run: |
          set -o pipefail
          fail=0
          for a in aud02_version_contamination \
                   aud04_content_volume aud05_question_bank aud06_holdout_integrity \
                   aud07_english_readiness aud08_technical_production \
                   aud09_course_sections aud10_answer_length_bias \
                   semantic_repetition \
                   lot01_second_audit fr2_second_audit; do
            echo "::group::$a"
            python3 "tools/audit/$a.py" || fail=1
            echo "::endgroup::"
          done
          echo "::group::aud03_source_anchor --offline"
          python3 tools/audit/aud03_source_anchor.py --offline || fail=1
          echo "::endgroup::"
          # Every « Pièges d'examen » paragraph has a reviewed verdict, and none
          # is a GAP: a trap is rehearsed by a flashcard, or says why not.
          echo "::group::pitfall_flashcards --max-gaps 0"
          python3 tools/audit/pitfall_flashcards.py --max-gaps 0 || fail=1
          echo "::endgroup::"
          exit $fail

      # A rule that has only ever been silent has not been shown to be capable
      # of speaking. These two inject a defect and assert the check fires.
      - name: Checks are not vacuous
        run: |
          set -o pipefail
          python3 tools/audit/prove_framework_rules_fail.py
          python3 tools/audit/prove_flashcard_coverage_fails.py
          python3 tools/audit/aud10_answer_length_bias.py --prove
          # Four of the Lot 27 classifications return zero on the real corpus,
          # which is the shape every vacuous check in this project had. ~3 s.
          python3 tools/audit/lot27_practice_audit.py --prove
          # Remediation P3.1: the semantic-repetition audit fires on an
          # unreviewed pair, an open REPEAT and a review older than its question.
          python3 tools/audit/semantic_repetition.py --prove
          # The pitfall audit refuses an unreviewed, stale or reworded pitfall,
          # an unknown card, a bare NO_CARD and a GAP over the ceiling.
          python3 tools/audit/pitfall_flashcards.py --prove
          # The independent reviewer's sample (docs/review/): never a HOLDOUT
          # question, and the refusal names none.
          python3 tools/review/draw_sample.py --prove
          # The reviewer's attachable pack: the HOLDOUT file, a HOLDOUT question
          # in a mixed bank file and a HOLDOUT id quoted anywhere are refused.
          python3 tools/review/build_pack.py --prove

      # Remediation P3.3. docs/corrections/changelog.yml names, for each
      # correction, the courses, cards and questions that carry it: --check
      # re-derives every list from the commit it cites. --versions is the guard
      # for this push: a question whose prompt or key changed must get a new
      # version, or a learner's earlier answers keep counting for a question
      # that is no longer the same. --prove injects one defect per rule.
      - name: Corrections journal matches its commits; a rewritten question gets a new version
        run: |
          set -o pipefail
          python3 tools/corrections/derive.py --check
          python3 tools/corrections/derive.py --prove
          if [ "${{ github.event_name }}" = pull_request ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          python3 tools/corrections/derive.py --versions "$base"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install site dependencies
        run: npm --prefix website ci

      - name: Generate the documentation tree from canonical data
        run: php bin/cert build

      # /examens: what the menu recommends, and that a drawn exam keeps the
      # official count, the topic spread, one question per item, unseen first.
      # Reads the exams.json the step above just wrote.
      - name: The mock-exam menu recommends and draws as stated
        run: node website/tools/verify-exams.mjs

      - name: The revision pages reach the published site
        run: |
          for page in roadmap calendar checkpoints readiness; do
            test -s "website/docs/revision/$page.md" \
              || { echo "missing website/docs/revision/$page.md"; exit 1; }
          done

          # The agenda page is a shell that fetches this payload. Without the
          # file it renders an error banner, and every gate above would still
          # be green -- the generator step is the only thing that produces it.
          test -s website/static/data/revision-calendar.json \
            || { echo "missing website/static/data/revision-calendar.json"; exit 1; }

          python3 - <<'PY'
          import json, sys

          plan = json.load(open('website/static/data/revision-calendar.json'))
          events = sum(len(d['events']) for d in plan['days'].values())

          if len(plan['days']) < 60 or events < 300:
              print(f'agenda payload too small: {len(plan["days"])} days, {events} events')
              sys.exit(1)

          print(f'agenda payload: {len(plan["days"])} days, {events} events')
          PY

      - name: Type-check the site
        run: npm --prefix website run typecheck

      # The agenda replans in the browser, which means the scheduler exists
      # twice: in Python and in TypeScript. Two implementations of one
      # algorithm drift, so keeping both is only defensible while this holds —
      # the port must reproduce the published plan exactly, day by day and slot
      # by slot. The day it does not, the build stops.
      - name: The browser scheduler agrees with build_roadmap.py
        run: node website/tools/verify-reschedule.mjs

      # Remediation P2.3: the flashcard scheduler exists twice too, in PHP
      # (src/Review, the specified reference) and in TypeScript (the page). The
      # port replays every sequence of up to six outcomes through both.
      - name: The browser flashcard scheduler agrees with ReviewScheduler.php
        run: node website/tools/verify-review.mjs

      # « Ma progression » shows the learner's own answers by channel. These
      # cases (none, partial, repeated, contradictory, mixed channels) pin what
      # a reader sees, so a change that merges channels or counts a retry as a
      # first answer stops the build.
      - name: Learner-facing figures keep their channels apart
        run: node website/tools/verify-observed.mjs

      # Remediation P3.3: Mock 5 picks weak items from the learner's failures;
      # a failure on an earlier version of a rewritten question is not one.
      - name: Mock 5's weak items ignore answers to an earlier version
        run: node website/tools/verify-weakness.mjs

      # Remediation P3.2: when a lot's comprehension check comes back (7, 14,
      # 28 days after its last answer) and which of its questions come first.
      - name: Delayed checks are scheduled and selected as stated
        run: node website/tools/verify-delayed.mjs

      # Remediation P3.2 (docs/policy/first-exposure.md): the « série inédite »
      # serves only never-answered questions, lot after lot, and the parallel
      # replay never serves the missed question itself.
      - name: First-exposure series serve only unseen questions
        run: node website/tools/verify-exposure.mjs

      # `onBrokenLinks: 'throw'` makes this the site-level counterpart of the
      # LNK-001 content rule: a dead link fails the build instead of shipping.
      - name: Build the documentation site
        run: npm --prefix website run build

      # Accessibility gate (§13, §17). Audits the built artefact with axe-core
      # against WCAG 2.1 AA, plus structural checks axe cannot make (single h1,
      # no heading-level skips, focus affordance on every control).
      - name: Install Chromium for the accessibility audit
        run: npx --prefix website playwright install --with-deps chromium

      # Compiling and passing the audit say the page renders. Neither says a
      # tick survives a reload, a course link resolves, or a new exam date
      # moves anything. Those three are the point of the page, so they are
      # driven in a real browser.
      - name: The agenda actually links, ticks and replans
        run: node website/tools/verify-agenda-ui.mjs

      # Lot 27. The same argument, for the mode a learner spends the most time
      # in: the point of Practice Mode is what appears AFTER an answer, and a
      # rendering audit of the empty question form says nothing about it. Each
      # check here is paired with a proof that it can fail.
      - name: Practice Mode corrects, renders code and reports
        run: node website/tools/verify-practice-ui.mjs

      # The door from a course to its own questions. The accessibility audit
      # walks a fixed list of pages with no query string, so it never sees
      # `/practice?item=…` and never sees the banner that narrowing renders.
      # This is the only check that does.
      - name: A course links to its questions, and the link narrows the series
        run: node website/tools/verify-course-to-questions.mjs

      # A page nothing links to is a page the learner does not have. The five
      # mocks were published, deployed, smoke-tested and a11y-audited for weeks
      # while linked from nowhere: every gate visits them by a hardcoded URL
      # list, and `onBrokenLinks` catches broken links, never missing ones.
      - name: Every published page is reachable by clicking
        run: node website/tools/verify-navigation.mjs

      # The simulations hub is client-rendered: the served HTML carries the
      # shell and the word « Chargement… », so fetching it and grepping for a
      # mock name would find the NAVBAR and report success about a body that
      # never rendered. Only a browser can tell the two apart.
      - name: The simulations hub says what each mock is for
        run: node website/tools/verify-simulations-ui.mjs

      # The correction of a mock (owner, 2026-10-14): right answers shown after
      # submission, and every question missed linking to a course section whose
      # anchor exists in the built page.
      - name: A mock's correction links each miss to its course section
        run: node website/tools/verify-exam-correction.mjs

      # Remediation P2.3: a rating per card, its due day, the card's version,
      # a reset, export and import, a v4 store migrated — and opening a card
      # recording nothing. Driven by keyboard where a learner would use one.
      - name: Flashcard recall is recorded, scheduled and kept apart from a reveal
        run: node website/tools/verify-flashcards-ui.mjs

      # A card front's code span holding a brace is emitted as <code> with
      # character references (the <summary> line is a JSX context): the MDX
      # compiler must render it exactly as the code span.
      - name: A card front's code renders as its code span, with no brace in JSX
        run: node website/tools/verify-summary-code.mjs

      # Remediation P3.2, in the browser: no correction before the reasoning is
      # given, the self-rating recorded and the text not; a delayed check due
      # after 8 days, starting with the missed question, recorded as delayed;
      # a « série inédite » of ten lots that names no item before the answer,
      # and a parallel replay that serves another question on the outcome.
      - name: Reasoning before the correction, delayed checks, first-exposure series
        run: node website/tools/verify-transfer-ui.mjs

      - name: Accessibility audit
        run: npm --prefix website run a11y

      - name: Deployed artefact contains no server-side code
        run: |
          if grep -rIl --include='*.html' --include='*.js' --include='*.json' '<?php' website/build/; then
            echo "::error::PHP found in the static build output"
            exit 1
          fi

      - name: Practice payload carries no holdout question
        run: |
          pool=$(python3 -c 'import json;print(json.load(open("website/build/data/practice.json"))["pool"])')
          if [ "$pool" != "LEARNING" ]; then
            echo "::error::practice payload declares pool $pool"
            exit 1
          fi
