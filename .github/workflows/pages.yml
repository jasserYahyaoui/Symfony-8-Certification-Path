name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deployment in progress; queue behind it instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation site
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: json, mbstring, iconv
          coverage: none
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      # A deployment must never publish content that fails the mandatory rules
      # of Master Plan §12, so the gate runs here rather than trusting CI.
      - name: Content rules
        run: php bin/cert validate

      - name: Generate the documentation tree from canonical data
        run: php bin/cert build

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install site dependencies
        run: npm --prefix website ci

      - name: Build the documentation site
        run: npm --prefix website run build

      # Requires GitHub Pages to be enabled once, with "Source: GitHub Actions",
      # under Settings > Pages. `enablement: true` was tried and rejected: the
      # workflow GITHUB_TOKEN cannot call the create-Pages-site API ("Resource
      # not accessible by integration"), which needs repository admin rights.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke-test:
    name: Production smoke test
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      # The holdout check below compares the deployed payloads against the
      # canonical question banks, so this job needs the repository.
      - uses: actions/checkout@v4
      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml

      # Master Plan §16: "the real production URL passes smoke tests".
      # Never report DEPLOYED from intention alone.
      - name: Check every published page and payload
        env:
          BASE_URL: https://jasseryahyaoui.github.io/Symfony-8-Certification-Path
        run: |
          set -euo pipefail
          fail=0
          # `trailingSlash: false` means the docs index is served at /docs,
          # not /docs/ — the latter is a genuine 404.
          for path in "" "docs" "docs/syllabus/coverage" "docs/syllabus/exclusions" \
                      "docs/syllabus/glossary" "docs/readiness" \
                      "docs/revision/roadmap" "docs/revision/calendar" \
                      "docs/revision/checkpoints" "docs/revision/readiness" \
                      "calendar" \
                      "practice" "exam" "simulations" "mock-4" "mock-1" "mock-2" "mock-3" "mock-5" "progression" \
                      "data/revision-calendar.json" \
                      "data/practice.json" "data/exam.json" "data/coverage.json" \
                      "data/readiness.json" "data/simulations.json" "data/mock-4.json" "data/mock-1.json" "data/mock-2.json" "data/mock-3.json" "data/mock-5.json"; do
            url="$BASE_URL/$path"
            code=$(curl -sL -o /tmp/body -w '%{http_code}' --retry 5 --retry-delay 5 --retry-all-errors "$url")
            if [ "$code" != "200" ]; then
              echo "::error::$url returned HTTP $code"
              fail=1
            else
              echo "ok  $code  $url"
            fi
          done

          # The landing page must actually render, not merely return 200.
          #
          # Fetched to a file rather than piped into grep: under `pipefail`,
          # `curl | grep -q` fails the pipeline on a *successful* match, because
          # grep exits at the first hit and curl dies of SIGPIPE. That produced
          # a false "did not render" the moment the page grew large enough for
          # the race to bite.
          curl -sL -o /tmp/landing "$BASE_URL/"
          grep -q 'Symfony 8 Certification Path' /tmp/landing \
            || { echo "::error::landing page did not render expected content"; fail=1; }

          # The revision calendar, proved against the deployed bytes. A 200 on
          # docs/revision/calendar says a page is served; it says nothing about
          # whether the 76 days are inside it. The page is generated from
          # plan.json by DocsGenerator, so an empty or stale generator step
          # would publish a heading and nothing else -- and that is precisely
          # the failure a learner reports as "I cannot see the calendar".
          #
          # The exam marker is checked too: the generator used to schedule
          # revisions through 09/01/2027, past a 15/12/2026 sitting. If the
          # deployed page ends on the exam day, the truncation reached
          # production; if it names January 2027, it did not.
          curl -sL --retry 5 --retry-delay 5 --retry-all-errors -o /tmp/calendar "$BASE_URL/docs/revision/calendar"
          cal_missing=""
          grep -q '1 octobre 2026' /tmp/calendar || cal_missing="$cal_missing first-day"
          grep -q 'EXAMEN Symfony 8.0' /tmp/calendar || cal_missing="$cal_missing exam-day"
          grep -q 'Mock 4' /tmp/calendar || cal_missing="$cal_missing mock-4-slot"
          # At least 60 day headings must render. The plan has 76 days; a
          # number this far below it means the loop that writes them broke.
          n_days=$(grep -c 'décembre 2026\|novembre 2026\|octobre 2026' /tmp/calendar || true)
          [ "$n_days" -ge 60 ] || cal_missing="$cal_missing only-$n_days-dates"
          if grep -q 'Janvier 2027' /tmp/calendar; then
            cal_missing="$cal_missing not-truncated-at-exam"
          fi
          if [ -n "$cal_missing" ]; then
            echo "::error::the published revision calendar is incomplete:$cal_missing"
            fail=1
          else
            echo "ok  revision  the calendar publishes $n_days dated entries and stops at the exam"
          fi

          # The agenda payload, proved against the deployed bytes. The page is
          # a React shell that fetches this file: a 200 on /calendar proves the
          # shell shipped and nothing about whether it has a plan to draw. An
          # empty or truncated payload renders an agenda with no sessions in
          # it, which looks like a working page.
          curl -sL --retry 5 --retry-delay 5 --retry-all-errors -o /tmp/agenda.json "$BASE_URL/data/revision-calendar.json"
          python3 - <<'PY' || fail=1
          import json, sys

          plan = json.load(open('/tmp/agenda.json'))
          days = plan.get('days', {})
          events = sum(len(d.get('events', [])) for d in days.values())
          exam = plan.get('exam')
          problems = []

          if exam is None:
              problems.append('no exam date')
          if len(days) < 60:
              problems.append(f'only {len(days)} days')
          if events < 300:
              problems.append(f'only {events} events')
          for date in days:
              if exam and date > exam:
                  problems.append(f'{date} is planned after the exam {exam}')
                  break
          for date, day in days.items():
              for event in day.get('events', []):
                  if not event.get('start') or not event.get('end') or event.get('minutes', 0) <= 0:
                      problems.append(f'{date} carries an event with no usable slot')
                      break

          if problems:
              print('::error::deployed agenda payload is unusable: ' + '; '.join(problems[:5]))
              sys.exit(1)

          print(f'ok  agenda   {len(days)} days, {events} sessions, stops at {exam}')
          PY

          # FR-2, proved against the deployed bytes rather than against the
          # build that produced them. The item pages render
          # content_level_justification and learning_outcomes, which were
          # French written WITHOUT its accents for lots 01-11 until FR-2
          # repaired all 126 items on 2026-09-08. No rule detects that defect
          # and none failed while it was live, which is exactly why the check
          # belongs here: it is the only gate that reads what a learner reads.
          for path in "docs/courses/lot-01/abstract-classes" \
                      "docs/courses/lot-01/php-api-up-to-php-8-4-version" \
                      "docs/courses/lot-01/interfaces" \
                      "docs/courses/lot-06/twigbundle"; do
            curl -sL --retry 5 --retry-delay 5 --retry-all-errors -o /tmp/fr2page "$BASE_URL/$path"
            # Known pre-FR-2 spellings. Each is a real French word missing its
            # accent, so a hit means the defect is live again on that page.
            if grep -qE '(propri[e]taire|r[e]ellement|piegeuses|Enoncer|fonctionnalite|mecanisme|methode|reussies)' /tmp/fr2page; then
              echo "::error::FR-2 regression: unaccented French published at $BASE_URL/$path"
              grep -oE '(proprietaire|reellement|piegeuses|Enoncer|fonctionnalite|mecanisme|methode|reussies)' /tmp/fr2page | sort -u | head
              fail=1
            else
              echo "ok  fr-2   $path carries its accents"
            fi
          done

          # The published Certification Readiness figure, proved against the
          # deployed bytes rather than against the build that produced them.
          # A 200 on data/readiness.json says the file exists; it says nothing
          # about the number inside it, and ADR-0007 moved that number from
          # 5.5% to 0%. A stale artifact serving the old figure would have
          # passed every check that ran before this one.
          curl -sL --retry 5 --retry-delay 5 --retry-all-errors -o /tmp/readiness.json "$BASE_URL/data/readiness.json"
          python3 .github/scripts/readiness-smoke.py /tmp/readiness.json docs/progress/certification-readiness.md \
            || fail=1

          # The Lot 01 refinement, proved against the deployed bytes. The
          # Interfaces item was assessed by two easy recall questions and its
          # course omitted two PHP 8.4 rules; both were repaired. Neither the
          # rule set nor any test reads a published page, so without this the
          # only evidence the refinement reached the learner would be that the
          # build succeeded.
          curl -sL --retry 5 --retry-delay 5 --retry-all-errors -o /tmp/l1page "$BASE_URL/docs/courses/lot-01/interfaces"
          missing=""
          grep -q 'surchargeables depuis 8.1' /tmp/l1page || missing="$missing constant-override"
          grep -q 'ne peut pas satisfaire une propriété' /tmp/l1page || missing="$missing readonly-vs-set"
          if [ -n "$missing" ]; then
            echo "::error::Lot 01 refinement missing from the published Interfaces page:$missing"
            fail=1
          else
            echo "ok  lot-01  the Interfaces page carries the 8.1 and 8.4 rules"
          fi

          # The Lot 02 audit, proved against the deployed bytes, for the same
          # reason as the Lot 01 block above: no rule and no test reads a
          # published page, so without this the only evidence the three P0
          # corrections reached the learner would be that the build succeeded.
          #
          # These four needles were chosen to DISCRIMINATE, not merely to match:
          # each one is absent from the pre-audit text at eef67f6 and present
          # after, checked before this step was written. A needle that matched
          # both would be a silent check -- the shape this project has already
          # found five times. `mais seulement pour les caches partages` was
          # dropped for exactly that reason: it predates the audit.
          #
          # They are also plain-text runs with no inline code span and no line
          # break inside them. The full sentence `... un proxy de confiance`
          # does NOT match: the source wraps between `de` and `confiance`, so
          # the rendered HTML carries a newline there and a line-oriented grep
          # stops at it. `-a` because the pages are detected as binary.
          for page in caching http-request; do
            code=$(curl -sL --retry 5 --retry-delay 5 --retry-all-errors \
              -o "/tmp/l2-$page" -w '%{http_code}' "$BASE_URL/docs/courses/lot-02/$page")
            if [ "$code" != "200" ]; then
              echo "::error::Lot 02 page $page serves $code"
              fail=1
            fi
          done
          missing=""
          # P0: max-age is not "for private caches" -- a shared cache uses it
          # whenever s-maxage is absent.
          grep -aq 'pour les caches privés' /tmp/l2-caching || missing="$missing max-age-not-private"
          # P0: setMaxAge() alone emits `private`, and only while neither
          # `public` nor `s-maxage` is set -- which is false in the block above
          # it, where setPublic() precedes.
          grep -aq 'étant ajouté par défaut tant que ni' /tmp/l2-caching || missing="$missing private-default-condition"
          # P0, security-relevant: getClientIp() does not return the left-most
          # X-Forwarded-For address. An allow-list built on that belief trusts a
          # value the client controls.
          grep -aq 'retire toute adresse appartenant à un proxy de' /tmp/l2-http-request || missing="$missing trusted-proxy-stripping"
          grep -aq 'ne renvoie pas « la plus à gauche »' /tmp/l2-http-request || missing="$missing not-left-most"
          if [ -n "$missing" ]; then
            echo "::error::Lot 02 corrections missing from the published pages:$missing"
            fail=1
          else
            echo "ok  lot-02  the Caching and HTTP request pages carry the three P0 corrections"
          fi

          # The Lot 02 pedagogical refinement, proved against the deployed
          # bytes. The flashcard level axis publishes an `###` heading per
          # non-empty level under `## Flashcards`; a build that silently lost
          # the grouping, or a deck whose `level` was dropped by the loader,
          # would still serve a 200 and still show the cards.
          #
          # Each needle below is ABSENT from master before this change --
          # `git grep` on the canonical content returned nothing for any of
          # them -- and present in the locally built page. A needle that
          # matched both would prove nothing, which is the failure this
          # project has already found five times.
          #
          # Plain-text runs only: no inline code span, no apostrophe (the
          # renderer escapes it), and no line break inside the run.
          for page in http-specification-rfc-9110 status-codes http-request; do
            code=$(curl -sL --retry 5 --retry-delay 5 --retry-all-errors \
              -o "/tmp/l2r-$page" -w '%{http_code}' "$BASE_URL/docs/courses/lot-02/$page")
            if [ "$code" != "200" ]; then
              echo "::error::Lot 02 refined page $page serves $code"
              fail=1
            fi
          done
          missing=""
          # The level axis reached the rendered page, on all three.
          for page in http-specification-rfc-9110 status-codes http-request; do
            grep -aq '>Mémorisation<' "/tmp/l2r-$page" || missing="$missing $page:no-recall-heading"
            grep -aq '>Pièges<' "/tmp/l2r-$page" || missing="$missing $page:no-trap-heading"
          done
          # Course prose added by the refinement: the mnemonic on RFC 9110,
          # the 401/403 question pair on Status codes, the two trust lists on
          # HTTP request.
          grep -aq 'du plus général au plus concret' /tmp/l2r-http-specification-rfc-9110 \
            || missing="$missing rfc9110:no-mnemonic"
          grep -aq 'Devant un énoncé absolu' /tmp/l2r-http-specification-rfc-9110 \
            || missing="$missing rfc9110:no-absolute-claim-tip"
          grep -aq '403 pose' /tmp/l2r-status-codes || missing="$missing status:no-401-403-tip"
          grep -aq 'Deux listes, deux dangers' /tmp/l2r-http-request \
            || missing="$missing request:no-two-lists-tip"
          # Flashcard bodies, one per page: the card text itself shipped, not
          # only the headings above it.
          grep -aq 'les deux générations de vocabulaire' /tmp/l2r-status-codes \
            || missing="$missing status:no-constant-naming-card"
          grep -aq 'stricts dans des directions opposées' /tmp/l2r-http-request \
            || missing="$missing request:no-all-vs-get-card"
          if [ -n "$missing" ]; then
            echo "::error::Lot 02 refinement missing from the published pages:$missing"
            fail=1
          else
            echo "ok  lot-02  the three refined pages carry their levelled flashcards and exam tips"
          fi

          # Page 4 of the same refinement, added when it shipped. Same rule:
          # each needle absent from master before the change, present in the
          # locally built page, no apostrophe and no code span.
          code=$(curl -sL --retry 5 --retry-delay 5 --retry-all-errors \
            -o /tmp/l2r-http-response -w '%{http_code}' "$BASE_URL/docs/courses/lot-02/http-response")
          if [ "$code" != "200" ]; then
            echo "::error::Lot 02 refined page http-response serves $code"
            fail=1
          fi
          missing=""
          grep -aq '>Mémorisation<' /tmp/l2r-http-response || missing="$missing response:no-recall-heading"
          grep -aq '>Pièges<' /tmp/l2r-http-response || missing="$missing response:no-trap-heading"
          grep -aq 'Le contrôleur rend, le runner émet' /tmp/l2r-http-response \
            || missing="$missing response:no-send-tip"
          grep -aq 'making it also safe to be embedded into HTML' /tmp/l2r-http-response \
            || missing="$missing response:no-json-encoding-card"
          if [ -n "$missing" ]; then
            echo "::error::Lot 02 refinement missing from the HTTP response page:$missing"
            fail=1
          else
            echo "ok  lot-02  the HTTP response page carries its levelled flashcards and exam tips"
          fi

          # Page 5, same rule again: each needle absent from master before the
          # change, present in the locally built page, no apostrophe and no
          # code span. The two prose needles are quotations from RFC 9110 that
          # the cards carry, so they also prove the card bodies shipped.
          code=$(curl -sL --retry 5 --retry-delay 5 --retry-all-errors \
            -o /tmp/l2r-http-methods -w '%{http_code}' "$BASE_URL/docs/courses/lot-02/http-methods")
          if [ "$code" != "200" ]; then
            echo "::error::Lot 02 refined page http-methods serves $code"
            fail=1
          fi
          missing=""
          grep -aq '>Mémorisation<' /tmp/l2r-http-methods || missing="$missing methods:no-recall-heading"
          grep -aq '>Pièges<' /tmp/l2r-http-methods || missing="$missing methods:no-trap-heading"
          grep -aq 'Symfony ajoute, et retire' /tmp/l2r-http-methods \
            || missing="$missing methods:no-two-lists-tip"
          grep -aq 'gateway to object-based systems' /tmp/l2r-http-methods \
            || missing="$missing methods:no-case-sensitivity-card"
          if [ -n "$missing" ]; then
            echo "::error::Lot 02 refinement missing from the HTTP methods page:$missing"
            fail=1
          else
            echo "ok  lot-02  the HTTP methods page carries its levelled flashcards and exam tips"
          fi

          # Page 6. The Domain needles also guard a correction: the page used
          # to teach that Domain RESTRICTS the scope, where the cookies draft
          # says an absent Domain restricts and a present one broadens.
          code=$(curl -sL --retry 5 --retry-delay 5 --retry-all-errors \
            -o /tmp/l2r-cookies -w '%{http_code}' "$BASE_URL/docs/courses/lot-02/cookies")
          if [ "$code" != "200" ]; then
            echo "::error::Lot 02 refined page cookies serves $code"
            fail=1
          fi
          missing=""
          grep -aq '>Mémorisation<' /tmp/l2r-cookies || missing="$missing cookies:no-recall-heading"
          grep -aq '>Pièges<' /tmp/l2r-cookies || missing="$missing cookies:no-trap-heading"
          grep -aq 'aux sous-domaines' /tmp/l2r-cookies || missing="$missing cookies:no-domain-correction"
          grep -aq 'only to the origin server' /tmp/l2r-cookies \
            || missing="$missing cookies:no-domain-card"
          if [ -n "$missing" ]; then
            echo "::error::Lot 02 refinement missing from the Cookies page:$missing"
            fail=1
          else
            echo "ok  lot-02  the Cookies page carries its levelled flashcards and the Domain correction"
          fi

          # Page 7. `shared` was rejected as a needle: it already appears
          # thirteen times on master, so it would have matched whatever
          # shipped.
          code=$(curl -sL --retry 5 --retry-delay 5 --retry-all-errors \
            -o /tmp/l2r-caching2 -w '%{http_code}' "$BASE_URL/docs/courses/lot-02/caching")
          if [ "$code" != "200" ]; then
            echo "::error::Lot 02 refined page caching serves $code"
            fail=1
          fi
          missing=""
          grep -aq '>Mémorisation<' /tmp/l2r-caching2 || missing="$missing caching:no-recall-heading"
          grep -aq '>Pièges<' /tmp/l2r-caching2 || missing="$missing caching:no-trap-heading"
          grep -aq 'Mnémonique' /tmp/l2r-caching2 || missing="$missing caching:no-mnemonic"
          grep -aq 'Using the first match' /tmp/l2r-caching2 \
            || missing="$missing caching:no-freshness-order-card"
          grep -aq 'must-understand' /tmp/l2r-caching2 \
            || missing="$missing caching:no-must-understand-card"
          if [ -n "$missing" ]; then
            echo "::error::Lot 02 refinement missing from the Caching page:$missing"
            fail=1
          else
            echo "ok  lot-02  the Caching page carries its levelled flashcards and the mnemonic"
          fi

          # Page 8, the first of the lot whose body had room for a full set of
          # exam tips: the needles therefore cover a new course section as
          # well as the cards.
          code=$(curl -sL --retry 5 --retry-delay 5 --retry-all-errors \
            -o /tmp/l2r-negotiation -w '%{http_code}' "$BASE_URL/docs/courses/lot-02/content-negotiation")
          if [ "$code" != "200" ]; then
            echo "::error::Lot 02 refined page content-negotiation serves $code"
            fail=1
          fi
          missing=""
          grep -aq '>Mémorisation<' /tmp/l2r-negotiation || missing="$missing negotiation:no-recall-heading"
          grep -aq '>Pièges<' /tmp/l2r-negotiation || missing="$missing negotiation:no-trap-heading"
          grep -aq 'Proactive contre réactive' /tmp/l2r-negotiation \
            || missing="$missing negotiation:no-proactive-section"
          grep -aq 'passive fingerprinting far too easy' /tmp/l2r-negotiation \
            || missing="$missing negotiation:no-accept-charset-card"
          grep -aq 'cannot be relied upon' /tmp/l2r-negotiation \
            || missing="$missing negotiation:no-language-order-card"
          if [ -n "$missing" ]; then
            echo "::error::Lot 02 refinement missing from the Content negotiation page:$missing"
            fail=1
          else
            echo "ok  lot-02  the Content negotiation page carries its levelled flashcards and exam tips"
          fi

          # Page 9. `commence par` was rejected as a needle: it appears ten
          # times on master already.
          code=$(curl -sL --retry 5 --retry-delay 5 --retry-all-errors \
            -o /tmp/l2r-language -w '%{http_code}' "$BASE_URL/docs/courses/lot-02/language-detection")
          if [ "$code" != "200" ]; then
            echo "::error::Lot 02 refined page language-detection serves $code"
            fail=1
          fi
          missing=""
          grep -aq '>Mémorisation<' /tmp/l2r-language || missing="$missing language:no-recall-heading"
          grep -aq '>Pièges<' /tmp/l2r-language || missing="$missing language:no-trap-heading"
          grep -aq 'Comment Symfony normalise un tag de langue' /tmp/l2r-language \
            || missing="$missing language:no-normalisation-section"
          grep -aq 'Le séparateur trahit la source' /tmp/l2r-language \
            || missing="$missing language:no-exam-tip"
          grep -aq 'fr_Latn_FR' /tmp/l2r-language || missing="$missing language:no-combinations"
          if [ -n "$missing" ]; then
            echo "::error::Lot 02 refinement missing from the Language detection page:$missing"
            fail=1
          else
            echo "ok  lot-02  the Language detection page carries its levelled flashcards and exam tips"
          fi

          # Page 10, the last of the lot. `non-blocking` was rejected as a
          # needle: it is already on master.
          code=$(curl -sL --retry 5 --retry-delay 5 --retry-all-errors \
            -o /tmp/l2r-httpclient -w '%{http_code}' "$BASE_URL/docs/courses/lot-02/symfony-httpclient-component")
          if [ "$code" != "200" ]; then
            echo "::error::Lot 02 refined page symfony-httpclient-component serves $code"
            fail=1
          fi
          missing=""
          grep -aq '>Mémorisation<' /tmp/l2r-httpclient || missing="$missing httpclient:no-recall-heading"
          grep -aq '>Pièges<' /tmp/l2r-httpclient || missing="$missing httpclient:no-trap-heading"
          grep -aq 'Deux zéros, deux sens' /tmp/l2r-httpclient \
            || missing="$missing httpclient:no-exam-tip"
          grep -aq 'redirects should not be followed' /tmp/l2r-httpclient \
            || missing="$missing httpclient:no-max-redirects-card"
          if [ -n "$missing" ]; then
            echo "::error::Lot 02 refinement missing from the HttpClient page:$missing"
            fail=1
          else
            echo "ok  lot-02  the HttpClient page carries its levelled flashcards and exam tips"
          fi

          # Holdout isolation, proved against the deployed bytes (§7.3,
          # ADR-0006). The declared `pool` field was the whole check until
          # 2026-09-03, which only ever proved the payload's own label. What
          # matters is the question ids actually shipped, so they are compared
          # against the canonical banks in this checkout.
          # --retry matches the page loop above. Without it a single transient
          # TLS error killed the job under `set -e` before holdout-smoke.py ran
          # -- curl exit 35, on 2026-09-08, moments after all 21 URLs had
          # returned 200. A network blip must not read as a holdout failure.
          curl -sL --retry 5 --retry-delay 5 --retry-all-errors -o /tmp/practice.json "$BASE_URL/data/practice.json"
          curl -sL --retry 5 --retry-delay 5 --retry-all-errors -o /tmp/exam.json "$BASE_URL/data/exam.json"

          # Mock 4 is the one payload that carries the holdout, so the check
          # runs in both directions: none of it in the learning payloads, all
          # of it in the mock one.
          curl -sL --retry 5 --retry-delay 5 --retry-all-errors -o /tmp/mock-4.json "$BASE_URL/data/mock-4.json"

          # Training mocks must carry no holdout question at all.
          curl -sL --retry 5 --retry-delay 5 --retry-all-errors -o /tmp/mock-1.json "$BASE_URL/data/mock-1.json"
          curl -sL --retry 5 --retry-delay 5 --retry-all-errors -o /tmp/mock-2.json "$BASE_URL/data/mock-2.json"
          curl -sL --retry 5 --retry-delay 5 --retry-all-errors -o /tmp/mock-3.json "$BASE_URL/data/mock-3.json"
          curl -sL --retry 5 --retry-delay 5 --retry-all-errors -o /tmp/mock-5.json "$BASE_URL/data/mock-5.json"

          python3 .github/scripts/holdout-smoke.py /tmp/practice.json /tmp/exam.json /tmp/mock-4.json /tmp/mock-1.json /tmp/mock-2.json /tmp/mock-3.json /tmp/mock-5.json || fail=1

          # Lot 27. Practice Mode's feedback reads an item index Unit B added to
          # this payload. If it stops being emitted, two of the seven feedback
          # sections vanish while every other gate stays green: the build, the
          # rules and the accessibility audit all pass on a page that renders
          # perfectly and no longer says what to revise.
          python3 .github/scripts/practice-smoke.py /tmp/practice.json /tmp/course-sample.txt || fail=1

          # The simulations hub holds none of its own text: every sentence comes
          # from this payload. A payload that loses `when_to_use` leaves a page
          # that renders perfectly and no longer answers the question it exists
          # for.
          #
          # Only the payload is checked here, deliberately. The page is
          # client-rendered, so its served HTML carries the shell and nothing
          # else; grepping it for a mock name would match the NAVBAR and report
          # success about a body that never rendered. That the body renders is
          # proven in a browser by verify-simulations-ui.mjs in CI.
          curl -sL --retry 5 --retry-delay 5 --retry-all-errors -o /tmp/simulations.json "$BASE_URL/data/simulations.json"
          python3 .github/scripts/simulations-smoke.py /tmp/simulations.json || fail=1

          # Three course URLs, fetched for real. Three of 163 is a sample, and
          # the script says so: the structure of all 163 is checked above, and
          # `onBrokenLinks: throw` proves the build wrote the pages.
          fetched=0
          while read -r course; do
            [ -n "$course" ] || continue
            code=$(curl -sL --retry 5 --retry-delay 5 --retry-all-errors -o /dev/null -w '%{http_code}' "$BASE_URL$course")
            fetched=$((fetched + 1))
            if [ "$code" = "200" ]; then
              echo "ok  course  sampled $course serves $code"
            else
              echo "FAIL  course  sampled $course serves $code"
              fail=1
            fi
          done < /tmp/course-sample.txt

          # A loop that quietly fetches fewer URLs than were sampled is worse
          # than no loop: the first production run dropped the last line,
          # because `while read` skips a final line with no trailing newline,
          # and still reported success. The count is now compared.
          expected=$(wc -l < /tmp/course-sample.txt)
          if [ "$fetched" -ne "$expected" ]; then
            echo "FAIL  course  $fetched URL(s) fetched, $expected sampled"
            fail=1
          fi

          exit $fail
