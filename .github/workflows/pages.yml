name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deployment in progress; queue behind it instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: json, mbstring
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --no-dev --optimize-autoloader

      # A deployment must never publish content that fails the mandatory rules
      # of Master Plan §12, so the gate runs again here rather than trusting CI.
      - name: Install dev dependencies for the content gate
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Content rules
        run: php bin/cert validate

      - name: Build
        run: php bin/cert build

      # Requires GitHub Pages to be enabled once, with "Source: GitHub Actions",
      # under Settings > Pages. `enablement: true` was tried and rejected: the
      # workflow GITHUB_TOKEN cannot call the create-Pages-site API ("Resource
      # not accessible by integration"), which needs repository admin rights.
      # Every push deploys automatically once that one-time setting is made.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke-test:
    name: Production smoke test
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      # Master Plan §16: "the real production URL passes smoke tests".
      # Never report DEPLOYED from intention alone.
      - name: Check every published page and payload
        env:
          BASE_URL: https://jasseryahyaoui.github.io/Symfony-8-Certification-Path
        run: |
          set -euo pipefail
          fail=0
          for path in "" "index.html" "practice.html" "exam.html" \
                      "assets/css/app.css" "assets/js/app.js" \
                      "data/practice.json" "data/exam.json" "data/coverage.json"; do
            url="$BASE_URL/$path"
            code=$(curl -s -o /tmp/body -w '%{http_code}' --retry 5 --retry-delay 5 --retry-all-errors "$url")
            if [ "$code" != "200" ]; then
              echo "::error::$url returned HTTP $code"
              fail=1
            else
              echo "ok  $code  $url"
            fi
          done

          # The home page must actually render, not just return 200.
          curl -s "$BASE_URL/index.html" | grep -q 'Symfony 8 Certification Path' \
            || { echo "::error::home page did not render expected content"; fail=1; }

          # Practice payload must never carry the holdout pool (§7.3).
          pool=$(curl -s "$BASE_URL/data/practice.json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["pool"])')
          if [ "$pool" != "LEARNING" ]; then
            echo "::error::practice payload declares pool $pool"
            fail=1
          fi

          exit $fail
