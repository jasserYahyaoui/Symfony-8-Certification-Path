name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deployment in progress; queue behind it instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation site
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: json, mbstring, iconv
          coverage: none
          tools: composer:v2

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      # A deployment must never publish content that fails the mandatory rules
      # of Master Plan §12, so the gate runs here rather than trusting CI.
      - name: Content rules
        run: php bin/cert validate

      - name: Generate the documentation tree from canonical data
        run: php bin/cert build

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install site dependencies
        run: npm --prefix website ci

      - name: Build the documentation site
        run: npm --prefix website run build

      # Requires GitHub Pages to be enabled once, with "Source: GitHub Actions",
      # under Settings > Pages. `enablement: true` was tried and rejected: the
      # workflow GITHUB_TOKEN cannot call the create-Pages-site API ("Resource
      # not accessible by integration"), which needs repository admin rights.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/build

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  smoke-test:
    name: Production smoke test
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      # The holdout check below compares the deployed payloads against the
      # canonical question banks, so this job needs the repository.
      - uses: actions/checkout@v4
      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml

      # Master Plan §16: "the real production URL passes smoke tests".
      # Never report DEPLOYED from intention alone.
      - name: Check every published page and payload
        env:
          BASE_URL: https://jasseryahyaoui.github.io/Symfony-8-Certification-Path
        run: |
          set -euo pipefail
          fail=0
          # `trailingSlash: false` means the docs index is served at /docs,
          # not /docs/ — the latter is a genuine 404.
          for path in "" "docs" "docs/syllabus/coverage" "docs/syllabus/exclusions" \
                      "docs/syllabus/glossary" \
                      "practice" "exam" "mock-4" "mock-1" "mock-2" "mock-3" "mock-5" "progression" \
                      "data/practice.json" "data/exam.json" "data/coverage.json" \
                      "data/mock-4.json" "data/mock-1.json" "data/mock-2.json" "data/mock-3.json" "data/mock-5.json"; do
            url="$BASE_URL/$path"
            code=$(curl -sL -o /tmp/body -w '%{http_code}' --retry 5 --retry-delay 5 --retry-all-errors "$url")
            if [ "$code" != "200" ]; then
              echo "::error::$url returned HTTP $code"
              fail=1
            else
              echo "ok  $code  $url"
            fi
          done

          # The landing page must actually render, not merely return 200.
          #
          # Fetched to a file rather than piped into grep: under `pipefail`,
          # `curl | grep -q` fails the pipeline on a *successful* match, because
          # grep exits at the first hit and curl dies of SIGPIPE. That produced
          # a false "did not render" the moment the page grew large enough for
          # the race to bite.
          curl -sL -o /tmp/landing "$BASE_URL/"
          grep -q 'Symfony 8 Certification Path' /tmp/landing \
            || { echo "::error::landing page did not render expected content"; fail=1; }

          # FR-2, proved against the deployed bytes rather than against the
          # build that produced them. The item pages render
          # content_level_justification and learning_outcomes, which were
          # French written WITHOUT its accents for lots 01-11 until FR-2
          # repaired all 126 items on 2026-09-08. No rule detects that defect
          # and none failed while it was live, which is exactly why the check
          # belongs here: it is the only gate that reads what a learner reads.
          for path in "docs/courses/lot-01/abstract-classes" \
                      "docs/courses/lot-01/php-api-up-to-php-8-4-version" \
                      "docs/courses/lot-01/interfaces" \
                      "docs/courses/lot-06/twigbundle"; do
            curl -sL --retry 5 --retry-delay 5 --retry-all-errors -o /tmp/fr2page "$BASE_URL/$path"
            # Known pre-FR-2 spellings. Each is a real French word missing its
            # accent, so a hit means the defect is live again on that page.
            if grep -qE '(propri[e]taire|r[e]ellement|piegeuses|Enoncer|fonctionnalite|mecanisme|methode|reussies)' /tmp/fr2page; then
              echo "::error::FR-2 regression: unaccented French published at $BASE_URL/$path"
              grep -oE '(proprietaire|reellement|piegeuses|Enoncer|fonctionnalite|mecanisme|methode|reussies)' /tmp/fr2page | sort -u | head
              fail=1
            else
              echo "ok  fr-2   $path carries its accents"
            fi
          done

          # The Lot 01 refinement, proved against the deployed bytes. The
          # Interfaces item was assessed by two easy recall questions and its
          # course omitted two PHP 8.4 rules; both were repaired. Neither the
          # rule set nor any test reads a published page, so without this the
          # only evidence the refinement reached the learner would be that the
          # build succeeded.
          curl -sL --retry 5 --retry-delay 5 --retry-all-errors -o /tmp/l1page "$BASE_URL/docs/courses/lot-01/interfaces"
          missing=""
          grep -q 'surchargeables depuis 8.1' /tmp/l1page || missing="$missing constant-override"
          grep -q 'ne peut pas satisfaire une propriété' /tmp/l1page || missing="$missing readonly-vs-set"
          if [ -n "$missing" ]; then
            echo "::error::Lot 01 refinement missing from the published Interfaces page:$missing"
            fail=1
          else
            echo "ok  lot-01  the Interfaces page carries the 8.1 and 8.4 rules"
          fi

          # Holdout isolation, proved against the deployed bytes (§7.3,
          # ADR-0006). The declared `pool` field was the whole check until
          # 2026-09-03, which only ever proved the payload's own label. What
          # matters is the question ids actually shipped, so they are compared
          # against the canonical banks in this checkout.
          # --retry matches the page loop above. Without it a single transient
          # TLS error killed the job under `set -e` before holdout-smoke.py ran
          # -- curl exit 35, on 2026-09-08, moments after all 21 URLs had
          # returned 200. A network blip must not read as a holdout failure.
          curl -sL --retry 5 --retry-delay 5 --retry-all-errors -o /tmp/practice.json "$BASE_URL/data/practice.json"
          curl -sL --retry 5 --retry-delay 5 --retry-all-errors -o /tmp/exam.json "$BASE_URL/data/exam.json"

          # Mock 4 is the one payload that carries the holdout, so the check
          # runs in both directions: none of it in the learning payloads, all
          # of it in the mock one.
          curl -sL --retry 5 --retry-delay 5 --retry-all-errors -o /tmp/mock-4.json "$BASE_URL/data/mock-4.json"

          # Training mocks must carry no holdout question at all.
          curl -sL --retry 5 --retry-delay 5 --retry-all-errors -o /tmp/mock-1.json "$BASE_URL/data/mock-1.json"
          curl -sL --retry 5 --retry-delay 5 --retry-all-errors -o /tmp/mock-2.json "$BASE_URL/data/mock-2.json"
          curl -sL --retry 5 --retry-delay 5 --retry-all-errors -o /tmp/mock-3.json "$BASE_URL/data/mock-3.json"
          curl -sL --retry 5 --retry-delay 5 --retry-all-errors -o /tmp/mock-5.json "$BASE_URL/data/mock-5.json"

          python3 .github/scripts/holdout-smoke.py /tmp/practice.json /tmp/exam.json /tmp/mock-4.json /tmp/mock-1.json /tmp/mock-2.json /tmp/mock-3.json /tmp/mock-5.json || fail=1

          exit $fail
